    "May propose coherence probes, repair hypotheses, and overreach risks.",
    "May not mark a finding blocking without deterministic source report evidence."
  ],
  "epistemic_risks": [
    "Overstating advisory probes as accepted coherence findings.",
    "Inventing Mathlib grounding that was not found by deterministic auditors."
  ],
  "necessary_conditions": [
    "Input reports include source report styles and evidence paths.",
    "Every probe names deterministic gates to rerun.",
    "Raw generative output is archived when Codex-exec is used."
  ],
  "sufficiency_claim": "Sufficient only for advisory coherence probing; not sufficient for promotion or blocking without deterministic gate evidence.",
  "representation_contract": [
    "Probe payloads include evidence_bindings, repair_hypotheses, deterministic_gates_to_rerun, and overreach_risks.",
    "Allowed verdicts are pass, advisory_findings, deterministic_blocker_supported, and insufficient_evidence."
  ],
  "validation_oracles": [
    "python skills/mathformerphysicslib/mathformerphysicslib-generative-coherence-critic/scripts/build_generative_coherence_critic_plan.py --self-test --json",
