category_errors_to_reject:
  - Backend names are evidence-regime facets, not epistemic primitives.
  - Workflow phases are lifecycle positions, not epistemic primitives.
  - Retrieved relevance is not validity or semantic alignment.
  - A generated artifact is not a proved or accepted artifact.
  - Compilation or execution success is not source fidelity or nonvacuity.
  - Failure to find a counterexample is not proof.
  - A gate aggregates evidence; it does not create mathematical evidence.
  - A revised artifact must be rechecked rather than inheriting prior validity.
  - Reports, logs, indexes, and explanations support reasoning but are not proofs.
  - A coherent reasoning-flow projection is not evidence that its skills ran or its epistemic goal was achieved.
