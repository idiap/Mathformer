# Neuro-symbolic AI Group
# File Documentation
#
# Motivation:
#   Relate operational Mathformer skills to backend-independent epistemic
#   reasoning types without confusing workflow phases with kinds of reasoning.
#
# Intent:
#   Provide an initial, machine-readable ontology in which a reasoning style is
#   an ordered or looping composition of one or more skill applications.
#
# Function:
#   Defines epistemic primitives, orthogonal facets, trust-state dimensions,
#   and representative skill compositions for framework-level discussion and
#   later validation tooling.
#
# Maintenance Notes:
#   The style compositions are a draft seed; the skill_bindings map exhaustively
#   classifies the current canonical inventory. Keep skill ids aligned with
#   skills/<theme>/<name>/SKILL.md and update bindings from skill-contract evidence, not
#   from directory-name heuristics.

version: 2
status: consolidated_draft
inventory_snapshot:
  canonical_skill_count: 188
  counted_from: skills/*/*/SKILL.md
  binding_coverage: exhaustive

semantics:
  primitive: >
    A backend-independent epistemic operation. A skill application may realize
    one primary primitive and several supporting primitives.
  reasoning_style: >
    A directed composition of skill applications. Styles may be sequential,
    branching, nested, or cyclic, and a skill may participate in many styles.
  infrastructure_role: >
    A supporting capability such as orchestration, observability, explanation,
    or curation. Infrastructure is not promoted to a domain-reasoning primitive
    merely because it is implemented as a skill.
  relationship_to_workflow_taxonomy: >
    This epistemic ontology complements rather than replaces the operational
    reasoning_types coordinate in meta_skills/taxonomy/workflow_taxonomy.json.
    Existing labels such as autoformalization and pathology_repair describe
    workflow families; the primitives below describe the reasoning performed
    inside those workflows.
  output_type_registry: skills/OUTPUT_TYPES.yaml
  skill_type_registry: skills/SKILL_TYPES.yaml
  reasoning_flow_language: skills/control/reasoning-flow-language/references/erfl-0.3.json
  reasoning_flow_profiles: examples/reasoning_flows/*.rflow

primitive_types:
  - id: source_observation
    question: What does the source explicitly contain?
    output_claim: provenance-bearing observations
    cannot_establish:
      - truth
      - formal validity
  - id: structural_decomposition
    question: What are the units, dependencies, binders, and internal shape?
    output_claim: an explicit structural analysis
    cannot_establish:
      - external grounding
      - proof
  - id: semantic_modeling
    question: What objects, meanings, assumptions, domains, and contexts are intended?
    output_claim: an explicit semantic or constraint model
    cannot_establish:
      - derivability
      - adequacy of the model
  - id: retrieval
    question: Which existing facts, APIs, declarations, or precedents may be relevant?
    output_claim: ranked or exact candidates with provenance
    cannot_establish:
      - candidate correctness
      - semantic alignment
  - id: grounding_alignment
    question: Which retrieved object is actually applicable and meaning-preserving here?
    output_claim: a justified source-to-knowledge or artifact-to-library link
    cannot_establish:
      - the target theorem
  - id: abductive_completion
    question: Which missing premise, law, bridge, or plan could explain or complete the gap?
    output_claim: explicit candidate hypotheses or obligations
    cannot_establish:
      - proof of the candidate
  - id: constructive_formalization
    question: How can the intended object be synthesized in a formal representation?
    output_claim: a candidate formal artifact
    cannot_establish:
      - executability
      - truth
      - source fidelity
  - id: deduction_transformation
    question: What follows under the declared rules, premises, or valid transformations?
    output_claim: a proof, derivation, or semantics-preserving transformation
    cannot_establish:
      - source fidelity without separate evidence
  - id: probing_falsification
    question: What happens under execution, bounded samples, or adversarial probes?
    output_claim: execution evidence, diagnostics, or a counterexample
    cannot_establish:
      - universal truth from absence of failures
  - id: critical_verification
    question: Is the artifact adequate along a named independent criterion?
    output_claim: a scoped assessment backed by inspectable evidence
    cannot_establish:
      - dimensions outside the named criterion
  - id: diagnostic_revision
    question: Why did the artifact fail, and which localized change can repair it?
    output_claim: a diagnosis, repair plan, or revised candidate
    cannot_establish:
      - inherited validity after revision
  - id: comparative_reflection
    question: What is learned by comparing artifacts, explanations, or trajectories?
    output_claim: contrasts, synthesized lessons, or improvement hypotheses
    cannot_establish:
      - truth merely from agreement or relative score
  - id: epistemic_governance
    question: Which reasoning runs next, when should it stop, and what status is warranted?
    output_claim: a route, gate, trust transition, or stopping decision
    cannot_establish:
      - new mathematical conclusions
  - id: inductive_generalization
    question: Which scoped pattern is provisionally supported across the observed cases?
    output_claim: a provisional generalization with population, sampling, and boundary obligations
    cannot_establish:
      - deductive universality
      - validity outside the sampled or declared scope
  - id: analogical_transfer
    question: Which structure can be transported through an explicit correspondence, and what must be preserved?
    output_claim: a candidate transfer plus correspondence and preservation obligations
    cannot_establish:
      - target truth without a validated transfer relation
      - preservation of properties not named in the correspondence
  - id: contrastive_counterfactual
    question: What changes under a controlled alternative, intervention, or relevant contrast?
    output_claim: a scope-bound contrast supported by an explicit baseline and controlled difference
    cannot_establish:
      - causal identification without the required assumptions
      - validity beyond the controlled contrast

orthogonal_facets:
  backend:
    - lean
    - isabelle
    - rocq
    - vampire
    - sympy
    - knowledge_base
    - backend_neutral
  domain:
    - mathematics
    - physics
    - framework
  inference_form:
    - deduction
    - abduction
    - induction
    - analogy
    - contrastive_counterfactual
    - model_based_reasoning
    - symbolic_computation
    - numerical_sampling
    - hermeneutic_interpretation
  infrastructure_role:
    - orchestrator
    - evidence_recorder
    - explainer
    - curator
    - reporter
    - compatibility_wrapper

epistemic_state_dimensions:
  provenance:
    - absent
    - source_linked
    - source_verified
  retrieval_status:
    - unsearched
    - candidate
    - locally_verified
    - source_verified
  executability:
    - untested
    - failed
    - passed
  formal_validity:
    - unproved
    - proof_candidate
    - proof_checked
  semantic_fidelity:
    - unchecked
    - at_risk
    - passed
  nonvacuity:
    - unchecked
    - failed
    - passed
  domain_validity:
    - unchecked
    - at_risk
    - passed
  promotion_status:
    - generated
    - source_backed_candidate
    - formal_candidate
    - accepted
    - rejected
    - blocked

reasoning_styles:
  - id: source_grounded_autoformalization
    goal: Produce a source-faithful, library-grounded, backend-checked formal artifact.
    control_skills:
      - autoformalization-workflow-orchestrator
    stages:
      - primitive: source_observation
        skill_options:
          - source-formalizable-unit-extractor
          - latex-archive-theory-extractor
          - paper-main-theory-localizer
      - primitive: structural_decomposition
        skill_options:
          - source-line-translation-packet-builder
          - latex-prerequisite-expander
          - latex-expansion-review-orchestrator
      - primitive: semantic_modeling
        skill_options:
          - source-line-translation-packet-builder
          - latex-expansion-binding-reviewer
      - primitive: abductive_completion
        skill_options:
          - proof-expansion-difficulty-estimator
          - proof-expansion-support-orchestrator
          - latex-prerequisite-expander
      - primitive: retrieval
        skill_options:
          - mathlib-concept-candidate-mapper
          - isarmathlib-grounding-navigator
          - sympy-concept-grounding-navigator
      - primitive: grounding_alignment
        skill_options:
          - mathlib-candidate-verifier
          - mathlib-concept-coverage-reviewer
          - mathlib-api-compatibility-planner
      - primitive: constructive_formalization
        skill_options:
          - lean-autoformalization-drafter
          - isabelle-autoformalization-drafter
          - rocq-autoformalization-drafter
          - sympy-autoformalization-drafter
      - primitive: probing_falsification
        skill_options:
          - lean-execution-runner
          - isabelle-execution-runner
          - rocq-execution-runner
          - sympy-execution-runner
      - primitive: critical_verification
        skill_options:
          - lean-critique-suite-orchestrator
          - lean-consistency-report-orchestrator
          - sympy-consistency-report-orchestrator
          - source-formalization-drift-guard
      - primitive: diagnostic_revision
        skill_options:
          - lean-formal-refinement
        repeats_from: constructive_formalization
      - primitive: epistemic_governance
        skill_options:
          - gate-policy-controller
          - autoformalization-result-realness-verifier
    trust_transition:
      from: source_linked
      to: backend_checked_candidate_or_blocker

  - id: premise_retrieval_and_verified_reuse
    goal: Reuse an existing result without confusing relevance with validity.
    control_skills:
      - result-existence-precheck-orchestrator
    stages:
      - primitive: source_observation
      - primitive: structural_decomposition
        skill_options:
          - mathlib-term-expansion-annotator
          - mathlib-concept-ontology-manager
      - primitive: retrieval
        skill_options:
          - premise-kb-indexer
          - mathlib-index-builder
          - mathlib-hierarchy-navigator
          - mathlib-declaration-neighborhood-navigator
          - mathlib-concept-candidate-mapper
      - primitive: grounding_alignment
        skill_options:
          - mathlib-candidate-verifier
          - mathlib-web-evidence-validator
          - mathlib-result-existence-checker
      - primitive: critical_verification
        skill_options:
          - mathlib-candidate-verifier
          - mathlib-result-existence-checker
      - primitive: epistemic_governance
        skill_options:
          - result-existence-precheck-orchestrator
    trust_transition:
      from: unresolved_concept_or_result
      to: snapshot_bound_verified_reuse_candidate_or_explicit_gap

  - id: formal_proof_discovery
    goal: Derive a conclusion and retain authoritative formal proof evidence.
    stages:
      - primitive: semantic_modeling
        skill_options:
          - vampire-atp-orchestrator
      - primitive: retrieval
        skill_options:
          - premise-kb-indexer
          - mathlib-concept-candidate-mapper
      - primitive: constructive_formalization
        skill_options:
          - vampire-atp-orchestrator
          - lean-autoformalization-drafter
          - rocq-autoformalization-drafter
      - primitive: deduction_transformation
        skill_options:
          - vampire-atp-orchestrator
      - primitive: probing_falsification
        skill_options:
          - lean-execution-runner
          - rocq-execution-runner
          - vampire-atp-orchestrator
      - primitive: critical_verification
        skill_options:
          - lean-logical-soundness-critic
          - lean-nonvacuity-consistency-checker
      - primitive: comparative_reflection
        skill_options:
          - vampire-proof-informalizer
          - lean-informalization-extractor
    trust_transition:
      from: formal_claim_candidate
      to: proof_checked_artifact_or_search_failure

  - id: executable_symbolic_derivation
    goal: Build and check an explicit symbolic transformation trace.
    control_skills:
      - sympy-consistency-report-orchestrator
    stages:
      - primitive: source_observation
        skill_options:
          - sympy-expression-parser
      - primitive: semantic_modeling
        skill_options:
          - sympy-assumption-modeler
      - primitive: retrieval
        skill_options:
          - sympy-api-docs-indexer
      - primitive: grounding_alignment
        skill_options:
          - sympy-concept-grounding-navigator
      - primitive: constructive_formalization
        skill_options:
          - sympy-autoformalization-drafter
      - primitive: deduction_transformation
        skill_options:
          - sympy-identity-validator
          - sympy-transformation-trace-verifier
      - primitive: probing_falsification
        skill_options:
          - sympy-execution-runner
          - sympy-counterexample-searcher
      - primitive: critical_verification
        skill_options:
          - sympy-consistency-report-orchestrator
    trust_transition:
      from: source_expression
      to: executable_checked_trace_or_counterexample

  - id: physics_derivation_reconstruction
    goal: Recover and validate a physically meaningful derivation, not only scalar algebra.
    stages:
      - primitive: source_observation
        skill_options:
          - physics-derivation-source-extractor
          - physics-informal-derivation-elicitor
      - primitive: structural_decomposition
        skill_options:
          - physics-equation-parser
          - physics-derivation-plan-builder
      - primitive: semantic_modeling
        skill_options:
          - physics-symbol-table-builder
          - physics-dimension-modeler
          - physics-coordinate-frame-context-builder
          - physics-regime-assumption-modeler
      - primitive: abductive_completion
        skill_options:
          - physics-implicit-gap-detector
          - physics-derivation-gap-expander
      - primitive: grounding_alignment
        skill_options:
          - physics-law-concept-grounding-navigator
          - physics-unit-system-grounder
      - primitive: deduction_transformation
        skill_options:
          - physics-derivation-step-verifier
      - primitive: probing_falsification
        skill_options:
          - physics-unit-analysis-verifier
          - physics-numeric-sanity-sampler
      - primitive: critical_verification
        skill_options:
          - physics-final-hypothesis-reviewer
          - physics-derivation-consistency-report-orchestrator
    trust_transition:
      from: terse_physics_source
      to: explicit_physically_checked_derivation_or_gap_ledger

  - id: adversarial_validation
    goal: Seek decisive failures across independent validity dimensions.
    stages:
      - primitive: probing_falsification
        skill_options:
          - sympy-counterexample-searcher
          - physics-numeric-sanity-sampler
          - mathformerphysicslib-generative-coherence-critic
          - physics-lean-generative-critic-orchestrator
          - physics-sympy-generative-critic-orchestrator
      - primitive: critical_verification
        skill_options:
          - lean-syntactic-correctness-critic
          - lean-semantic-preservation-critic
          - lean-logical-soundness-critic
          - lean-mathlib-alignment-critic
          - lean-nonvacuity-consistency-checker
          - autoformalization-result-realness-verifier
      - primitive: epistemic_governance
        skill_options:
          - gate-policy-controller
    trust_transition:
      from: apparently_successful_candidate
      to: dimensioned_evidence_vector_with_blockers

  - id: critic_driven_recursive_repair
    goal: Repair localized failures while preserving already-passing dimensions.
    stages:
      - primitive: critical_verification
        skill_options:
          - lean-critique-suite-orchestrator
          - physics-lean-drift-pathology-monitor
          - physics-sympy-final-equation-reviewer
      - primitive: diagnostic_revision
        skill_options:
          - lean-formal-refinement
          - physics-lean-execution-interpreter
          - physics-lean-review-refinement-router
          - physics-sympy-execution-interpreter
          - physics-sympy-review-refinement-router
      - primitive: abductive_completion
        skill_options:
          - physics-lean-repair-expansion-cartographer
          - physics-sympy-repair-expansion-cartographer
      - primitive: constructive_formalization
        skill_options:
          - physics-lean-generative-repair-orchestrator
          - physics-lean-refinement-loop
      - primitive: epistemic_governance
        skill_options:
          - physics-lean-recursive-repair-loop-controller
          - physics-sympy-recursive-repair-loop-controller
        repeats_from: critical_verification
    protected_properties:
      - source_fidelity
      - executability
      - nonvacuity
      - grounding
      - explicit_assumptions
    trust_transition:
      from: checked_candidate_with_localized_failures
      to: rechecked_repair_or_precise_blocker

  - id: theory_library_curation
    goal: Turn reusable candidates into coherent, provenance-bearing library knowledge.
    control_skills:
      - mathformerlib-accumulation-orchestrator
      - mathformerphysicslib-coherence-gate
    stages:
      - primitive: retrieval
        skill_options:
          - mathformerphysicslib-coherence-inventory-builder
      - primitive: grounding_alignment
        skill_options:
          - mathformerphysicslib-concept-canonicalizer
          - mathformerphysicslib-mathlib-grounding-auditor
      - primitive: critical_verification
        skill_options:
          - mathformerphysicslib-api-operability-critic
          - mathformerphysicslib-integration-critic
          - mathformerphysicslib-redefinition-critic
          - mathformerphysicslib-foundation-verifier
      - primitive: diagnostic_revision
        skill_options:
          - mathformerphysicslib-coherence-repair-planner
      - primitive: constructive_formalization
        skill_options:
          - mathformerphysicslib-foundation-surface-designer
          - mathformerphysicslib-foundation-drafter
      - primitive: epistemic_governance
        skill_options:
          - mathformerlib-promotion-gate
          - mathformerphysicslib-coherence-gate
    infrastructure_skills:
      - mathformerlib-registry-manager
      - mathformer-library-docs-generator
    trust_transition:
      from: reusable_candidate
      to: accepted_curated_entry_or_repair_plan

  - id: trajectory_reflection_and_process_improvement
    goal: Propose and independently test an immutable reasoning revision without weakening prior successful behavior.
    stages:
      - primitive: comparative_reflection
        skill_options:
          - reference-free-descriptive-evaluator
          - reference-free-critic-monitor
          - formalphysics-comparative-analysis-reporter
          - formalphysics-judge-synthesis-reporter
      - primitive: diagnostic_revision
        skill_options:
          - autoformalization-reflective-refinement-loop
      - primitive: constructive_formalization
      - primitive: probing_falsification
        skill_options:
          - skill-test-program-orchestrator
      - primitive: comparative_reflection
        skill_options:
          - reference-free-descriptive-evaluator
          - reference-free-critic-monitor
          - formalphysics-comparative-analysis-reporter
          - formalphysics-judge-synthesis-reporter
      - primitive: critical_verification
        skill_options:
          - workflow-contract-validator
          - skill-hook-coverage-maximizer
      - primitive: epistemic_governance
        skill_options:
          - gate-policy-controller
    infrastructure_skills:
      - reasoning-log-schema-guardian
      - mathformer-workflow-router
    protected_properties:
      - prior_successful_cases
      - hook_coverage
      - reasoning_log_validity
      - evaluation_contract_integrity
      - candidate_lineage
      - rollback_target
    trust_transition:
      from: observed_workflow_trajectory
      to: tested_scoped_reasoning_revision_or_retained_baseline

skill_binding_policy:
  coverage: every canonical skills/*/*/SKILL.md directory
  primary_cardinality: exactly_one
  secondary_cardinality: zero_or_more_unique
  assignment_basis: declared SKILL.md contract and dominant epistemic output
  wrappers_and_infrastructure: explicitly_classified
  note: >
    Secondary primitives record materially present reasoning operations, not
    every downstream use of the artifact. Backend and workflow family remain
    orthogonal facets.

