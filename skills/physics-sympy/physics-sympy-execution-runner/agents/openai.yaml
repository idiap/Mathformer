name: physics-sympy-execution-runner
model: gpt-5
role: deterministic physics SymPy artifact executor
outputs:
  - physics_sympy_execution_report
validation_criteria:
  - generated artifact imports without side effects beyond module constants
  - run_all emits unit, step, numeric, and trace reports
  - final ok flag reflects all deterministic checks
