  generative_interpreter_or_rewriter:
    axes:
      execution_posture: generative
      specification_styles: [transformational, declarative]
      composition_role: atomic_operator
    examples:
      - lean-output-denoiser
      - proof-expansion-web-researcher
  generative_critic:
    axes:
      execution_posture: generative
      specification_styles: [evaluative, constraint_based]
      composition_role: atomic_operator
    examples:
      - lean-semantic-preservation-critic
      - lean-logical-soundness-critic
      - latex-expansion-completeness-reviewer
  generative_planner:
    axes:
      execution_posture: generative
      specification_styles: [procedural, compositional, constraint_based]
      composition_role: sequential_orchestrator
    examples:
