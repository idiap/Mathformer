classification_contract:
  required_fields:
    - skill
    - execution_posture
    - primary_specification_style
    - secondary_specification_styles
    - composition_role
    - implementation_surfaces
    - state_model
    - effect_profile
    - authority_profile
    - primary_reasoning_type
    - primary_output_types
    - testing_obligations
    - classification_evidence
  invariants:
    - Every skill has exactly one execution posture for a named version of its contract.
    - Procedural and declarative are specification styles, not execution postures.
    - A skill may have one primary and several secondary specification styles.
    - Deterministic does not imply correct, pure, environment-independent, or proof-producing.
    - Generative does not imply unconstrained; generative skills require explicit structural and semantic oracles.
    - Hybrid substeps preserve separate provenance, output types, and authority boundaries.
    - Orchestrators and wrappers do not inherit the authority of subordinate outputs.
    - A skill contract change may require reclassification even when its directory name is unchanged.

testing_matrix:
  deterministic:
    required:
      - compile_or_parse
      - schema_and_contract
      - fixed_fixture_regression
      - environment_capture
  generative:
    required:
      - prompt_and_context_capture
      - adversarial_content_probe
      - required_and_forbidden_claim_oracle
      - non_regression_examples
  hybrid:
    required:
      - all_deterministic_requirements
      - all_generative_requirements
      - substep_provenance
      - handoff_and_authority_boundary
      - stale_evidence_regression
  human_mediated:
    required:
      - reviewer_and_scope_record
      - decision_provenance
      - unresolved_handoff_test
