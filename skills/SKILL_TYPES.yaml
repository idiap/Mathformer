  hybrid_generate_then_verify:
    axes:
      execution_posture: hybrid
      specification_styles: [transformational, constraint_based]
      composition_role: atomic_operator
    examples:
      - lean-line-annotation
      - physics-lean-physical-semantics-critic
  hybrid_tool_augmented_critic:
    axes:
      execution_posture: hybrid
      specification_styles: [evaluative, compositional]
      composition_role: sequential_orchestrator
    examples:
      - physics-lean-generative-critic-orchestrator
      - formalphysics-judge-synthesis-reporter
  hybrid_critic_repair_router:
    axes:
      execution_posture: hybrid
      specification_styles: [evaluative, procedural, compositional]
      composition_role: branching_router
    examples:
