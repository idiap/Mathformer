interface:
  display_name: "LaTeX Completeness Reviewer"
  short_description: "Review expansion prerequisite coverage"
  default_prompt: "Use $latex-expansion-completeness-reviewer to compare this original statement and LaTeX expansion for missing definitions, assumptions, side conditions, and conclusion preservation."
