interface:
  display_name: "LaTeX Prerequisite Expander"
  short_description: "Expand math statements before formalization"
  default_prompt: "Expand this mathematical statement into an equivalent LaTeX-ready version with explicit definitions, theorem prerequisites, and implicit assumptions. Do not produce formal code."
