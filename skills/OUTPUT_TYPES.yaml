composition_rules:
  - id: observations_become_evidence_relationally
    rule: An observation becomes evidence only when it names the exact claim, polarity, scope, and inference under which it bears on that claim.
  - id: format_independence
    rule: The same output type may have several representations, and one representation may carry many output types.
  - id: candidate_nonpromotion
    rule: Candidate artifacts and hypotheses remain proposals until named evidence and gate outputs change their status.
  - id: exact_certificate_scope
    rule: A derivation certificate applies only to the exact hashed formal claim, dependencies, checker, and assumptions it records.
  - id: counterexample_asymmetry
    rule: One admissible aligned counterexample may refute a universal encoded claim; absence of a found counterexample is never proof.
  - id: backend_scope
    rule: Execution evidence establishes backend behavior, not source fidelity, nonvacuity, or domain validity unless those are explicit backend guarantees.
  - id: assessment_scope
    rule: A scoped assessment must not silently claim validity dimensions it did not test.
  - id: aggregation_transparency
    rule: An aggregate synthesis must cite member outputs, preserve disagreements and waivers, and inherit member limitations.
  - id: decision_non_evidence
    rule: A decision record changes workflow status but creates no new mathematical evidence.
  - id: revision_revalidation
    rule: A revision record names invalidated checks; a successor artifact does not inherit affected validation results.
  - id: explanation_non_authority
    rule: An explanation or rendering points to authoritative outputs and is not a substitute for them.
  - id: entry_level_memory_trust
    rule: Indexes and registries preserve trust per entry; collection membership does not imply acceptance.
  - id: blocker_semantics
    rule: A blocker records current inability to proceed and must not be interpreted as falsity or impossibility of the target.
  - id: bundle_weakest_link
    rule: A bundle preserves member types and cannot acquire stronger authority merely through packaging.
  - id: no_generic_status
    rule: Canonical outputs use namespaced process, validation, claim, decision, and promotion statuses rather than an ambiguous top-level status or ok flag.
  - id: digest_bound_evidence
    rule: Evidence, assessments, and decisions identify the exact subject digest; a changed subject makes dependent outputs stale until explicitly revalidated.
  - id: plan_evidence_separation
    rule: A plan, prompt, queue, or repair proposal cannot satisfy a requirement for executed evidence or a completed assessment.
  - id: authority_ceiling
    rule: Generative critics and aggregate reports may raise risk or route work but cannot independently manufacture proof-checked validity.
  - id: waiver_nontruth
    rule: A waiver changes permission under a policy while preserving the failed check and residual risk; it does not change mathematical truth.
  - id: scoped_completion
    rule: Complete always means complete under a named gate profile and version for an exact subject digest, never globally complete.
  - id: canonical_projection_separation
    rule: Human renderings and embedded copies cite an immutable authoritative record; mutable latest paths are pointers rather than evidence identities.
  - id: semantic_kind_separation
    rule: Semantic kind describes the internal epistemic object, while output type describes its workflow function; neither is inferred from container names or file formats.
