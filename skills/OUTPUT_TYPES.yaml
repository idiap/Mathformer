# Neuro-symbolic AI Group
# File Documentation
#
# Motivation:
#   Distinguish the epistemic kind of a Mathformer output from its file format,
#   backend, workflow phase, status, and human-facing rendering.
#
# Intent:
#   Provide an initial ontology of reasoning outputs, their authority and
#   validation properties, and the constraints on their downstream use.
#
# Function:
#   Defines output families, leaf types, orthogonal property axes, a common
#   output-record contract, reasoning-to-output mappings, and trust rules.
#
# Maintenance Notes:
#   Keep this aligned with skills/REASONING_TYPES.yaml, skills/SKILL_HOOKS.yaml,
#   docs/architecture/PRINCIPLES.md, and reasoning-log skill-application fields.
#   Do not infer epistemic type from suffixes such as packet, report, JSON, or
#   HTML.

version: 2
status: consolidated_draft
inventory_basis:
  - skills/SKILL_HOOKS.yaml
  - skills/*/*/SKILL.md
  - skills/control/reasoning-log-schema-guardian/references/schema.md
  - docs/architecture/PRINCIPLES.md
inventory_snapshot:
  hook_contracts: 200
  declared_output_labels: 325
  distinct_output_labels: 320
  labels_containing_report: 82
  labels_containing_packet: 36
  labels_containing_plan: 31

semantics:
  output_type: >
    The primary epistemic function of an output: what kind of claim, proposal,
    evidence, decision, or memory object it is.
  semantic_kind: >
    The internal epistemic object shape carried by an output: claim, evidence,
    model, relation, assessment, decision, obligation, plan, presentation,
    bundle, or blocker. Semantic kind is independent of the output's workflow
    function, container label, representation, and status.
  representation: >
    A serialization or rendering such as JSON, YAML, JSONL, Markdown, HTML,
    Lean, Isabelle, Rocq, TPTP, TSTP, Python, CSV, or SVG. Representation never
    determines epistemic type.
  status: >
    A lifecycle or gate condition such as draft, checked, blocked, accepted, or
    rejected. Status is not an output type and must be scoped to named checks.
  bundle: >
    A container that references several typed outputs. A bundle has no stronger
    authority than its cited members and must preserve their individual status.

semantic_kinds:
  claim: A proposition capable of truth or falsity, always carrying modality, scope, provenance, and obligations.
  evidence: An inspectable item that bears on a claim only through a typed relation.
  model: An explicit formal, symbolic, numerical, semantic, or idealized representation.
  relation: A typed connection among immutable output identities.
  assessment: A criterion-scoped evaluation of a claim, artifact, model, or evidence set.
  decision: An epistemic calibration or operational disposition that creates no object-level evidence.
  obligation: A condition remaining before a named use or promotion.
  plan: Prospective bounded reasoning or action with no authority until executed and assessed.
  presentation: A communicative projection whose authority is permanently inherited from its sources.
  bundle: A product, collection, tagged alternative, context, or handoff whose members retain their own authority.
  blocker: A current inability to continue, not falsity or impossibility.

output_families:
  - id: descriptive
    purpose: Record or organize what is present without endorsing a target claim.
  - id: prospective
    purpose: Propose candidates, hypotheses, obligations, or future actions.
  - id: evidential
    purpose: Record observations or certificates that bear directly on a claim.
  - id: evaluative
    purpose: Assess evidence or make a policy-bound status decision.
  - id: revisionary
    purpose: Explain failure and specify or record a controlled change.
  - id: communicative
    purpose: Translate or render other outputs for human understanding.
  - id: memory
    purpose: Preserve retrievable or curated knowledge for later workflows.
  - id: operational
    purpose: Preserve lineage, observability, failure, and recovery information.

canonical_hierarchy:
  descriptive_output:
    - source_observation_packet
    - structural_model
    - semantic_context_model
  proposal_output:
    - retrieval_candidate_set
    - hypothesis_obligation_set
    - plan_directive
    - candidate_artifact
  warrant_output:
    - grounding_evidence_link
    - derivation_certificate
    - execution_evidence_record
    - counterexample_witness
  assessment_output:
    - scoped_assessment
    - aggregate_synthesis
  governance_output:
    - decision_record
    - blocker_record
  intervention_output:
    - diagnosis_repair_specification
    - revision_record
  interpretive_output:
    - explanation
  persistence_output:
    - index_registry
    - curated_knowledge_entry
    - provenance_trace

primary_type_selection:
  rule: >
    Choose the type that describes the output's intended downstream epistemic
    use, then record other materially present roles as secondary output types.
  tests:
    - question: Does it state what was observed or modeled?
      choose: descriptive_output
    - question: Does it propose a candidate, obligation, or future action?
      choose: proposal_output
    - question: Does it bear directly on an exact claim under a named method?
      choose: warrant_output
    - question: Does it assess cited evidence against named criteria?
      choose: assessment_output
    - question: Does it authorize, reject, route, waive, or block a transition?
      choose: governance_output
    - question: Does it diagnose or record a controlled change?
      choose: intervention_output
    - question: Does it explain another authoritative output to an audience?
      choose: interpretive_output
    - question: Does it preserve, index, or trace other outputs for later use?
      choose: persistence_output
  tie_breaker: >
    Prefer the role consumed by the next gate. Packaging, rendering, and
    lifecycle status never break a tie.

