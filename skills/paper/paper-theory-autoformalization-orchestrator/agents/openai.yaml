interface:
  display_name: "Paper Theory Orchestrator"
  short_description: "Coordinate paper-level theory formalization"
  default_prompt: "Use $paper-theory-autoformalization-orchestrator to extract a paper's layout, localize the main theory, expand intermediate results and supporting references, then route the reviewed theory queue through mathlib grounding and Lean autoformalization."
