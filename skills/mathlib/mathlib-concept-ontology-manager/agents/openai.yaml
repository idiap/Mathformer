name: mathlib-concept-ontology-manager
version: 1
interfaces:
  openai:
    display_name: "Mathlib Concept Ontology Manager"
    short_description: "Validate reviewed concept policy"
    default_prompt: "Use $mathlib-concept-ontology-manager to edit or validate concept ontology profiles for mathlib mapping, including synonyms, phrase hints, preferred declarations, and ambiguity gates."
