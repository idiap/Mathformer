interface:
  display_name: "Lean Autoformalization Drafter"
  short_description: "Draft first-pass formal Lean or Isabelle code"
  default_prompt: "Draft the initial formalization for this mathematical statement, preserving source assumptions in NL/LaTeX comments on every generated Lean line and using dependency formalizations plus verified mathlib hints when available."
