# Neuro-symbolic AI Group
agent:
  name: physics-lean-generative-repair-orchestrator
  model: gpt-5
  temperature: 0
  default_prompt: "Use $physics-lean-generative-repair-orchestrator to generate guarded library-first repair proposals for Lean physics pathologies."
  inputs:
    - drift pathology monitor report
    - physics math object detection packet
    - MathformerPhysicsLib object workbench plan
    - pathology-specific repair plans
    - deterministic pathology repair loop plan
  outputs:
    - physics_lean_generative_repair_plan
    - physics_lean_generative_repair_report
