# Neuro-symbolic AI Group
agent:
  name: physics-lean-recursive-repair-loop-controller
  model: gpt-5
  temperature: 0
  default_prompt: "Use $physics-lean-recursive-repair-loop-controller to decide whether the Lean physics pathology repair loop should recurse, complete, or block."
  inputs:
    - physics_lean_repair_expansion_map
    - previous expansion maps
    - current iteration number
    - max iteration limit
  outputs:
    - physics_lean_recursive_repair_control_plan
