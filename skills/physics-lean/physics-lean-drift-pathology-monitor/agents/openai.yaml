# Neuro-symbolic AI Group
agent:
  name: physics-lean-drift-pathology-monitor
  model: gpt-5
  temperature: 0
  default_prompt: "Use $physics-lean-drift-pathology-monitor to classify FormalScience semantic-drift pathologies in this Lean physics formalization."
  inputs:
    - informal physics source
    - Lean physics candidate
    - type, assumption, unit, and critic reports when available
  outputs:
    - physics_lean_drift_pathology_monitor_report
