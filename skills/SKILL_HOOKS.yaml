# Neuro-symbolic AI Group
# File Documentation
#
# Motivation:
#   Make agent behavior explicit, scoped, and reproducible for specialized Mathformer tasks.
#
# Intent:
#   Tell coding agents what context to load, what invariants to preserve, and how to validate their work.
#
# Function:
#   Contains skill instructions, prompts, references, and scripts used by Codex-style workflows.
#
# Maintenance Notes:
#   Keep this header synchronized with major responsibility changes, and prefer updating tests or examples when behavior changes.

version: 1
description: >
  Systematic hook contract for applying the split Mathformer skills. The
  runtime remains shared, but each workflow phase has one canonical skill owner,
  expected reasoning-log steps, and gate conditions.

  runtime_contract:
    orchestrator_skill: autoformalization-workflow-orchestrator
    reasoning_log_required_payload_fields:
      - skill
    skill_application_required_payload_sections:
      - intent
      - inputs
      - artifacts
      - evidence
      - decision
      - risks
      - next_action
      - human_summary
    generic_skill_application_steps:
      - skill_application_start
      - skill_application_context_loaded
      - skill_application_input_normalized
      - skill_application_action_taken
      - skill_application_evidence_recorded
      - skill_application_gate_evaluated
      - skill_application_complete
      - skill_application_error
    recommended_payload_fields:
      - hook_id
      - duration_ms
      - agent_usage
      - convergence_criteria
