hooks:
  - id: control.workflow_contract
    phase: control
    trigger: after hook, skill, routing, shared-runtime, or workflow-contract changes
    owner_skill: workflow-contract-validator
    reasoning_log_steps:
      - workflow_contract_validation_start
      - workflow_contract_validation_complete
      - workflow_contract_validation_error
    gate: strict validation must have no blocking hook, owner, routing, or shared-runtime findings
    outputs:
      - hook_contract_report

  - id: control.workflow_router
    phase: control
    trigger: when a natural-language, generative, Codex-exec, Claude, or OpenCode entrypoint must reach Mathformer workflows through the hub
    owner_skill: mathformer-workflow-router
    reasoning_log_steps:
      - workflow_router_request_normalized
      - workflow_router_route_resolved
      - workflow_router_coverage_audited
      - workflow_router_hub_safety_preserved
    gate: every registered workflow family must have at least one natural-language route to a known controlled action
    outputs:
      - mathformer_workflow_router_coverage_report

  - id: control.generative_workflow_coordinator
    phase: control
    trigger: when Codex must interpret, decompose, order, explain, or invoke one or more Mathformer workflows from a natural-language goal
    owner_skill: mathformer-generative-workflow-coordinator
    reasoning_log_steps:
      - generative_workflow_coordination_start
      - generative_workflow_intents_decomposed
      - generative_workflow_routes_validated
      - generative_workflow_coordination_complete
      - generative_workflow_coordination_error
    gate: every generated intent must resolve through the deterministic router to known hub actions, and mutating actions require user authorization

  - id: control.reasoning_flow_language
    phase: control
    trigger: when authoring, importing, publishing, explaining, or changing an epistemic reasoning-flow profile or its generated catalogue
    owner_skill: reasoning-flow-language
    reasoning_log_steps:
      - reasoning_flow_profile_loaded
      - reasoning_flow_relational_coherence_validated
      - reasoning_flow_resource_plane_validated
      - reasoning_flow_registry_alignment_validated
      - reasoning_flow_predicate_map_generated
      - reasoning_flow_catalog_synchronized
      - reasoning_flow_validation_complete
      - reasoning_flow_validation_error
    gate: strict validation must preserve typed handles, labelled relations, calibrated endpoints, bounded iteration, and registry alignment
    outputs:
      - reasoning_flow_validation_report
      - reasoning_flow_catalog_markdown
      - reasoning_flow_materializations_markdown

  - id: control.skill_hook_coverage
    phase: control
    trigger: after adding skills, editing hooks, editing direct routes, or changing workflow loop structure
    owner_skill: skill-hook-coverage-maximizer
    reasoning_log_steps:
      - skill_hook_coverage_audit_start
      - skill_hook_coverage_audit_complete
      - skill_hook_coverage_audit_error
    gate: every non-wrapper skill must have a hook or direct route, and named loop contracts must include their required hooks and owner skills
    outputs:
      - skill_hook_coverage_report
      - loop_contract_report

  - id: control.reasoning_log_schema
    phase: control
    trigger: after a reasoning log is produced or before reasoning-log-derived statistics/gates
    owner_skill: reasoning-log-schema-guardian
    reasoning_log_steps:
      - reasoning_log_schema_validation_start
      - reasoning_log_schema_validation_complete
      - reasoning_log_schema_validation_error
    gate: strict validation must have parseable JSONL, monotone event indexes, payload.skill, and known hook ids
    outputs:
      - reasoning_log_schema_report

  - id: control.gate_policy
    phase: control
    trigger: whenever validators, critiques, Lean checks, coverage checks, or audits produce a pass/fail gate
    owner_skill: gate-policy-controller
    reasoning_log_steps:
      - gate_policy_decision_start
      - gate_policy_decision_complete
      - gate_policy_decision_error
    gate: unwaived blocking failures produce fail; nonblocking failures produce warn
    outputs:
      - gate_decision

  - id: intake.workflow_start
    phase: intake
    trigger: every end-to-end workflow run
    owner_skill: autoformalization-workflow-orchestrator
    reasoning_log_steps:
      - workflow_start
      - artifact_paths_resolved
    outputs:
      - normalized_statement
      - artifact paths

  - id: intake.source_unit_inventory
    phase: intake
    trigger: after a source URL, article, paper excerpt, or wiki-style page is provided and before LaTeX expansion, duplicate-result precheck, or first-pass drafting
    owner_skill: source-formalizable-unit-extractor
    reasoning_log_steps:
      - source_unit_inventory_start
      - source_unit_inventory_complete
      - source_unit_inventory_error
    gate: every selected theorem-like drafting target must have a typed source-linked unit, original span, mathlib concept hints, and downstream routes before autoformalization begins
    outputs:
      - formalizable_unit_inventory
      - source_unit_dependency_queue
      - source_unit_mathlib_concepts

  - id: intake.paper_layout_extract
    phase: intake
    trigger: after a PDF URL, paper PDF, or paper text is provided and before paper-level theory localization
    owner_skill: paper-docling-layout-extractor
    reasoning_log_steps:
      - paper_layout_extract_start
      - paper_layout_extract_complete
      - paper_layout_extract_error
    gate: layout extraction must report its engine and preserve sections, blocks, references, warnings, and source provenance before theorem localization
    outputs:
      - paper_layout_packet
      - extraction_engine_report
      - layout_warnings

  - id: intake.paper_theory_localize
    phase: intake
    trigger: after paper layout extraction and before source-unit inventory, LaTeX expansion, duplicate-result precheck, or first-pass drafting
    owner_skill: paper-main-theory-localizer
    reasoning_log_steps:
      - paper_theory_localization_start
      - paper_theory_localization_complete
      - paper_theory_localization_error
    gate: selected paper-level drafting targets must include support units, intermediate expansion queue, reference support, and mathlib concept hints
    outputs:
      - paper_theory_localization_packet
      - main_theory_results
      - intermediate_expansion_queue
      - reference_support_packet

  - id: intake.latex_archive_theory_extract
    phase: intake
    trigger: after a LaTeX textbook archive or source tree is provided and before thematic TeX organization or batch autoformalization
    owner_skill: latex-archive-theory-extractor
    reasoning_log_steps:
      - latex_archive_theory_extract_start
      - latex_archive_theory_extract_complete
      - latex_archive_theory_extract_error
