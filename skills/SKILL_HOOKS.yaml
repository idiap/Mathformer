    gate: navigation must expose allowed next operation, depth and breadth budgets, declaration-neighborhood evidence, import cost, stop reason, and gap-ledger entries before candidates are promoted
    outputs:
      - navigation_state
      - candidate_declarations
      - intended_import_set
      - navigation_gap_ledger

  - id: mathlib.hierarchy.navigate
    phase: mathlib_alignment
    trigger: user asks to navigate mathlib hierarchy or a workflow needs module-tree context
    owner_skill: mathlib-hierarchy-navigator
    reasoning_log_steps:
      - mathlib_hierarchy_navigation_start
      - mathlib_hierarchy_navigation_complete
    outputs:
      - focus
      - ancestors
      - children
      - siblings

  - id: mathlib.hierarchy.module_tree
    phase: mathlib_alignment
    trigger: module-prefix navigation is requested
    owner_skill: mathlib-module-tree-cartographer
    reasoning_log_steps:
      - mathlib_module_tree_scanned
    outputs:
      - child prefixes
      - leaf counts
      - sibling modules

  - id: mathlib.hierarchy.declaration_neighborhood
    phase: mathlib_alignment
    trigger: a concrete module or declaration-name filter is requested
    owner_skill: mathlib-declaration-neighborhood-navigator
    reasoning_log_steps:
      - mathlib_declaration_neighborhood_ready
    outputs:
      - imports
      - declarations
      - source references

  - id: mathlib.verify
    phase: mathlib_alignment
    trigger: concept_map_verify_checks is true or enable_mathlib_concept_compatibility_loop is true
    owner_skill: mathlib-candidate-verifier
    reasoning_log_steps:
      - concept_mapping_verify_result
    gate: verified candidates should include check_ok and check_errors fields
    outputs:
      - check_ok
      - check_errors

  - id: mathlib.compatibility_loop
    phase: mathlib_alignment
    trigger: enable_mathlib_concept_compatibility_loop is true
    owner_skill: mathlib-compatibility-loop-orchestrator
    reasoning_log_steps:
      - mathlib_concept_compatibility_loop_start
      - mathlib_concept_compatibility_loop_iteration_start
      - mathlib_concept_compatibility_loop_iteration_error
      - mathlib_concept_compatibility_loop_complete
    gate: loop stops when every extracted concept has verified mathlib coverage or the configured round cap is reached
    outputs:
      - mathlib_concept_compatibility_rounds
      - mathlib_concept_coverage

  - id: mathlib.coverage
    phase: mathlib_alignment
    trigger: after concept mapping or each compatibility-loop iteration
    owner_skill: mathlib-concept-coverage-reviewer
    reasoning_log_steps:
      - mathlib_concept_coverage_review_complete
    gate: all concepts should have at least one check_ok declaration or an explicit gap
    outputs:
      - coverage_score
      - all_concepts_verified
      - gaps

  - id: mathlib.web_strategy
    phase: mathlib_alignment
    trigger: after concept coverage reports unresolved or ambiguous mathlib candidates and web grounding is enabled
    owner_skill: mathlib-web-search-strategist
    reasoning_log_steps:
      - mathlib_web_strategy_start
      - mathlib_web_strategy_complete
      - mathlib_web_strategy_error
    gate: planned searches must prefer official mathlib docs/source and include local Lean verification handoffs
    outputs:
      - mathlib_web_search_plan
      - official_source_queries
      - local_verification_handoffs

  - id: mathlib.web_evidence
    phase: mathlib_alignment
    trigger: after web search produces mathlib grounding claims
    owner_skill: mathlib-web-evidence-validator
    reasoning_log_steps:
      - mathlib_web_evidence_validation_start
      - mathlib_web_evidence_validation_complete
      - mathlib_web_evidence_validation_error
    gate: API claims require official mathlib docs/source evidence and local Lean verification before being treated as grounded
    outputs:
      - mathlib_web_evidence_report
      - grounded_claims
      - candidate_only_claims
      - blocked_web_claims

  - id: mathlib.web_grounding_loop
    phase: mathlib_alignment
    trigger: local concept mapping, hierarchy navigation, or verification leaves gaps that need web-assisted grounding
    owner_skill: mathlib-web-grounding-orchestrator
    reasoning_log_steps:
      - mathlib_web_grounding_loop_start
      - mathlib_web_grounding_local_evidence_ready
      - mathlib_web_grounding_search_plan_ready
      - mathlib_web_grounding_evidence_validated
      - mathlib_web_grounding_local_verification_handoff
      - mathlib_web_grounding_loop_complete
      - mathlib_web_grounding_loop_error
    gate: web-assisted claims must return to local verification before prompt injection, import planning, or accepted library accumulation
    outputs:
      - mathlib_web_grounding_packet
      - grounded_api_claims
      - unresolved_mathlib_gaps

  - id: mathlib.grounding_maximize
    phase: mathlib_alignment
    trigger: after concept coverage, web grounding, import planning, saved Lean generation, or whenever artifact-set mathlib grounding is below target
    owner_skill: mathlib-grounding-maximizer
    reasoning_log_steps:
      - mathlib_grounding_maximization_start
      - mathlib_grounding_maximization_round_start
      - mathlib_grounding_measurement_complete
      - mathlib_grounding_fix_plan_ready
      - mathlib_grounding_monotonic_gate_complete
      - mathlib_grounding_maximization_complete
      - mathlib_grounding_maximization_error
    gate: artifact sets should have no broad Mathlib imports, no realness blockers, compatibility scores at target, and nondecreasing reference-free grounding unless explicitly marked draft or blocked
    outputs:
      - mathlib_grounding_report
      - grounding_loop_todos
      - monotonicity_comparison

  - id: mathlib.api_plan
    phase: mathlib_alignment
    trigger: after concept coverage review and before initial drafting
    owner_skill: mathlib-api-compatibility-planner
    reasoning_log_steps:
      - alignment_hints_prepared
    gate: drafting prompts should prefer verified declarations and isolate unresolved gaps
    outputs:
      - mathlib_alignment_hints

  - id: mathlib.import.plan
    phase: mathlib_alignment
    trigger: after concept coverage, hierarchy navigation, or fixture expected-import metadata is available
    owner_skill: mathlib-import-set-builder
    reasoning_log_steps:
      - mathlib_import_plan_start
      - mathlib_import_plan_complete
    gate: final import plans should prefer explicit Mathlib modules and flag broad `import Mathlib`
    outputs:
      - planned_imports
      - import_block
      - import_plan_findings

  - id: mathlib.import.context
    phase: mathlib_alignment
    trigger: after an import plan is built and before drafting, refinement, or final artifact acceptance relies on declarations
    owner_skill: lean-import-context-verifier
    reasoning_log_steps:
      - lean_import_context_verification_start
      - lean_import_context_verification_complete
    gate: expected declarations and generated Lean must pass under the intended imports, not only under broad `import Mathlib`
    outputs:
      - import_context_report
      - broad_only_declarations
      - missing_expected_imports

  - id: mathformerlib.accumulate
    phase: library
    trigger: a generated or curated formalization should be accumulated into the parallel Mathformerlib library
    owner_skill: mathformerlib-accumulation-orchestrator
    reasoning_log_steps:
      - mathformerlib_accumulation_start
      - mathformerlib_accumulation_candidate_selected
      - mathformerlib_accumulation_complete
      - mathformerlib_accumulation_error
    gate: accepted Mathformerlib entries must pass promotion gate, compile checks, and registry update
    outputs:
      - accumulation_plan
      - target_module
      - promotion_report

  - id: mathformerlib.registry
    phase: library
    trigger: after Mathformerlib files change or before reporting accumulated formalization counts
    owner_skill: mathformerlib-registry-manager
    reasoning_log_steps:
      - mathformerlib_registry_build_start
      - mathformerlib_registry_build_complete
      - mathformerlib_registry_build_error
    gate: registry must have no accepted modules with placeholder/scaffold markers
    outputs:
      - mathformerlib_registry
      - formalization_status_counts

  - id: mathformerlib.promotion_gate
    phase: library
    trigger: before moving a candidate formalization into accepted Mathformerlib status
    owner_skill: mathformerlib-promotion-gate
    reasoning_log_steps:
      - mathformerlib_promotion_gate_start
      - mathformerlib_promotion_gate_complete
      - mathformerlib_promotion_gate_error
    gate: realness and requested compile checks must pass before accepted promotion
    outputs:
      - promotion_status
      - promotion_findings

  - id: library.documentation
    phase: library
    trigger: after final Lean artifacts, realness reports, consistency reports, statistics, and Mathformerlib registry updates are complete
    owner_skill: mathformer-library-docs-generator
    reasoning_log_steps:
      - mathformer_library_docs_start
      - mathformer_library_docs_complete
      - mathformer_library_docs_error
    gate: every documented Lean module must have a repository Markdown page, rendered Lean and LaTeX/source sections where present, and an updated browsable index
    outputs:
      - mathformer_library_docs_index
      - mathformer_library_module_pages
      - mathformer_library_docs_manifest

  - id: library.aligned_html_documentation
    phase: library
    trigger: after final Lean artifacts have source-aware comments and the Markdown documentation pass is complete
    owner_skill: mathformer-library-docs-generator
    reasoning_log_steps:
      - mathformer_aligned_html_docs_start
      - mathformer_aligned_html_docs_complete
      - mathformer_aligned_html_docs_error
    gate: every included Lean module must have one aligned HTML page with original text, rendered LaTeX, syntax-highlightable Lean code, source-order declaration anchors, and an updated aligned index
    outputs:
      - mathformer_aligned_html_docs_index
      - mathformer_aligned_html_module_pages
      - mathformer_aligned_html_docs_manifest

  - id: draft.initial
    phase: drafting
    trigger: no seed_formalization is provided
    owner_skill: lean-autoformalization-drafter
    reasoning_log_steps:
      - autoformalizer_initial_start
      - autoformalizer_initial_output
    inputs:
      - dependency context
      - mathlib alignment hints
      - core statement annotations
      - line translation packet source anchors

  - id: draft.seed
    phase: drafting
    trigger: seed_formalization is provided
    owner_skill: autoformalization-workflow-orchestrator
    reasoning_log_steps:
      - seed_formalization_used

  - id: execute.initial
    phase: execution
    trigger: immediately after autoformalizer_initial_output or seed_formalization_used
    owner_skill: lean-execution-runner
    reasoning_log_steps:
      - lean_execution_initial_start
      - lean_execution_initial_output
    gate: execution diagnostics must be available before refinement decisions
    outputs:
      - correctness
      - hard_feedback
      - lean_error_log_file
      - lean_error_log

  - id: check.compile
    phase: verification
    trigger: after each generated or saved Lean artifact
    owner_skill: lean-compile-checker
    reasoning_log_steps:
      - hard_critique_initial_start
      - hard_critique_initial_output
      - hard_critique_start
      - hard_critique_output
      - hard_critique_final_start
      - hard_critique_final_output
      - saved_output_hard_check_start
      - saved_output_hard_check
      - compatibility_audit_lake_check_start
      - compatibility_audit_lake_check_complete
    gate: failed compile checks trigger formal refinement or fail the final gate

  - id: postformalization.source_anchor_drift_guard
    phase: verification
    trigger: after initial Lean generation, seed replay, refinement, or denoising when a line translation packet exists
    owner_skill: source-formalization-drift-guard
    reasoning_log_steps:
      - source_anchor_drift_guard_start
      - source_anchor_drift_guard_complete
      - source_anchor_drift_guard_error
    gate: Lean declaration comments must cite valid Source anchors with configured coverage, no orphan anchors, and no source-aware declaration comments missing anchors
    outputs:
      - source_anchor_drift_report
      - covered_source_anchor_set
      - uncovered_source_anchor_set

  - id: refine.formal
    phase: refinement
    trigger: hard critique or compile check fails
    owner_skill: lean-formal-refinement
    reasoning_log_steps:
      - iterative_refinement_triggered
      - formal_refiner_start
      - formal_refiner_output
      - iterative.formal_refiner_start
      - iterative.formal_refiner_output

  - id: critique.semantic
    phase: critique
    trigger: soft critique or final LLM judge suite is enabled
    owner_skill: lean-critique-and-judging
    reasoning_log_steps:
      - soft_critique_start
      - soft_critique_output
      - iterative.soft_critique_start
      - iterative.soft_critique_output
      - llm_judges_start
      - llm_judges_complete

  - id: critique.syntax
    phase: critique
    trigger: user asks for a Lean syntax, elaboration, or typecheck critique
    owner_skill: lean-syntactic-correctness-critic
    reasoning_log_steps:
      - hard_critique_initial_start
      - hard_critique_initial_output
      - hard_critique_start
      - hard_critique_output
      - hard_critique_final_start
      - hard_critique_final_output
      - compatibility_audit_lake_check_start
      - compatibility_audit_lake_check_complete
    gate: syntax failures block final critique-suite approval

  - id: critique.semantic_preservation
    phase: critique
    trigger: user asks whether Lean preserves the informal statement/proof
    owner_skill: lean-semantic-preservation-critic
    reasoning_log_steps:
      - soft_critique_start
      - soft_critique_output
      - llm_judges_start
      - llm_judges_complete
    gate: semantic preservation failures route to semantic realignment

  - id: critique.logical_soundness
    phase: critique
    trigger: user asks for a logical pass, non-vacuity review, or soundness critique
    owner_skill: lean-logical-soundness-critic
    reasoning_log_steps:
      - soft_critique_start
      - soft_critique_output
      - compatibility_audit_finding_detected
    gate: logical soundness failures block approval even if Lean compiles

  - id: critique.mathlib_alignment
    phase: critique
    trigger: user asks whether Lean is aligned with mathlib-native APIs
    owner_skill: lean-mathlib-alignment-critic
    reasoning_log_steps:
      - concept_mapping_success
      - concept_mapping_verify_result
      - compatibility_audit_finding_detected
    gate: release workflows may require these warnings to be resolved

  - id: critique.suite
    phase: critique
    trigger: user asks for a full critique suite, review gate, or systematic critique
    owner_skill: lean-critique-suite-orchestrator
    reasoning_log_steps:
      - critique_suite_start
      - hard_critique_initial_output
      - soft_critique_output
      - llm_judges_complete
      - compatibility_audit_complete
      - critique_suite_complete
      - critique_suite_error
    gate: suite judgement is pass only when all blocking passes succeed or are waived

  - id: critique.reference_free_monitor
    phase: critique
    trigger: after Lean execution, critique-suite output, or saved-artifact checks when benchmark-free correctness evidence must be trended
    owner_skill: reference-free-critic-monitor
    reasoning_log_steps:
      - reference_free_critic_monitor_start
      - reference_free_critic_measurement_complete
      - reference_free_critic_monotonicity_complete
      - reference_free_critic_monitor_complete
      - reference_free_critic_monitor_error
    gate: accepted refinements must not decrease reference-free critic scores, increase hard risk counts, or shrink theorem/source-anchor surfaces without explicit semantic-preservation justification
    outputs:
      - reference_free_critic_packet
      - reference_free_snapshot
      - reference_free_improvement_todos

  - id: postformalization.informalize
    phase: postformalization
    trigger: after a final Lean artifact compiles and before consistency review, artifact acceptance, or human-facing proof explanation
    owner_skill: lean-informalization-extractor
    reasoning_log_steps:
      - lean_informalization_extraction_start
      - lean_informalization_extraction_complete
      - lean_informalization_extraction_error
    gate: every theorem-like final declaration should have a conservative informal statement and proof summary derived from the Lean artifact, with source/generation comments preserved separately
    outputs:
      - lean_informalization_packet
      - reverse_statement_packets
      - reverse_proof_summaries

  - id: postformalization.informal_internal_consistency
    phase: postformalization
    trigger: after reverse informalization and before source/Lean informal-consistency review
    owner_skill: lean-informal-proof-internal-consistency-verifier
    reasoning_log_steps:
      - lean_informal_internal_consistency_start
      - lean_informal_internal_consistency_complete
      - lean_informal_internal_consistency_error
    gate: informalized proof packets must have no missing statements, missing proof summaries, placeholder traces, axioms-as-proofs, exact circular dependencies, or severe proof-shape contradictions before they are used as consistency evidence
    outputs:
      - informal_proof_internal_consistency_report
      - internal_proof_consistency_findings
      - internal_proof_consistency_score

  - id: consistency.declaration_shape
    phase: consistency
    trigger: after reverse informalization and before source/Lean informal-consistency review, non-vacuity review, or final acceptance
    owner_skill: lean-declaration-shape-consistency-checker
    reasoning_log_steps:
      - lean_declaration_shape_consistency_start
      - lean_declaration_shape_consistency_complete
      - lean_declaration_shape_consistency_error
    gate: theorem-like declarations must preserve source-advertised logical shape, including iff, existence, uniqueness, and conditional structure, unless an explicit representation-boundary note explains the encoding
    outputs:
      - declaration_shape_report
      - declaration_shape_findings
      - declaration_shape_score

  - id: postformalization.informal_consistency
    phase: postformalization
    trigger: after reverse informalization and before final artifact acceptance or MathformerLib promotion
    owner_skill: lean-informal-consistency-verifier
    reasoning_log_steps:
      - lean_informal_consistency_start
      - lean_informal_consistency_complete
      - lean_informal_consistency_error
    gate: final artifacts must have no reverse-informalization blockers, no realness blockers, no optional Lean-check failures, and no source/comment claim shape inconsistent with the Lean theorem signature
    outputs:
      - informal_consistency_report
      - reverse_consistency_findings
      - proof_consistency_score

  - id: consistency.nonvacuity
    phase: consistency
    trigger: after compilation, informalization, and declaration-shape review before final acceptance or MathformerLib promotion
    owner_skill: lean-nonvacuity-consistency-checker
    reasoning_log_steps:
      - lean_nonvacuity_consistency_start
      - lean_nonvacuity_consistency_complete
      - lean_nonvacuity_consistency_error
    gate: accepted theorem-like declarations must have no axioms, false-hypothesis vacuity, target-restating hypotheses, or undocumented exact-hypothesis proof wrappers
    outputs:
      - nonvacuity_report
      - nonvacuity_findings
      - nonvacuity_score

  - id: consistency.cross_file_concepts
    phase: consistency
    trigger: after one or more Lean artifacts are saved and before corpus-level acceptance or MathformerLib promotion
    owner_skill: lean-cross-file-concept-consistency-indexer
    reasoning_log_steps:
      - lean_cross_file_concept_index_start
      - lean_cross_file_concept_index_complete
      - lean_cross_file_concept_index_error
    gate: same-file full declaration-name collisions block acceptance; cross-file divergent concept families become review or MathformerLib-promotion todos
    outputs:
      - cross_file_concept_index
      - cross_file_consistency_report
      - mathformerlib_promotion_candidates

  - id: consistency.unified_report
    phase: consistency
    trigger: after saved Lean artifact generation, before final acceptance, and after any consistency, grounding, or realness critic changes
    owner_skill: lean-consistency-report-orchestrator
    reasoning_log_steps:
      - lean_consistency_report_start
      - lean_consistency_report_layer_complete
      - lean_consistency_report_complete
      - lean_consistency_report_error
    gate: final artifacts pass only when all required consistency layers pass, including compile context when enabled, comment hygiene, realness, informalization, declaration shape, internal proof consistency, reverse informal consistency, non-vacuity, cross-file concepts, mathlib grounding, and reference-free monitoring
    outputs:
      - lean_consistency_report
      - blocking_consistency_layers
      - monotonic_consistency_todos

  - id: refine.semantic
    phase: refinement
    trigger: semantic or aspect critique fails after hard critique succeeds
    owner_skill: lean-formal-refinement
    reasoning_log_steps:
      - informal_refinement_start
      - informal_refinement_output
      - iterative.informal_refiner_start
      - iterative.informal_refiner_output

  - id: transition.taxonomy
    phase: logging
    trigger: every recorded code transition
    owner_skill: lean-refinement-taxonomy
    reasoning_log_steps:
      - refinement_taxonomy_start
      - refinement_transition_analysis
      - iterative.refinement_taxonomy_start
      - iterative.refinement_transition_analysis
    gate: transition rows must include trigger_family and trigger_reason

  - id: output.denoise
    phase: cleanup
    trigger: raw model output includes prose, repeated candidates, or unfenced code
    owner_skill: lean-output-denoiser
    reasoning_log_steps:
      - denoising_start
      - denoising_complete

  - id: mathlib.import.minimize
    phase: cleanup
    trigger: after denoising, refinement, or saved Lean artifact generation when the import block should be tightened
    owner_skill: mathlib-import-minimizer
    reasoning_log_steps:
      - mathlib_import_minimization_start
      - mathlib_import_minimization_complete
    gate: final artifacts should have deduplicated imports and no broad `import Mathlib` unless explicitly waived
    outputs:
      - minimized_imports
      - suggested_import_block
      - import_minimization_findings

  - id: audit.compatibility
    phase: audit
    trigger: enable_compatibility_audit is true after saved output
    owner_skill: mathlib-abstraction-auditor
    reasoning_log_steps:
      - compatibility_audit_start
      - compatibility_audit_cli_start
      - compatibility_audit_file_loaded
      - compatibility_audit_structure_scanned
      - compatibility_audit_finding_detected
      - compatibility_audit_complete
      - compatibility_audit_report_written
      - compatibility_audit_output_emitted
      - compatibility_audit_error
    gate: compatibility_target_met controls score-gated outer cycles

  - id: artifact.realness_gate
    phase: artifacts
    trigger: after each saved Lean artifact or report, and before final statistics/report publication
    owner_skill: autoformalization-result-realness-verifier
    reasoning_log_steps:
      - result_realness_verification_complete
    gate: final artifacts must have no mock/stub/planned/unexecuted markers, no `sorry`/`admit`/target `axiom`, no missing generated-line `NL/LaTeX:` comments, and no interface scaffold claimed as complete
    outputs:
      - result_realness_report
      - blocking_realness_findings

  - id: artifact.statistics
    phase: artifacts
    trigger: workflow completion
    owner_skill: autoformalization-workflow-orchestrator
    reasoning_log_steps:
      - save_refinement_history
      - save_autoformalization_statistics
      - save_systematic_report
      - workflow_complete
    outputs:
      - .lean
      - .history.json
      - .report.json
      - reasoning-log.jsonl
      - .stats.json
      - .stats.tex

  - id: evaluation.rfde_report
    phase: evaluation
    trigger: after unified consistency report, reference-free critic monitoring, source-anchor drift report, realness gate, and artifact statistics are available
    owner_skill: reference-free-descriptive-evaluator
    reasoning_log_steps:
      - rfde_report_start
      - rfde_surface_measurement_complete
      - rfde_trajectory_analysis_complete
      - rfde_report_complete
      - rfde_report_error
    gate: RFDE reporting must expose hard gates, metric profiles, claim and obligation ledgers, diagnostics, cost trace, phase-transition observability, and rendered dashboard without hiding weak evidence surfaces
    outputs:
      - rfde_report_json
      - rfde_report_markdown
      - rfde_dashboard_html
      - rfde_trajectory_timeline_html
      - rfde_metrics_timeseries
      - rfde_trajectory_model

  - id: reflection.process_refinement
    phase: reflection
    trigger: after workflow reports and reasoning logs are produced, or when prompt/skill improvement opportunities are requested
    owner_skill: autoformalization-reflective-refinement-loop
    reasoning_log_steps:
      - reflective_refinement_loop_start
      - reflective_refinement_observation_complete
      - reflective_refinement_opportunity_identified
      - reflective_refinement_monotonicity_gate_complete
      - reflective_refinement_loop_complete
      - reflective_refinement_loop_error
    gate: proposed prompt or skill refinements must preserve all previously successful baseline cases and pass strict suite, hook, and reasoning-log checks
    outputs:
      - refinement_packet
      - monotonicity_contract
      - improvement_todos

  - id: test.skill_program
    phase: testing
    trigger: after skill, prompt, hook, runtime, or suite changes; before accepting prompt/skill refinements
    owner_skill: skill-test-program-orchestrator
    reasoning_log_steps:
      - skill_test_inventory_complete
      - skill_test_deterministic_start
      - skill_test_deterministic_check_complete
      - skill_test_deterministic_complete
      - skill_test_content_codex_exec_start
      - skill_test_content_codex_exec_result
      - skill_test_content_codex_exec_complete
      - skill_test_todos_generated
      - skill_test_program_error
    gate: deterministic checks must have no blocking failures, and generative/hybrid skills must have Codex-exec probes or explicit TODOs
    outputs:
      - skill_inventory
      - deterministic_test_report
      - content_codex_exec_report
      - skill_testing_todos

  - id: annotate.optional
    phase: annotation
    trigger: user asks for line-level Lean explanation
    owner_skill: lean-line-annotation
    reasoning_log_steps:
      - lean_line_annotation_start
      - lean_line_annotation_complete

  - id: annotate.line_comment_guard
    phase: annotation
    trigger: after initial drafting, denoising, or refinement produces generated Lean code and before the artifact is accepted or saved
    owner_skill: lean-line-annotation
    reasoning_log_steps:
      - lean_line_comment_guard_start
      - lean_line_comment_guard_complete
      - lean_line_comment_guard_error
    gate: generated Lean must preserve source-aware semantic declaration comments and avoid legacy per-line `NL/LaTeX:` noise or syntax-only comments
    outputs:
      - line_comment_contract_report

  - id: benchmark.proofnet
    phase: benchmark
    trigger: user asks for ProofNet download, export, or evaluation
    owner_skill: proofnet-benchmark-runner
    reasoning_log_steps:
      - proofnet_benchmark_start
      - proofnet_benchmark_complete
      - proofnet_benchmark_error

