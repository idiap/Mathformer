# File Documentation
#
# Motivation:
#   Make agent behavior explicit, scoped, and reproducible for specialized Mathformer tasks.
#
# Intent:
#   Tell coding agents what context to load, what invariants to preserve, and how to validate their work.
#
# Function:
#   Contains skill instructions, prompts, references, and scripts used by Codex-style workflows.
#
# Maintenance Notes:
#   Keep this header synchronized with major responsibility changes, and prefer updating tests or examples when behavior changes.

interface:
  display_name: "Workflow Contract Validator"
  short_description: "Check Mathformer hook ownership and routing"
  default_prompt: "Validate the Mathformer skill hook contract, report missing owners or runtime scripts, and identify any routing or reasoning-log evidence problems."
