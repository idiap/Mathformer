schema_version: workflow-skill/v1
namespace: mathformer
id: hub_paper_evidence_packet_workflow
version: 1.0.0
kind: workflow
description: Runnable main projection sharing argument parsing, ordered feature assembly,
  missing-path traversal, JSON persistence and native console completion with the
  CLI.
aliases:
- paper:evidence-packet
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Argv:
    schema:
      type: array
      items:
        type: string
  Arguments:
    schema:
      type: object
      required:
      - feature
      - output
      - json
      properties:
        feature:
          enum:
          - all
          - reasoning-log-html-renderer
          - reference-free-critic-monitor
          - controlled-action-hub
          - workflow-catalogue-graph-report
          type: string
        output:
          type: string
        json:
          type: boolean
  FeatureBatch:
    schema:
      type: array
      items:
        type: object
      minItems: 1
      maxItems: 4
  Packet:
    schema:
      type: object
      required:
      - schema_version
      - packet_type
      - missing_paths
      properties:
        schema_version:
          const: 1
        packet_type:
          enum:
          - paper_new_functionality_evidence_collection
          - paper_new_functionality_evidence
        missing_paths:
          type: array
          items:
            type: string
  PacketFile:
    schema:
      type: object
      required:
      - schema_version
      - packet_type
      - missing_paths
      properties:
        schema_version:
          const: 1
        packet_type:
          enum:
          - paper_new_functionality_evidence_collection
          - paper_new_functionality_evidence
        missing_paths:
          type: array
          items:
            type: string
    representation: file
    media_type: application/json
  OutputPath:
    schema:
      type: string
  Result:
    schema:
      type: object
      required:
      - ok
      - output
      - feature
      - feature_count
      - missing_path_count
      - missing_paths
      properties:
        ok:
          const: true
        output:
          type: string
        feature:
          type: string
        feature_count:
          type: integer
          minimum: 1
          maximum: 4
        missing_path_count:
          type: integer
          minimum: 0
        missing_paths:
          type: array
          items:
            type: string
  ExitCode:
    schema:
      const: 0
      type: integer
  Console:
    schema:
      type: string
inputs:
  argv:
    type: Argv
outputs:
  packet:
    type: Packet
    value:
      ref: steps.finalize.outputs.packet
  artifact:
    type: PacketFile
    value:
      ref: steps.write.outputs.artifact
  result:
    type: Result
    value:
      ref: steps.emit.outputs.result
  exit_code:
    type: ExitCode
    value:
      ref: steps.emit.outputs.exit_code
  stdout:
    type: Console
    value:
      ref: steps.emit.outputs.stdout
operations:
  parse:
    inputs:
      argv:
        type: Argv
    outputs:
      args:
        type: Arguments
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_paper_evidence_parse
        operation: mathformer_paper_evidence_parse
  build_all:
    inputs: {}
    outputs:
      packets:
        type: FeatureBatch
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_paper_evidence_build_all
        operation: mathformer_paper_evidence_build_all
  build_one:
    inputs:
      args:
        type: Arguments
    outputs:
      packets:
        type: FeatureBatch
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_paper_evidence_build_one
        operation: mathformer_paper_evidence_build_one
  finalize:
    inputs:
      args:
        type: Arguments
      packets:
        type: FeatureBatch
    outputs:
      packet:
        type: Packet
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_paper_evidence_finalize
        operation: mathformer_paper_evidence_finalize
  write:
    inputs:
      args:
        type: Arguments
      packet:
        type: Packet
    outputs:
      path:
        type: OutputPath
      artifact:
        type: PacketFile
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_paper_evidence_write
        operation: mathformer_paper_evidence_write
  emit:
    inputs:
      args:
        type: Arguments
      packet:
        type: Packet
      path:
        type: OutputPath
    outputs:
      result:
        type: Result
      exit_code:
        type: ExitCode
      stdout:
        type: Console
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_paper_evidence_emit
        operation: mathformer_paper_evidence_emit
flow:
  kind: sequence
  steps:
  - id: parse
    kind: call
    operation: parse
    arguments:
      argv:
        ref: inputs.argv
  - id: select
    kind: switch
    cases:
    - id: all
      when:
        eq:
        - ref: steps.parse.outputs.args.feature
        - literal: all
      body:
        kind: call
        operation: build_all
        arguments: {}
    default:
      kind: call
      operation: build_one
      arguments:
        args:
          ref: steps.parse.outputs.args
    outputs:
      packets:
        type: FeatureBatch
        value:
          ref: selected.outputs.packets
  - id: finalize
    kind: call
    operation: finalize
    arguments:
      args:
        ref: steps.parse.outputs.args
      packets:
        ref: steps.select.outputs.packets
  - id: write
    kind: call
    operation: write
    arguments:
      args:
        ref: steps.parse.outputs.args
      packet:
        ref: steps.finalize.outputs.packet
  - id: emit
    kind: call
    operation: emit
    arguments:
      args:
        ref: steps.parse.outputs.args
      packet:
        ref: steps.finalize.outputs.packet
      path:
        ref: steps.write.outputs.path
  outputs:
    artifact:
      type: PacketFile
      value:
        ref: steps.write.outputs.artifact
    result:
      type: Result
      value:
        ref: steps.emit.outputs.result
    exit_code:
      type: ExitCode
      value:
        ref: steps.emit.outputs.exit_code
    packet:
      type: Packet
      value:
        ref: steps.finalize.outputs.packet
    stdout:
      type: Console
      value:
        ref: steps.emit.outputs.stdout
policy:
  effects:
    filesystem:
      read:
      - repository_evidence_paths
      write:
      - selected_output_path_and_parents
    network: []
    external_write: []
  authority:
    allowed:
    - inspect_evidence_paths
    - write_evidence_packet
    forbidden:
    - execute_recorded_validation_commands
    - infer_scientific_truth_from_completion
    - bypass_native_controls
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Evidence-path metadata and source-authored claims only; completion
    establishes no scientific validation or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: paper_skills/framework-repository-cartographer/scripts/build_paper_evidence_packet.py
    selector: main; parse_options; build_all_packets; build_one_packet; finalize_packet;
      write_packet; emit_result; build_packet; FEATURE_BUILDERS; missing_paths; iter_path_records;
      path_entry; validation_command
    digest: sha256:a4554e62ad8531b71f0d591f2796265b2c3915445ce179ace2c23927e90140a8
  - path: scripts/mathformer.py
    selector: build_registry/action:paper:evidence-packet; run_action; run_leaf_action;
      prepare_leaf_boundary; launch_leaf_boundary; finish_leaf_boundary
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/paper_evidence_packet_tools.py
    selector: register_paper_evidence_packet_tools
    digest: sha256:07d5a9393760b95641f3dab4d5ee664cdc7ffaef9a683c0902916a558c489acd
  - path: scripts/mcp_server.py
    selector: _paper_evidence_packet_guard; register_paper_evidence_packet_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: service capability inventory
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory/paper:evidence-packet
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/test_matrix.json
    selector: mcp.paper_evidence_packet.workflow
    digest: sha256:f84f868985d0f9b2087a24feff1fce6b3542baf6112134d7160181c2f59557e2
  gaps:
  - Feature templates and finite helper traversal stay opaque within their owning
    operations; payload types summarize their interfaces.
  - The graph models main only. Hub preflight, dry-run and write auditing remain in
    the native hub boundary and are not run by these main-step tools. MCP deployment
    readonly and configured write roots apply before persistence.
  - The 3600-second and five-call ceilings are enforced by Lunar, not the native CLI.
    There is no native refinement, retry or convergence loop.
  - Argparse termination (including help) ends the parse tool invocation with its
    exit code and stderr console output, without downstream calls; it is a tool error
    rather than an ordinary packet result.
extensions:
  mathformer.source:
    category: hub
    native_id: paper:evidence-packet
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: paper:evidence-packet
      family: paper
      kind: generation
      safety: writes_artifacts
      command:
      - '{python}'
      - paper_skills/framework-repository-cartographer/scripts/build_paper_evidence_packet.py
      - --output
      - artifacts/paper_skills/new_functionality_evidence_packet.json
      - --json
      depends_on: []
      writes:
      - artifacts/paper_skills/
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: Registered paper:evidence-packet dispatches run_action -> run_leaf_action.
      Preflight errors return without launch; dry-run also returns without launch.
      Otherwise launch once, interpret exit status, audit writes and optionally report.
      No dependencies or native timeout.
    hub_defaults:
      feature: all
      output: artifacts/paper_skills/new_functionality_evidence_packet.json
      json: true
    direct_entrypoint: main accepts --feature, --output and --json; absolute output
      paths are supported.
    callers:
    - paper:update-plan
    - both paper claim-audit actions
    - paper:functionality-update-suite
    failure_policy: Preserve failed preflight/subprocess outcomes; never treat missing
      evidence metadata as native execution failure.
    effects_status: Source reads evidence metadata and writes selected JSON; hub additionally
      audits and may write artifacts/workflow_hub/.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    modeling: Main-only ordered source projection; builder/traversal helper internals
      stay inside owning operations. No synthetic loop bounds or checkpoint support.
# REUSE-IgnoreEnd
