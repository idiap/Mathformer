  gaps:
  - Child preflight, subprocess execution, self-test assertions and write auditing
    remain native inside visit; child fields are carried unchanged.
  - Registry specialization fixes this alias to one dependency and no parent command;
    a different registry requires a different bound and graph.
  - 3600 seconds and five operation calls are descriptor budgets enforced by Lunar,
    not native controller budgets. CLI leaf timeout remains None; separate mathformer_run_action
    applies its configurable MCP cap.
  - Unknown-action admission is implemented by the shared source but unreachable for
    this fixed registered alias.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:coherence-canonicalize
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lib:coherence-canonicalize
      summary: Alias for MathformerPhysicsLib concept canonicalization.
      family: mathformerphysicslib
      kind: sequence
      safety: read_only
      command: []
      depends_on:
      - mathformerphysicslib:concept-canonicalize
      required_paths: []
      required_tools: []
      optional_tools: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: CLI main and scripts/mcp_server.py::mathformer_run_workflow -> mathformer_run_action
      use build_registry -> run_action/prepare_action.
    failure_policy: Return native failure payloads unchanged; child ok=false is data
      consumed by advance, not a graph exception.
    scientific_payloads: Selected self-test builds two concepts, canonicalizes, audits
      grounding, runs critics, builds repair/gate/generative reports and asserts expectations.
      main canonicalizes the returned report again; it lacks concept_occurrence_index,
      so emitted graph concept_count is zero. JSON stdout stays inside the child HubResult.
    canonicalization: Sorted concept IDs accumulate records. Owner selection stops
      at first matching owner hint, else first foundation occurrence, else sole occurrence,
      else ambiguity. Traversals are input-sized with no convergence or repair loop.
      Other CLI invocations load an input inventory or build one; the selected hub
      command always uses self-test.
    adapter: The shared native steps are registered as MCP tools. A transport-only
      carry preserves rejection through a top-level loop because Lunar requires scoped
      exit handling for branch-local loops. Rejected admission performs no native
      visit; accepted runs visit once and stop at the first transition.
