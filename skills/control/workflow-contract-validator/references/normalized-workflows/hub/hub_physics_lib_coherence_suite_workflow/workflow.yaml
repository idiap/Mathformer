schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lib_coherence_suite_workflow
version: 1.0.0
kind: workflow
description: Commandless alias and nine ordered independent coherence smoke checks.
aliases:
- physics-lib:coherence-suite
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../../coherence-suite-alias-interface.schema.json#/$defs/RunContext
    representation: value
  HubResult:
    schema: ../../../coherence-suite-alias-interface.schema.json#/$defs/HubResult
    representation: value
  ActionId:
    schema:
      type: string
  Strings:
    schema:
      type: array
      items:
        type: string
  Bool:
    schema:
      type: boolean
  Admission:
    schema:
      type: object
      required:
      - accepted
      - status
      - ancestry
      properties:
        accepted:
          type: boolean
        status:
          type: string
          enum:
          - accepted
          - unknown_action
          - dependency_cycle
          - extra_args_for_sequence
        ancestry:
          type: array
          items:
            type: string
      additionalProperties: false
  DependencyState:
    schema:
      type: object
      required:
      - index
      - children
      - dependencies_ok
      - ancestry
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 9
        children:
          type: array
          maxItems: 9
          items:
            type: object
            required:
            - ok
            properties:
              ok:
                type: boolean
        dependencies_ok:
          type: boolean
        ancestry:
          type: array
          items:
            type: string
      additionalProperties: false
  RepositoryRoot:
    schema:
      type: string
      minLength: 1
inputs:
  context:
    type: RunContext
  extra_args:
    type: Strings
  seen:
    type: Strings
  repository_root:
    type: RepositoryRoot
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  admit:
    inputs:
      action:
        type: ActionId
      extra_args:
        type: Strings
      seen:
        type: Strings
    outputs:
      admission:
        type: Admission
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_admit
        operation: mathformer_coherence_alias_admit
  reject:
    inputs:
      action:
        type: ActionId
      admission:
        type: Admission
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_reject
        operation: mathformer_coherence_alias_reject
  initialize:
    inputs:
      admission:
        type: Admission
    outputs:
      state:
        type: DependencyState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_initialize
        operation: mathformer_coherence_alias_initialize
  visit_leaf:
    inputs:
      state:
        type: DependencyState
      context:
        type: RunContext
      repository_root:
        type: RepositoryRoot
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_visit
        operation: mathformer_coherence_alias_visit
  advance:
    inputs:
      action:
        type: ActionId
      state:
        type: DependencyState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: DependencyState
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_advance
        operation: mathformer_coherence_alias_advance
  finish:
    inputs:
      action:
        type: ActionId
      state:
        type: DependencyState
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_finish
        operation: mathformer_coherence_alias_finish
  carry:
    inputs:
      state:
        type: DependencyState
    outputs:
      state:
        type: DependencyState
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_carry
        operation: mathformer_coherence_alias_carry
  return_result:
    inputs:
      result:
        type: HubResult
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_alias_return_result
        operation: mathformer_coherence_alias_return_result
flow:
  kind: sequence
  steps:
  - id: alias_admission
    kind: call
    operation: admit
    arguments:
      action:
        literal: physics-lib:coherence-suite
      extra_args:
        ref: inputs.extra_args
      seen:
        ref: inputs.seen
  - id: alias_dispatch
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.alias_admission.outputs.admission.accepted
      body:
        kind: sequence
        steps:
        - id: alias_state
          kind: call
          operation: initialize
          arguments:
            admission:
              ref: steps.alias_admission.outputs.admission
        - id: suite_admission
          kind: call
          operation: admit
          arguments:
            action:
              literal: mathformerphysicslib:coherence-suite
            extra_args:
              literal: []
            seen:
              ref: steps.alias_state.outputs.state.ancestry
        - id: suite_dispatch
          kind: switch
          cases:
          - id: accepted
            when:
              ref: steps.suite_admission.outputs.admission.accepted
            body:
              kind: sequence
              steps:
              - id: suite_state
                kind: call
                operation: initialize
                arguments:
                  admission:
                    ref: steps.suite_admission.outputs.admission
              outputs:
                state:
                  type: DependencyState
                  value:
                    ref: steps.suite_state.outputs.state
                rejection:
                  type: HubResult
                  value:
                    literal:
                      ok: true
          default:
            kind: sequence
            steps:
            - id: suite_reject
              kind: call
              operation: reject
              arguments:
                action:
                  literal: mathformerphysicslib:coherence-suite
                admission:
                  ref: steps.suite_admission.outputs.admission
            outputs:
              state:
                type: DependencyState
                value:
                  literal:
                    index: 0
                    children: []
                    dependencies_ok: true
                    ancestry: []
              rejection:
                type: HubResult
                value:
                  ref: steps.suite_reject.outputs.result
          outputs:
            state:
              type: DependencyState
              value:
                ref: selected.outputs.state
            rejection:
              type: HubResult
              value:
                ref: selected.outputs.rejection
        outputs:
          alias_state:
            type: DependencyState
            value:
              ref: steps.alias_state.outputs.state
          state:
            type: DependencyState
            value:
              ref: steps.suite_dispatch.outputs.state
          ready:
            type: Bool
            value:
              ref: steps.suite_admission.outputs.admission.accepted
          rejection:
            type: HubResult
            value:
              ref: steps.suite_dispatch.outputs.rejection
    default:
      kind: sequence
      steps:
      - id: alias_reject
        kind: call
        operation: reject
        arguments:
          action:
            literal: physics-lib:coherence-suite
          admission:
            ref: steps.alias_admission.outputs.admission
      outputs:
        alias_state:
          type: DependencyState
          value:
            literal:
              index: 0
              children: []
              dependencies_ok: true
              ancestry: []
        state:
          type: DependencyState
          value:
            literal:
              index: 0
              children: []
              dependencies_ok: true
              ancestry: []
        ready:
          type: Bool
          value:
            literal: false
        rejection:
          type: HubResult
          value:
            ref: steps.alias_reject.outputs.result
    outputs:
      alias_state:
        type: DependencyState
        value:
          ref: selected.outputs.alias_state
      state:
        type: DependencyState
        value:
          ref: selected.outputs.state
      ready:
        type: Bool
        value:
          ref: selected.outputs.ready
      rejection:
        type: HubResult
        value:
          ref: selected.outputs.rejection
  - id: dependencies
    kind: loop
    description: Top-level placement permits scoped PRISM exhaustion. Rejected admissions
      carry an inert frame once and launch nothing.
    state_type: DependencyState
    initial:
      ref: steps.alias_dispatch.outputs.state
    max_iterations: 9
    on_exhausted: fail
    body:
      id: dispatch
      kind: switch
      cases:
      - id: accepted
        when:
          ref: steps.alias_dispatch.outputs.ready
        body:
          kind: sequence
          steps:
          - id: visit
            kind: call
            operation: visit_leaf
            arguments:
              state:
                ref: loop.state
              context:
                ref: inputs.context
              repository_root:
                ref: inputs.repository_root
          - id: collect
            kind: call
            operation: advance
            arguments:
              action:
                literal: mathformerphysicslib:coherence-suite
              state:
                ref: loop.state
              child:
                ref: steps.visit.outputs.result
              context:
                ref: inputs.context
          outputs:
            state:
              type: DependencyState
              value:
                ref: steps.collect.outputs.state
            done:
              type: Bool
              value:
                ref: steps.collect.outputs.done
      default:
        id: carry
        kind: call
        operation: carry
        arguments:
          state:
            ref: loop.state
      outputs:
        state:
          type: DependencyState
          value:
            ref: selected.outputs.state
        done:
          type: Bool
          value:
            ref: selected.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: DependencyState
        value:
          ref: loop.state
  - id: suite_completion
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.alias_dispatch.outputs.ready
      body:
        id: suite_finish
        kind: call
        operation: finish
        arguments:
          action:
            literal: mathformerphysicslib:coherence-suite
          state:
            ref: steps.dependencies.outputs.state
    default:
      id: return_rejection
      kind: call
      operation: return_result
      arguments:
        result:
          ref: steps.alias_dispatch.outputs.rejection
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  - id: alias_completion
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.alias_admission.outputs.admission.accepted
      body:
        kind: sequence
        steps:
        - id: alias_collect
          kind: call
          operation: advance
          arguments:
            action:
              literal: physics-lib:coherence-suite
            state:
              ref: steps.alias_dispatch.outputs.alias_state
            child:
              ref: steps.suite_completion.outputs.result
            context:
              ref: inputs.context
        - id: alias_finish
          kind: call
          operation: finish
          arguments:
            action:
              literal: physics-lib:coherence-suite
            state:
              ref: steps.alias_collect.outputs.state
        outputs:
          result:
            type: HubResult
            value:
              ref: steps.alias_finish.outputs.result
    default:
      id: return_rejection
      kind: call
      operation: return_result
      arguments:
        result:
          ref: steps.alias_dispatch.outputs.rejection
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.alias_completion.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 25
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Hub completion is transport success; no scientific validity or promotion
    follows.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_action (with build_registry and prepare_action)
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/coherence_suite_alias_tools.py
    selector: register_coherence_suite_alias_tools
    digest: sha256:016688daeb9b81bcc9d8275b1b0f5ec2b5e03667f39f4a0e033fe68c8c23d256
  - path: scripts/coherence_suite_tools.py
    selector: Context, Admission, State
    digest: sha256:f01f545deae5fdef5acfcfc30fafa39bc7059e66b3184a29f41fb336f3345ace
  - path: scripts/mathformer_mcp_service.py
    selector: mcp_tools
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/references/coherence-suite-alias-interface.schema.json
    selector: $defs
    digest: sha256:185e8080eb04be6c100d710539b0a96e0332e99f1098c6c779da0d51ff0d9447
  - path: scripts/mcp_server.py
    selector: 'register_coherence_suite_alias_tools(mcp, lambda path: _path_allowed(path))'
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Leaf script internals and scientific JSON meanings remain opaque; unexpected launch
    errors propagate.
  - The 3600-second and 25-call limits are enforced by Lunar, not by the native CLI
    controller. Staged tools retain native timeout_seconds=None; the separate MCP
    mathformer_run_action interface applies its configured timeout.
  - Mandatory Lunar receipts/provenance preserve native payloads and write audits;
    they do not upgrade optional native logs or qualify external capabilities.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:coherence-suite
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lib:coherence-suite
      family: mathformerphysicslib
      kind: sequence
      safety: read_only
  mathformer.native_boundary:
    execution: Registered mathformer_coherence_alias_* MCP tools reuse native helpers
      and fixed build_registry. Explicit repository_root is carried through leaf preflight,
      subprocess cwd and both write-audit snapshots. carry transports an inactive
      frame unchanged; it executes no source step.
    input_conventions: All RunContext fields, repository_root, extra_args and seen
      are explicit; CLI empty-list conventions are supplied by the caller.
    leaf_semantics: Preflight failure returns ok=false; dry_run launches nothing.
      Otherwise exit status and write-audit acceptance determine ok; JSON output is
      captured, not interpreted.
    timeout: Native staged leaves retain registry timeouts (None here); Lunar enforces
      workflow wall/call ceilings. The separate mathformer_run_action interface supplies
      its default 600-second per-leaf cap.
    failure_policy: Native ok=false is returned as payload; only unexpected controller
      exceptions terminate graph execution.
    qualification_capability_names_are_not_runtime_grants: true
  mathformer.composition:
    ordered_checks:
    - inventory
    - canonicalization
    - Mathlib grounding
    - redefinition
    - integration
    - API operability
    - generative critique planning
    - repair planning
    - coherence gating
    leaf_arguments:
    - --self-test
    - --json
    dataflow: Results are collected in children; no leaf consumes a preceding leaf's
      output.
    bounds: One alias child expanded once; nine suite visits maximum. Done is true
      on visit nine, so the bound returns normally; exhaustion is unreachable for
      this registry.
    stopping: Stop after the declared count or first failed child unless keep_going;
      cumulative failure never recovers.
    parent_commands: Both wrappers are commandless and return nested sequence envelopes.
    callers: CLI main; run_intent_match via mathformerphysicslib.coherence; MCP mathformer_run_workflow
      to mathformer_run_action to hub.run_action.
    route_boundary: The NL route schedules coherence-loop-report separately after
      this suite; it is outside this contract.
