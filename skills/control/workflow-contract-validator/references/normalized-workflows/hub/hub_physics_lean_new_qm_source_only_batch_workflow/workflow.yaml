schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lean_new_qm_source_only_batch_workflow
version: 1.0.0
kind: workflow
description: Source-only deprecated QM scaffold batch; models main and the gated process_case
  path.
aliases:
- physics-lean:new-qm-source-only-batch
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Arguments:
    schema:
      type: array
      items:
        type: string
  BatchState:
    schema:
      type: object
      required:
      - records
      - position
      - cases
      - run_gates
      - json_output
      properties:
        records:
          type: array
          items:
            type: object
        position:
          type: integer
          minimum: 0
          maximum: 20
        cases:
          type: array
          maxItems: 20
          items:
            type: object
        run_gates:
          type: boolean
        json_output:
          type: boolean
      additionalProperties: false
  CaseWork:
    schema:
      type: object
      required:
      - result
      - paths
      properties:
        result:
          type: object
          required:
          - case_id
          - source_index
          - lean_path
          - source_record
          - required_terms
          properties:
            case_id:
              type: string
            source_index:
              type: integer
            lean_path:
              type: string
            source_record:
              type: string
            required_terms:
              type: array
              items:
                type: string
        paths:
          type: object
          required:
          - lean
          - source
          - packets
          properties:
            lean:
              type: string
            source:
              type: string
            packets:
              type: object
              additionalProperties:
                type: string
      additionalProperties: false
  CommandResult:
    schema:
      type: object
      required:
      - command
      - returncode
      - ok
      - stdout_tail
      - stderr_tail
      - json
      properties:
        command:
          type: array
          items:
            type: string
        returncode:
          type: integer
        ok:
          type: boolean
        stdout_tail:
          type: string
        stderr_tail:
          type: string
        json: {}
  BatchReport:
    schema:
      type: object
      required:
      - schema_version
      - style
      - source_policy
      - case_count
      - cases
      - mathlib_grounding_audit
      - mathlib_grounding_audit_ok
      - ok
      properties:
        schema_version:
          const: 1
        style:
          const: new_qm_source_only_recursive_batch_report
        source_policy:
          const: question_answer_only_dataset_solution_forbidden
        case_count:
          const: 20
        cases:
          type: array
          minItems: 20
          maxItems: 20
          items:
            type: object
        mathlib_grounding_audit:
          type: string
        mathlib_grounding_audit_ok:
          type: boolean
        ok:
          type: boolean
      additionalProperties: false
  Boolean:
    schema:
      type: boolean
  Path:
    schema:
      type: string
  ExitCode:
    schema:
      type: integer
      enum:
      - 0
      - 1
  RuntimeContext:
    schema:
      type: object
      required:
      - repository_root
      - allow_mutating
      properties:
        repository_root:
          type: string
          minLength: 1
        allow_mutating:
          type: boolean
      additionalProperties: false
inputs:
  argv:
    type: Arguments
  context:
    type: RuntimeContext
outputs:
  summary:
    type: BatchReport
    value:
      ref: flow.outputs.summary
  report_path:
    type: Path
    value:
      ref: flow.outputs.report_path
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
operations:
  initialize:
    inputs:
      argv:
        type: Arguments
      context:
        type: RuntimeContext
    outputs:
      state:
        type: BatchState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_initialize
        operation: mathformer_new_qm_initialize
  generate:
    inputs:
      state:
        type: BatchState
      context:
        type: RuntimeContext
    outputs:
      work:
        type: CaseWork
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_generate
        operation: mathformer_new_qm_generate
  initial_plan:
    inputs:
      work:
        type: CaseWork
      context:
        type: RuntimeContext
    outputs:
      work:
        type: CaseWork
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_initial_plan
        operation: mathformer_new_qm_initial_plan
  compile:
    inputs:
      work:
        type: CaseWork
      context:
        type: RuntimeContext
    outputs:
      work:
        type: CaseWork
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_compile
        operation: mathformer_new_qm_compile
  completeness:
    inputs:
      work:
        type: CaseWork
      context:
        type: RuntimeContext
    outputs:
      work:
        type: CaseWork
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_completeness
        operation: mathformer_new_qm_completeness
  repair_plans:
    inputs:
      work:
        type: CaseWork
      context:
        type: RuntimeContext
    outputs:
      work:
        type: CaseWork
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_repair_plans
        operation: mathformer_new_qm_repair_plans
  final_plan:
    inputs:
      work:
        type: CaseWork
      context:
        type: RuntimeContext
    outputs:
      work:
        type: CaseWork
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_final_plan
        operation: mathformer_new_qm_final_plan
  append_case:
    inputs:
      state:
        type: BatchState
      work:
        type: CaseWork
    outputs:
      state:
        type: BatchState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_append_case
        operation: mathformer_new_qm_append_case
  grounding_audit:
    inputs:
      state:
        type: BatchState
      context:
        type: RuntimeContext
    outputs:
      audit:
        type: CommandResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_grounding_audit
        operation: mathformer_new_qm_grounding_audit
  report:
    inputs:
      state:
        type: BatchState
      audit:
        type: CommandResult
      context:
        type: RuntimeContext
    outputs:
      summary:
        type: BatchReport
      report_path:
        type: Path
      exit_code:
        type: ExitCode
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_new_qm_report
        operation: mathformer_new_qm_report
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments:
      argv:
        ref: inputs.argv
      context:
        ref: inputs.context
  - id: cases
    kind: loop
    state_type: BatchState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 20
    on_exhausted: fail
    description: Fixed ordered source iteration; done is true on the twentieth append,
      so normal completion precedes exhaustion.
    body:
      kind: sequence
      steps:
      - id: generate
        kind: call
        operation: generate
        arguments:
          state:
            ref: loop.state
          context:
            ref: inputs.context
      - id: gates
        kind: switch
        cases:
        - id: enabled
          when:
            ref: loop.state.run_gates
          body:
            kind: sequence
            steps:
            - id: initial_plan
              kind: call
              operation: initial_plan
              arguments:
                work:
                  ref: steps.generate.outputs.work
                context:
                  ref: inputs.context
            - id: compile
              kind: call
              operation: compile
              arguments:
                work:
                  ref: steps.initial_plan.outputs.work
                context:
                  ref: inputs.context
            - id: completeness
              kind: call
              operation: completeness
              arguments:
                work:
                  ref: steps.compile.outputs.work
                context:
                  ref: inputs.context
            - id: repair_plans
              kind: call
              operation: repair_plans
              arguments:
                work:
                  ref: steps.completeness.outputs.work
                context:
                  ref: inputs.context
            - id: final_plan
              kind: call
              operation: final_plan
              arguments:
                work:
                  ref: steps.repair_plans.outputs.work
                context:
                  ref: inputs.context
            - id: append_gated
              kind: call
              operation: append_case
              arguments:
                state:
                  ref: loop.state
                work:
                  ref: steps.final_plan.outputs.work
            outputs:
              state:
                type: BatchState
                value:
                  ref: steps.append_gated.outputs.state
              done:
                type: Boolean
                value:
                  ref: steps.append_gated.outputs.done
        default:
          kind: call
          operation: append_case
          arguments:
            state:
              ref: loop.state
            work:
              ref: steps.generate.outputs.work
        outputs:
          state:
            type: BatchState
            value:
              ref: selected.outputs.state
          done:
            type: Boolean
            value:
              ref: selected.outputs.done
      outputs:
        state:
          type: BatchState
          value:
            ref: steps.gates.outputs.state
        done:
          type: Boolean
          value:
            ref: steps.gates.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: BatchState
        value:
          ref: loop.state
  - id: grounding
    kind: call
    operation: grounding_audit
    arguments:
      state:
        ref: steps.cases.outputs.state
      context:
        ref: inputs.context
  - id: report
    kind: call
    operation: report
    arguments:
      state:
        ref: steps.cases.outputs.state
      audit:
        ref: steps.grounding.outputs.audit
      context:
        ref: inputs.context
  outputs:
    summary:
      type: BatchReport
      value:
        ref: steps.report.outputs.summary
    report_path:
      type: Path
      value:
        ref: steps.report.outputs.report_path
    exit_code:
      type: ExitCode
      value:
        ref: steps.report.outputs.exit_code
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/physics_lean/new_qm_source_only/
      - artifacts/workflow_hub/
      - libraries/MathformerPhysicsLib/Lean/formalphysics_*/
      - MathformerPhysicsLib/Lean/formalphysics_*/
      - artifacts/physics_lean/grounded_sample_thoroughness/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 900
    max_operation_calls: 143
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Generated wrappers, packets and successful commands do not establish
    scientific truth or promotion.
observability:
