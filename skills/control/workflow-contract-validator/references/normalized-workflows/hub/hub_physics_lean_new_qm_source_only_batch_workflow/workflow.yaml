  gaps:
  - All main graph operations have registered MCP ports and share native implementation.
    Child-program internals remain native. Compilation is not a scientific validity
    claim.
  - The graph begins at runner argv. Hub admission, dry-run, 900-second subprocess
    deadline, capture and post-run write auditing remain the surrounding native boundary.
    MCP initialize reuses hub preflight and requires explicit mutation authorization;
    service write-root policy applies to writing ports. Outputs are native batch results,
    not HubResult audit attestations.
  - Context relocates repository input/output paths and native helper paths. Deployment
    must qualify repository mounts and the declared effects; capability labels are
    not runtime grants. Child timeouts remain 240 seconds. The contract also enforces
    its 900-second wall budget and 143-call limit.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lean:new-qm-source-only-batch
    owner_skill: skills/physics-lean/physics-lean-goal-sample-autoformalizer/SKILL.md
    contract:
      id: physics-lean:new-qm-source-only-batch
      family: physics_lean
      kind: generation
      safety: writes_repo
      depends_on: []
      allows_extra_args: true
      timeout_seconds: 900
  mathformer.native_boundary:
    execution: Shared native runner steps through scripts/new_qm_source_only_tools.py
      registered in scripts/mcp_server.py; original hub action remains available.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    argv_prefix:
    - --acknowledge-deprecated-batch-scaffold
    - --json
    admission: Mutation authorization required unless dry-run; preflight checks required
      paths; dry-run does not enter main.
    completion: Capture native exit/stdout/stderr; timeout becomes failed hub result;
      undeclared writes can override hub success independently of summary.ok.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    step_context:
    - repository_root
    - allow_mutating
    observability: Native report formatting goes to MCP stderr; command records and
      artifact paths are unchanged. Lunar supplies workflow receipts.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    selected_cases:
    - 4
    - 9
    - 12
    - 19
    - 23
    - 25
    - 32
    - 34
    - 35
    - 37
    - 39
    - 41
    - 43
    - 44
    - 45
    - 47
    - 48
    - 49
    - 53
    - 56
    bounds: 20 fixed case iterations; controller max-iterations=8 is an argument,
      not an enclosing repair loop; 143 calls is the derived graph ceiling.
    timing: Each direct runner child has 240 seconds; 900 seconds bounds the hub runner
      subprocess, not native main in isolation; 3600 is not a native bound.
    failure: Exceptions, child timeouts, non-QM records and check=True nonzero exits
      abort before reporting; recorded command failures continue; unsuccessful summary
      is emitted before exit 1.
    bindings: Every call uses a real registered MCP tool over shared source functions.
      No external boundary substitution exists in production.
  mathformer.steps:
    initialize: 'main: parse argv; reject missing acknowledgement and invalid arguments;
      load FormalPhysics.json; initialize cases=[], position=0 and parsed flags. run_gates
      and json_output default false.'
    generate: 'main selection and process_case before run_gates: index SELECTED_CASES
      at position; reject non-QM; pass only field/question/answer. Write fixed-template
      Lean wrapper, source_record.json, predetermined packets and skill_usage_ledger.json;
      initialize fresh result and paths. Ledger statuses do not prove execution.'
    initial_plan: 'process_case goal_plan_before_gates: plan --case --json to goal_plan_initial.json;
      append command result; check=True, timeout=240.'
    compile: 'process_case lean_compile: lake env lean using work paths; append result;
      check=False, timeout=240; nonzero exit continues.'
    completeness: 'process_case completeness: check Lean and source record with recursive-frontier-count=0,
      expect-complete and JSON output to derivation_completeness.json; append result;
      check=False, timeout=240; nonzero exit continues.'
    repair_plans: 'process_case expansion_map then recursive_control: cartographer
      consumes predetermined packet paths and writes repair_expansion_map.json; controller
      consumes that map once with iteration=1, max-iterations=8, no history, writing
      recursive_control_plan.json. Append both results; each check=True and timeout=240.
      Record decisions without following them or repairing.'
    final_plan: 'process_case goal_plan_after_gates: plan --case --run-gates --json
      to goal_plan_final.json with compile/thoroughness gates; append result; check=False,
      timeout=240; nonzero exit continues.'
    append_case: 'main cases.append(process_case(...)) and for advancement: pack state
      with work.result appended and position advanced once; compute done iff all 20
      SELECTED_CASES consumed. Preserve records and flags; discard local case paths.
      No cross-case frontier, signature history or repair state.'
    grounding_audit: 'main after all cases: always run GROUNDING_AUDITOR --output
      mathlib_grounding_audit.json --json; check=False, timeout=240. Nonzero exit
      is recorded; exceptions/timeouts still abort.'
    report: 'main summary and reporting: gated ok requires every lean_compile.ok and
      completeness.ok and completeness.json.ok is True; ungated ok=True. Ignore final-plan
      and grounding-audit failures for this predicate. Write artifacts/physics_lean/new_qm_source_only/batch_report.json,
      print JSON or native human summary, return 0 iff ok else 1.'
