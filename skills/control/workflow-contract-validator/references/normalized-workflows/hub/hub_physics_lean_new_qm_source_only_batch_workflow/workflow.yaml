  - path: libraries/MathformerPhysicsLib/release_status.py
    selector: native implementation, shared steps, registration or authored inventory
      projection
    digest: sha256:d10f70157f9b44923ad8ed3fda743b70133ea890ace3d1c509638704dfc81d59
