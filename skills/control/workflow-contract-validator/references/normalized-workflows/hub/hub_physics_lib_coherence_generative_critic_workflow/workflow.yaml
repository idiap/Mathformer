  - path: tests/mcp/fixtures/generative_critic_original.py.txt
    selector: original CLI baseline
    digest: sha256:dfc03752aeb8d9b6329436ea70362aaac568974cf3609c2e9b643a30cb590df9
  - path: tests/mcp/fixtures/coherence_canonicalize_alias_compiler.py
    selector: deterministic external compiler boundary fixture
    digest: sha256:c65a5ab788c7f9704444d00a4c1ce384ac2611ef2f15f629fd2b8043c2ad6e0b
  - path: scripts/workflow_write_audit.py
    selector: snapshot_repository; audit_snapshots
    digest: sha256:1f1e5ca40776f1b5671d89668ca1eee5d6802f633749c6cce7a94d8d25c838a1
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Fixed registered invocation excludes repeated --report, repository-inventory default
    and optional --output branches; these remain in the native CLI. No coherence-loop
    caller is invoked.
  - Native timeout is null; Lunar enforces the retained 3600-second and ten-operation
    budgets. Abandoned paused children are reaped when their MCP service exits. Required
    receipts and digests are host-owned; optional enclosing hub report publication
    remains controller-owned.
  - Known registered alias has one child. The top-level loop and transport-only carry
    preserve rejection without visiting a dependency; this places Lunar exhaustion
    handling outside branch-local scope. Unknown-action rejection remains unreachable
    for this fixed registry specialization.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:coherence-generative-critic
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lib:coherence-generative-critic
      summary: Alias for MathformerPhysicsLib generative coherence critic.
      family: mathformerphysicslib
      kind: sequence
      safety: read_only
      command: []
      depends_on:
      - mathformerphysicslib:generative-coherence-critic
      required_paths: []
      required_tools: []
      optional_tools: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: One native child subprocess; stage calls describe its internals, never
      separate launches.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    - repository_root
    - extra_args
    - seen
    effects_status: native write audit plus host receipts
    failure_policy: Preserve native failure payloads, aggregate failure and write
      auditing; failed children do not become accepted plans.
    scientific_payloads: Plan JSON is captured in child stdout within HubResult, not
      a separate theorem or proof artifact.
    optional_staged_transport: reports and plan observers pause the SAME child until
      matching acknowledgments; closed/mismatched acknowledgments fail it. Callbacks
      stay within owning stages; no durable resume.
    adapter: Registered MCP tools reuse hub helpers and the existing staged child
      transport. carry_stage carries inactive child output; carry transports rejected
      admissions through the top-level loop without native work.
  mathformer.composition:
    ordered_dependencies:
    - mathformerphysicslib:generative-coherence-critic
    dependency_workflows:
    - hub_mathformerphysicslib_generative_coherence_critic_workflow
    command_after_dependencies: false
    keep_going_semantics: Stop on failed child unless keep_going; aggregate failure
      persists. Single dependency means both branches finish after one visit.
    extra_args_for_sequence: rejected by run_action
    modeling: Dependency traversal only; no iterative scientific refinement or retry.
