schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lib_coherence_generative_critic_workflow
version: 1.0.0
kind: workflow
description: One-child hub alias for advisory coherence-plan construction, specialized
  to registered --self-test --json; no probe execution or repair.
aliases:
- physics-lib:coherence-generative-critic
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  Bool:
    schema:
      type: boolean
  Admission:
    schema:
      type: object
      properties:
        accepted:
          type: boolean
        status:
          type: string
        ancestry:
          type: array
          items:
            type: string
      required:
      - accepted
      - status
      - ancestry
      additionalProperties: false
  DependencyState:
    schema:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 1
        children:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              ok:
                type: boolean
            required:
            - ok
        dependencies_ok:
          type: boolean
        ancestry:
          type: array
          items:
            type: string
      required:
      - index
      - children
      - dependencies_ok
      - ancestry
      additionalProperties: false
  Boundary:
    schema:
      type: object
      required:
      - execute
      - payload
      - snapshot
      - repository_root
      properties:
        execute:
          type: boolean
        payload:
          type: object
        snapshot:
          type: object
        repository_root:
          type: string
  ChildStage:
    schema:
      type: object
      required:
      - active
      - state
      properties:
        active:
          type: boolean
        state:
          type: object
          required:
          - token
          - reports_json
          - plan_json
          - child
          properties:
            token:
              type: string
            reports_json:
              type: string
            plan_json:
              type: string
            child:
              type: object
      additionalProperties: false
  Text:
    schema:
      type: string
  Strings:
    schema:
      type: array
      items:
        type: string
inputs:
  context:
    type: RunContext
  repository_root:
    type: Text
  extra_args:
    type: Strings
  seen:
    type: Strings
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  admit:
    inputs:
      extra_args:
        type: Strings
      seen:
        type: Strings
    outputs:
      admission:
        type: Admission
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_admit
        operation: mathformer_coherence_generative_alias_admit
  reject:
    inputs:
      admission:
        type: Admission
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_reject
        operation: mathformer_coherence_generative_alias_reject
  initialize:
    inputs:
      admission:
        type: Admission
    outputs:
      state:
        type: DependencyState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_initialize
        operation: mathformer_coherence_generative_alias_initialize
  prepare_child:
    inputs:
      state:
        type: DependencyState
      context:
        type: RunContext
      repository_root:
        type: Text
    outputs:
      boundary:
        type: Boundary
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_prepare_child
        operation: mathformer_coherence_generative_alias_prepare_child
  reports:
    inputs:
      boundary:
        type: Boundary
    outputs:
      stage:
        type: ChildStage
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_reports
        operation: mathformer_coherence_generative_alias_reports
  plan:
    inputs:
      stage:
        type: ChildStage
    outputs:
      stage:
        type: ChildStage
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_plan
        operation: mathformer_coherence_generative_alias_plan
  complete_child:
    inputs:
      stage:
        type: ChildStage
      boundary:
        type: Boundary
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_complete_child
        operation: mathformer_coherence_generative_alias_complete_child
  skip_child:
    inputs:
      boundary:
        type: Boundary
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_skip_child
        operation: mathformer_coherence_generative_alias_skip_child
  advance:
    inputs:
      state:
        type: DependencyState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: DependencyState
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_advance
        operation: mathformer_coherence_generative_alias_advance
  finish:
    inputs:
      state:
        type: DependencyState
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_finish
        operation: mathformer_coherence_generative_alias_finish
  carry:
    inputs:
      state:
        type: DependencyState
      result:
        type: HubResult
    outputs:
      state:
        type: DependencyState
      done:
        type: Bool
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_carry
        operation: mathformer_coherence_generative_alias_carry
  carry_stage:
    inputs:
      stage:
        type: ChildStage
    outputs:
      stage:
        type: ChildStage
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_generative_alias_carry_stage
        operation: mathformer_coherence_generative_alias_carry_stage
flow:
  kind: sequence
  steps:
  - id: admission
    kind: call
    operation: admit
    arguments:
      extra_args:
        ref: inputs.extra_args
      seen:
        ref: inputs.seen
  - id: dispatch
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.admission.outputs.admission.accepted
      body:
        kind: sequence
        steps:
        - id: initial
          kind: call
          operation: initialize
          arguments:
            admission:
              ref: steps.admission.outputs.admission
        outputs:
          state:
            type: DependencyState
            value:
              ref: steps.initial.outputs.state
          rejection:
            type: HubResult
            value:
              literal:
                ok: true
    default:
      kind: sequence
      steps:
      - kind: call
        operation: reject
        arguments:
          admission:
            ref: steps.admission.outputs.admission
        id: rejection
      outputs:
        state:
          type: DependencyState
          value:
            literal:
              index: 0
              children: []
              dependencies_ok: true
              ancestry: []
        rejection:
          type: HubResult
          value:
            ref: steps.rejection.outputs.result
    outputs:
      state:
        type: DependencyState
        value:
          ref: selected.outputs.state
      rejection:
        type: HubResult
        value:
          ref: selected.outputs.rejection
  - id: dependencies
    kind: loop
    state_type: DependencyState
    initial:
      ref: steps.dispatch.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: switch
      cases:
      - id: accepted
        when:
          ref: steps.admission.outputs.admission.accepted
        body:
          kind: sequence
          steps:
          - id: prepare
            kind: call
            operation: prepare_child
            arguments:
              state:
                ref: loop.state
              context:
                ref: inputs.context
              repository_root:
                ref: inputs.repository_root
          - id: child
            kind: switch
            cases:
            - id: execute
              when:
                ref: steps.prepare.outputs.boundary.execute
              body:
                kind: sequence
                steps:
                - id: reports
                  kind: call
                  operation: reports
                  arguments:
                    boundary:
                      ref: steps.prepare.outputs.boundary
                - id: planning
                  kind: switch
                  cases:
                  - id: reports_ready
                    when:
                      ref: steps.reports.outputs.stage.active
                    body:
                      kind: sequence
                      steps:
                      - id: plan
                        kind: call
                        operation: plan
                        arguments:
                          stage:
                            ref: steps.reports.outputs.stage
                      outputs:
                        stage:
                          type: ChildStage
                          value:
                            ref: steps.plan.outputs.stage
                  default:
                    kind: call
                    operation: carry_stage
                    arguments:
                      stage:
                        ref: steps.reports.outputs.stage
                  outputs:
                    stage:
                      type: ChildStage
                      value:
                        ref: selected.outputs.stage
                - id: complete
                  kind: call
                  operation: complete_child
                  arguments:
                    stage:
                      ref: steps.planning.outputs.stage
                    boundary:
                      ref: steps.prepare.outputs.boundary
                outputs:
                  result:
                    type: HubResult
                    value:
                      ref: steps.complete.outputs.result
            default:
              kind: sequence
              steps:
              - id: skip
                kind: call
                operation: skip_child
                arguments:
                  boundary:
                    ref: steps.prepare.outputs.boundary
              outputs:
                result:
                  type: HubResult
                  value:
                    ref: steps.skip.outputs.result
            outputs:
              result:
                type: HubResult
                value:
                  ref: selected.outputs.result
          - id: advance
            kind: call
            operation: advance
            arguments:
              state:
                ref: loop.state
              child:
                ref: steps.child.outputs.result
              context:
                ref: inputs.context
          outputs:
            state:
              type: DependencyState
              value:
                ref: steps.advance.outputs.state
            done:
              type: Bool
              value:
                ref: steps.advance.outputs.done
      default:
        kind: sequence
        steps:
        - kind: call
          operation: carry
          arguments:
            state:
              ref: loop.state
            result:
              ref: steps.dispatch.outputs.rejection
          id: carry
        outputs:
          state:
            type: DependencyState
            value:
              ref: steps.carry.outputs.state
          done:
            type: Bool
            value:
              ref: steps.carry.outputs.done
      outputs:
        state:
          type: DependencyState
          value:
            ref: selected.outputs.state
        done:
          type: Bool
          value:
            ref: selected.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: DependencyState
        value:
          ref: body.outputs.state
  - id: completion
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.admission.outputs.admission.accepted
      body:
        id: completion
        kind: call
        operation: finish
        arguments:
          state:
            ref: steps.dependencies.outputs.state
    default:
      kind: sequence
      steps:
      - kind: call
        operation: carry
        arguments:
          state:
            ref: steps.dispatch.outputs.state
          result:
            ref: steps.dispatch.outputs.rejection
        id: carry
      outputs:
        result:
          type: HubResult
          value:
            ref: steps.carry.outputs.result
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.completion.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
    - execute_advisory_probes
    - promote_generated_findings
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 10
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Advisory plan only; completion establishes neither scientific truth
    nor promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
