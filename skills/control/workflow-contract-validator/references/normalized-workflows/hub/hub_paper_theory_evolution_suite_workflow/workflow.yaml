schema_version: workflow-skill/v1
namespace: mathformer
id: hub_paper_theory_evolution_suite_workflow
version: 1.0.0
kind: workflow
description: Ordered native theory-evolution suite with source-shared callable stages
  for one to five scenario entries.
aliases:
- paper:theory-evolution-suite
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Options:
    schema:
      type: object
      required:
      - model
      - output_dir
      additionalProperties: false
      properties:
        model:
          type: string
        output_dir:
          type: string
        runs:
          type: integer
          default: 128
        seed:
          type: integer
          default: 17
        json:
          type: boolean
          default: false
        scenarios:
          type: array
          minItems: 1
          maxItems: 5
          items:
            enum:
            - baseline
            - accelerated_grounding
            - grounding_bottleneck
            - drift_repair_pressure
            - noisy_plateau
          default:
          - baseline
          - accelerated_grounding
          - grounding_bottleneck
          - drift_repair_pressure
          - noisy_plateau
  SuiteState:
    schema:
      type: object
      required:
      - options
      - base_model
      - scenario_index
      - scenario_results
      - context
      properties:
        options:
          type: object
        base_model:
          type: object
        scenario_index:
          type: integer
          minimum: 0
        scenario_results:
          type: array
          items:
            type: object
        context:
          type: object
          required:
          - working_directory
          additionalProperties: false
          properties:
            working_directory:
              type: string
  ScenarioTask:
    schema:
      type: object
      required:
      - model
      - scenario_id
      - runs
      - seed
      - output_dir
      - context
      properties:
        model:
          type: object
        scenario_id:
          type: string
        runs:
          type: integer
        seed:
          type: integer
        output_dir:
          type: string
        context:
          type: object
          required:
          - working_directory
          additionalProperties: false
          properties:
            working_directory:
              type: string
  ScenarioResult:
    schema:
      type: object
      required:
      - scenario_id
      - scenario
      - model_path
      - output_dir
      - summary
      - rows
      properties:
        scenario_id:
          type: string
        scenario:
          type: object
        model_path:
          type: string
        output_dir:
          type: string
        summary:
          type: object
        rows:
          type: array
          items:
            type: object
  SuiteManifest:
    schema:
      type: object
      required:
      - schema_version
      - base_model
      - run_count_per_scenario
      - seed
      - scenarios
      - outputs
      properties:
        schema_version:
          const: 1
        base_model:
          type: string
        run_count_per_scenario:
          type: integer
        seed:
          type: integer
        scenarios:
          type: array
          items:
            type: object
        outputs:
          type: object
  Flag:
    schema:
      type: boolean
  ExitCode:
    schema:
      type: integer
      const: 0
  Context:
    schema:
      type: object
      required:
      - working_directory
      additionalProperties: false
      properties:
        working_directory:
          type: string
  Stdout:
    schema:
      type: string
inputs:
  options:
    type: Options
  context:
    type: Context
outputs:
  manifest:
    type: SuiteManifest
    value:
      ref: flow.outputs.manifest
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
  stdout:
    type: Stdout
    value:
      ref: flow.outputs.stdout
operations:
  initialize:
    inputs:
      options:
        type: Options
      context:
        type: Context
    outputs:
      state:
        type: SuiteState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_theory_suite_initialize
        operation: mathformer_theory_suite_initialize
  prepare_scenario:
    inputs:
      state:
        type: SuiteState
    outputs:
      task:
        type: ScenarioTask
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_theory_suite_prepare_scenario
        operation: mathformer_theory_suite_prepare_scenario
  run_scenario:
    inputs:
      task:
        type: ScenarioTask
    outputs:
      result:
        type: ScenarioResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_theory_suite_run_scenario
        operation: mathformer_theory_suite_run_scenario
  accumulate:
    inputs:
      state:
        type: SuiteState
      task:
        type: ScenarioTask
      result:
        type: ScenarioResult
    outputs:
      state:
        type: SuiteState
      done:
        type: Flag
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_theory_suite_accumulate
        operation: mathformer_theory_suite_accumulate
  finalize_suite:
    inputs:
      state:
        type: SuiteState
    outputs:
      manifest:
        type: SuiteManifest
      exit_code:
        type: ExitCode
      stdout:
        type: Stdout
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_theory_suite_finalize_suite
        operation: mathformer_theory_suite_finalize_suite
flow:
  kind: sequence
  steps:
  - id: start
    kind: call
    operation: initialize
    arguments:
      options:
        ref: inputs.options
      context:
        ref: inputs.context
  - id: scenarios
    kind: loop
    state_type: SuiteState
    initial:
      ref: steps.start.outputs.state
    max_iterations: 5
    on_exhausted: fail
    description: Nonempty selection; done is true after its last entry, including
      entry five. No native exhaustion failure within this specialization.
    body:
      kind: sequence
      steps:
      - id: prepare
        kind: call
        operation: prepare_scenario
        arguments:
          state:
            ref: loop.state
      - id: run
        kind: call
        operation: run_scenario
        arguments:
          task:
            ref: steps.prepare.outputs.task
      - id: append
        kind: call
        operation: accumulate
        arguments:
          state:
            ref: loop.state
          task:
            ref: steps.prepare.outputs.task
          result:
            ref: steps.run.outputs.result
      outputs:
        state:
          type: SuiteState
          value:
            ref: steps.append.outputs.state
        done:
          type: Flag
          value:
            ref: steps.append.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: SuiteState
        value:
          ref: body.outputs.state
  - id: artifacts
    kind: call
    operation: finalize_suite
    arguments:
      state:
        ref: steps.scenarios.outputs.state
  outputs:
    manifest:
      type: SuiteManifest
      value:
        ref: steps.artifacts.outputs.manifest
    exit_code:
      type: ExitCode
      value:
        ref: steps.artifacts.outputs.exit_code
    stdout:
      type: Stdout
      value:
        ref: steps.artifacts.outputs.stdout
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - selected_output_directory
      - artifacts/paper_skills/
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 17
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Simulated priors only; completion establishes no scientific truth,
    proof, promotion or runtime qualification.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: paper_skills/theory-evolution-simulator/scripts/run_theory_evolution_simulation_suite.py
    selector: main; suite_parser; initialize_suite; prepare_suite_scenario; execute_suite_scenario;
      accumulate_suite_scenario; finalize_suite; apply_scenario; run_scenario
    digest: sha256:cd5df40c877a0d0af13fdba7d4d7197e3c703b839a556064d18403acc5a21bb0
  - path: paper_skills/theory-evolution-simulator/scripts/simulate_theory_evolution.py
    selector: simulate_one; initialize_trajectory; prepare_phase; advance_step; finish_phase;
      finish_trajectory; terminal_status
    digest: sha256:f44e80b65b7c4111f5a98919a09fee6ac76ab1cc9ef87c4ed0aeaf4e58788de1
  - path: scripts/mathformer.py
    selector: build_registry/action:paper:theory-evolution-suite; run_action; run_leaf_action;
      preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/theory_evolution_suite_tools.py
    selector: register_theory_evolution_suite_tools; source; native_context
    digest: sha256:387d6e2873c01ad27d2e0a2a04463fe5a8026131ee3f845dca96a21a86865b34
  - path: scripts/mcp_server.py
    selector: register_theory_evolution_suite_tools; _graph_layout_write_policy
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory authored theory-evolution-suite contract
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Hub admission, preflight, dry-run, subprocess timeout and write-audit remain in
    the existing hub path outside this main-entrypoint graph. MCP persistence uses
    service read-only and write-root guards.
  - Scenario selections longer than five entries are outside this specialization;
    native CLI allows longer selections and duplicates. No new run, phase or trajectory
    step cap is imposed.
  - Helper internals remain source-owned inside run_scenario; compact schemas do not
    establish scientific validity. Lunar supplies contract receipts and global budgets;
    native CLI has no equivalent receipt mandate. Errors propagate without retry and
    may leave earlier artifacts.
extensions:
  mathformer.source:
    category: hub
    native_id: paper:theory-evolution-suite
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: paper:theory-evolution-suite
      family: paper
      kind: generation
      safety: writes_artifacts
      depends_on: []
      writes:
      - artifacts/paper_skills/
      allows_extra_args: true
      timeout_seconds: 1200
  mathformer.native_boundary:
    execution: Existing hub dispatch remains run_action -> run_leaf_action, dependency-free,
      forwarding extra arguments after preflight and honoring dry-run; this graph
      specifies main after admission, not a replacement hub execution path.
    failure_policy: Native subprocess errors/preflight/timeout remain failures; simulated
      statuses do not alter successful exit 0. No retry or checkpoint support.
    budget: Native subprocess timeout is 1200 seconds; the 3600-second contract limit
      is not an implementation budget. Seventeen calls bound only this graph's blocks.
    effects_status: Output directory is supplied by the caller; native writes can
      lie outside the registry's artifacts/paper_skills declaration.
    context: Absolute working_directory preserves native relative input/output paths
      and their printed spelling; stdout returns verbatim from the source terminal
      stage and is also emitted to service stderr.
    qualification: Five registered MCP tools invoke the same stages as main. run_scenario
      retains its entire native inner simulation and write order. The scenario loop
      terminates after the last requested entry, including entry five.
# REUSE-IgnoreEnd
