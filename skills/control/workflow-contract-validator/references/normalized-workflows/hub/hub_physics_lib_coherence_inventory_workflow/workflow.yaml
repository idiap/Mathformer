schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lib_coherence_inventory_workflow
version: 1.0.0
kind: workflow
description: Commandless coherence-inventory alias; admit, traverse its one child,
  and return the native envelope.
aliases:
- physics-lib:coherence-inventory
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
    representation: value
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
    representation: value
  Strings:
    schema:
      type: array
      items:
        type: string
  Boolean:
    schema:
      type: boolean
  Admission:
    schema:
      type: object
      required:
      - accepted
      - status
      - ancestry
      properties:
        accepted:
          type: boolean
        status:
          enum:
          - accepted
          - unknown_action
          - dependency_cycle
          - extra_args_for_sequence
        ancestry:
          type: array
          items:
            type: string
          uniqueItems: true
      additionalProperties: false
  DependencyState:
    schema:
      type: object
      required:
      - index
      - children
      - dependencies_ok
      - ancestry
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 1
        children:
          type: array
          maxItems: 1
          items:
            type: object
            required:
            - ok
            properties:
              ok:
                type: boolean
        dependencies_ok:
          type: boolean
        ancestry:
          type: array
          items:
            type: string
          uniqueItems: true
      additionalProperties: false
  RepositoryRoot:
    schema:
      type: string
      minLength: 1
inputs:
  context:
    type: RunContext
  extra_args:
    type: Strings
    required: false
  seen:
    type: Strings
    required: false
  repository_root:
    type: RepositoryRoot
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  admit:
    inputs:
      extra_args:
        type: Strings
        required: false
      seen:
        type: Strings
        required: false
    outputs:
      admission:
        type: Admission
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_admit
        operation: mathformer_coherence_inventory_alias_admit
  reject:
    inputs:
      admission:
        type: Admission
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_reject
        operation: mathformer_coherence_inventory_alias_reject
  initialize:
    inputs:
      admission:
        type: Admission
    outputs:
      state:
        type: DependencyState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_initialize
        operation: mathformer_coherence_inventory_alias_initialize
  visit:
    inputs:
      context:
        type: RunContext
      state:
        type: DependencyState
      repository_root:
        type: RepositoryRoot
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_visit
        operation: mathformer_coherence_inventory_alias_visit
  advance:
    inputs:
      state:
        type: DependencyState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: DependencyState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_advance
        operation: mathformer_coherence_inventory_alias_advance
  finish:
    inputs:
      state:
        type: DependencyState
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_finish
        operation: mathformer_coherence_inventory_alias_finish
  carry:
    inputs:
      state:
        type: DependencyState
      result:
        type: HubResult
    outputs:
      state:
        type: DependencyState
      done:
        type: Boolean
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_coherence_inventory_alias_carry
        operation: mathformer_coherence_inventory_alias_carry
flow:
  kind: sequence
  steps:
  - id: admission
    kind: call
    operation: admit
    arguments:
      extra_args:
        ref: inputs.extra_args
      seen:
        ref: inputs.seen
  - id: dispatch
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.admission.outputs.admission.accepted
      body:
        kind: sequence
        steps:
        - id: initial
          kind: call
          operation: initialize
          arguments:
            admission:
              ref: steps.admission.outputs.admission
        outputs:
          state:
            type: DependencyState
            value:
              ref: steps.initial.outputs.state
          rejection:
            type: HubResult
            value:
              literal:
                ok: true
    default:
      kind: sequence
      steps:
      - kind: call
        operation: reject
        arguments:
          admission:
            ref: steps.admission.outputs.admission
        id: rejection
      outputs:
        state:
          type: DependencyState
          value:
            literal:
              index: 0
              children: []
              dependencies_ok: true
              ancestry: []
        rejection:
          type: HubResult
          value:
            ref: steps.rejection.outputs.result
    outputs:
      state:
        type: DependencyState
        value:
          ref: selected.outputs.state
      rejection:
        type: HubResult
        value:
          ref: selected.outputs.rejection
  - id: dependencies
    kind: loop
    state_type: DependencyState
    initial:
      ref: steps.dispatch.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: switch
      cases:
      - id: accepted
        when:
          ref: steps.admission.outputs.admission.accepted
        body:
          kind: sequence
          steps:
          - id: child
            kind: call
            operation: visit
            arguments:
              state:
                ref: loop.state
              context:
                ref: inputs.context
              repository_root:
                ref: inputs.repository_root
          - id: advance
            kind: call
            operation: advance
            arguments:
              state:
                ref: loop.state
              child:
                ref: steps.child.outputs.child
              context:
                ref: inputs.context
          outputs:
            state:
              type: DependencyState
              value:
                ref: steps.advance.outputs.state
            done:
              type: Boolean
              value:
                ref: steps.advance.outputs.done
      default:
        kind: sequence
        steps:
        - kind: call
          operation: carry
          arguments:
            state:
              ref: loop.state
            result:
              ref: steps.dispatch.outputs.rejection
          id: carry
        outputs:
          state:
            type: DependencyState
            value:
              ref: steps.carry.outputs.state
          done:
            type: Boolean
            value:
              ref: steps.carry.outputs.done
      outputs:
        state:
          type: DependencyState
          value:
            ref: selected.outputs.state
        done:
          type: Boolean
          value:
            ref: selected.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: DependencyState
        value:
          ref: body.outputs.state
  - id: completion
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.admission.outputs.admission.accepted
      body:
        id: completion
        kind: call
        operation: finish
        arguments:
          state:
            ref: steps.dependencies.outputs.state
    default:
      kind: sequence
      steps:
      - kind: call
        operation: carry
        arguments:
          state:
            ref: steps.dispatch.outputs.state
          result:
            ref: steps.dispatch.outputs.rejection
        id: carry
      outputs:
        result:
          type: HubResult
          value:
            ref: steps.carry.outputs.result
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.completion.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked controller description; completion establishes no scientific
    truth or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_registry; prepare_action; admit_action; reject_action; initialize_dependencies;
      visit_dependency; advance_dependencies; finish_dependencies; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: skills/mathformerphysicslib/mathformerphysicslib-coherence-inventory-builder/scripts/build_coherence_inventory.py
    selector: main
    digest: sha256:21ee48b98b2422303284a24db371f24cc391c2a2794e7734ffe8a318a4ba3189
  - path: skills/mathformerphysicslib/mathformerphysicslib-coherence-inventory-builder/scripts/coherence_common.py
