  - path: scripts/mathformer_mcp_service.py
    selector: service_coverage_report
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/mcp/run_coherence_inventory_alias_workflow_tests.py
    selector: AliasTests
    digest: sha256:a7ace047645cfbdb3ce579421174f57a6ebacd7b85be8c9510a77a00b9adae5f
  - path: tests/mcp/fixtures/coherence_inventory_alias_original.py.txt
    selector: frozen original controller for parity
    digest: sha256:353f96277d1ed3a98704919eb20da0455b6ed1ab31285910ac6fb17a38421e9f
  - path: tests/mcp/fixtures/coherence_canonicalize_alias_compiler.py
    selector: deterministic generic external compiler boundary fixture
    digest: sha256:c65a5ab788c7f9704444d00a4c1ce384ac2611ef2f15f629fd2b8043c2ad6e0b
  - path: libraries/MathformerPhysicsLib/release_status.py
    selector: native coherence_common import
    digest: sha256:d10f70157f9b44923ad8ed3fda743b70133ea890ace3d1c509638704dfc81d59
  gaps:
  - Child admission, preflight, self-test internals, subprocess capture and repository
    write audit remain native inside visit; the scientific JSON in stdout is not separately
    typed.
  - The alias is fixed to one registered child and no parent command; unknown-action
    admission is unreachable for this specialization.
  - Lunar enforces the preserved 3600-second and five-call budgets. Native CLI child
    timeout remains None; the existing whole-workflow MCP interface uses its configurable
    600-second default. No retries are introduced.
  - The supplied capability qualification placeholders are retained and grant no additional
    authority. Lunar supplies runtime receipts and provenance while native payloads
    remain unchanged.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:coherence-inventory
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
  mathformer.native_boundary:
    execution: Callable MCP operations delegate to shared native controller helpers;
      visit calls the registered child through run_action.
    mount: repository_root explicitly carries the caller filesystem context into native
      preflight, subprocess cwd and both write snapshots; the CLI retains its default
      repository.
    input_defaults: Omitted extra_args and seen use empty arrays at the MCP admission
      interface.
    failure_policy: Return native ok/status unchanged; failed child data reaches advance
      and finish. Unexpected controller exceptions propagate.
    adapter: 'Lunar requires scoped loop exit handling: hoist the one-child loop and
      carry rejected results without dependency execution. Accepted calls remain admit,
      initialize, visit, advance, finish.'
    leaf: The registered command is build_coherence_inventory.py --self-test --json,
      without a native timeout; the alternate build_inventory branch is unused.
    self_test: Two-concept fixture, canonicalize, grounding audit, redefinition/integration/API
      critics, repair/gate/generative plan, fixture assertions including seven probes,
      JSON emission and zero exit. Critic and gate failures remain payload data; assertions
      and uncaught errors fail the subprocess.
  mathformer.composition:
    ordered_dependencies:
    - mathformerphysicslib:coherence-inventory
    dependency_workflows:
    - hub_mathformerphysicslib_coherence_inventory_workflow
    command_after_dependencies: false
    extra_args_for_sequence: rejected by run_action
    bound_semantics: Exact one-child registry specialization; until is true at index=1,
      so normal sequence return precedes bound exhaustion. on_exhausted is unreachable
      for source-valid state.
