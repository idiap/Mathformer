schema_version: workflow-skill/v1
namespace: mathformer
id: hub_adoption_validate_workflow
version: 1.0.0
kind: workflow
description: Validate portable adoption metadata through shared native schema, per-surface
  traversal and final alias checks.
aliases:
- adoption:validate
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Data:
    schema:
      type: object
      required:
      - value
      - error
      properties:
        value: {}
        error:
          type:
          - string
          - 'null'
      additionalProperties: false
  ScanState:
    schema:
      type: object
      required:
      - data
      - registry
      - position
      - identities
      - operations
      - aliases
      - error
      properties:
        data:
          type: object
        registry:
          type: object
        position:
          type: integer
          minimum: 0
        identities:
          type: array
          items:
            type: string
          uniqueItems: true
        operations:
          type: object
        aliases:
          type: object
          additionalProperties:
            type: string
        error:
          type:
          - string
          - 'null'
      additionalProperties: false
  Done:
    schema:
      type: boolean
  Completion:
    schema:
      type: object
      required:
      - returncode
      - json
      properties:
        returncode:
          type: integer
          enum:
          - 0
          - 2
        json:
          type: object
          required:
          - ok
          properties:
            ok:
              type: boolean
            surface_count:
              type: integer
              minimum: 1
            operation_count:
              type: integer
              minimum: 1
            error:
              type: string
          additionalProperties: false
      additionalProperties: false
  MetadataPath:
    schema:
      type: string
inputs:
  metadata_path:
    type: MetadataPath
    required: false
outputs:
  result:
    type: Completion
    value:
      ref: flow.outputs.result
operations:
  load:
    inputs:
      metadata_path:
        type: MetadataPath
        required: false
    outputs:
      data:
        type: Data
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_validate_load
        operation: mathformer_validate_load
  initialize:
    inputs:
      data:
        type: Data
    outputs:
      state:
        type: ScanState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_validate_initialize
        operation: mathformer_validate_initialize
  check_surface:
    inputs:
      state:
        type: ScanState
    outputs:
      state:
        type: ScanState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_validate_check_surface
        operation: mathformer_validate_check_surface
  advance_guard:
    inputs:
      state:
        type: ScanState
    outputs:
      state:
        type: ScanState
      done:
        type: Done
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_validate_advance_guard
        operation: mathformer_validate_advance_guard
  finish:
    inputs:
      state:
        type: ScanState
    outputs:
      result:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_validate_finish
        operation: mathformer_validate_finish
flow:
  kind: sequence
  steps:
  - id: read
    kind: call
    operation: load
    arguments:
      metadata_path:
        ref: inputs.metadata_path
  - id: prepare
    kind: call
    operation: initialize
    arguments:
      data:
        ref: steps.read.outputs.data
  - id: surfaces
    kind: loop
    state_type: ScanState
    initial:
      ref: steps.prepare.outputs.state
    max_iterations: 4096
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: check
        kind: call
        operation: check_surface
        arguments:
          state:
            ref: loop.state
      - id: advance
        kind: call
        operation: advance_guard
        arguments:
          state:
            ref: steps.check.outputs.state
      outputs:
        state:
          type: ScanState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Done
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: ScanState
        value:
          ref: body.outputs.state
  - id: complete
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.surfaces.outputs.state
  outputs:
    result:
      type: Completion
      value:
        ref: steps.complete.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - read_metadata_and_sources
    - inspect_registered_hub_commands
    forbidden:
    - invoke_discovered_operations
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 8195
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Structural metadata acceptance only; no backend execution or scientific
    acceptance.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/control/workflow-contract-validator/scripts/portable_adoption.py
    selector: main → load_contract → validate_metadata; read_metadata; metadata_initialize;
      metadata_check_surface; metadata_advance; metadata_finish; validation_result;
      emit_completion
    digest: sha256:71cc63a093533d56dc9a14c03557dbe914f75cfbc5baeee7b32fdf66ca58a025
  - path: scripts/mathformer.py
    selector: build_registry adoption:validate; adoption:check; preflight; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/adoption_validate_tools.py
    selector: register_adoption_validate_tools
    digest: sha256:88280f02e5e203fc63d0b006dee32dc5bc71ee25c408a5d244849280bdd7ce54
  - path: scripts/catalog_check_tools.py
    selector: source; repository_path; complete
    digest: sha256:8337163990599e0da5eec47f40e65b3d480a4b88cb7924fa2fd1d96d51a360ff
  - path: scripts/mcp_server.py
    selector: register_adoption_validate_tools(mcp)
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: service_coverage_report
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory authored adoption:validate
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Native schema recursion and per-surface inner traversals remain inside their owning
    shared operations.
  - The workflow accepts at most 4096 surfaces; the native CLI has no surface cap.
    Initialize rejects out-of-domain metadata before traversal. Exhaustion is unreachable
    for valid in-domain metadata at the authored bound.
  - Caught native errors are carried explicitly to finish; intervening blocks perform
    no native validation after an error. Finish emits the same error JSON and returncode
    2. Uncaught exceptions fail the tool and stop the graph.
  - Metadata path is optional repository-contained context for the existing load_contract(path)
    interface; omission uses the native METADATA path. JSON is read and checked by
    the native interpreter, not a replacement schema.
  - Hub preflight, dry-run, subprocess wrapping and repository-write audit remain
    outside the selected CLI graph.
  - Native argument parsing uses fixed validate before the protected read; CLI parsing
    failures remain outside the native exception handler.
  - Wall time, operation budgets and mandatory receipts are enforced by Lunar; native
    CLI has no corresponding budgets or receipts.
  - MCP emits native completion JSON on stderr to preserve protocol stdout. Registry
    transport retains command fields read by native validation; sets and tuple indexes
    use JSON arrays between calls.
extensions:
  mathformer.source:
    category: hub
    native_id: adoption:validate
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: adoption:validate
      family: control
      kind: validation
      safety: read_only
      command:
      - '{python}'
      - skills/control/workflow-contract-validator/scripts/portable_adoption.py
      - validate
      depends_on: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    metadata_path: skills/control/workflow-contract-validator/references/portable-adoption.json
    execution: Hub preflight and dry-run precede one subprocess; audit repository
      writes afterward.
    failure_policy: Subprocess failure or undeclared writes makes the hub result unsuccessful.
    envelope: Completion models native CLI output; the hub wraps it in its own result.
    composition: adoption:check invokes adoption:validate first in its dependency
      sequence.
  mathformer.context:
    metadata_path: Optional repository-owned metadata file path. Empty/omitted means
      native METADATA. The input is a path context; load reads the actual JSON before
      native validation.
  mathformer.state:
    error: Nullable native exception message. Initialization and checking skip native
      work once set; advancement stops on error without moving the cursor. Finish
      converts it to the native CLI envelope.
    iteration: Position advances only after a successful surface body. Identities,
      operations and aliases are carried in source order; no retries or scientific
      invocations.
