schema_version: workflow-skill/v1
namespace: mathformer
id: hub_skills_client_discovery_workflow
version: 1.0.0
kind: workflow
description: Build the cross-client skill discovery report in source order.
aliases:
- skills:client-discovery
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Canonical:
    schema:
      type: object
      additionalProperties:
        type: string
  ClientResult:
    schema:
      type: object
      required:
      - client
      - target
      - ok
      - published_count
      - missing
      - extra
      - blockers
      - warnings
      properties:
        client:
          type: string
          enum:
          - codex
          - claude
          - opencode
        target:
          type: string
        ok:
          type: boolean
        published_count:
          type: integer
          minimum: 0
        expected_count:
          type: integer
          minimum: 0
        missing:
          type: array
          items:
            type: string
        extra:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        broken_links:
          type: array
          items:
            type: string
        noncanonical_links:
          type: array
          items:
            type: string
        missing_skill_md:
          type: array
          items:
            type: string
        required_smoke_skills_present:
          type: array
          items:
            type: string
  ClientState:
    schema:
      type: object
      required:
      - canonical
      - cursor
      - clients
      - reports
      - repo_root
      properties:
        canonical:
          type: object
          additionalProperties:
            type: string
        cursor:
          type: integer
          minimum: 0
          maximum: 3
        clients:
          const:
          - client: codex
            target: .agents/skills
          - client: claude
            target: .claude/skills
          - client: opencode
            target: .opencode/skills
        reports:
          type: array
          maxItems: 3
          items:
            type: object
        repo_root:
          type: string
      additionalProperties: false
  Done:
    schema:
      type: boolean
  DiscoveryReport:
    schema:
      type: object
      required:
      - ok
      - canonical_skill_count
      - clients
      - target_roots
      properties:
        ok:
          type: boolean
        canonical_skill_count:
          type: integer
          minimum: 0
        clients:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
        target_roots:
          const:
            codex: .agents/skills
            claude: .claude/skills
            opencode: .opencode/skills
      additionalProperties: false
  RepositoryRoot:
    schema:
      type: string
      minLength: 1
inputs:
  repo_root:
    type: RepositoryRoot
outputs:
  report:
    type: DiscoveryReport
    value:
      ref: flow.outputs.report
operations:
  collect:
    inputs:
      repo_root:
        type: RepositoryRoot
    outputs:
      canonical:
        type: Canonical
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_client_discovery_collect
        operation: mathformer_client_discovery_collect
  initialize:
    inputs:
      canonical:
        type: Canonical
      repo_root:
        type: RepositoryRoot
    outputs:
      state:
        type: ClientState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_client_discovery_initialize
        operation: mathformer_client_discovery_initialize
  check:
    inputs:
      state:
        type: ClientState
    outputs:
      result:
        type: ClientResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_client_discovery_check
        operation: mathformer_client_discovery_check
  advance:
    inputs:
      state:
        type: ClientState
      result:
        type: ClientResult
    outputs:
      state:
        type: ClientState
      done:
        type: Done
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_client_discovery_advance
        operation: mathformer_client_discovery_advance
  aggregate:
    inputs:
      state:
        type: ClientState
    outputs:
      report:
        type: DiscoveryReport
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_client_discovery_aggregate
        operation: mathformer_client_discovery_aggregate
flow:
  kind: sequence
  steps:
  - id: canonical
    kind: call
    operation: collect
    arguments:
      repo_root:
        ref: inputs.repo_root
  - id: seed
    kind: call
    operation: initialize
    arguments:
      canonical:
        ref: steps.canonical.outputs.canonical
      repo_root:
        ref: inputs.repo_root
  - id: clients
    kind: loop
    state_type: ClientState
    initial:
      ref: steps.seed.outputs.state
    max_iterations: 3
    on_exhausted: fail
    description: Exactly three source clients; done is true on the third iteration,
      so normal completion at the bound is preserved. Exhaustion is unreachable for
      source-faithful adapters. Client failure is report data, not node failure.
    body:
      kind: sequence
      steps:
      - id: inspect
        kind: call
        operation: check
        arguments:
          state:
            ref: loop.state
      - id: append
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          result:
            ref: steps.inspect.outputs.result
      outputs:
        state:
          type: ClientState
          value:
            ref: steps.append.outputs.state
        done:
          type: Done
          value:
            ref: steps.append.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: ClientState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: aggregate
    arguments:
      state:
        ref: steps.clients.outputs.state
  outputs:
    report:
      type: DiscoveryReport
      value:
        ref: steps.finish.outputs.report
policy:
  effects:
    filesystem:
      read:
      - repository
      - discovery_symlink_targets
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - inspect_skill_discovery
    forbidden:
    - modify_files
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 9
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Discovery report only; no runtime qualification or scientific result.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: tests/agent_clients/run_skill_client_discovery.py
    selector: build_report; canonical_skills; check_client; initialize_discovery;
      inspect_discovery_client; advance_discovery; aggregate_discovery; main
    digest: sha256:b5c612028cbf3a0f6ece36f38fccd13a2a94bd784604d774a5d72b3dc5cdf9f1
  - path: scripts/mathformer.py
    selector: skills:client-discovery; skills.link; run_action; run_leaf_action; preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/client_discovery_tools.py
    selector: register_client_discovery_tools
    digest: sha256:c7c2cc4e31991a13e324605825d460f7e3d5e2213da98cbd2a0c43dff182ddaf
  - path: scripts/mcp_server.py
    selector: register_client_discovery_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: service_coverage_report
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Helper internals remain source-owned; report array elements use compact object
    schemas.
  - The native CLI and hub envelopes remain outside build_report; Lunar enforces the
    declared runtime policies.
extensions:
  mathformer.source:
    category: hub
    native_id: skills:client-discovery
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: skills:client-discovery
      family: skills
      kind: validation
      safety: read_only
      command:
      - '{python}'
      - tests/agent_clients/run_skill_client_discovery.py
      - --json
      depends_on: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: MCP tools delegate to the shared native build_report steps, with explicit
      repository read context.
    cli: main prints JSON or human output and returns 0 for report.ok, otherwise 1.
      Missing-root reports can cause KeyError in human output through expected_count;
      the hub uses --json. Unexpected filesystem errors propagate.
    hub: run_action delegates to run_leaf_action with no action dependencies. Preflight
      failures and dry runs stop before launch; post-execution write auditing can
      override success. skills.link runs discovery after skills:link. Hub envelopes
      and optional report writes are outside build_report.
    limits: No native retry, convergence loop, checkpoint support or explicit timeout.
# REUSE-IgnoreEnd
