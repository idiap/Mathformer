schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lib_all_candidate_compile_workflow
version: 1.0.0
kind: workflow
description: Sequential native candidate compilation and report generation; callable
  specialization of run() for an asserted 0..256 discovered cases.
aliases:
- physics-lib:all-candidate-compile
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Request:
    schema:
      type: object
      description: Native execution context. case_count asserts discovery cardinality
        for the bounded descriptor; the original entrypoint remains uncapped. Relative
        output paths resolve under repository_root.
      required:
      - repository_root
      - output
      - timeout_seconds
      - case_count
      additionalProperties: false
      properties:
        repository_root:
          type: string
          default: .
          minLength: 1
        output:
          type: string
          default: artifacts/physics_lean/all_candidate_compile/report.json
          minLength: 1
        timeout_seconds:
          type: integer
          default: 180
        case_count:
          type: integer
          minimum: 0
          maximum: 256
  Boolean:
    schema:
      type: boolean
  ScanState:
    schema:
      type: object
      required:
      - cases
      - index
      - results
      additionalProperties: false
      properties:
        cases:
          type: array
          maxItems: 256
          items:
            type: string
        index:
          type: integer
          minimum: 0
          maximum: 256
        results:
          type: array
          maxItems: 256
          items:
            type: object
          description: Ordered CaseRecord values accumulated once per visited path.
  CaseRecord:
    schema:
      type: object
      required:
      - case_id
      - path
      - source_sha256
      - command
      - returncode
      - stdout
      - stderr
      - compiled
      - diagnostic_sha256
      additionalProperties: false
      properties:
        case_id:
          type: string
        path:
          type: string
        source_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        command:
          type: array
          items:
            type: string
        returncode:
          type:
          - integer
          - 'null'
        stdout:
          type: string
        stderr:
          type: string
        compiled:
          type: boolean
        diagnostic_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        timeout:
          type: boolean
          const: true
  Report:
    schema:
      type: object
      required:
      - schema_version
      - style
      - generated_at_utc
      - workflow_executed
      - checks_passed
      - artifact_status
      - library_status
      - release_ok
      - case_count
      - compiled_count
      - lean_version
      - lake_manifest_sha256
      - results
      - blockers
      - terminal_states
      properties:
        schema_version:
          type: integer
          const: 1
        style:
          type: string
          const: mathformerphysicslib_all_candidate_compile
        generated_at_utc:
          type: string
        workflow_executed:
          type: boolean
          const: true
        checks_passed:
          type: boolean
        artifact_status:
          type: string
          const: candidate
        library_status:
          type: string
          enum:
          - accepted
          - blocked
        release_ok:
          type: boolean
          const: false
        case_count:
          type: integer
          minimum: 0
        compiled_count:
          type: integer
          minimum: 0
        lean_version:
          type: object
        lake_manifest_sha256:
          type:
          - string
          - 'null'
        results:
          type: array
          items:
            type: object
        blockers:
          type: array
          items:
            type: string
            const: candidate_compile_failure
        terminal_states:
          type: array
          items:
            type: string
            const: compile_failed
inputs:
  request:
    type: Request
outputs:
  report:
    type: Report
    value:
      ref: flow.outputs.report
operations:
  discover_state:
    inputs:
      request:
        type: Request
    outputs:
      state:
        type: ScanState
      pending:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_candidates_discover
        operation: mathformer_physics_candidates_discover
  compile_next:
    inputs:
      request:
        type: Request
      state:
        type: ScanState
    outputs:
      record:
        type: CaseRecord
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_candidates_compile
        operation: mathformer_physics_candidates_compile
  advance_state:
    inputs:
      state:
        type: ScanState
      record:
        type: CaseRecord
    outputs:
      state:
        type: ScanState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_candidates_advance
        operation: mathformer_physics_candidates_advance
  finish:
    inputs:
      request:
        type: Request
      state:
        type: ScanState
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_candidates_finish
        operation: mathformer_physics_candidates_finish
  empty_state:
    inputs:
      state:
        type: ScanState
    outputs:
      state:
        type: ScanState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_candidates_empty
        operation: mathformer_physics_candidates_empty
flow:
  kind: sequence
  steps:
  - id: discover
    kind: call
    operation: discover_state
    arguments:
      request:
        ref: inputs.request
  - id: traverse
    kind: loop
    state_type: ScanState
    initial:
      ref: steps.discover.outputs.state
    max_iterations: 256
    on_exhausted: fail
    body:
      kind: switch
      cases:
      - id: nonempty
        when:
          ref: steps.discover.outputs.pending
        body:
          kind: sequence
          steps:
          - id: compile
            kind: call
            operation: compile_next
            arguments:
              request:
                ref: inputs.request
              state:
                ref: loop.state
          - id: advance
            kind: call
            operation: advance_state
            arguments:
              state:
                ref: loop.state
              record:
                ref: steps.compile.outputs.record
          outputs:
            state:
              type: ScanState
              value:
                ref: steps.advance.outputs.state
            done:
              type: Boolean
              value:
                ref: steps.advance.outputs.done
      default:
        kind: call
        operation: empty_state
        arguments:
          state:
            ref: loop.state
      outputs:
        state:
          type: ScanState
          value:
            ref: selected.outputs.state
        done:
          type: Boolean
          value:
            ref: selected.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: ScanState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: finish
    arguments:
      request:
        ref: inputs.request
      state:
        ref: steps.traverse.outputs.state
  outputs:
    report:
      type: Report
      value:
        ref: steps.finish.outputs.report
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - .lake/
      - artifacts/physics_lean/all_candidate_compile/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 514
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Candidate compilation evidence only; no promotion, release acceptance
    or scientific truth.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: tests/physics_lean/run_mathformerphysicslib_all_candidate_compile.py
    selector: run; discover_state; compile_next; advance_state; empty_state; finish_report
    digest: sha256:c7f343376de5c1641290eb446d39ea03012f81cb9494dc10d828b52d05fefc8e
  - path: scripts/mathformer.py
    selector: build_registry; admit_action; prepare_action; run_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/physics_candidate_compile_tools.py
    selector: register_physics_candidate_compile_tools
    digest: sha256:d2947ef955a09fa53173cd735797a4feadd97aabc747dee7ed06ff0b03280884
  - path: scripts/mcp_server.py
    selector: register_physics_candidate_compile_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Native discovery is uncapped. This descriptor admits only exact case_count 0..256;
    the adapter rejects mismatches and larger discoveries before compilation, never
    truncating.
  - 'The empty-state identity branch is inside the loop for Lunar compilation: empty
    discovery invokes no compile/advance and passes the unchanged accumulator to finish.
    At 256 cases the final done guard stops normally; exhaustion is unreachable for
    admitted inputs.'
  - Hub admission, subprocess envelope and write auditing remain source-owned boundary
    metadata; staged tools model run(), not all controller paths. Service read-only
    and allowed-write-root checks apply to staged writes.
  - Nested report/accumulator record schemas are compact; native payloads retain all
    fields. Effect/runtime qualification remains external.
  - The 3600-second policy and 514-call ceiling are descriptor limits, not native
    execution budgets; mandatory runtime receipts do not upgrade optional native logs.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:all-candidate-compile
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lib:all-candidate-compile
      family: mathformerphysicslib
      kind: sequence
      safety: writes_artifacts
      depends_on:
      - mathformerphysicslib:all-candidate-compile
      command: []
      allows_extra_args: false
      writes:
      - artifacts/physics_lean/all_candidate_compile/
      - .lake/
  mathformer.native_boundary:
    execution: CLI/MCP hub use run_action/run_leaf_action; staged MCP calls the same
      source iterator, compilation and report helpers as run().
    admission: Reject cycles and sequence extra arguments; preflight errors and dry-run
      skip launch.
    dependency_state: Index, children, ancestry and cumulative success; stop on failure
      unless keep_going.
    composition: One child only; no subsequent alias command; failed child keeps aggregate
      success false.
    launch: Child launches the selected script with --json and a separate 1800-second
      subprocess timeout.
    completion: Undeclared writes can fail the hub result; native report and hub envelope
      are distinct.
    main: Print report; exit 0 iff checks_passed, otherwise 1. Unexpected exceptions
      abort.
    timing: Per-case timeout defaults to 180 seconds; version query has no local timeout.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
# REUSE-IgnoreEnd
