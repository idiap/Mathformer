schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_sympy_cross_backend_semantic_packet_0000_workflow
version: 1.0.0
kind: workflow
description: Build the FormalPhysics 0000 cross-backend alignment evidence packet.
aliases:
- physics-sympy:cross-backend-semantic-packet-0000
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  CaseId:
    schema:
      type: string
      const: formalphysics_0000
  ArtifactRoot:
    schema:
      type:
      - string
      - 'null'
      description: Null selects native defaults; strings retain native Path semantics.
  PacketState:
    schema:
      type: object
      description: Server-local single-use handle to the same native mutable dictionary,
        module and Paths; no checkpoint or serialization of native state.
      properties:
        handle:
          type: string
        phase:
          type: string
          enum:
          - inspected
          - collected
          - aligned
      required:
      - handle
      - phase
      additionalProperties: false
  Ready:
    schema:
      type: boolean
  EvidencePacket:
    schema:
      type: object
      properties:
        schema_version:
          const: 1
        ok:
          type: boolean
        case_id:
          type: string
        style:
          const: physics_sympy_cross_backend_semantic_packet
        physics_ir:
          type:
          - object
          - 'null'
        backend_semantic_packets:
          type: array
          items:
            type: object
          maxItems: 3
        semantic_parity:
          type: object
        findings:
          type: array
          items:
            type: object
      required:
      - schema_version
      - ok
      - case_id
      - style
      - physics_ir
      - backend_semantic_packets
      - semantic_parity
      - findings
      additionalProperties: true
inputs:
  case_id:
    type: CaseId
  artifact_root:
    type: ArtifactRoot
outputs:
  packet:
    type: EvidencePacket
    value:
      ref: flow.outputs.packet
operations:
  inspect_packet:
    inputs:
      case_id:
        type: CaseId
      artifact_root:
        type: ArtifactRoot
    outputs:
      state:
        type: PacketState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_semantic_packet_inspect
        operation: mathformer_semantic_packet_inspect
  collect_packet:
    inputs:
      state:
        type: PacketState
    outputs:
      state:
        type: PacketState
      ir_ready:
        type: Ready
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_semantic_packet_collect
        operation: mathformer_semantic_packet_collect
  packet_ir_ready:
    inputs:
      state:
        type: PacketState
    outputs:
      ready:
        type: Ready
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_semantic_packet_readiness
        operation: mathformer_semantic_packet_readiness
  align_packet:
    inputs:
      state:
        type: PacketState
    outputs:
      state:
        type: PacketState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_semantic_packet_align
        operation: mathformer_semantic_packet_align
  assemble_packet:
    inputs:
      state:
        type: PacketState
    outputs:
      packet:
        type: EvidencePacket
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_semantic_packet_assemble
        operation: mathformer_semantic_packet_assemble
flow:
  kind: sequence
  steps:
  - id: inspect
    kind: call
    operation: inspect_packet
    arguments:
      case_id:
        ref: inputs.case_id
      artifact_root:
        ref: inputs.artifact_root
  - id: collect
    kind: call
    operation: collect_packet
    arguments:
      state:
        ref: steps.inspect.outputs.state
  - id: readiness
    kind: call
    operation: packet_ir_ready
    arguments:
      state:
        ref: steps.collect.outputs.state
  - id: alignment
    kind: switch
    cases:
    - id: ir_ready
      when:
        ref: steps.readiness.outputs.ready
      body:
        kind: sequence
        steps:
        - id: align
          kind: call
          operation: align_packet
          arguments:
            state:
              ref: steps.collect.outputs.state
        - id: assemble_aligned
          kind: call
          operation: assemble_packet
          arguments:
            state:
              ref: steps.align.outputs.state
        outputs:
          packet:
            type: EvidencePacket
            value:
              ref: steps.assemble_aligned.outputs.packet
    default:
      kind: call
      operation: assemble_packet
      arguments:
        state:
          ref: steps.collect.outputs.state
    outputs:
      packet:
        type: EvidencePacket
        value:
          ref: selected.outputs.packet
  outputs:
    packet:
      type: EvidencePacket
      value:
        ref: steps.alignment.outputs.packet
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - produce_alignment_evidence
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 180
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Alignment evidence only; no Lean compilation, proof or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: complete
  sources:
  - path: tests/physics_sympy/run_cross_backend_semantic_packet.py
    selector: build_packet
    digest: sha256:ee1f335e884f514984585f7b5126cf44aa268a8128e8aa22055f2e785b5d6559
  - path: tests/physics_sympy/run_cross_backend_semantic_packet.py
    selector: inspect_packet; collect_packet; packet_ir_ready; align_packet; assemble_packet;
      main
    digest: sha256:ee1f335e884f514984585f7b5126cf44aa268a8128e8aa22055f2e785b5d6559
  - path: scripts/mathformer.py
    selector: build_registry/action:physics-sympy:cross-backend-semantic-packet-0000;
      preflight; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/cross_backend_semantic_packet_tools.py
    selector: PacketStages; register_cross_backend_semantic_packet_tools
    digest: sha256:4f583e3d7bb72ce3eee98cbc9f658600590c9ae3ae224254629925eab75586ed
  - path: scripts/mcp_server.py
    selector: register_cross_backend_semantic_packet_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: libraries/MathformerPhysicsLib/physics_ir.py
    selector: from_case_spec; validate_ir; backend_packet; compare_backend_packets
    digest: sha256:875d922159c63a2b2c6daa0967deb96dae577854e3f25b0be9fbbe2f703648b4
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps: []
extensions:
  mathformer.source:
    category: hub
    native_id: physics-sympy:cross-backend-semantic-packet-0000
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-sympy:cross-backend-semantic-packet-0000
      family: physics_sympy
      kind: validation
      safety: read_only
      depends_on: []
      writes: []
      timeout_seconds: 180
  mathformer.native_boundary:
    invocation: Hub launches the script with --case formalphysics_0000 --json.
    input_specialization: Case fixed to hub default; artifact_root null preserves
      native defaults.
    preflight: Failure or dry-run prevents launch; no action dependencies.
    failure: Timeout or undeclared writes fail the hub result; uncaught native exceptions
      propagate.
    output: CLI prints JSON or writes --output; exit 0 when packet.ok, otherwise 3.
    budget: 180 seconds is the hub subprocess timeout, not a build_packet deadline;
      3600 was generated metadata.
    effects: Stage imports and callbacks have native Python effects; optional CLI
      output is outside build_packet.
    observability: Lunar emits required v1 execution receipts; native packet findings
      and artifact hashes are retained.
    state_transport: MCP handle retains native objects in one server instance; collect/align
      rotate handles, assembly/failure consumes them, readiness is a read-only guard.
  mathformer.control:
    inspect: Unavailable SymPy and absent Lean add high findings; absent Isabelle
      adds none.
    collect: 'Unavailable SymPy skips callbacks. Derive/dimension/numeric share one
      try: an exception skips remaining callbacks and adds a high finding; later reviews
      may propagate.

      '
    align: 'Guard ignores validation outcomes. Invalid IR adds a high finding and
      alignment continues. SymPy packet is followed by Lean if present, then Isabelle
      if present. False parity extends findings; only high severity controls final
      ok.

      '
    bounds: 'No orchestration loop, retry, repair or convergence test. Internal traversals
      are finite metadata collections; alignment creates at most three packets.

      '
    stopping: Both guard branches assemble normally, including failed evidence; no
      acceptance gate.
# REUSE-IgnoreEnd
