  gaps:
  - Child internals remain inside native visit_dependency/run_action; diagnostic JSON
    is retained unchanged in captured stdout.
  - The native action has no subprocess timeout or global runtime budget. Lunar enforces
    the retained 3600-second and operation-call budgets and required runtime receipts.
  - Unknown-action admission is unreachable for the fixed registered alias; shared
    admission still preserves that guard.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:coherence-gate
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lib:coherence-gate
      family: mathformerphysicslib
      kind: sequence
      safety: read_only
      command: []
      depends_on:
      - mathformerphysicslib:coherence-gate
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: run_action is shared by CLI, natural-language routes and recursive
      calls. Registered mathformer_coherence_gate_alias_* tools call the shared native
      helpers. A transport-only carry preserves rejected admissions through the top-level
      loop without visiting a dependency; this layout supports Lunar loop exhaustion
      scoping.
    child_command:
    - python
    - skills/mathformerphysicslib/mathformerphysicslib-coherence-gate/scripts/gate_coherence.py
    - --self-test
    - --json
    child_semantics: 'Preflight checks required paths and argument policy; errors
      or dry_run return before launch. Otherwise snapshot, capture process returncode/stdout/stderr,
      then audit writes; unexpected writes force ok=false and undeclared_writes. The
      CLI selects supplied or default reports, then supplied or generated repairs,
      then aggregates and emits JSON. This registration uses self-test inventory,
      canonicalization, grounding, redefinition, integration and API checks. Repair
      planning accumulates recommendations without applying them. Report/finding scans
      carry high/medium counters to collection exhaustion: any high blocks, otherwise
      medium warns, otherwise accepted. No repair-convergence loop or retry exists.
      Without --require-release, diagnostic blocking still exits zero; exit 3 requires
      that omitted flag.'
    loop_bound: One dependency guarantees done on iteration one; on_exhausted is unreachable.
    scientific_payloads: HubResult is a transport envelope; diagnostic acceptance
      remains separate.
