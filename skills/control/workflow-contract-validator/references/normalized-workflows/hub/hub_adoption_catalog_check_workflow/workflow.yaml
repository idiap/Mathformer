schema_version: workflow-skill/v1
namespace: mathformer
id: hub_adoption_catalog_check_workflow
version: 1.0.0
kind: workflow
description: Validate portable adoption metadata, render its catalog, and reject missing
  or stale catalog text.
aliases:
- adoption:catalog-check
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Metadata:
    schema:
      anyOf:
      - type: object
        required:
        - schema_version
        - canonical_roots
        - taxonomy_sources
        - surfaces
        properties:
          schema_version:
            const: 1
          canonical_roots:
            type: array
            items:
              type: string
          taxonomy_sources:
            type: object
          surfaces:
            type: array
            items:
              type: object
      - type: 'null'
    representation: value
  Markdown:
    schema:
      type: string
    representation: value
  Boolean:
    schema:
      type: boolean
    representation: value
  Completion:
    schema:
      type: object
      required:
      - returncode
      - json
      properties:
        returncode:
          type: integer
          enum:
          - 0
          - 2
        json:
          type: object
          required:
          - ok
          properties:
            ok:
              type: boolean
            path:
              type: string
            checked:
              type: boolean
            error:
              type: string
          additionalProperties: false
      additionalProperties: false
    representation: value
  Path:
    schema:
      type: string
    representation: value
inputs:
  metadata_path:
    type: Path
    required: false
  catalog_path:
    type: Path
    required: false
outputs:
  completion:
    type: Completion
    value:
      ref: flow.outputs.completion
operations:
  load:
    inputs:
      metadata_path:
        type: Path
        required: false
    outputs:
      data:
        type: Metadata
      ok:
        type: Boolean
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_catalog_load
        operation: mathformer_catalog_load
  render:
    inputs:
      data:
        type: Metadata
    outputs:
      text:
        type: Markdown
      ok:
        type: Boolean
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_catalog_render
        operation: mathformer_catalog_render
  compare:
    inputs:
      text:
        type: Markdown
      catalog_path:
        type: Path
        required: false
    outputs:
      stale:
        type: Boolean
      ok:
        type: Boolean
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_catalog_compare
        operation: mathformer_catalog_compare
  stale:
    inputs: {}
    outputs:
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_catalog_stale
        operation: mathformer_catalog_stale
  matched:
    inputs:
      catalog_path:
        type: Path
        required: false
    outputs:
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_catalog_matched
        operation: mathformer_catalog_matched
  failed:
    inputs:
      completion:
        type: Completion
    outputs:
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_catalog_failed
        operation: mathformer_catalog_failed
flow:
  kind: sequence
  steps:
  - id: load
    kind: call
    operation: load
    arguments:
      metadata_path:
        ref: inputs.metadata_path
  - id: loaded
    kind: switch
    cases:
    - id: 'yes'
      when:
        ref: steps.load.outputs.ok
      body:
        kind: sequence
        steps:
        - id: render
          kind: call
          operation: render
          arguments:
            data:
              ref: steps.load.outputs.data
        - id: rendered
          kind: switch
          cases:
          - id: 'yes'
            when:
              ref: steps.render.outputs.ok
            body:
              kind: sequence
              steps:
              - id: compare
                kind: call
                operation: compare
                arguments:
                  text:
                    ref: steps.render.outputs.text
                  catalog_path:
                    ref: inputs.catalog_path
              - id: compared
                kind: switch
                cases:
                - id: 'yes'
                  when:
                    ref: steps.compare.outputs.ok
                  body:
                    kind: sequence
                    steps:
                    - id: finish
                      kind: switch
                      cases:
                      - id: 'yes'
                        when:
                          ref: steps.compare.outputs.stale
                        body:
                          kind: call
                          operation: stale
                          arguments: {}
                      default:
                        kind: call
                        operation: matched
                        arguments:
                          catalog_path:
                            ref: inputs.catalog_path
                      outputs:
                        completion:
                          type: Completion
                          value:
                            ref: selected.outputs.completion
                    outputs:
                      completion:
                        type: Completion
                        value:
                          ref: steps.finish.outputs.completion
                default:
                  kind: call
                  operation: failed
                  arguments:
                    completion:
                      ref: steps.compare.outputs.completion
                outputs:
                  completion:
                    type: Completion
                    value:
                      ref: selected.outputs.completion
              outputs:
                completion:
                  type: Completion
                  value:
                    ref: steps.compared.outputs.completion
          default:
            kind: call
            operation: failed
            arguments:
              completion:
                ref: steps.render.outputs.completion
          outputs:
            completion:
              type: Completion
              value:
                ref: selected.outputs.completion
        outputs:
          completion:
            type: Completion
            value:
              ref: steps.rendered.outputs.completion
    default:
      kind: call
      operation: failed
      arguments:
        completion:
          ref: steps.load.outputs.completion
    outputs:
      completion:
        type: Completion
        value:
          ref: selected.outputs.completion
  outputs:
    completion:
      type: Completion
      value:
        ref: steps.loaded.outputs.completion
policy:
  effects:
    filesystem:
      read:
      - repository
      write: []
    network: []
    external_write: []
  authority:
    allowed:
    - validate_metadata
    - check_catalog_drift
    forbidden:
    - invoke_declared_operations
    - write_catalog
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 4
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked catalog consistency description only; no execution,
    scientific endorsement, availability attestation, or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/control/workflow-contract-validator/scripts/portable_adoption.py
    selector: main catalog --check; load_contract; validate_metadata; catalog_text;
      catalog_is_stale; catalog_result; emit_completion
    digest: sha256:71cc63a093533d56dc9a14c03557dbe914f75cfbc5baeee7b32fdf66ca58a025
  - path: scripts/mathformer.py
    selector: build_registry adoption:catalog-check; native outer hub
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/catalog_check_tools.py
    selector: register_catalog_check_tools
    digest: sha256:8337163990599e0da5eec47f40e65b3d480a4b88cb7924fa2fd1d96d51a360ff
  - path: scripts/mcp_server.py
    selector: catalog check MCP registration
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory authored catalog check contract
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Helper validation traversals and Markdown accumulation remain internal native
    operations, not a Python equivalence model.
  - The graph specializes the selected CLI branch after hub preflight; hub dry-run,
    subprocess and write audit remain outside this graph.
  - Lunar enforces the retained 3600-second and four-call ceilings; the native CLI
    has no time ceiling.
  - Native terminal JSON stdout is routed to MCP stderr to preserve transport framing;
    structured completion retains returncode and JSON. Lunar supplies execution receipts.
extensions:
  mathformer.source:
    category: hub
    native_id: adoption:catalog-check
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: adoption:catalog-check
      summary: Reject drift in the generated portable pilot catalog.
      family: control
      kind: validation
      safety: read_only
      command:
      - '{python}'
      - skills/control/workflow-contract-validator/scripts/portable_adoption.py
      - catalog
      - --check
      depends_on: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
  mathformer.control:
    scope: Fixed catalog --check branch after successful native hub preflight and
      non-dry-run selection.
    ordering:
    - load_contract (including first validate_metadata)
    - catalog_text (including second validate_metadata)
    - short-circuit missing/exact-text comparison
    - stale error or matching success
    validation: Schema, canonical identities, aliases, repository paths, implementation
      bindings, typing, provenance references and authority constraints. Reads implementation
      sources and builds the hub registry without invoking declared operations.
    carried_state: Each validation maintains fresh identity, operation and alias indexes;
      recursive schema oneOf checks count successful alternatives. catalog_text maintains
      its lines accumulator.
    iteration: Helper traversals are bounded by the actual metadata/schema contents,
      with authored surface and operation order. No retries, refinement, convergence
      test, fixed iteration cap, or exhaustion result is native.
    stopping: Validation stops at the first rejected condition; oneOf catches candidate
      ValueErrors internally and requires exactly one match. Rendering completes after
      the final operation, including empty traversal if allowed by validation.
    formatting: Rows contain operation identity/aliases, owner, invocation mechanism/execution
      posture and result authority; replace cell pipes with backslash-pipe and cell
      newlines with spaces.
    specialization: No --check=false input is exposed. The source's catalog-writing
      alternative is outside this read-only action.
  mathformer.failure:
    caught:
    - ValueError
    - KeyError
    - TypeError
    - FileNotFoundError
    terminal_output: Caught ValueError, KeyError, TypeError and FileNotFoundError
      become native JSON/code-2 completions; ok switches stop all dependent steps.
      Other exceptions propagate as MCP failures with no retry.
    other_exceptions: Propagate; no retry or checkpoint. Argument parsing occurs before
      main's try block.
    stale: Missing catalog or exact mismatch raises ValueError('generated pilot catalog
      is stale'); the explicit stale operation includes the owning main catch.
    success: Completion.returncode=0 and Completion.json={ok:true,path:'docs/migrations/portable-repository-adoption/catalog.md',checked:true}.
    hub_acceptance: A returncode of 2 is a failed native action even though it has
      a JSON payload. A returncode of 0 still requires a successful hub write audit.
  mathformer.native_boundary:
    execution: Selected CLI branch implemented by registered native-function MCP steps;
      outer hub remains unchanged.
    preflight: Reject extra arguments; return early with native preflight error payload,
      or status dry_run without launching the subprocess.
    dependencies: No dependencies. adoption:check also includes this leaf as a sequence
      member; that enclosing sequence is outside this graph.
    audit: Snapshot repository before and after subprocess; audit declared writes=[];
      unexpected writes force ok=false/status=undeclared_writes.
    reporting: Optional hub report writes remain outside the selected CLI branch.
    budget: At most four calls; no native retry or exhaustion loop. Lunar enforces
      the contract ceilings.
  mathformer.context:
    metadata_path: Optional metadata file path; omitted/empty uses native METADATA.
      Validation still resolves against the repository.
    catalog_path: Optional comparison file path; omitted/empty uses native CATALOG.
      Matched result retains native relative_to(ROOT) behavior.
