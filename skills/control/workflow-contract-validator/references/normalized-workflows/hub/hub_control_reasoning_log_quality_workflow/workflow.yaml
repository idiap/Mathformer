schema_version: workflow-skill/v1
namespace: mathformer
id: hub_control_reasoning_log_quality_workflow
version: 1.0.0
kind: workflow
description: Select logs, audit quality, optionally verify the bad fixture, print
  and return status.
aliases:
- control:reasoning-log-quality
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Argv:
    schema:
      type: array
      items:
        type: string
    representation: value
  Request:
    schema:
      type: object
      required:
      - log_files
      - hooks_file
      - self_test
      - json
      - fixture_directory
      properties:
        log_files:
          type: array
          items:
            type: string
        hooks_file:
          type: string
        self_test:
          type: boolean
        json:
          type: boolean
        fixture_directory:
          type: string
  Flag:
    schema:
      type: boolean
  Selection:
    schema:
      type: object
      required:
      - log_files
      - fixtures
      properties:
        log_files:
          type: array
          items:
            type: string
        fixtures:
          type: object
          additionalProperties:
            type: string
  Report:
    schema:
      type: object
      required:
      - schema_version
      - style
      - ok
      - log_count
      - event_count
      - quality_scores
      - quality_dimensions
      - consumer_readiness
      - logs
      - findings
      properties:
        schema_version:
          const: 1
        style:
          const: reasoning_log_consumer_quality_audit
        ok:
          type: boolean
        log_count:
          type: integer
          minimum: 0
        event_count:
          type: integer
          minimum: 0
        quality_scores:
          type: object
          additionalProperties:
            type: number
        quality_dimensions:
          type: array
          items:
            type: string
        consumer_readiness:
          type: object
        logs:
          type: array
          items:
            type: object
        findings:
          type: array
          items:
            type: object
        self_test:
          type: object
  Outcome:
    schema:
      type: object
      required:
      - report
      - exit_code
      - stdout
      properties:
        report:
          type: object
        exit_code:
          enum:
          - 0
          - 3
        stdout:
          type: string
  Context:
    schema:
      type: object
      required:
      - fixture_directory
      additionalProperties: false
      properties:
        fixture_directory:
          type: string
inputs:
  argv:
    type: Argv
  context:
    type: Context
outputs:
  result:
    type: Outcome
    value:
      ref: flow.outputs.result
operations:
  parse_and_guard:
    inputs:
      argv:
        type: Argv
      context:
        type: Context
    outputs:
      request:
        type: Request
      use_fixtures:
        type: Flag
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_reasoning_quality_parse_and_guard
        operation: mathformer_reasoning_quality_parse_and_guard
  prepare_fixtures:
    inputs:
      request:
        type: Request
    outputs:
      selection:
        type: Selection
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_reasoning_quality_prepare_fixtures
        operation: mathformer_reasoning_quality_prepare_fixtures
  select_supplied:
    inputs:
      request:
        type: Request
    outputs:
      selection:
        type: Selection
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_reasoning_quality_select_supplied
        operation: mathformer_reasoning_quality_select_supplied
  audit_selected:
    inputs:
      request:
        type: Request
      selection:
        type: Selection
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_reasoning_quality_audit_selected
        operation: mathformer_reasoning_quality_audit_selected
  verify_bad:
    inputs:
      request:
        type: Request
      selection:
        type: Selection
      report:
        type: Report
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_reasoning_quality_verify_bad
        operation: mathformer_reasoning_quality_verify_bad
  emit:
    inputs:
      request:
        type: Request
      report:
        type: Report
    outputs:
      result:
        type: Outcome
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_reasoning_quality_emit
        operation: mathformer_reasoning_quality_emit
flow:
  kind: sequence
  steps:
  - id: parse
    kind: call
    operation: parse_and_guard
    arguments:
      argv:
        ref: inputs.argv
      context:
        ref: inputs.context
  - id: select
    kind: switch
    cases:
    - id: fixtures
      when:
        ref: steps.parse.outputs.use_fixtures
      body:
        id: write_fixtures
        kind: call
        operation: prepare_fixtures
        arguments:
          request:
            ref: steps.parse.outputs.request
    default:
      id: supplied
      kind: call
      operation: select_supplied
      arguments:
        request:
          ref: steps.parse.outputs.request
    outputs:
      selection:
        type: Selection
        value:
          ref: selected.outputs.selection
  - id: audit
    kind: call
    operation: audit_selected
    arguments:
      request:
        ref: steps.parse.outputs.request
      selection:
        ref: steps.select.outputs.selection
  - id: finish
    kind: switch
    cases:
    - id: self_test
      when:
        ref: steps.parse.outputs.request.self_test
      body:
        kind: sequence
        steps:
        - id: check_bad
          kind: call
          operation: verify_bad
          arguments:
            request:
              ref: steps.parse.outputs.request
            selection:
              ref: steps.select.outputs.selection
            report:
              ref: steps.audit.outputs.report
        - id: print_checked
          kind: call
          operation: emit
          arguments:
            request:
              ref: steps.parse.outputs.request
            report:
              ref: steps.check_bad.outputs.report
        outputs:
          result:
            type: Outcome
            value:
              ref: steps.print_checked.outputs.result
    default:
      id: print_direct
      kind: call
      operation: emit
      arguments:
        request:
          ref: steps.parse.outputs.request
        report:
          ref: steps.audit.outputs.report
    outputs:
      result:
        type: Outcome
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: Outcome
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/reasoning/self_test/
    network: []
    external_write: []
  authority:
    allowed:
    - audit_reasoning_logs
    - write_self_test_fixtures
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 6
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked quality audit only; ok does not imply consumer readiness
    or scientific validity.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/control/reasoning-log-schema-guardian/scripts/audit_reasoning_log_quality.py
    selector: main
    digest: sha256:22ab6d873c6f6edee0f0011fdd1bb2990ec6c2f22ae2d80da8cce2dc5c528a54
  - path: scripts/mathformer.py
    selector: build_registry control:reasoning-log-quality; run_action; run_leaf_action;
      preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/reasoning_quality_tools.py
    digest: sha256:171ca258b681200d4503f61238bc5c12255d2276a8fa1f34e653a3f46b29a952
  - path: scripts/mcp_server.py
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/mcp/run_reasoning_quality_workflow_tests.py
    digest: sha256:30a50646f7d2fa908ec8ff6bc5316c13ce1075430bbf9bed37be242cb2dc183b
  - path: tests/mcp/fixtures/reasoning_quality_original.py.txt
    digest: sha256:3ba9adde1aa6629858a514125f3f986eb0a68b7bff1bbaa8a81c9f172503b996
  - path: tests/test_matrix.json
    digest: sha256:d32b00ccbceb1a135706331f4a27c4515c55b0ef02536e0db867f29c167d1fe9
  gaps:
  - Audit helper loops remain source-owned and exhaust inputs without native count
    or runtime caps.
  - Hub preflight, dry-run, subprocess dispatch and write audit are outside this main-entrypoint
    workflow.
extensions:
  mathformer.source:
    category: hub
    native_id: control:reasoning-log-quality
    owner_skill: skills/control/reasoning-log-schema-guardian/SKILL.md
    contract:
      id: control:reasoning-log-quality
      summary: Audit reasoning logs against the consumer-grade quality profile.
      family: control
      kind: validation
      safety: read_only
      command:
      - '{python}'
      - skills/control/reasoning-log-schema-guardian/scripts/audit_reasoning_log_quality.py
      - --self-test
      - --json
      depends_on: []
      required_paths:
      - skills/control/reasoning-log-schema-guardian/scripts/audit_reasoning_log_quality.py
      - skills/control/reasoning-log-schema-guardian/references/schema.md
      required_tools: []
      optional_tools: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: run_action dispatches run_leaf_action after preflight; dry-run returns
      before execution. Callers include the NL quality route and consumer-readiness
      sequence.
    effects_status: Native read_only and empty writes declaration conflicts with forced
      self-test fixture writes; subsequent hub write audit can reject unexpected writes.
    failure_policy: Do not turn failed preflight, subprocess or write audit into acceptance.
    runtime_binding: Six registered MCP tools share the CLI implementation; argv excludes
      interpreter/script. Context.fixture_directory relocates self-test storage; empty
      string selects native repository defaults. stdout is returned as an outcome
      and printed by the native CLI.
  mathformer.quality:
    dimensions:
    - self_contained
    - self_explanatory
    - concise
    - human_understandable
    - machine_processable
    checks: Application metadata, structured sections, intent/summary, recovery guidance,
      hook membership, payload size, inline output, credentials and private paths.
    advisory_bounds:
      intent_chars: 180
      summary_chars: 320
      payload_bytes: 8192
      inline_output_chars: 1200
    readiness: Nonempty log list, positive event count, no high findings and every
      dimension at least 0.95.
    ok: No high findings; explicit self-test additionally requires a high finding
      in the bad fixture.
    stopping: Exhaust finite inputs normally despite malformed lines or high findings;
      no retry, checkpoint, convergence or source-enforced global budget. Uncaught
      I/O, hook and helper exceptions propagate.
  mathformer.fixture_context:
    fixture_directory: Host-resolved artifacts/reasoning/self_test/ write mount. Empty
      selects the native repository path; tests supply an isolated temporary artifacts
      directory.
  mathformer.step_sources:
    parse_and_guard: audit_reasoning_log_quality.py:parse_args and main initialization/first
      condition. Parse repeated --log-file, default hooks, --self-test and --json;
      compute self_test or not log_files. Argument errors exit before audit.
    prepare_fixtures: audit_reasoning_log_quality.py:main first if and write_self_test_fixtures.
      Write/replace good and bad JSONL through PID temporary files; pack fixtures
      and [default_good_fixture()], replacing supplied logs.
    select_supplied: audit_reasoning_log_quality.py:main fixtures={} and log_files=list(args.log_file),
      first-if fallthrough. Pack supplied logs with empty fixtures; no writes.
    audit_selected: audit_reasoning_log_quality.py:main audit_logs call; audit_logs/audit_event
      own helper loops. Parse hook contract first. For each log load JSONL, accumulate
      loading findings, validate_entries with strict=True and instrumentation/application
      requirements false, retain high schema findings, audit every parsed event, append
      per-log scores, then aggregate. Carry findings, per-log/global score rows and
      event count; schema validation carries previous index/timestamp per log. Findings
      and malformed lines do not stop traversal. Exhaust logs, entries and nested
      payload values without count/runtime caps, retry or convergence.
    verify_bad: audit_reasoning_log_quality.py:main second if. Audit [default_bad_fixture()]
      using the same hooks; attach self_test fixtures, original good_ok, any high
      bad finding, and sorted unique bad finding codes. Set ok=original ok AND bad_has_high_findings.
      Retain good-report readiness/findings. Bad audit helpers remain owned here.
    emit: audit_reasoning_log_quality.py:main final if and return. JSON prints the
      full report with ensure_ascii=False, indent=2, sort_keys=True. Otherwise print
      ok, readiness status and first 20 findings. Return 0 iff final ok, otherwise
      3. Pack report, stdout and return code; findings are normal report results.
