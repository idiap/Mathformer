schema_version: workflow-skill/v1
namespace: mathformer
id: hub_review_autoformalization_framework_workflow
version: 1.0.0
kind: workflow
description: Ordered framework review through run_action and prepare_action; no parent
  command.
aliases:
- review:autoformalization-framework
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  Strings:
    schema:
      type: array
      items:
        type: string
  Bool:
    schema:
      type: boolean
  Admission:
    schema:
      type: object
      required:
      - accepted
      - status
      - ancestry
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        status:
          enum:
          - accepted
          - unknown_action
          - dependency_cycle
          - extra_args_for_sequence
        ancestry:
          type: array
          items:
            type: string
          uniqueItems: true
  DependencyState:
    schema:
      type: object
      required:
      - index
      - children
      - dependencies_ok
      - ancestry
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 3
        children:
          type: array
          maxItems: 3
          items:
            type: object
            required:
            - ok
            properties:
              ok:
                type: boolean
        dependencies_ok:
          type: boolean
        ancestry:
          type: array
          items:
            type: string
      additionalProperties: false
  Mount:
    schema:
      type:
      - string
      - 'null'
inputs:
  context:
    type: RunContext
  extra_args:
    type: Strings
    required: false
  seen:
    type: Strings
    required: false
  repository_root:
    type: Mount
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  admit:
    inputs:
      extra_args:
        type: Strings
        required: false
      seen:
        type: Strings
        required: false
    outputs:
      admission:
        type: Admission
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_admit
        operation: mathformer_review_framework_admit
  reject:
    inputs:
      admission:
        type: Admission
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_reject
        operation: mathformer_review_framework_reject
  initialize:
    inputs:
      admission:
        type: Admission
    outputs:
      state:
        type: DependencyState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_initialize
        operation: mathformer_review_framework_initialize
  visit:
    inputs:
      state:
        type: DependencyState
      context:
        type: RunContext
      repository_root:
        type: Mount
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_visit
        operation: mathformer_review_framework_visit
  advance:
    inputs:
      state:
        type: DependencyState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: DependencyState
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_advance
        operation: mathformer_review_framework_advance
  finish:
    inputs:
      state:
        type: DependencyState
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_finish
        operation: mathformer_review_framework_finish
  carry:
    inputs:
      state:
        type: DependencyState
      result:
        type: HubResult
    outputs:
      state:
        type: DependencyState
      done:
        type: Bool
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_review_framework_carry
        operation: mathformer_review_framework_carry
flow:
  kind: sequence
  steps:
  - id: admission
    kind: call
    operation: admit
    arguments:
      extra_args:
        ref: inputs.extra_args
      seen:
        ref: inputs.seen
  - id: dispatch
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.admission.outputs.admission.accepted
      body:
        kind: sequence
        steps:
        - id: initial
          kind: call
          operation: initialize
          arguments:
            admission:
              ref: steps.admission.outputs.admission
        outputs:
          state:
            type: DependencyState
            value:
              ref: steps.initial.outputs.state
          rejection:
            type: HubResult
            value:
              literal:
                ok: true
    default:
      kind: sequence
      steps:
      - kind: call
        operation: reject
        arguments:
          admission:
            ref: steps.admission.outputs.admission
        id: rejection
      outputs:
        state:
          type: DependencyState
          value:
            literal:
              index: 0
              children: []
              dependencies_ok: true
              ancestry: []
        rejection:
          type: HubResult
          value:
            ref: steps.rejection.outputs.result
    outputs:
      state:
        type: DependencyState
        value:
          ref: selected.outputs.state
      rejection:
        type: HubResult
        value:
          ref: selected.outputs.rejection
  - id: dependencies
    kind: loop
    state_type: DependencyState
    initial:
      ref: steps.dispatch.outputs.state
    max_iterations: 3
    on_exhausted: fail
    body:
      kind: switch
      cases:
      - id: accepted
        when:
          ref: steps.admission.outputs.admission.accepted
        body:
          kind: sequence
          steps:
          - id: child
            kind: call
            operation: visit
            arguments:
              state:
                ref: loop.state
              context:
                ref: inputs.context
              repository_root:
                ref: inputs.repository_root
          - id: advance
            kind: call
            operation: advance
            arguments:
              state:
                ref: loop.state
              child:
                ref: steps.child.outputs.child
              context:
                ref: inputs.context
          outputs:
            state:
              type: DependencyState
              value:
                ref: steps.advance.outputs.state
            done:
              type: Bool
              value:
                ref: steps.advance.outputs.done
      default:
        kind: sequence
        steps:
        - kind: call
          operation: carry
          arguments:
            state:
              ref: loop.state
            result:
              ref: steps.dispatch.outputs.rejection
          id: carry
        outputs:
          state:
            type: DependencyState
            value:
              ref: steps.carry.outputs.state
          done:
            type: Bool
            value:
              ref: steps.carry.outputs.done
      outputs:
        state:
          type: DependencyState
          value:
            ref: selected.outputs.state
        done:
          type: Bool
          value:
            ref: selected.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: DependencyState
        value:
          ref: body.outputs.state
  - id: completion
    kind: switch
    cases:
    - id: accepted
      when:
        ref: steps.admission.outputs.admission.accepted
      body:
        id: completion
        kind: call
        operation: finish
        arguments:
          state:
            ref: steps.dependencies.outputs.state
    default:
      kind: sequence
      steps:
      - kind: call
        operation: carry
        arguments:
          state:
            ref: steps.dispatch.outputs.state
          result:
            ref: steps.dispatch.outputs.rejection
        id: carry
      outputs:
        result:
          type: HubResult
          value:
            ref: steps.carry.outputs.result
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.completion.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - .lake/
      - artifacts/
      - artifacts/physics_lean/release_gate/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 9
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked transport/control description; completion establishes
    no scientific truth or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_action; build_registry; prepare_action; dependency helpers
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/review_framework_tools.py
    selector: review framework runtime registration
    digest: sha256:123d9e57b34fbb68729bb2280753c4504bdbb5c8f9e3b811b7a47320213d9c8d
  - path: scripts/mcp_server.py
    selector: review framework runtime registration
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: review framework runtime registration
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: review framework runtime registration
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Recursive child graphs and leaf internals remain native calls within visit; backend
    scripts are not expanded.
  - Lunar enforces the retained 3600-second and nine-operation limits; no native global
    review deadline exists. The release-gate leaf timeout remains 1200 seconds.
  - Native effect qualification remains source-owned; Lunar receipts establish no
    scientific truth or promotion.
extensions:
  mathformer.source:
    category: hub
    native_id: review:autoformalization-framework
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: review:autoformalization-framework
      summary: Run the controlled cross-cutting autoformalization framework and physics
        release review.
      family: quality
      kind: sequence
      safety: writes_artifacts
      command: []
      depends_on:
      - control:all
      - test:docs
      - mathformerphysicslib:release-gate
      writes:
      - artifacts/physics_lean/release_gate/
      - .lake/
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: Registered mathformer_review_framework_* tools call the shared native
      dependency helpers and fixed build_registry action; recursive visits retain
      preflight, argv, timeouts and write auditing.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    - repository_root
    failure_policy: Child ok=false is returned as data; advance controls stopping
      and sticky aggregate failure.
    leaf_semantics: Preflight precedes dry-run or argv execution without shell; failed
      preflight, nonzero exit, timeout or undeclared writes fail. Write auditing and
      timing remain internal.
    bounds: Finite registered dependencies and leaf timeouts; release-gate timeout
      is 1200 seconds. No retries, convergence loop or native global deadline.
    callers: main direct run and run_intent_match via review.autoformalization.framework
      propagate flags; CLI exits 0/1 from aggregate ok.
    scientific_payloads: HubResult is a transport envelope, not a proof or backend
      report.
    inputs: Optional extra_args and seen default empty; required repository_root is
      a string mount or null for the repository default.
  mathformer.composition:
    ordered_dependencies:
    - control:all
    - test:docs
    - mathformerphysicslib:release-gate
    dependency_workflows:
    - hub_control_all_workflow
    - hub_test_docs_workflow
    - hub_mathformerphysicslib_release_gate_workflow
    command_after_dependencies: false
    keep_going_semantics: Stop after first failed child unless keep_going; cumulative
      failure cannot recover.
    extra_args_for_sequence: rejected by run_action
    modeling: One source dependency traversal, no refinement; third advance sets done=true
      and avoids exhaustion.
    admission_bypass: Transport-only carry exits the top-level loop on rejected admission
      and returns the rejection unchanged; no native visit or finish runs.
# REUSE-IgnoreEnd
