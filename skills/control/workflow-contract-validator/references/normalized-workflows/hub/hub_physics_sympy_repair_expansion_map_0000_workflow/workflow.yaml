schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_sympy_repair_expansion_map_0000_workflow
version: 1.0.0
kind: workflow
description: Build and emit one native SymPy repair expansion map; hub preflight and
  write auditing remain with the existing hub caller.
aliases:
- physics-sympy:repair-expansion-map-0000
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  ExtraArguments:
    schema:
      type: array
      items:
        type: string
  Options:
    schema:
      type: object
      required:
      - self_test
      - goal_plan_supplied
      - case
      - goal_plan
      - review
      - output
      - reasoning_log
      properties:
        self_test:
          type: boolean
        goal_plan_supplied:
          type: boolean
        case:
          type:
          - string
          - 'null'
        goal_plan:
          type:
          - string
          - 'null'
        review:
          type: array
          items:
            type: string
        output:
          type:
          - string
          - 'null'
        reasoning_log:
          type:
          - string
          - 'null'
  GoalPlan:
    schema:
      type: object
      description: Native planner dictionary; optional fields retain build_map defaults.
      properties:
        case_id: {}
        next_action: {}
        findings:
          type: array
          items: {}
  Reviews:
    schema:
      type: array
      items:
        type: object
  ExpansionMap:
    schema:
      type: object
      required:
      - style
      - backend
      - case_id
      - status
      - exhaustive
      - node_count
      - outstanding_node_count
      - nodes
      - outstanding_nodes
      - next_frontier
      - iteration_signature
      - required_rerun_gates
      - sympy_only_boundary
      properties:
        style:
          const: physics_sympy_repair_expansion_map
        backend:
          const: sympy
        case_id:
          type: string
        status:
          enum:
          - complete
          - needs_expansion
          - blocked
        exhaustive:
          const: true
        node_count:
          type: integer
          minimum: 0
        outstanding_node_count:
          type: integer
          minimum: 0
        nodes:
          type: array
          items:
            type: object
        outstanding_nodes:
          type: array
          items:
            type: object
        next_frontier:
          type: array
          items:
            type: object
        iteration_signature:
          type: string
          pattern: ^[0-9a-f]{16}$
        required_rerun_gates:
          type: array
          items:
            type: string
        sympy_only_boundary:
          type: object
  Emission:
    schema:
      type: object
      required:
      - serialized_json
      - exit_code
      properties:
        serialized_json:
          type: string
        exit_code:
          const: 0
  NativeJson:
    schema:
      type: string
      description: Lossless native JSON insertion order across transport; checked
        against the typed payload.
inputs:
  extra_args:
    type: ExtraArguments
outputs:
  expansion:
    type: ExpansionMap
    value:
      ref: flow.outputs.expansion
  result:
    type: Emission
    value:
      ref: flow.outputs.result
operations:
  parse_cli:
    inputs:
      extra_args:
        type: ExtraArguments
    outputs:
      options:
        type: Options
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_parse_cli
        operation: mathformer_sympy_expansion_parse_cli
  load_plan:
    inputs:
      options:
        type: Options
    outputs:
      plan:
        type: GoalPlan
      plan_json:
        type: NativeJson
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_load_plan
        operation: mathformer_sympy_expansion_load_plan
  plan_case:
    inputs:
      options:
        type: Options
    outputs:
      plan:
        type: GoalPlan
      plan_json:
        type: NativeJson
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_plan_case
        operation: mathformer_sympy_expansion_plan_case
  load_reviews:
    inputs:
      options:
        type: Options
    outputs:
      reviews:
        type: Reviews
      reviews_json:
        type: NativeJson
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_load_reviews
        operation: mathformer_sympy_expansion_load_reviews
  build_map:
    inputs:
      plan:
        type: GoalPlan
      reviews:
        type: Reviews
      plan_json:
        type: NativeJson
      reviews_json:
        type: NativeJson
    outputs:
      expansion:
        type: ExpansionMap
      expansion_json:
        type: NativeJson
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_build_map
        operation: mathformer_sympy_expansion_build_map
  self_test:
    inputs: {}
    outputs:
      expansion:
        type: ExpansionMap
      expansion_json:
        type: NativeJson
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_self_test
        operation: mathformer_sympy_expansion_self_test
  emit:
    inputs:
      options:
        type: Options
      expansion:
        type: ExpansionMap
      expansion_json:
        type: NativeJson
    outputs:
      result:
        type: Emission
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_expansion_emit
        operation: mathformer_sympy_expansion_emit
flow:
  kind: sequence
  steps:
  - id: parse
    kind: call
    operation: parse_cli
    arguments:
      extra_args:
        ref: inputs.extra_args
  - id: select
    kind: switch
    cases:
    - id: self_test
      when:
        ref: steps.parse.outputs.options.self_test
      body:
        kind: call
        operation: self_test
        arguments: {}
    default:
      kind: sequence
      steps:
      - id: resolve_plan
        kind: switch
        cases:
        - id: file
          when:
            ref: steps.parse.outputs.options.goal_plan_supplied
          body:
            kind: call
            operation: load_plan
            arguments:
              options:
                ref: steps.parse.outputs.options
        default:
          kind: call
          operation: plan_case
          arguments:
            options:
              ref: steps.parse.outputs.options
        outputs:
          plan:
            type: GoalPlan
            value:
              ref: selected.outputs.plan
          plan_json:
            type: NativeJson
            value:
              ref: selected.outputs.plan_json
      - id: reviews
        kind: call
        operation: load_reviews
        arguments:
          options:
            ref: steps.parse.outputs.options
      - id: map
        kind: call
        operation: build_map
        arguments:
          plan:
            ref: steps.resolve_plan.outputs.plan
          reviews:
            ref: steps.reviews.outputs.reviews
          plan_json:
            ref: steps.resolve_plan.outputs.plan_json
          reviews_json:
            ref: steps.reviews.outputs.reviews_json
      outputs:
        expansion:
          type: ExpansionMap
          value:
            ref: steps.map.outputs.expansion
        expansion_json:
          type: NativeJson
          value:
            ref: steps.map.outputs.expansion_json
    outputs:
      expansion:
        type: ExpansionMap
        value:
          ref: selected.outputs.expansion
      expansion_json:
        type: NativeJson
        value:
          ref: selected.outputs.expansion_json
  - id: emit
    kind: call
    operation: emit
    arguments:
      options:
        ref: steps.parse.outputs.options
      expansion:
        ref: steps.select.outputs.expansion
      expansion_json:
        ref: steps.select.outputs.expansion_json
  outputs:
    expansion:
      type: ExpansionMap
      value:
        ref: steps.select.outputs.expansion
    result:
      type: Emission
      value:
        ref: steps.emit.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - native_runtime_outputs
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 360
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked map only; completion does not establish scientific
    truth or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/physics-sympy/physics-sympy-repair-expansion-cartographer/scripts/map_physics_sympy_repair_expansion.py
    selector: main (delegates mapping to build_map)
    digest: sha256:41e47a6f15b19da49f1f1949c711e6d2e95992ebf4c9d619ad9eeedcaf3c0405
  - path: scripts/mathformer.py
    selector: build_registry/action:physics-sympy:repair-expansion-map-0000; preflight;
      run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/sympy_expansion_tools.py
    selector: register_sympy_expansion_tools; lossless JSON ports
    digest: sha256:fbc89998dd998fbfde9b517f4405acc576baf7f30309ba7944703c8561bc4ebb
  - path: scripts/mcp_server.py
    selector: register_sympy_expansion_tools(mcp, _analysis_write_policy)
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory authored physics-sympy:repair-expansion-map-0000
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - The graph covers selected main after native hub preflight. Hub dry-run, subprocess
    timeout capture and repository write auditing remain outside this graph in the
    unchanged hub caller.
  - Planner internals are delegated to native run_goal_planner with its original argv
    and 240-second timeout. Listed rerun gates and the separate recursive controller
    are not executed by this invocation.
  - Malformed input payload shapes remain native failures; argparse exits are translated
    to MCP errors to preserve the server. Native optional reasoning logs are distinct
    from Lunar runtime receipts.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-sympy:repair-expansion-map-0000
    owner_skill: skills/physics-sympy/physics-sympy-repair-expansion-cartographer/SKILL.md
    contract:
      id: physics-sympy:repair-expansion-map-0000
      family: physics_sympy
      kind: validation
      safety: read_only
      depends_on: []
      allows_extra_args: true
      timeout_seconds: 360
      writes: []
  mathformer.native_boundary:
    execution: Callable MCP block adapters share the original CLI implementation.
      Lunar executes the selected post-preflight main graph with runtime receipts;
      the native hub remains responsible for its outer preflight, dry-run, timeout
      capture and write audit.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Hub preflight blocks launch; timeout or undeclared writes makes
      hub ok false.
    scientific_payloads: Map statuses are payload values; native process return 0
      does not mean repairs complete.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    callers: Stage sequencing and recursive-repair controller are outside this invocation.
    recursion: Controller consumes caller-supplied maps/state, blocks repeated signatures
      or cap (default 6), and returns a decision without executing repairs or iterating.
# REUSE-IgnoreEnd
