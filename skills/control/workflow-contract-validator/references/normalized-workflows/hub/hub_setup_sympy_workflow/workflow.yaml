schema_version: workflow-skill/v1
namespace: mathformer
id: hub_setup_sympy_workflow
version: 1.0.0
kind: workflow
description: Install the SymPy profile through the controlled setup:sympy leaf boundary.
aliases:
- setup:sympy
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema:
      type: object
      properties:
        dry_run:
          type: boolean
        json_output:
          type: boolean
        keep_going:
          type: boolean
        allow_mutating:
          type: boolean
        write_report:
          type: boolean
      required:
      - dry_run
      - json_output
      - keep_going
      - allow_mutating
      - write_report
      additionalProperties: false
  ExtraArguments:
    schema:
      type: array
      items:
        type: string
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  Boundary:
    schema:
      type: object
      properties:
        execute:
          type: boolean
        continuation:
          type: string
      required:
      - execute
      - continuation
      additionalProperties: false
inputs:
  context:
    type: RunContext
  extra_args:
    type: ExtraArguments
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  prepare_boundary:
    inputs:
      context:
        type: RunContext
      extra_args:
        type: ExtraArguments
    outputs:
      boundary:
        type: Boundary
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_setup_sympy_prepare_boundary
        operation: mathformer_setup_sympy_prepare_boundary
  return_preflight:
    inputs:
      boundary:
        type: Boundary
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_setup_sympy_return_preflight
        operation: mathformer_setup_sympy_return_preflight
  launch_installer:
    inputs:
      boundary:
        type: Boundary
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_setup_sympy_launch_installer
        operation: mathformer_setup_sympy_launch_installer
  audit_result:
    inputs:
      boundary:
        type: Boundary
      result:
        type: HubResult
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_setup_sympy_audit_result
        operation: mathformer_setup_sympy_audit_result
flow:
  kind: sequence
  steps:
  - id: preflight
    kind: call
    operation: prepare_boundary
    arguments:
      context:
        ref: inputs.context
      extra_args:
        ref: inputs.extra_args
  - id: route
    kind: switch
    cases:
    - id: execute
      when:
        ref: steps.preflight.outputs.boundary.execute
      body:
        kind: sequence
        steps:
        - id: launch
          kind: call
          operation: launch_installer
          arguments:
            boundary:
              ref: steps.preflight.outputs.boundary
        - id: audit
          kind: call
          operation: audit_result
          arguments:
            boundary:
              ref: steps.preflight.outputs.boundary
            result:
              ref: steps.launch.outputs.result
        outputs:
          result:
            type: HubResult
            value:
              ref: steps.audit.outputs.result
    default:
      kind: call
      operation: return_preflight
      arguments:
        boundary:
          ref: steps.preflight.outputs.boundary
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.route.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - .venv/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 4
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Environment setup result and native write audit only; no scientific
    result or external-effect qualification.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: interface_only
  sources:
  - path: scripts/install_env.py
    selector: main
    digest: sha256:2c8a00fbf461dddcb10899271ca41d47bf90c9a077b47add7db3c250aab1a5fd
  - path: scripts/mathformer.py
    selector: build_registry/setup:sympy; run_action; run_leaf_action; prepare_leaf_boundary;
      launch_leaf_boundary; finish_leaf_boundary
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/setup_sympy_tools.py
    digest: sha256:0177c5b3c6ab0680b6789e092cefdcab11ab90eb6e8cfb8ec5c3dd957980d62d
  - path: scripts/mcp_server.py
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - The installer is deliberately opaque at its native single-subprocess boundary;
    main retains initialization, environment preparation, dependency selection/installation,
    Lean skip and completion in source order.
  - Only the fixed --with-sympy route is represented; other profiles and Lean execution
    are inactive.
  - Native timeout_seconds is null; Lunar enforces the workflow wall-time budget but
    cannot cancel an already launched native subprocess.
  - VENV_PATH may resolve outside .venv/; repository write auditing does not sandbox
    external writes. Network, uv caches and external effects require host qualification.
extensions:
  mathformer.source:
    category: hub
    native_id: setup:sympy
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: setup:sympy
      family: setup
      kind: setup
      safety: writes_environment
      command:
      - uv
      - run
      - python
      - scripts/install_env.py
      - --with-sympy
      depends_on: []
      required_paths:
      - scripts/install_env.py
      required_tools:
      - uv
      writes:
      - .venv/
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: run_action -> run_leaf_action; one captured subprocess from repository
      root.
    failure_policy: Preserve failed native results; installer termination still reaches
      the hub write audit.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    modeling: No dependency traversal, retry, scientific search or convergence loop
      on this leaf route.
# REUSE-IgnoreEnd
