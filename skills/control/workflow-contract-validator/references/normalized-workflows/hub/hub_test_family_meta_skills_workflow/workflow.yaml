schema_version: workflow-skill/v1
namespace: mathformer
id: hub_test_family_meta_skills_workflow
version: 1.0.0
kind: workflow
description: Traverse the meta_skills matrix in order, aggregate evidence, and publish
  JSON.
aliases:
- test:family:meta-skills
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Invocation:
    schema:
      type: object
      properties:
        module_family:
          const:
          - meta_skills
        profile:
          const: workstation
        json:
          const: true
        emit_dependency_map_only:
          const: false
        changed_files_only:
          const: false
        validate_matrix:
          const: false
        fail_on_warning:
          const: false
        write_jsonl:
          type: 'null'
        write_junit:
          type: 'null'
        selected_row_cap:
          const: 3
      required:
      - module_family
      - profile
      - json
      - emit_dependency_map_only
      - changed_files_only
      - validate_matrix
      - fail_on_warning
      - write_jsonl
      - write_junit
      - selected_row_cap
      additionalProperties: false
  CheckState:
    schema:
      type: object
      properties:
        matrix:
          type: array
          items:
            type: object
        selected:
          type: array
          maxItems: 3
          items:
            type: object
        families:
          type: array
          items:
            type: string
        index:
          type: integer
          minimum: 0
          maximum: 3
        results:
          type: array
          maxItems: 3
          items:
            type: object
      required:
      - matrix
      - selected
      - families
      - index
      - results
      additionalProperties: false
  Pending:
    schema:
      type: boolean
  Report:
    schema:
      type: object
      properties:
        run_id:
          type: string
        ok:
          type: boolean
        profile:
          const: workstation
        families:
          type: array
          items:
            type: string
        summary:
          type: object
        results:
          type: array
          items:
            type: object
        schema_errors:
          type: array
          items:
            type: string
        matrix_errors:
          type: array
          items:
            type: string
        capability_ledger:
          type: object
        dependency_map:
          type: string
        changed_files_only:
          const: false
        changed_files:
          type: array
          maxItems: 0
      required:
      - run_id
      - ok
      - profile
      - families
      - summary
      - results
      - schema_errors
      - matrix_errors
      - capability_ledger
      - dependency_map
      - changed_files_only
      - changed_files
      additionalProperties: false
  ExitCode:
    schema:
      type: integer
      enum:
      - 0
      - 3
  Context:
    schema:
      type: object
      required:
      - handle
      additionalProperties: false
      properties:
        handle:
          type: string
          minLength: 1
  Publication:
    schema:
      type: object
      required:
      - report_path
      - stdout
      additionalProperties: false
      properties:
        report_path:
          type: string
        stdout:
          type: string
  Cursor:
    schema:
      type: object
      required:
      - state
      - pending
      additionalProperties: false
      properties:
        state:
          type: object
          properties:
            matrix:
              type: array
              items:
                type: object
            selected:
              type: array
              maxItems: 3
              items:
                type: object
            families:
              type: array
              items:
                type: string
            index:
              type: integer
              minimum: 0
              maximum: 3
            results:
              type: array
              maxItems: 3
              items:
                type: object
          required:
          - matrix
          - selected
          - families
          - index
          - results
          additionalProperties: false
        pending:
          type: boolean
inputs:
  invocation:
    type: Invocation
outputs:
  report:
    type: Report
    value:
      ref: flow.outputs.report
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
  publication:
    type: Publication
    value:
      ref: flow.outputs.publication
operations:
  prepare:
    inputs:
      invocation:
        type: Invocation
    outputs:
      state:
        type: CheckState
      context:
        type: Context
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_meta_skills_family_prepare
        operation: mathformer_meta_skills_family_prepare
  advance:
    inputs:
      state:
        type: CheckState
      invocation:
        type: Invocation
      context:
        type: Context
    outputs:
      state:
        type: CheckState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_meta_skills_family_advance
        operation: mathformer_meta_skills_family_advance
  finalize:
    inputs:
      state:
        type: CheckState
      invocation:
        type: Invocation
      context:
        type: Context
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_meta_skills_family_finalize
        operation: mathformer_meta_skills_family_finalize
  publish:
    inputs:
      report:
        type: Report
      invocation:
        type: Invocation
      context:
        type: Context
    outputs:
      exit_code:
        type: ExitCode
      publication:
        type: Publication
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_meta_skills_family_publish
        operation: mathformer_meta_skills_family_publish
  retain_empty:
    inputs:
      cursor:
        type: Cursor
      context:
        type: Context
    outputs:
      cursor:
        type: Cursor
      pending:
        type: Pending
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_meta_skills_family_retain_empty
        operation: mathformer_meta_skills_family_retain_empty
  pending:
    inputs:
      state:
        type: CheckState
      context:
        type: Context
    outputs:
      pending:
        type: Pending
      cursor:
        type: Cursor
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_meta_skills_family_pending
        operation: mathformer_meta_skills_family_pending
flow:
  kind: sequence
  steps:
  - id: prepare
    kind: call
    operation: prepare
    arguments:
      invocation:
        ref: inputs.invocation
  - id: initial_guard
    kind: call
    operation: pending
    arguments:
      state:
        ref: steps.prepare.outputs.state
      context:
        ref: steps.prepare.outputs.context
  - id: traverse
    kind: loop
    state_type: Cursor
    initial:
      ref: steps.initial_guard.outputs.cursor
    max_iterations: 3
    on_exhausted: fail
    description: One check per pending cursor; retain_empty carries zero checks without
      invoking run_check. The third advance normally stops after its false guard.
    body:
      kind: switch
      cases:
      - id: pending
        when:
          ref: loop.state.pending
        body:
          kind: sequence
          steps:
          - id: advance
            kind: call
            operation: advance
            arguments:
              state:
                ref: loop.state.state
              invocation:
                ref: inputs.invocation
              context:
                ref: steps.prepare.outputs.context
          - id: guard
            kind: call
            operation: pending
            arguments:
              state:
                ref: steps.advance.outputs.state
              context:
                ref: steps.prepare.outputs.context
          outputs:
            cursor:
              type: Cursor
              value:
                ref: steps.guard.outputs.cursor
            pending:
              type: Pending
              value:
                ref: steps.guard.outputs.pending
      default:
        kind: call
        operation: retain_empty
        arguments:
          cursor:
            ref: loop.state
          context:
            ref: steps.prepare.outputs.context
      outputs:
        cursor:
          type: Cursor
          value:
            ref: selected.outputs.cursor
        pending:
          type: Pending
          value:
            ref: selected.outputs.pending
    next_state:
      ref: body.outputs.cursor
    until:
      not:
        ref: body.outputs.pending
    outputs:
      state:
        type: CheckState
        value:
          ref: loop.state.state
  - id: finalize
    kind: call
    operation: finalize
    arguments:
      state:
        ref: steps.traverse.outputs.state
      invocation:
        ref: inputs.invocation
      context:
        ref: steps.prepare.outputs.context
  - id: publish
    kind: call
    operation: publish
    arguments:
      report:
        ref: steps.finalize.outputs.report
      invocation:
        ref: inputs.invocation
      context:
        ref: steps.prepare.outputs.context
  outputs:
    report:
      type: Report
      value:
        ref: steps.finalize.outputs.report
    exit_code:
      type: ExitCode
      value:
        ref: steps.publish.outputs.exit_code
    publication:
      type: Publication
      value:
        ref: steps.publish.outputs.publication
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 10
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked description; no scientific result, runtime qualification
    or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: tests/test_program/run_comprehensive_tests.py
    selector: run; main; enter_checks; prepare_checks; checks_pending; advance_check;
      finalize_checks; run_check; publish_report
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: tests/test_matrix.json
    selector: schema_version=2; module_family=meta_skills
    digest: sha256:17b2fc38f51c7711873b68dc5f630cfc0eb06351160ad6401ea67a6044ace322
  - path: tests/meta_skills/run_meta_skill_suite.py
    selector: run_suite; run_command
    digest: sha256:06c35f2abb57248a44871776621cfe6612c81e24ad802517780d88a29a8e9fab
  - path: scripts/mathformer.py
    selector: build_registry; run_action; run_leaf_action; audit_pack_sources
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mcp_server.py
    selector: register_meta_skills_family_tools; service write policy
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: service_coverage_report
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: scripts/comprehensive_strict_tools.py
    selector: source_runner
    digest: sha256:692874cb5a8c7869a675ee2fe16f2a3a88ab7be2dfe103a5c995217f372afecd
  - path: scripts/meta_skills_family_workflow_tools.py
    selector: register_meta_skills_family_tools
    digest: sha256:eb539435189d3e588d86fe61c6da9d8860198967c9e956d14717b95871474577
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: 'inventory: test:family:meta-skills authored contract'
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/mcp/run_meta_skills_family_workflow_tests.py
    selector: MetaSkillsFamilyTests
    digest: sha256:8de04aa5b7b453417823a639986d70f9860abf2a1d3988c5d08a7d8c3a21f64e
  - path: tests/mcp/fixtures/meta_skills_family_boundary.py
    selector: 'install; serve: isolated compiler/provider boundaries'
    digest: sha256:46f4f660375470201a4a23c02c027c35c9313e14ca95e91ac72bb5471f4970a9
  - path: tests/mcp/fixtures/meta_skills_family_original.py.txt
    selector: 'selected original execution source: run; main'
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  gaps:
  - Default-only specialization excludes dependency-map-only, changed-file selection,
    strict, matrix validation, JSONL and JUnit branches; the native entrypoint retains
    them.
  - Applicability requires 0..3 selected meta_skills rows. Preparation rejects larger
    selections before execution; the native loop has no iteration-exhaustion failure.
    retain_empty only carries the native zero-iteration state through the runtime
    loop.
  - Hub preflight/dry-run and its 900-second subprocess wrapper remain outside this
    runner graph. Service authorization and write roots apply to every block call.
    Native row timeouts and repository write audits remain inside run_check.
  - The 3600-second and 10-call limits are normalization metadata, not native execution
    timeouts. Network and external effects require qualification; Lunar supplies required
    execution receipts and digests.
extensions:
  mathformer.source:
    native_id: test:family:meta-skills
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: test:family:meta-skills
      summary: Run the comprehensive test matrix for the meta_skills module family.
      family: meta_skills
      kind: validation
      safety: writes_artifacts
      command:
      - '{python}'
      - tests/test_program/run_comprehensive_tests.py
      - --module-family
      - meta_skills
      - --json
      depends_on: []
      required_paths:
      - tests/test_program/run_comprehensive_tests.py
      - tests/test_matrix.json
      writes:
      - artifacts/
      allows_extra_args: false
      timeout_seconds: 900
  mathformer.native_boundary:
    execution: Hub CLI/NL dispatch run_action to dependency-free run_leaf_action;
      no DAG interpreter.
    failure_policy: Preflight failures and extra arguments reject; dry-run returns
      before execution.
    audit: Actual subprocess execution has a 900-second timeout and a repository-write
      audit.
    scientific_payloads: Runner report and process exit are distinct from the HubResult
      transport envelope.
    block_execution: Registered MCP ports call shared native runner functions. Preparation
      retains native parse_args defaults (run_id and output path) in a server-owned
      context; every following port requires this context and validates state/report
      assertions and phase. Publication returns native stdout alongside the exit code.
  mathformer.execution:
    context: prepare parses --module-family meta_skills --json once, calls enter_checks
      then prepare_checks, and returns an opaque handle required by later ports.
    empty_selection: A root loop carries Cursor(state,pending). Its empty branch invokes
      retain_empty without a native check or source write, preserving zero iterations.
      This avoids branch-local loop exhaustion unsupported by the current Lunar compiler.
    check_semantics: run_check retains row arguments, timeouts, expected exits, optional-dependency
      handling, write audits and output excerpts. Nonzero exits and timeouts accumulate
      failed results; uncaught launch errors abort. No retries.
    nested_suite: 'The suite remains a native subprocess: ten commands in order, no
      fail-fast; each uses 180 seconds under its enclosing 120-second matrix check.
      Uncaught launch errors/timeouts abort the suite process.'
    publication: finalize_checks writes artifacts/test_program/dependency_map.json;
      publish_report writes deterministic_tests.json, prints JSON, and returns 0 or
      3.
