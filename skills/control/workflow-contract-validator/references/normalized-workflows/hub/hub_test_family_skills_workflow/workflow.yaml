schema_version: workflow-skill/v1
namespace: mathformer
id: hub_test_family_skills_workflow
version: 1.0.0
kind: workflow
description: Skills native run() traversal and main() publication. Adapter cursors
  carry the native pending guard; a top-level bounded loop carries empty/snapshot
  paths without executing a check.
aliases:
- test:family:skills
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Args:
    schema:
      type: object
      properties:
        module_family:
          type: array
          const:
          - skills
        profile:
          type: string
          enum:
          - workstation
          - strict
          default: workstation
        run_id:
          type: string
        emit_dependency_map_only:
          type: boolean
        changed_files_only:
          type: boolean
        fail_on_warning:
          type: boolean
        validate_matrix:
          type: boolean
        output_file:
          type: string
        write_jsonl:
          type:
          - string
          - 'null'
        write_junit:
          type:
          - string
          - 'null'
        json:
          type: boolean
      required:
      - module_family
      - profile
      - run_id
      - emit_dependency_map_only
      - changed_files_only
      - fail_on_warning
      - validate_matrix
      - output_file
      - write_jsonl
      - write_junit
      - json
      additionalProperties: false
  SelectionBound:
    schema:
      type: integer
      const: 1000
  Boolean:
    schema:
      type: boolean
  CheckState:
    schema:
      type: object
      properties:
        matrix:
          type: array
          items:
            type: object
        selected:
          type: array
          maxItems: 1000
          items:
            type: object
        families:
          type: array
          items:
            type: string
        index:
          type: integer
          minimum: 0
          maximum: 1000
        results:
          type: array
          maxItems: 1000
          items:
            type: object
        pending:
          type: boolean
      required:
      - matrix
      - selected
      - families
      - index
      - results
      - pending
      additionalProperties: false
  Report:
    schema:
      type: object
      properties:
        run_id:
          type: string
        ok:
          type: boolean
        families:
          type: array
          items:
            type: string
        summary:
          type: object
        results:
          type: array
          items:
            type: object
        schema_errors:
          type: array
          items:
            type: string
        matrix_errors:
          type: array
          items:
            type: string
        capability_ledger:
          type: object
        dependency_map:
          type: string
      required:
      - run_id
      - ok
      - families
      - summary
      - results
      - schema_errors
      - matrix_errors
      additionalProperties: true
  ExitCode:
    schema:
      type: integer
      enum:
      - 0
      - 3
  Context:
    schema:
      type: object
      properties:
        handle:
          type: string
      required:
      - handle
      additionalProperties: false
  Publication:
    schema:
      type: object
      properties:
        stdout:
          type: string
        report_path:
          type: string
      required:
      - stdout
      - report_path
      additionalProperties: false
inputs:
  args:
    type: Args
  selection_bound:
    type: SelectionBound
outputs:
  report:
    type: Report
    value:
      ref: steps.finalize.outputs.report
  exit_code:
    type: ExitCode
    value:
      ref: steps.publish.outputs.exit_code
  publication:
    type: Publication
    value:
      ref: steps.publish.outputs.publication
operations:
  enter:
    inputs:
      args:
        type: Args
    outputs:
      snapshot_only:
        type: Boolean
      context:
        type: Context
      empty_state:
        type: CheckState
      empty_report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_enter
        operation: mathformer_skills_family_enter
  snapshot:
    inputs:
      args:
        type: Args
      context:
        type: Context
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_snapshot
        operation: mathformer_skills_family_snapshot
  prepare:
    inputs:
      args:
        type: Args
      selection_bound:
        type: SelectionBound
      context:
        type: Context
    outputs:
      state:
        type: CheckState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_prepare
        operation: mathformer_skills_family_prepare
  advance:
    inputs:
      state:
        type: CheckState
      args:
        type: Args
      context:
        type: Context
    outputs:
      state:
        type: CheckState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_advance
        operation: mathformer_skills_family_advance
  finalize:
    inputs:
      state:
        type: CheckState
      args:
        type: Args
      context:
        type: Context
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_finalize
        operation: mathformer_skills_family_finalize
  publish:
    inputs:
      report:
        type: Report
      args:
        type: Args
      context:
        type: Context
    outputs:
      exit_code:
        type: ExitCode
      publication:
        type: Publication
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_publish
        operation: mathformer_skills_family_publish
  retain_empty:
    inputs:
      state:
        type: CheckState
      context:
        type: Context
    outputs:
      state:
        type: CheckState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_retain_empty
        operation: mathformer_skills_family_retain_empty
  saved_report:
    inputs:
      report:
        type: Report
      context:
        type: Context
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_family_saved_report
        operation: mathformer_skills_family_saved_report
flow:
  kind: sequence
  steps:
  - id: enter
    kind: call
    operation: enter
    arguments:
      args:
        ref: inputs.args
  - id: dispatch
    kind: switch
    cases:
    - id: snapshot_only
      when:
        ref: steps.enter.outputs.snapshot_only
      body:
        kind: sequence
        steps:
        - id: snapshot
          kind: call
          operation: snapshot
          arguments:
            args:
              ref: inputs.args
            context:
              ref: steps.enter.outputs.context
        outputs:
          state:
            type: CheckState
            value:
              ref: steps.enter.outputs.empty_state
          report:
            type: Report
            value:
              ref: steps.snapshot.outputs.report
    default:
      kind: sequence
      steps:
      - id: prepare
        kind: call
        operation: prepare
        arguments:
          args:
            ref: inputs.args
          selection_bound:
            ref: inputs.selection_bound
          context:
            ref: steps.enter.outputs.context
      outputs:
        state:
          type: CheckState
          value:
            ref: steps.prepare.outputs.state
        report:
          type: Report
          value:
            ref: steps.enter.outputs.empty_report
    outputs:
      state:
        type: CheckState
        value:
          ref: selected.outputs.state
      report:
        type: Report
        value:
          ref: selected.outputs.report
  - id: checks
    kind: loop
    state_type: CheckState
    initial:
      ref: steps.dispatch.outputs.state
    max_iterations: 1000
    on_exhausted: fail
    body:
      kind: switch
      cases:
      - id: pending
        when:
          ref: loop.state.pending
        body:
          kind: call
          operation: advance
          arguments:
            state:
              ref: loop.state
            args:
              ref: inputs.args
            context:
              ref: steps.enter.outputs.context
      default:
        kind: call
        operation: retain_empty
        arguments:
          state:
            ref: loop.state
          context:
            ref: steps.enter.outputs.context
      outputs:
        state:
          type: CheckState
          value:
            ref: selected.outputs.state
    next_state:
      ref: body.outputs.state
    until:
      not:
        ref: body.outputs.state.pending
    outputs:
      state:
        type: CheckState
        value:
          ref: loop.state
  - id: finalize
    kind: switch
    cases:
    - id: snapshot
      when:
        ref: steps.enter.outputs.snapshot_only
      body:
        kind: call
        operation: saved_report
        arguments:
          report:
            ref: steps.dispatch.outputs.report
          context:
            ref: steps.enter.outputs.context
    default:
      kind: call
      operation: finalize
      arguments:
        state:
          ref: steps.checks.outputs.state
        args:
          ref: inputs.args
        context:
          ref: steps.enter.outputs.context
    outputs:
      report:
        type: Report
        value:
          ref: selected.outputs.report
  - id: publish
    kind: call
    operation: publish
    arguments:
      report:
        ref: steps.finalize.outputs.report
      args:
        ref: inputs.args
      context:
        ref: steps.enter.outputs.context
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 2005
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked test orchestration only; no scientific truth or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: tests/test_program/run_comprehensive_tests.py
    selector: run; enter_checks; snapshot_report; prepare_checks; checks_pending;
      advance_check; finalize_checks; main; publish_report
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: scripts/mathformer.py
    selector: build_registry; run_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/skills_family_workflow_tools.py
    selector: register_skills_family_tools
    digest: sha256:f038d9becf7c7ed0f8075652b913c2654583a29db08f7b3e2ffa3cdb8266016d
  - path: scripts/mcp_server.py
    selector: register_skills_family_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: service_coverage_report
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: scripts/comprehensive_strict_tools.py
    selector: source_runner
    digest: sha256:692874cb5a8c7869a675ee2fe16f2a3a88ab7be2dfe103a5c995217f372afecd
  - path: tests/mcp/run_skills_family_workflow_tests.py
    selector: SkillsFamilyTests
    digest: sha256:1068383b8fbcf4138788181181289273236f6fe01151b73e97a57e7a03093026
  - path: tests/mcp/fixtures/skills_family_original.py.txt
    selector: original run; main
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: tests/mcp/fixtures/comprehensive_workflow_boundary.py
    selector: install; serve
    digest: sha256:b21352e7b0f9e6e7439d058573e75457f0485f5fd9b65d9002b6801b7cea33d7
  - path: tests/mcp/fixtures/comprehensive_strict_boundary.py
    selector: install
    digest: sha256:7ef72487cc2ff1b63f167a1d1c5ccbfec5b5dc3bc300c597253f14b066591bd3
  gaps:
  - Payload schemas abbreviate native row/result internals; native operations own
    logs, timing and helper details.
  - Specialization supports at most 1000 selected rows; admission rejects larger selections.
    Native traversal has no fixed cap. Final row exits normally at the bound.
  - The 3600s and 2005-call limits are descriptor budgets, not native runner-wide
    limits.
  - Hub subprocess controls remain owned by the native hub; block tools use service
    authorization, write-root checks and server-owned arguments/state. Network and
    external effects remain unqualified.
extensions:
  mathformer.source:
    category: hub
    native_id: test:family:skills
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: test:family:skills
      family: skills
      kind: validation
      safety: writes_artifacts
      depends_on: []
      allows_extra_args: false
      timeout_seconds: 900
  mathformer.native_boundary:
    execution: Native hub retains preflight, dry-run, 900s subprocess timeout and
      write audit. Direct block tools invoke shared source steps with server-owned
      state and service write authorization.
    invocation: Python run_comprehensive_tests.py --module-family skills --json; default
      workstation profile; extra arguments rejected.
    scope: Graph models run() plus main() publication; direct runner flags remain
      typed for source branches, but hub does not expose them.
    qualification_capability_names_are_not_runtime_grants: true
    cursor: Native cursor fields are preserved; pending is the last native checks_pending
      result. Synthetic empty carriers exist only to traverse PRISM without running
      prepare, advance or finalize on the snapshot branch.
  mathformer.step_semantics:
    enter: Call enter_checks once; retain typed CLI arguments and return native branch
      plus server context. Empty state/report are transport carriers used only by
      the unselected traversal path.
    snapshot: Call snapshot_report once, writing the native dependency snapshot and
      retaining the report for publication.
    prepare: Call prepare_checks and the initial checks_pending guard. Assert at most
      selection_bound rows, retain native matrix order and server-owned state; pending
      is the adapter guard field.
    advance: Call advance_check once then checks_pending. Strip the adapter pending
      field before the native call and restore its boolean output. Failures and timeouts
      remain result data; unexpected exceptions invalidate the context and propagate.
    finalize: Strip adapter pending, require the consumed server-owned cursor, call
      finalize_checks and retain the report.
    publish: Call publish_report once; preserve JSON, optional JSONL/JUnit and CLI
      output ordering. Return stdout explicitly to protect MCP framing, with the native
      0/3 exit code.
    retain_empty: Identity carrier for empty and snapshot paths through the at-least-once
      bounded PRISM loop; never executes a native check.
    saved_report: Forward the server-owned early snapshot report without calling finalize_checks.
