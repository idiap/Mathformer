schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lean_foundation_surface_design_workflow
version: 1.0.0
kind: workflow
description: Single-pass native foundation surface planning, self-test assertions,
  and conditional JSON publication through shared callable MCP steps.
aliases:
- physics-lean:foundation-surface-design
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Argv:
    schema:
      type: array
      items:
        type: string
    representation: value
  Arguments:
    schema:
      type: object
      properties:
        object_packet:
          type:
          - string
          - 'null'
        output:
          type:
          - string
          - 'null'
        self_test:
          type: boolean
        json:
          type: boolean
        halted:
          type: boolean
        help_text:
          type: string
      required:
      - object_packet
      - output
      - self_test
      - json
      - halted
      - help_text
      additionalProperties: false
    representation: value
  Packet:
    schema:
      description: Raw json.loads result, or {} when no packet path; malformed shapes
        are not repaired and may fail in build_plan.
    representation: value
  Surfaces:
    schema:
      type: array
      items:
        type: object
        properties:
          object_id:
            type: string
          module_path:
            type: string
          state:
            enum:
            - candidate_generated
            - mathlib_reused
          surface_kind:
            enum:
            - thin_bridge
            - mathlib_reexport_surface
          recursive_frontier:
            type: array
            items:
              type: object
        required:
        - object_id
        - module_path
        - state
        - surface_kind
        - recursive_frontier
    representation: value
  Modules:
    schema:
      type: array
      items:
        type: string
      uniqueItems: true
    representation: value
  Plan:
    schema:
      type:
      - object
      - 'null'
      properties:
        style:
          const: physics_foundation_surface_plan
        surface_count:
          type: integer
          minimum: 0
        surfaces:
          type: array
          items:
            type: object
        recursive_frontier_count:
          type: integer
          minimum: 0
        recursive_frontier:
          type: array
          items:
            type: object
        recursive_policy:
          type: object
        accepted_index:
          const: libraries/MathformerPhysicsLib/Lean/Foundations.lean
        accepted_index_imports:
          type: array
          items:
            type: string
        source_packet_id: {}
        terminal_state:
          enum:
          - surface_plan_complete
          - no_surfaces
      required:
      - style
      - surface_count
      - surfaces
      - recursive_frontier_count
      - recursive_frontier
      - recursive_policy
      - accepted_index
      - accepted_index_imports
      - source_packet_id
      - terminal_state
    representation: value
  JsonText:
    schema:
      type: string
    representation: value
    media_type: application/json
  ExitCode:
    schema:
      type: integer
      const: 0
    representation: value
  Context:
    schema:
      type: object
      properties:
        working_directory:
          type: string
        program_name:
          type: string
        allow_mutating:
          type: boolean
      required:
      - working_directory
      - program_name
      - allow_mutating
      additionalProperties: false
    representation: value
  Text:
    schema:
      type: string
    representation: value
inputs:
  argv:
    type: Argv
  context:
    type: Context
outputs:
  plan:
    type: Plan
    value:
      ref: flow.outputs.plan
  json_text:
    type: JsonText
    value:
      ref: flow.outputs.json_text
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
  stdout:
    type: Text
    value:
      ref: flow.outputs.stdout
operations:
  parse:
    inputs:
      argv:
        type: Argv
      context:
        type: Context
    outputs:
      args:
        type: Arguments
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_parse
        operation: mathformer_foundation_surface_parse
  fixture:
    inputs: {}
    outputs:
      packet:
        type: Packet
      packet_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_fixture
        operation: mathformer_foundation_surface_fixture
  load:
    inputs:
      args:
        type: Arguments
      context:
        type: Context
    outputs:
      packet:
        type: Packet
      packet_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_load
        operation: mathformer_foundation_surface_load
  design:
    inputs:
      packet:
        type: Packet
      packet_json:
        type: Text
    outputs:
      surfaces:
        type: Surfaces
      surfaces_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_design
        operation: mathformer_foundation_surface_design
  modules:
    inputs:
      surfaces:
        type: Surfaces
    outputs:
      modules:
        type: Modules
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_modules
        operation: mathformer_foundation_surface_modules
  assemble:
    inputs:
      packet:
        type: Packet
      surfaces:
        type: Surfaces
      modules:
        type: Modules
      packet_json:
        type: Text
      surfaces_json:
        type: Text
    outputs:
      plan:
        type: Plan
      plan_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_assemble
        operation: mathformer_foundation_surface_assemble
  check_self_test:
    inputs:
      args:
        type: Arguments
      plan:
        type: Plan
      plan_json:
        type: Text
    outputs:
      plan:
        type: Plan
      plan_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_check_self_test
        operation: mathformer_foundation_surface_check_self_test
  emit:
    inputs:
      args:
        type: Arguments
      plan:
        type: Plan
      context:
        type: Context
      plan_json:
        type: Text
    outputs:
      json_text:
        type: JsonText
      exit_code:
        type: ExitCode
      stdout:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_emit
        operation: mathformer_foundation_surface_emit
  help:
    inputs:
      args:
        type: Arguments
    outputs:
      plan:
        type: Plan
      json_text:
        type: JsonText
      exit_code:
        type: ExitCode
      stdout:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_foundation_surface_help
        operation: mathformer_foundation_surface_help
flow:
  kind: sequence
  steps:
  - id: parse
    kind: call
    operation: parse
    arguments:
      argv:
        ref: inputs.argv
      context:
        ref: inputs.context
  - id: run
    kind: switch
    cases:
    - id: help
      when:
        ref: steps.parse.outputs.args.halted
      body:
        kind: call
        operation: help
        arguments:
          args:
            ref: steps.parse.outputs.args
    default:
      kind: sequence
      steps:
      - id: packet
        kind: switch
        cases:
        - id: self_test
          when:
            ref: steps.parse.outputs.args.self_test
          body:
            kind: call
            operation: fixture
            arguments: {}
        default:
          kind: call
          operation: load
          arguments:
            args:
              ref: steps.parse.outputs.args
            context:
              ref: inputs.context
        outputs:
          packet:
            type: Packet
            value:
              ref: selected.outputs.packet
          packet_json:
            type: Text
            value:
              ref: selected.outputs.packet_json
      - id: design
        kind: call
        operation: design
        arguments:
          packet:
            ref: steps.packet.outputs.packet
          packet_json:
            ref: steps.packet.outputs.packet_json
      - id: modules
        kind: call
        operation: modules
        arguments:
          surfaces:
            ref: steps.design.outputs.surfaces
      - id: assemble
        kind: call
        operation: assemble
        arguments:
          packet:
            ref: steps.packet.outputs.packet
          surfaces:
            ref: steps.design.outputs.surfaces
          modules:
            ref: steps.modules.outputs.modules
          packet_json:
            ref: steps.packet.outputs.packet_json
          surfaces_json:
            ref: steps.design.outputs.surfaces_json
      - id: self_test_assertions
        kind: call
        operation: check_self_test
        arguments:
          args:
            ref: steps.parse.outputs.args
          plan:
            ref: steps.assemble.outputs.plan
          plan_json:
            ref: steps.assemble.outputs.plan_json
      - id: emit
        kind: call
        operation: emit
        arguments:
          args:
            ref: steps.parse.outputs.args
          plan:
            ref: steps.self_test_assertions.outputs.plan
          plan_json:
            ref: steps.self_test_assertions.outputs.plan_json
          context:
            ref: inputs.context
      outputs:
        plan:
          type: Plan
          value:
            ref: steps.self_test_assertions.outputs.plan
        json_text:
          type: JsonText
          value:
            ref: steps.emit.outputs.json_text
        exit_code:
          type: ExitCode
          value:
            ref: steps.emit.outputs.exit_code
        stdout:
          type: Text
          value:
            ref: steps.emit.outputs.stdout
    outputs:
      plan:
        type: Plan
        value:
          ref: selected.outputs.plan
      json_text:
        type: JsonText
        value:
          ref: selected.outputs.json_text
      exit_code:
        type: ExitCode
        value:
          ref: selected.outputs.exit_code
      stdout:
        type: Text
        value:
          ref: selected.outputs.stdout
  outputs:
    plan:
      type: Plan
      value:
        ref: steps.run.outputs.plan
    json_text:
      type: JsonText
      value:
        ref: steps.run.outputs.json_text
    exit_code:
      type: ExitCode
      value:
        ref: steps.run.outputs.exit_code
    stdout:
      type: Text
      value:
        ref: steps.run.outputs.stdout
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - native_runtime_outputs
      - artifacts/mathformerphysicslib/foundations/
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - design_surface_plan
    - write_requested_output
    - print_plan
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
    - promote_foundation_surface
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 7
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Planning metadata only; emitted gates, recursive policies and rerun
    instructions do not execute checks, prove results, or promote surfaces.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/mathformerphysicslib/mathformerphysicslib-foundation-surface-designer/scripts/design_foundation_surfaces.py
    selector: main (delegates to build_plan and design_surface)
    digest: sha256:6329cbe02aa2b82d7b378edaa21ee20b4209e06741594e15c4ee548e4dcda9d5
  - path: scripts/mathformer.py
    selector: build_registry/action:physics-lean:foundation-surface-design; run_action;
      run_leaf_action; preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/foundation_surface_tools.py
    selector: Callable shared-step binding, registration, service inventory, or native
      generator adoption
    digest: sha256:483466c63053b8f35e41a07d74d5da67feff0ce9778d856d0fa0966c8d0d1f2b
  - path: scripts/mcp_server.py
    selector: Callable shared-step binding, registration, service inventory, or native
      generator adoption
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/mathformer_mcp_service.py
    selector: Callable shared-step binding, registration, service inventory, or native
      generator adoption
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: Callable shared-step binding, registration, service inventory, or native
      generator adoption
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - The selected Python main is expanded; outer hub preflight, dry-run, subprocess
    capture and write auditing remain an external boundary. MCP output writes require
    per-call permission within service write roots.
  - Finite input and ladder traversals remain inside their owning native operations.
    There is no object-count cap, graph repair, convergence, promotion, checkpoint
    or native exhaustion outcome.
  - The native action has no timeout or retries. Lunar enforces the retained 3600-second
    and seven-operation budgets, one attempt, and required runtime receipts.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lean:foundation-surface-design
    owner_skill: skills/mathformerphysicslib/mathformerphysicslib-foundation-surface-designer/SKILL.md
    contract:
      id: physics-lean:foundation-surface-design
      summary: Design Mathlib-first MathformerPhysicsLib foundation surfaces from
        an object packet.
      family: physics_lean
      kind: validation
      safety: writes_artifacts
      command:
      - '{python}'
      - skills/mathformerphysicslib/mathformerphysicslib-foundation-surface-designer/scripts/design_foundation_surfaces.py
      depends_on: []
      required_paths:
      - skills/mathformerphysicslib/mathformerphysicslib-foundation-surface-designer/scripts/design_foundation_surfaces.py
      required_tools: []
      optional_tools: []
      writes:
      - artifacts/mathformerphysicslib/foundations/
      allows_extra_args: true
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: Callable MCP tools share all source steps with main/build_plan. The
      existing hub controller retains preflight, dry-run, subprocess execution and
      write auditing for whole-action dispatch.
    context_fields:
    - working_directory
    - program_name
    - allow_mutating
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Keep preflight, subprocess failure and write-audit failures unsuccessful;
      never turn them into acceptance.
    scientific_payloads: Plan/json_text describe planner values, not the HubResult
      transport envelope. Direct callers may use build_plan without CLI emission.
    observability: Native stdout is returned verbatim and mirrored to stderr to protect
      MCP framing. Checked JSON text companions retain insertion order through canonicalizing
      transports. CLI main keeps native stdout and exception behavior.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    extra_args_for_sequence: native per-action policy
    modeling: Dependency-free Python leaf expanded into shared source steps; hub controller
      behavior remains an external execution boundary.
  mathformer.design:
    source_selector: build_plan; module_for; design_surface
    default_module: Contexts
    module_path_fallback: MODULES[Contexts], without rewriting the requested foundation_module
      or bridge decision
    bridge_modules:
    - Units
    - Laws
    - Contexts
    - VectorCalculus
    - HilbertSpace
    - UnboundedOperators
    - PositionMomentumModels
    bridge_result:
    - candidate_generated
    - thin_bridge
    other_result:
    - mathlib_reused
    - mathlib_reexport_surface
    declaration_selection: DECLARATIONS[str(item.get('object_id'))] or [object_id.replace('.',
      '_')]
    ladder_selection: PROMOTION_LADDERS[object_id] or DEFAULT_PROMOTION_LADDER
    frontier_selection: Only ladder steps with status == open_recursive_frontier become
      records; preserve level/name/gate and source-owned owner_skill/action.
    bounds: One pass over the supplied objects, then finite traversals of surfaces
      and selected ladders; no explicit object-count bound. Accumulators are surfaces,
      unique module paths, and flattened frontier, not repair or promotion state.
  mathformer.self_test:
    packet:
      packet_id: self_test
      objects:
      - object_id: vector_field.real.euclidean3
        object_class: vector_field
        display_name: Real vector field
        foundation_module: Fields
        mathlib_search_terms:
        - EuclideanSpace
        - Fin
# REUSE-IgnoreEnd
