schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_ir_build_workflow
version: 1.0.0
kind: workflow
description: Source-level main flow building a physics IR report from one JSON source
  record.
aliases:
- physics:ir-build
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Arguments:
    schema:
      type: array
      items:
        type: string
  BuildInput:
    schema:
      type: object
      required:
      - record
      - case_id
      - steps
      - projection_bridges
      - output
      - write_output
      - json_output
      - halted
      - stdout
      properties:
        record:
          type: object
        case_id:
          type: string
        steps: {}
        projection_bridges: {}
        output:
          type:
          - string
          - 'null'
        write_output:
          type: boolean
        json_output:
          type: boolean
        halted:
          type: boolean
        stdout:
          type: string
      description: Parsed arguments and selected converter inputs; malformed source
        shapes fail natively.
  PhysicsIR:
    schema:
      type: object
      description: Semantic value of PhysicsDerivationIR; dataclass conversion remains
        native.
      required:
      - case_id
      - source_digest
      - obligations
      - quantities
      - schema_version
      properties:
        case_id:
          type: string
        source_digest:
          type: string
        obligations:
          type: array
          items:
            type: object
        quantities:
          type: array
          items:
            type: object
        schema_version:
          type: integer
  Errors:
    schema:
      type: array
      items:
        type: string
  Report:
    schema:
      type:
      - object
      - 'null'
      required:
      - schema_version
      - style
      - ok
      - artifact_status
      - blockers
      - physics_ir
      - physics_ir_digest
      properties:
        schema_version:
          const: 1
        style:
          const: physics_ir_build_report
        ok:
          type: boolean
        artifact_status:
          enum:
          - candidate
          - blocked
        blockers:
          type: array
          items:
            type: string
        physics_ir:
          type: object
        physics_ir_digest:
          type: string
      description: Native report; null only on argparse help termination before reading
        a record.
  Completion:
    schema:
      type: object
      required:
      - stdout
      - exit_code
      properties:
        stdout:
          type: string
        exit_code:
          enum:
          - 0
          - 3
  Context:
    schema:
      type: object
      required:
      - working_directory
      - allow_mutating
      properties:
        working_directory:
          type: string
        allow_mutating:
          type: boolean
        program_name:
          type: string
      additionalProperties: false
inputs:
  argv:
    type: Arguments
  context:
    type: Context
outputs:
  report:
    type: Report
    value:
      ref: flow.outputs.report
  completion:
    type: Completion
    value:
      ref: flow.outputs.completion
operations:
  load:
    inputs:
      argv:
        type: Arguments
      context:
        type: Context
    outputs:
      request:
        type: BuildInput
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_load
        operation: mathformer_physics_ir_load
  convert:
    inputs:
      request:
        type: BuildInput
    outputs:
      ir:
        type: PhysicsIR
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_convert
        operation: mathformer_physics_ir_convert
  validate:
    inputs:
      ir:
        type: PhysicsIR
    outputs:
      errors:
        type: Errors
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_validate
        operation: mathformer_physics_ir_validate
  package:
    inputs:
      ir:
        type: PhysicsIR
      errors:
        type: Errors
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_package
        operation: mathformer_physics_ir_package
  write:
    inputs:
      request:
        type: BuildInput
      report:
        type: Report
      context:
        type: Context
    outputs: {}
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_write
        operation: mathformer_physics_ir_write
    effects:
      filesystem:
        read: []
        write:
        - selected_output_path
      network: []
      external_write: []
  emit:
    inputs:
      request:
        type: BuildInput
      report:
        type: Report
    outputs:
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_emit
        operation: mathformer_physics_ir_emit
  help:
    inputs:
      request:
        type: BuildInput
    outputs:
      report:
        type: Report
      completion:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_ir_help
        operation: mathformer_physics_ir_help
flow:
  kind: sequence
  steps:
  - id: load
    kind: call
    operation: load
    arguments:
      argv:
        ref: inputs.argv
      context:
        ref: inputs.context
  - id: dispatch
    kind: switch
    cases:
    - id: help_requested
      when:
        ref: steps.load.outputs.request.halted
      body:
        kind: call
        operation: help
        arguments:
          request:
            ref: steps.load.outputs.request
    default:
      kind: sequence
      steps:
      - id: convert
        kind: call
        operation: convert
        arguments:
          request:
            ref: steps.load.outputs.request
      - id: validate
        kind: call
        operation: validate
        arguments:
          ir:
            ref: steps.convert.outputs.ir
      - id: package
        kind: call
        operation: package
        arguments:
          ir:
            ref: steps.convert.outputs.ir
          errors:
            ref: steps.validate.outputs.errors
      - id: deliver
        kind: switch
        cases:
        - id: output_requested
          when:
            ref: steps.load.outputs.request.write_output
          body:
            kind: sequence
            steps:
            - id: write
              kind: call
              operation: write
              arguments:
                request:
                  ref: steps.load.outputs.request
                report:
                  ref: steps.package.outputs.report
                context:
                  ref: inputs.context
            - id: emit_after_write
              kind: call
              operation: emit
              arguments:
                request:
                  ref: steps.load.outputs.request
                report:
                  ref: steps.package.outputs.report
            outputs:
              completion:
                type: Completion
                value:
                  ref: steps.emit_after_write.outputs.completion
        default:
          kind: call
          operation: emit
          arguments:
            request:
              ref: steps.load.outputs.request
            report:
              ref: steps.package.outputs.report
        outputs:
          completion:
            type: Completion
            value:
              ref: selected.outputs.completion
      outputs:
        report:
          type: Report
          value:
            ref: steps.package.outputs.report
        completion:
          type: Completion
          value:
            ref: steps.deliver.outputs.completion
    outputs:
      report:
        type: Report
        value:
          ref: selected.outputs.report
      completion:
        type: Completion
        value:
          ref: selected.outputs.completion
  outputs:
    report:
      type: Report
      value:
        ref: steps.dispatch.outputs.report
    completion:
      type: Completion
      value:
        ref: steps.dispatch.outputs.completion
policy:
  effects:
    filesystem:
      read:
      - selected_source_record
      write:
      - selected_output_path
    network: []
    external_write: []
  authority:
    allowed:
    - build_candidate_ir
    - validate_ir_structure
    - write_requested_report
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
    - promote_candidate
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 6
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Structural validation yields candidate or blocked reports, never
    a proof or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: complete
  sources:
  - path: scripts/physics_ir.py
    selector: main
    digest: sha256:e4fce119a4cfafdb38a6c5bd077d14385797a08ea0b523c20afe7f443c920445
  - path: libraries/MathformerPhysicsLib/physics_ir.py
    selector: from_case_spec; validate_ir; stable_digest; PhysicsDerivationIR
    digest: sha256:875d922159c63a2b2c6daa0967deb96dae577854e3f25b0be9fbbe2f703648b4
  - path: scripts/mathformer.py
    selector: build_registry/action:physics:ir-build; run_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mcp_server.py
    selector: mathformer_run_workflow
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/physics_ir_tools.py
    selector: register_physics_ir_tools; working_directory
    digest: sha256:7de6098ae03b13470f868cef73a8f75c9ea0cd27fe213fe808dbbd9e33d9458b
  gaps: []
extensions:
  mathformer.source:
    category: hub
    native_id: physics:ir-build
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics:ir-build
      family: physics_sympy
      kind: generation
      safety: writes_artifacts
      depends_on: []
      allows_extra_args: true
      timeout_seconds: null
  mathformer.native_boundary:
    execution: MCP step tools reuse the helpers called by scripts/physics_ir.py::main.
      Native hub dispatch remains available separately with its preflight, dry-run,
      subprocess and write audit controls.
    failure_policy: Argparse help returns null report and exit 0 before any read.
      Invalid arguments fail the load call with diagnostics. Read, conversion, serialization
      and I/O failures propagate without retry. Validation errors still emit a report
      with completion exit_code 3.
    output_paths: Context supplies an absolute existing working_directory for relative
      source/output paths; program_name optionally preserves argv[0] in argparse diagnostics.
      Writes require allow_mutating, service write authorization and an allowed resolved
      output path.
    limits: Native collection traversal finishes at input exhaustion; assumption slug
      suffixes cap at 80 characters. There are no native retries or timeouts. Lunar
      enforces the retained 3600-second and six-operation-call ceilings. Help takes
      two calls, ordinary runs five, output runs six.
    observability: Native stdout is mirrored to MCP stderr and returned exactly in
      completion; native report bytes and digests are preserved. Lunar supplies step
      receipts, effect records and replay artifacts.
    transport: JSON dataclass transport restores PhysicsDerivationIR for native validate/package;
      it does not rerun from_case_spec. Native tuple collections serialize as JSON
      arrays.
# REUSE-IgnoreEnd
