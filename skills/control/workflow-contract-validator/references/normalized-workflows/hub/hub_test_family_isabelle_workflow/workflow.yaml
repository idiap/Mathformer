schema_version: workflow-skill/v1
namespace: mathformer
id: hub_test_family_isabelle_workflow
version: 1.0.0
kind: workflow
description: 'Default Isabelle hub command: prepare, traverse matrix rows in order,
  finalize, then publish.'
aliases:
- test:family:isabelle
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  SelectionScope:
    schema:
      type: object
      required:
      - max_selected_checks
      properties:
        max_selected_checks:
          const: 5
      additionalProperties: false
      description: 'Domain declaration, not a CLI argument: the canonical matrix selects
        at most five Isabelle rows. Native argv is --module-family isabelle --json
        with other defaults.'
  CheckState:
    schema:
      type: object
      required:
      - args
      - matrix
      - selected
      - families
      - index
      - results
      properties:
        args:
          type: object
          description: Retained native parse_args result, including generated run_id
            and default output path.
        matrix:
          type: array
          items:
            type: object
        selected:
          type: array
          maxItems: 5
          items:
            type: object
        families:
          type: array
          items:
            type: string
        index:
          type: integer
          minimum: 0
          maximum: 5
        results:
          type: array
          maxItems: 5
          items:
            type: object
      additionalProperties: false
      description: Cursor plus invocation context; index equals result count; selected
        is the ordered Isabelle subsequence of matrix.
  Boolean:
    schema:
      type: boolean
  Report:
    schema:
      type: object
      required:
      - run_id
      - ok
      - profile
      - families
      - summary
      - results
      - schema_errors
      - matrix_errors
      - capability_ledger
      - dependency_map
      properties:
        run_id:
          type: string
        ok:
          type: boolean
        profile:
          const: workstation
        families:
          type: array
          items:
            type: string
        summary:
          type: object
        results:
          type: array
          items:
            type: object
        schema_errors:
          type: array
        matrix_errors:
          type: array
        capability_ledger:
          type: object
        dependency_map:
          type: string
  Publication:
    schema:
      type: object
      required:
      - report_path
      - exit_code
      - stdout
      properties:
        report_path:
          type: string
        exit_code:
          enum:
          - 0
          - 3
        stdout:
          type: string
      additionalProperties: false
  InvocationContext:
    schema:
      type: object
      required:
      - handle
      properties:
        handle:
          type: string
      additionalProperties: false
inputs:
  scope:
    type: SelectionScope
outputs:
  report:
    type: Report
    value:
      ref: flow.outputs.report
  publication:
    type: Publication
    value:
      ref: flow.outputs.publication
operations:
  prepare:
    inputs:
      scope:
        type: SelectionScope
    outputs:
      state:
        type: CheckState
      context:
        type: InvocationContext
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_isabelle_family_prepare
        operation: mathformer_isabelle_family_prepare
  pending:
    inputs:
      state:
        type: CheckState
      context:
        type: InvocationContext
    outputs:
      pending:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_isabelle_family_pending
        operation: mathformer_isabelle_family_pending
  advance:
    inputs:
      state:
        type: CheckState
      context:
        type: InvocationContext
    outputs:
      state:
        type: CheckState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_isabelle_family_advance
        operation: mathformer_isabelle_family_advance
  finalize:
    inputs:
      state:
        type: CheckState
      context:
        type: InvocationContext
    outputs:
      report:
        type: Report
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_isabelle_family_finalize
        operation: mathformer_isabelle_family_finalize
  publish:
    inputs:
      state:
        type: CheckState
      report:
        type: Report
      context:
        type: InvocationContext
    outputs:
      publication:
        type: Publication
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_isabelle_family_publish
        operation: mathformer_isabelle_family_publish
  retain_empty:
    inputs:
      state:
        type: CheckState
      context:
        type: InvocationContext
    outputs:
      state:
        type: CheckState
      pending:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_isabelle_family_retain_empty
        operation: mathformer_isabelle_family_retain_empty
flow:
  kind: sequence
  steps:
  - id: prepare
    kind: call
    operation: prepare
    arguments:
      scope:
        ref: inputs.scope
  - id: inspect
    kind: call
    operation: pending
    arguments:
      state:
        ref: steps.prepare.outputs.state
      context:
        ref: steps.prepare.outputs.context
  - kind: loop
    state_type: CheckState
    initial:
      ref: steps.prepare.outputs.state
    body:
      kind: switch
      cases:
      - id: empty
        when:
          not:
            ref: steps.inspect.outputs.pending
        body:
          kind: call
          operation: retain_empty
          arguments:
            state:
              ref: loop.state
            context:
              ref: steps.prepare.outputs.context
      default:
        kind: sequence
        steps:
        - id: advance_one
          kind: call
          operation: advance
          arguments:
            state:
              ref: loop.state
            context:
              ref: steps.prepare.outputs.context
        - id: inspect_next
          kind: call
          operation: pending
          arguments:
            state:
              ref: steps.advance_one.outputs.state
            context:
              ref: steps.prepare.outputs.context
        outputs:
          state:
            type: CheckState
            value:
              ref: steps.advance_one.outputs.state
          pending:
            type: Boolean
            value:
              ref: steps.inspect_next.outputs.pending
      outputs:
        state:
          type: CheckState
          value:
            ref: selected.outputs.state
        pending:
          type: Boolean
          value:
            ref: selected.outputs.pending
    next_state:
      ref: body.outputs.state
    until:
      not:
        ref: body.outputs.pending
    max_iterations: 5
    on_exhausted: fail
    outputs:
      state:
        type: CheckState
        value:
          ref: loop.state
    id: traverse
  - id: finalize
    kind: call
    operation: finalize
    arguments:
      state:
        ref: steps.traverse.outputs.state
      context:
        ref: steps.prepare.outputs.context
  - id: publish
    kind: call
    operation: publish
    arguments:
      state:
        ref: steps.traverse.outputs.state
      report:
        ref: steps.finalize.outputs.report
      context:
        ref: steps.prepare.outputs.context
  outputs:
    report:
      type: Report
      value:
        ref: steps.finalize.outputs.report
    publication:
      type: Publication
      value:
        ref: steps.publish.outputs.publication
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 900
    max_operation_calls: 14
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Completion establishes test execution and native exit status, neither
    scientific truth nor runtime qualification beyond the exercised environment.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: tests/test_program/run_comprehensive_tests.py
    selector: run
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: tests/test_program/run_comprehensive_tests.py
    selector: prepare_checks; advance_check; run_check; finalize_checks; parse_args;
      main; publish_report
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: scripts/mathformer.py
    selector: build_registry/action:test:family:isabelle; run_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: tests/test_matrix.json
    selector: module_family == isabelle, matrix order
    digest: sha256:17b2fc38f51c7711873b68dc5f630cfc0eb06351160ad6401ea67a6044ace322
  - path: scripts/comprehensive_strict_tools.py
    digest: sha256:692874cb5a8c7869a675ee2fe16f2a3a88ab7be2dfe103a5c995217f372afecd
  - path: scripts/isabelle_family_workflow_tools.py
    digest: sha256:39e5736c8440cd411f8b57047e46d2b40d25fb5fd9a26c42bc5bec60566aec2b
  - path: scripts/mcp_server.py
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: scripts/mathformer_mcp_service.py
    digest: sha256:ff2a57a3dc268e73d31e34605d80a65a5bdc6e16e28ad41af5752ad8bae60164
  - path: tests/mcp/run_isabelle_family_workflow_tests.py
    digest: sha256:d201f16ab10c4846fb09cb79b2b8f7ff2132e47f094f39ccdd23908efeda2e5c
  - path: tests/mcp/fixtures/isabelle_family_original.py.txt
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  gaps:
  - Specialized to the registered default workstation invocation and canonical selections
    of zero through five rows. The input scope declares this domain, not a native
    CLI option. Larger selections require revising the bound.
  - Direct-run dependency-map-only, changed-file, matrix-validation and strict-profile
    branches are excluded because the registered command does not enable them.
  - Hub preflight, dry-run, subprocess enforcement and write auditing remain the native
    boundary, described in metadata rather than duplicated in run's graph.
  - Types summarize native payloads; helper internals and full runtime effects remain
    native. Lunar supplies execution receipts and provenance; native dependency snapshots
    and CLI JSON remain source-owned.
extensions:
  mathformer.source:
    category: hub
    native_id: test:family:isabelle
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: test:family:isabelle
      summary: Run the comprehensive test matrix for the isabelle module family.
      family: isabelle
      kind: validation
      safety: writes_artifacts
      command:
      - '{python}'
      - tests/test_program/run_comprehensive_tests.py
      - --module-family
      - isabelle
      - --json
      depends_on: []
      required_paths:
      - tests/test_program/run_comprehensive_tests.py
      - tests/test_matrix.json
      required_tools: []
      optional_tools: []
      writes:
      - artifacts/
      allows_extra_args: false
      timeout_seconds: 900
  mathformer.native_boundary:
    execution: Registered MCP block adapters call the shared native run helpers; this
      graph specializes run to the default Isabelle invocation. The original hub controller
      remains the CLI boundary.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Preflight or dry-run may prevent entry to run; the hub enforces
      a 900-second subprocess timeout and audits writes. Native failure remains failure.
    scientific_payloads: Report describes test execution and capabilities, not a proof
      artifact.
  mathformer.traversal:
    source: tests/test_program/run_comprehensive_tests.py::run/advance_check
    invariant: 0 <= index <= len(selected); len(results) == index; matrix order preserved.
    selected_timeouts_seconds:
    - 120
    - 120
    - 240
    - 300
    - 120
    stopping: Stop normally when index equals selected count, including completion
      on iteration five. No retries. Within the constrained domain the loop cannot
      exhaust with rows remaining; on_exhausted fail is a defensive unreachable outcome,
      not a native cap failure.
    timing: 900 seconds is the native hub subprocess limit, not a guarantee that all
      row limits plus overhead fit. Hub timeout may prevent finalization/publication.
      The generated 3600-second value is discarded.
