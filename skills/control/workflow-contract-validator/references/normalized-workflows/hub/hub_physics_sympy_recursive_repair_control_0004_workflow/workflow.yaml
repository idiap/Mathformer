schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_sympy_recursive_repair_control_0004_workflow
version: 1.0.0
kind: workflow
description: Emit one SymPy repair-control decision; recursion is managed by the caller.
aliases:
- physics-sympy:recursive-repair-control-0004
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Request:
    schema:
      type: object
      properties:
        case:
          type:
          - string
          - 'null'
          description: Hub supplies formalphysics_0004 unless overridden.
        expansion_map:
          type:
          - string
          - 'null'
        previous_expansion_maps:
          type: array
          items:
            type: string
          default: []
        iteration:
          type: integer
          default: 1
        max_iterations:
          type: integer
          default: 6
      additionalProperties: false
  NullablePath:
    schema:
      type:
      - string
      - 'null'
  State:
    schema:
      type: object
      required:
      - request
      - expansion_map
      - previous_expansion_maps
      - iteration
      - max_iterations
      properties:
        request:
          type: object
        expansion_map:
          type: object
        previous_expansion_maps:
          type: array
          items:
            type: object
        iteration:
          type: integer
        max_iterations:
          type: integer
  Guards:
    schema:
      type: object
      required:
      - early_complete
      - non_exhaustive
      - repeated
      - at_cap
      - empty
      properties:
        early_complete:
          type: boolean
        non_exhaustive:
          type: boolean
        repeated:
          type: boolean
        at_cap:
          type: boolean
        empty:
          type: boolean
      additionalProperties: false
  Branch:
    schema:
      type: string
      enum:
      - complete
      - non_exhaustive
      - repeated
      - at_cap
      - recurse
  Plan:
    schema:
      type: object
      required:
      - style
      - backend
      - case_id
      - status
      - decision
      - iteration
      - max_iterations
      - iteration_signature
      - prior_iteration_signatures
      - outstanding_node_count
      - blockers
      - next_actions
      - loop_policy
      - required_rerun_gates
      - recursion_invariants
      - sympy_only_boundary
      properties:
        style:
          const: physics_sympy_recursive_repair_control_plan
        backend:
          const: sympy
        case_id: {}
        status:
          type: string
          enum:
          - complete
          - blocked
          - recurse
        decision:
          type: string
          enum:
          - complete
          - blocked
          - recurse
        iteration:
          type: integer
        max_iterations:
          type: integer
        iteration_signature:
          type: string
        prior_iteration_signatures:
          type: array
          items:
            type: string
        outstanding_node_count:
          type: integer
        blockers:
          type: array
          items:
            type: string
        next_actions:
          type: array
          items:
            type: object
        loop_policy:
          type: object
        required_rerun_gates:
          type: array
          items:
            type: string
        recursion_invariants:
          type: array
          items:
            type: string
        sympy_only_boundary:
          type: object
  ExitCode:
    schema:
      type: integer
      const: 0
  Context:
    schema:
      type: object
      required:
      - working_directory
      properties:
        working_directory:
          type: string
          description: Existing absolute caller directory for resolving relative map,
            history, output and log paths.
      additionalProperties: false
  Text:
    schema:
      type: string
inputs:
  request:
    type: Request
  output_path:
    type: NullablePath
  reasoning_log:
    type: NullablePath
  context:
    type: Context
outputs:
  state:
    type: State
    value:
      ref: flow.outputs.state
  plan:
    type: Plan
    value:
      ref: flow.outputs.plan
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
  stdout_text:
    type: Text
    value:
      ref: flow.outputs.stdout_text
operations:
  load_state:
    inputs:
      request:
        type: Request
      context:
        type: Context
    outputs:
      state:
        type: State
      state_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_recursive_repair_0004_load_state
        operation: mathformer_sympy_recursive_repair_0004_load_state
  compute_guards:
    inputs:
      state:
        type: State
      state_json:
        type: Text
    outputs:
      guards:
        type: Guards
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_recursive_repair_0004_compute_guards
        operation: mathformer_sympy_recursive_repair_0004_compute_guards
  finish_plan:
    inputs:
      state:
        type: State
      branch:
        type: Branch
      state_json:
        type: Text
    outputs:
      plan:
        type: Plan
      plan_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_recursive_repair_0004_finish_plan
        operation: mathformer_sympy_recursive_repair_0004_finish_plan
  emit_plan:
    inputs:
      plan:
        type: Plan
      output_path:
        type: NullablePath
      reasoning_log:
        type: NullablePath
      plan_json:
        type: Text
      context:
        type: Context
    outputs:
      exit_code:
        type: ExitCode
      stdout_text:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_recursive_repair_0004_emit_plan
        operation: mathformer_sympy_recursive_repair_0004_emit_plan
flow:
  kind: sequence
  steps:
  - id: load
    kind: call
    operation: load_state
    description: Use explicit map if truthy; otherwise cartographer for case; then
      load prior maps and pack unchanged counters.
    arguments:
      request:
        ref: inputs.request
      context:
        ref: inputs.context
  - id: guards
    kind: call
    operation: compute_guards
    description: Compute early completion, non-exhaustiveness, repeated signature,
      guarded cap comparison and empty outstanding nodes.
    arguments:
      state:
        ref: steps.load.outputs.state
      state_json:
        ref: steps.load.outputs.state_json
  - id: choose
    kind: switch
    description: Source choose_branch first-match precedence; finish_plan may override
      every branch to blocked.
    cases:
    - id: early_complete
      when:
        ref: steps.guards.outputs.guards.early_complete
      body:
        kind: call
        operation: finish_plan
        arguments:
          state:
            ref: steps.load.outputs.state
          branch:
            literal: complete
          state_json:
            ref: steps.load.outputs.state_json
    - id: non_exhaustive
      when:
        ref: steps.guards.outputs.guards.non_exhaustive
      body:
        kind: call
        operation: finish_plan
        arguments:
          state:
            ref: steps.load.outputs.state
          branch:
            literal: non_exhaustive
          state_json:
            ref: steps.load.outputs.state_json
    - id: repeated
      when:
        ref: steps.guards.outputs.guards.repeated
      body:
        kind: call
        operation: finish_plan
        arguments:
          state:
            ref: steps.load.outputs.state
          branch:
            literal: repeated
          state_json:
            ref: steps.load.outputs.state_json
    - id: at_cap
      when:
        ref: steps.guards.outputs.guards.at_cap
      body:
        kind: call
        operation: finish_plan
        arguments:
          state:
            ref: steps.load.outputs.state
          branch:
            literal: at_cap
          state_json:
            ref: steps.load.outputs.state_json
    - id: empty
      when:
        ref: steps.guards.outputs.guards.empty
      body:
        kind: call
        operation: finish_plan
        arguments:
          state:
            ref: steps.load.outputs.state
          branch:
            literal: complete
          state_json:
            ref: steps.load.outputs.state_json
    default:
      kind: call
      operation: finish_plan
      arguments:
        state:
          ref: steps.load.outputs.state
        branch:
          literal: recurse
        state_json:
          ref: steps.load.outputs.state_json
    outputs:
      plan:
        type: Plan
        value:
          ref: selected.outputs.plan
      plan_json:
        type: Text
        value:
          ref: selected.outputs.plan_json
  - id: emit
    kind: call
    operation: emit_plan
    arguments:
      plan:
        ref: steps.choose.outputs.plan
      output_path:
        ref: inputs.output_path
      reasoning_log:
        ref: inputs.reasoning_log
      plan_json:
        ref: steps.choose.outputs.plan_json
      context:
        ref: inputs.context
  outputs:
    state:
      type: State
      value:
        ref: steps.load.outputs.state
    plan:
      type: Plan
      value:
        ref: steps.choose.outputs.plan
    exit_code:
      type: ExitCode
      value:
        ref: steps.emit.outputs.exit_code
    stdout_text:
      type: Text
      value:
        ref: steps.emit.outputs.stdout_text
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - caller_output_path
      - caller_reasoning_log
    network: []
    external_write: []
  authority:
    allowed:
    - load_expansion_maps
    - invoke_cartographer
    - emit_control_plan
    forbidden:
    - execute_repairs
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 420
    max_operation_calls: 4
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: A plan and normal process exit establish neither completed repair
    nor scientific validity.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/physics-sympy/physics-sympy-recursive-repair-loop-controller/scripts/control_physics_sympy_recursive_repair.py
    selector: main → load_state → build_control_plan (compute_guards → choose_branch
      → finish_plan) → emit_plan
    digest: sha256:83cffe4ea8e2e6dbb33ec63bd18d0576414af8544a32657243a38eb70957149c
  - path: scripts/mathformer.py
    selector: build_registry/action:physics-sympy:recursive-repair-control-0004
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/sympy_recursive_repair_control_0004_tools.py
    selector: register_sympy_recursive_repair_control_0004_tools
    digest: sha256:7a94c0a2d8e728040678363c90cf882490c62b63da4355629d3976f740a9a8e6
  - path: scripts/sympy_recursive_repair_control_tools.py
    selector: source; restored; Context; Loaded; Guarded
    digest: sha256:b82bfe289d4c557b1969a9f4b940a1ef22689a4f4f39b172e1c665105397b24e
  - path: scripts/mcp_server.py
    selector: register_sympy_recursive_repair_control_0004_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory:physics-sympy:recursive-repair-control-0004
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/mcp/run_sympy_recursive_repair_control_0004_workflow_tests.py
    selector: SympyRecursiveControl0004Tests
    digest: sha256:a8ea02012c20a13f9b9de7133d6bf5fbe1828d9bcbdeffa873d9a4ecb397750d
  - path: tests/mcp/run_sympy_recursive_repair_control_workflow_tests.py
    selector: 'SympyRecursiveControlTests: native equivalence and cartographer result
      evidence'
    digest: sha256:9883b5e49aad4117f6cd41311298e4fcdaa5a8c5412ee2a16848f1712f9c9103
  - path: tests/mcp/fixtures/sympy_recursive_repair_control_original.py.txt
    selector: frozen original build_control_plan and CLI oracle
    digest: sha256:541c47ab9510e296669a8fcdf8124d225b055d21f580216fa4bc2f5b6b795ef0
  gaps:
  - The normal controller path is modeled; CLI self-test and hub transport/preflight/report
    envelopes are outside this projection.
  - Cartographer/planner internals and their validation gates remain inside the real
    native subprocess boundary; tests supply expansion-map files and subprocess-result
    evidence without invoking scientific workflows.
  - Policy effect labels require host and service enforcement; the binding applies
    existing service write policy. Native optional reasoning logging remains distinct
    from Lunar runtime receipts.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-sympy:recursive-repair-control-0004
    owner_skill: skills/physics-sympy/physics-sympy-recursive-repair-loop-controller/SKILL.md
    contract:
      id: physics-sympy:recursive-repair-control-0004
      summary: Control the recursive SymPy repair loop for FormalPhysics 0004.
      family: physics_sympy
      kind: validation
      safety: read_only
      command:
      - .venv/bin/python
      - skills/physics-sympy/physics-sympy-recursive-repair-loop-controller/scripts/control_physics_sympy_recursive_repair.py
      - --case
      - formalphysics_0004
      - --json
      depends_on: []
      allows_extra_args: true
      timeout_seconds: 420
      writes: []
  mathformer.native_boundary:
    inputs: Request is the parsed normal CLI request with hub default case formalphysics_0004;
      absent counters/history become 1, 6 and []. Explicit emission paths use null
      when omitted. Context supplies an existing absolute caller working directory.
      JSON sidecars preserve native object insertion order across PRISM codecs and
      are checked against typed state/plan payloads.
    loading: Missing map and case raises; file/JSON errors propagate. Cartographer
      runs once with 300-second timeout; nonzero exit or invalid/empty JSON becomes
      a blocked map; timeout propagates.
    cartographer: Owns goal planning with validation gates, outstanding-node construction,
      frontier ordering and iteration-signature hashing.
    guards: early_complete means status complete/not_required and no outstanding nodes;
      non_exhaustive negates exhaustive; repeated tests the string signature against
      truthy prior signatures; at_cap compares iteration >= max_iterations only after
      those three are false; empty means no outstanding nodes.
    finishing: Non-exhaustive, repeated and cap branches add their native blocker;
      map status blocked overrides any decision and adds expansion_map_blocked. Blockers
      are sorted/deduplicated. Blocked/recurse retain ordered frontier actions; complete
      clears actions.
    carried_state: Caller supplies prior maps/signatures, current map/frontier and
      counters; no counter increment, history persistence, checkpoint or internal
      repair loop.
    bounds: Integers have no range validation; defaults are iteration 1 and max_iterations
      6. Cap is a decision guard, not a loop bound; reaching it normally emits a blocked
      plan with exit code 0.
    emission: Advice and rerun gates are emitted without repairs; optional log precedes
      serialization, then optional output writes including parent creation or stdout.
      Failures propagate; missing optional log helper skips logging.
    effects_status: Optional explicit output/log paths can write despite the hub read_only
      label; child effects require qualification.
    budgets: 420 seconds is the hub subprocess timeout and projected wall budget;
      four actual stage calls add no native retries.
