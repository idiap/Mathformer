schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lean_formalphysics_comparative_report_workflow
version: 1.0.0
kind: workflow
description: 'Finite native FormalPhysics report: ordered preparation, candidate evaluation,
  selection, assembly and output; optional native self-test.'
aliases:
- physics-lean:formalphysics-comparative-report
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Argv:
    schema:
      type: array
      items:
        type: string
  Args:
    schema:
      type: object
      required:
      - self_test
      - has_input_json
      - options
      properties:
        self_test:
          type: boolean
        has_input_json:
          type: boolean
        options:
          type: object
          description: All parsed argparse values; timeout defaults to 60 and execute_lean
            to false.
  CasesState:
    schema:
      type: object
      required:
      - has_cases
      - phase
      - native_json
      properties:
        has_cases:
          type: boolean
        native_json:
          type: string
          description: Lossless JSON of native options, indices, manifest, cursors,
            current case, accumulated cases and prompts. Preserves dictionary insertion
            order exposed by native renderers.
        phase:
          type: string
          enum:
          - open
          - candidate
          - close
  Report:
    schema:
      type: object
      required:
      - manifest
      - cases
      - summary
      - qualitative_reviews
      - strategy_comparison_summary
      - codex_exec_judge_prompts
      - judge_synthesis
      properties:
        manifest:
          type: object
        cases:
          type: array
          maxItems: 1000
          items:
            type: object
        summary:
          type: object
        qualitative_reviews:
          type: object
        strategy_comparison_summary:
          type: object
        codex_exec_judge_prompts:
          type: array
          items:
            type: object
        judge_synthesis:
          type: object
  Completion:
    schema:
      type: object
      required:
      - exit_code
      - payload
      properties:
        exit_code:
          const: 0
        payload:
          type: object
          description: Native main result; report branch includes ok/style/summary/artifacts;
            self-test returns its own result.
  ReportText:
    schema:
      type: string
      description: Lossless native report JSON; prevents transport key canonicalization
        from changing rendered output order.
inputs:
  extra_args:
    type: Argv
outputs:
  result:
    type: Completion
    value:
      ref: steps.dispatch.outputs.result
operations:
  parse:
    inputs:
      argv:
        type: Argv
    outputs:
      args:
        type: Args
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_parse
        operation: mathformer_comparative_report_parse
  test:
    inputs:
      args:
        type: Args
    outputs:
      result:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_test
        operation: mathformer_comparative_report_test
  prepare:
    inputs:
      args:
        type: Args
    outputs:
      state:
        type: CasesState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_prepare
        operation: mathformer_comparative_report_prepare
  open_case:
    inputs:
      state:
        type: CasesState
    outputs:
      state:
        type: CasesState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_open_case
        operation: mathformer_comparative_report_open_case
  candidate:
    inputs:
      state:
        type: CasesState
    outputs:
      state:
        type: CasesState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_candidate
        operation: mathformer_comparative_report_candidate
  close_case:
    inputs:
      state:
        type: CasesState
    outputs:
      state:
        type: CasesState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_close_case
        operation: mathformer_comparative_report_close_case
  assemble:
    inputs:
      state:
        type: CasesState
    outputs:
      report:
        type: Report
      report_text:
        type: ReportText
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_assemble
        operation: mathformer_comparative_report_assemble
  write:
    inputs:
      args:
        type: Args
      report_text:
        type: ReportText
    outputs:
      result:
        type: Completion
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_write
        operation: mathformer_comparative_report_write
  empty:
    inputs:
      args:
        type: Args
    outputs:
      state:
        type: CasesState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_empty
        operation: mathformer_comparative_report_empty
  retain:
    inputs:
      state:
        type: CasesState
    outputs:
      state:
        type: CasesState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_comparative_report_retain
        operation: mathformer_comparative_report_retain
flow:
  kind: sequence
  steps:
  - kind: call
    operation: parse
    arguments:
      argv:
        ref: inputs.extra_args
    id: parse
  - id: initialize
    kind: switch
    cases:
    - id: self_test
      when:
        ref: steps.parse.outputs.args.self_test
      body:
        kind: call
        operation: empty
        arguments:
          args:
            ref: steps.parse.outputs.args
    default:
      kind: sequence
      steps:
      - kind: call
        operation: prepare
        arguments:
          args:
            ref: steps.parse.outputs.args
        id: prepare
      outputs:
        state:
          type: CasesState
          value:
            ref: steps.prepare.outputs.state
    outputs:
      state:
        type: CasesState
        value:
          ref: selected.outputs.state
  - id: traverse
    kind: loop
    state_type: CasesState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 4000
    on_exhausted: fail
    body:
      kind: switch
      cases:
      - id: open_case
        when:
          all:
          - ref: loop.state.has_cases
          - eq:
            - ref: loop.state.phase
            - literal: open
        body:
          kind: call
          operation: open_case
          arguments:
            state:
              ref: loop.state
      - id: candidate
        when:
          all:
          - ref: loop.state.has_cases
          - eq:
            - ref: loop.state.phase
            - literal: candidate
        body:
          kind: call
          operation: candidate
          arguments:
            state:
              ref: loop.state
      - id: close_case
        when:
          all:
          - ref: loop.state.has_cases
          - eq:
            - ref: loop.state.phase
            - literal: close
        body:
          kind: call
          operation: close_case
          arguments:
            state:
              ref: loop.state
      default:
        kind: call
        operation: retain
        arguments:
          state:
            ref: loop.state
      outputs:
        state:
          type: CasesState
          value:
            ref: selected.outputs.state
    next_state:
      ref: body.outputs.state
    until:
      not:
        ref: body.outputs.state.has_cases
    outputs:
      state:
        type: CasesState
        value:
          ref: loop.state
  - id: dispatch
    kind: switch
    cases:
    - id: self_test
      when:
        ref: steps.parse.outputs.args.self_test
      body:
        kind: call
        operation: test
        arguments:
          args:
            ref: steps.parse.outputs.args
    default:
      kind: sequence
      steps:
      - kind: call
        operation: assemble
        arguments:
          state:
            ref: steps.traverse.outputs.state
        id: assemble
      - kind: call
        operation: write
        arguments:
          args:
            ref: steps.parse.outputs.args
          report_text:
            ref: steps.assemble.outputs.report_text
        id: write
      outputs:
        result:
          type: Completion
          value:
            ref: steps.write.outputs.result
    outputs:
      result:
        type: Completion
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: Completion
      value:
        ref: steps.dispatch.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/formalphysics_comparative_analysis/
      - artifacts/workflow_hub/
      - native_temporary_files
    network: []
    external_write: []
  authority:
    allowed:
    - produce_comparative_report
    - optionally_compile_lean
    - ingest_supplied_judgments
    - run_native_self_test
    forbidden:
    - bypass_native_controls
    - execute_generative_judges
    - infer_scientific_truth_from_completion
    - promote_artifacts
  limits:
    wall_time_seconds: 900
    max_operation_calls: 4004
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Report evidence and candidate ranking; completion establishes neither
    proof nor promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/physics-common/formalphysics-comparative-analysis-reporter/scripts/build_comparative_report.py
    selector: main (delegates to build_report and write_outputs)
    digest: sha256:f28e488e2433e9c2158c3ee8c954de70be0116d62afd277dfe6079dd41896d9c
