  gaps:
  - Bounded specialization admits at most 1000 records; native CLI has no record-count
    cap. The actual --input-json file is read by native preparation; argv carries
    all path and compiler context.
  - Nested case/candidate loops are lowered to ordered open/candidate/close phases
    because Lunar rejects branch-local loop exhaustion. Empty/self-test traversal
    performs one identity transition without evaluating candidates. Native review/render
    traversals remain within their owning operations.
  - Lunar supplies mandatory receipts/digests in addition to native printing and report
    artifacts; the 900-second ceiling is the hub/runtime policy rather than a direct-main
    timeout.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lean:formalphysics-comparative-report
    owner_skill: skills/physics-common/formalphysics-comparative-analysis-reporter/SKILL.md
    contract:
      id: physics-lean:formalphysics-comparative-report
      family: physics_lean
      kind: render
      safety: writes_artifacts
      depends_on: []
      allows_extra_args: true
      timeout_seconds: 900
  mathformer.native_boundary:
    execution: Dependency-free hub leaf forwards extra arguments through run_action
      and run_leaf_action; graph models selected Python main only.
    failure_policy: Hub preflight or dry-run can prevent execution; timeout/nonzero
      exit/undeclared writes makes hub unsuccessful. Direct main returns zero after
      writing even for blocked candidates; invalid input/unhandled errors abort.
    timeout: Lean timeout defaults to 60 seconds per candidate and is configurable;
      900 seconds is the hub limit, not a direct-main limit.
  mathformer.source_semantics:
    preparation: Inventory finite discovered Foundations files/declarations; remove
      obsolete self-output unless retained; accumulate cleaned records/totals and
      write selected_examples.cleaned.json. Candidate order is external when supplied,
      then repository.
    evaluation: Load code; skip compile for unavailable/non-Lean candidates or without
      --execute-lean; external compile uses a temporary file. Then hygiene, dependency
      evidence, reference delta, gates, critic evidence, scores, aggregate. Compile
      failure/timeout remains evidence and iteration continues; unexpected errors
      abort.
    prompts_and_selection: Eight prompts per candidate are generated and optionally
      joined with supplied results; no judge execution. choose_best uses accepted,
      then provisional, then remaining Lean candidates, maximizing mean_score with
      source-order ties.
    termination: Empty cases bypass traversal. Each loop visits its finite collection
      once; the final allowed iteration exits normally when no items remain. Exhaustion
      is unreachable for admitted input and one-or-two candidate packets; no refinement,
      retry or convergence algorithm.
    outputs: JSON/HTML/Markdown report; prompt JSON; qualitative-review JSON and per-role
      Markdown; strategy JSON/Markdown. Review/render traversals stay inside their
      owning operations; no standalone manifest/todos write is performed here.
  mathformer.runtime:
    tools: scripts/comparative_report_tools.py
    state: JSON-safe native options, manifest, original-record index, supplied-result
      index, synthesis, cursors, accumulated cases/prompts and current case context.
      JSON keys replace native tuple/integer index keys without changing lookup semantics.
      State native_json and report_text preserve native insertion order across PRISM
      canonicalization.
    bound: 'At most four traversal calls per case: open, one or two candidate evaluations,
      close. Exact 4000th iteration stops normally. No retries or refinement. Errors
      abort; compiler failure/timeout remain evidence.'
    input: extra_args is the native argv; --input-json, --repo-root, --lean-cwd, --output-dir
      and supplied results/synthesis paths are consumed without an independent artifact
      override.
