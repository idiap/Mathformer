schema_version: workflow-skill/v1
namespace: mathformer
id: hub_physics_lean_formalphysics_codex_exec_judge_runner_workflow
version: 1.0.0
kind: workflow
description: Run selected FormalPhysics Codex judge prompts, specialized to the hub
  default limit of one.
aliases:
- physics-lean:formalphysics-codex-exec-judge-runner
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Args:
    schema:
      type: object
      required:
      - prompts_json
      - output_dir
      - limit
      - execute
      - workers
      - resume
      - codex_bin
      - sandbox
      - model
      - profile
      - timeout
      - case_id
      - candidate_id
      - judge_id
      properties:
        prompts_json:
          type: string
        output_dir:
          type: string
        limit:
          type: integer
          const: 1
        execute:
          type: boolean
          default: false
        workers:
          type: integer
          default: 1
        resume:
          type: boolean
          default: false
        codex_bin:
          type: string
        sandbox:
          type: string
          default: read-only
        model:
          type:
          - string
          - 'null'
        profile:
          type:
          - string
          - 'null'
        timeout:
          type: integer
          default: 900
        case_id:
          type:
          - string
          - 'null'
        candidate_id:
          type:
          - string
          - 'null'
        judge_id:
          type:
          - string
          - 'null'
        self_test:
          const: false
        json:
          type: boolean
      additionalProperties: false
  Flag:
    schema:
      type: boolean
  State:
    schema:
      type: object
      required:
      - args
      - artifacts
      - selected
      - rows
      properties:
        args:
          type: object
        artifacts:
          type: object
          required:
          - selected_prompts
          - results
          - manifest
          - prompt_dir
          properties:
            selected_prompts:
              type: string
            results:
              type: string
            manifest:
              type: string
            prompt_dir:
              type: string
        selected:
          type: array
          maxItems: 1
          items:
            type: object
        rows:
          type: array
          maxItems: 1
          items:
            type: object
      additionalProperties: false
  Manifest:
    schema:
      type: object
      required:
      - schema_version
      - style
      - created_at
      - execute
      - prompts_json
      - selected_prompt_count
      - completed_result_count
      - filters
      - workers
      - resume
      - artifacts
      - rows
      properties:
        schema_version:
          const: 1
        style:
          const: formalphysics_codex_exec_judge_runner
        created_at:
          type: string
        execute:
          type: boolean
        prompts_json:
          type: string
        selected_prompt_count:
          type: integer
          minimum: 0
          maximum: 1
        completed_result_count:
          type: integer
          minimum: 0
          maximum: 1
        filters:
          type: object
        workers:
          type: integer
        resume:
          type: boolean
        artifacts:
          type: object
        rows:
          type: array
          maxItems: 1
          items:
            type: object
      additionalProperties: false
  Context:
    schema:
      type: object
      required:
      - working_directory
      properties:
        working_directory:
          type: string
      additionalProperties: false
inputs:
  args:
    type: Args
  context:
    type: Context
outputs:
  manifest:
    type: Manifest
    value:
      ref: flow.outputs.manifest
operations:
  initialize:
    inputs:
      args:
        type: Args
      context:
        type: Context
    outputs:
      state:
        type: State
      parallel:
        type: Flag
      nonempty:
        type: Flag
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_codex_judge_runner_initialize
        operation: mathformer_codex_judge_runner_initialize
  parallel_batch:
    inputs:
      args:
        type: Args
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: mixed
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_codex_judge_runner_parallel_batch
        operation: mathformer_codex_judge_runner_parallel_batch
  append_row:
    inputs:
      args:
        type: Args
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
      done:
        type: Flag
    execution:
      mode: mixed
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_codex_judge_runner_append_row
        operation: mathformer_codex_judge_runner_append_row
  empty_state:
    inputs:
      state:
        type: State
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_codex_judge_runner_empty_state
        operation: mathformer_codex_judge_runner_empty_state
  persist:
    inputs:
      args:
        type: Args
      state:
        type: State
      context:
        type: Context
    outputs:
      manifest:
        type: Manifest
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_codex_judge_runner_persist
        operation: mathformer_codex_judge_runner_persist
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments:
      args:
        ref: inputs.args
      context:
        ref: inputs.context
  - id: process
    kind: loop
    state_type: State
    initial:
      ref: steps.initialize.outputs.state
    body:
      kind: switch
      cases:
      - id: parallel
        when:
          ref: steps.initialize.outputs.parallel
        body:
          kind: sequence
          steps:
          - id: batch
            kind: call
            operation: parallel_batch
            arguments:
              args:
                ref: inputs.args
              state:
                ref: loop.state
              context:
                ref: inputs.context
          outputs:
            state:
              type: State
              value:
                ref: steps.batch.outputs.state
            done:
              type: Flag
              value:
                literal: true
      - id: sequential_nonempty
        when:
          ref: steps.initialize.outputs.nonempty
        body:
          kind: sequence
          steps:
          - kind: call
            operation: append_row
            arguments:
              args:
                ref: inputs.args
              state:
                ref: loop.state
              context:
                ref: inputs.context
            id: append
          outputs:
            state:
              type: State
              value:
                ref: steps.append.outputs.state
            done:
              type: Flag
              value:
                ref: steps.append.outputs.done
      default:
        kind: sequence
        steps:
        - id: empty
          kind: call
          operation: empty_state
          arguments:
            state:
              ref: loop.state
        outputs:
          state:
            type: State
            value:
              ref: steps.empty.outputs.state
          done:
            type: Flag
            value:
              literal: true
      outputs:
        state:
          type: State
          value:
            ref: selected.outputs.state
        done:
          type: Flag
          value:
            ref: selected.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    max_iterations: 1
    on_exhausted: fail
    description: 'One selected prompt at most: select the native parallel, sequential
      nonempty, or empty path. Sequential completion uses the native post-append exhaustion
      test. Parallel and empty paths finish after their native batch/no-op. The loop
      surrounds the switch to keep its failure exit outside branch scope.'
    outputs:
      state:
        type: State
        value:
          ref: loop.state
  - id: persist
    kind: call
    operation: persist
    arguments:
      args:
        ref: inputs.args
      state:
        ref: steps.process.outputs.state
      context:
        ref: inputs.context
  outputs:
    manifest:
      type: Manifest
      value:
        ref: steps.persist.outputs.manifest
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - configured_output_dir
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - prepare_judge_prompts
    - execute_selected_judges
    - persist_judge_results
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 3
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked description; judge completion establishes neither scientific
    truth nor promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/physics-common/formalphysics-judge-synthesis-reporter/scripts/run_codex_exec_judges.py
    selector: run
    digest: sha256:a26b894a4385adc99b948dfae35ebc8799c36068d720d27c9679fcd93752ac54
  - path: scripts/mathformer.py
    selector: build_registry; run_action; run_leaf_action; preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/codex_judge_runner_tools.py
    selector: register_codex_judge_runner_tools; invocation
    digest: sha256:2d536dfcb95fb496df7a1805130b1fe8eee71d62105bf3aeefb6c3d2db099fdf
  - path: scripts/mcp_server.py
    selector: register_codex_judge_runner_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/codex_judge_self_test_tools.py
    selector: source
    digest: sha256:33ea4dfb831a6ed89003e9041ee759d21c0162c98414386bdcd50bb5b9265897
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Only limit=1 is modeled; direct invocation defaults to unlimited selection and
    hub extra arguments may override it.
  - Hub transport/preflight/write auditing remain outside this run(args) graph; parallel
    scheduling and prompt internals stay inside owning operations.
  - The 3600-second ceiling and three-call limit are descriptor limits, not native
    runner budgets. Native file reuse has no matching-definition check; Lunar receipts
    do not change its semantics. External effects remain qualified by service policy
    and caller authorization.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lean:formalphysics-codex-exec-judge-runner
    owner_skill: skills/physics-common/formalphysics-judge-synthesis-reporter/SKILL.md
  mathformer.native_boundary:
    entry: main parses arguments, selects run unless self-test, and normally exits
      zero despite failed judge rows.
    hub: run_action -> run_leaf_action; argv contains --limit 1 --json plus extra
      args; preflight and write auditing apply; subprocess timeout is 1200 seconds.
    dependencies: []
    nl_route: The separate self-test action precedes this action on the natural-language
      route; it is not a dependency of run.
  mathformer.prompt_behavior:
    source: execute_prompt; row_from_final_message; codex_command
    ordering: Write prompt file first; resume reuses any nonempty final-message file
      before checking execute.
    prepare: Otherwise, execute=false records the intended command and returns a preparation
      row.
    execute: Otherwise invoke codex exec with prompt stdin, model/profile/sandbox
      options and args.timeout (default 900 seconds).
    parsing: Parse JSON object, including embedded-object extraction; invalid output
      becomes an error result. Executed rows use subprocess returncode even when parsing
      fails.
    failures: Nonzero exits and invalid JSON remain rows and do not stop remaining
      prompts; uncaught exceptions including timeouts abort before persist_run.
    resume: Native file reuse only, without validation of matching prompts or definitions;
      no workflow checkpoint or retries.
  mathformer.step_mapping:
    initialize: Source initialize_run and run pack args/artifacts/selected/rows, create
      directories, load/filter prompts and apply Python slicing, check Codex availability
      if executing, then write selection. Export run guards args.execute and args.workers
      > 1, and bool(selected); no prompt processing yet.
    parallel_batch: Source run parallel branch submits every selected prompt to ThreadPoolExecutor(max_workers=args.workers),
      calls execute_prompt, collects as_completed by index, then packs rows in selection
      order. Empty input is valid. Exceptions propagate; executor shutdown waits for
      submitted work before propagation. Prompt behavior is documented below.
    append_row: Source append_run_row uses len(rows) as position, calls execute_prompt(selected[position],
      args, prompt_dir, position), appends its row, and returns len(rows) == len(selected).
      Export the mutated state and native exhaustion boolean without arithmetic expressions.
    empty_state: Source run's empty sequential for-loop performs no append_run_row
      calls; project its unchanged state into the branch export.
    persist: Source persist_run writes codex_exec_judge_results.json then codex_exec_judge_run_manifest.json
      and returns the manifest, even for empty selection. Results contain dict row.result
      values only when args.execute is true; preparation rows remain in manifest.rows.
