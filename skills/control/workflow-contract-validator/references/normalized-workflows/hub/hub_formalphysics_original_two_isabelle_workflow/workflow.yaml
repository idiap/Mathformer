schema_version: workflow-skill/v1
namespace: mathformer
id: hub_formalphysics_original_two_isabelle_workflow
version: 1.0.0
kind: workflow
description: Generate the two fixed Isabelle artifacts in main; optionally copy them
  to the library.
aliases:
- formalphysics:original-two-isabelle
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Argv:
    schema:
      type: array
      items:
        type: string
      enum:
      - []
      - - --promote-lib
    representation: value
  State:
    schema:
      type: object
      required:
      - cursor
      - promote_lib
      - generated
      additionalProperties: false
      properties:
        cursor:
          type: integer
          minimum: 0
          maximum: 2
        promote_lib:
          type: boolean
        generated:
          type: array
          items:
            type: string
    representation: value
  CaseWrites:
    schema:
      type: object
      required:
      - artifact_theory
      - artifact_root
      - lib_theory
      - lib_root
      additionalProperties: false
      properties:
        artifact_theory:
          type: string
        artifact_root:
          type: string
        lib_theory:
          type:
          - string
          - 'null'
        lib_root:
          type:
          - string
          - 'null'
    representation: value
  Bool:
    schema:
      type: boolean
    representation: value
  Paths:
    schema:
      type: array
      items:
        type: string
    representation: value
  ExitCode:
    schema:
      type: integer
      const: 0
    representation: value
  RepositoryRoot:
    schema:
      type: string
      minLength: 1
    representation: value
inputs:
  argv:
    type: Argv
  repository_root:
    type: RepositoryRoot
outputs:
  generated:
    type: Paths
    value:
      ref: flow.outputs.generated
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
operations:
  initialize:
    inputs:
      argv:
        type: Argv
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_original_two_isabelle_initialize
        operation: mathformer_original_two_isabelle_initialize
  write_case:
    inputs:
      state:
        type: State
      repository_root:
        type: RepositoryRoot
    outputs:
      writes:
        type: CaseWrites
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_original_two_isabelle_write_case
        operation: mathformer_original_two_isabelle_write_case
  accumulate:
    inputs:
      state:
        type: State
      writes:
        type: CaseWrites
      repository_root:
        type: RepositoryRoot
    outputs:
      state:
        type: State
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_original_two_isabelle_accumulate
        operation: mathformer_original_two_isabelle_accumulate
  complete:
    inputs:
      state:
        type: State
    outputs:
      generated:
        type: Paths
      exit_code:
        type: ExitCode
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_original_two_isabelle_complete
        operation: mathformer_original_two_isabelle_complete
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments:
      argv:
        ref: inputs.argv
  - id: cases
    kind: loop
    description: Exactly formalphysics_0000 (Lorentz-force projection), then formalphysics_0020
      (Maxwell-Ampere projection). Earlier writes persist. At iteration two done is
      true and completion is normal, not exhaustion.
    state_type: State
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 2
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: write
        kind: call
        operation: write_case
        arguments:
          state:
            ref: loop.state
          repository_root:
            ref: inputs.repository_root
      - id: accumulate
        kind: call
        operation: accumulate
        arguments:
          state:
            ref: loop.state
          writes:
            ref: steps.write.outputs.writes
          repository_root:
            ref: inputs.repository_root
      outputs:
        state:
          type: State
          value:
            ref: steps.accumulate.outputs.state
        done:
          type: Bool
          value:
            ref: steps.accumulate.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: State
        value:
          ref: body.outputs.state
  - id: complete
    kind: call
    operation: complete
    arguments:
      state:
        ref: steps.cases.outputs.state
  outputs:
    generated:
      type: Paths
      value:
        ref: steps.complete.outputs.generated
    exit_code:
      type: ExitCode
      value:
        ref: steps.complete.outputs.exit_code
policy:
  effects:
    filesystem:
      read:
      - scripts/generate_formalphysics_original_two_isabelle.py
      - data/benchmarks/formal_science/physics_top10_sources/
      write:
      - artifacts/physics_isabelle/from_scratch_isabelle/
      - libraries/MathformerPhysicsLib/Isabelle/
    network: []
    external_write: []
  authority:
    allowed:
    - generate_isabelle_artifacts
    - copy_library_artifacts_when_requested
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 6
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Generation and optional copying establish neither Isabelle compilation
    nor scientific validity.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/generate_formalphysics_original_two_isabelle.py
    selector: main; initialize; write_case_at; advance; finish; CASES; write_case;
      render_theory; text_block_safe; write_root
    digest: sha256:31ddab104e2c432968125552274b03c38940670d961c005eac10734ecf70edd5
  - path: scripts/mathformer.py
    selector: build_registry/action:formalphysics:original-two-isabelle; run_action;
      run_leaf_action; preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mcp_server.py
    selector: normalized workflow ID to native action dispatch
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/formalphysics_original_two_isabelle_tools.py
    selector: register_formalphysics_original_two_isabelle_tools
    digest: sha256:c2724dc85071732777547ab81b9b2516683957679742f2c521b6914843b9bd7d
  gaps:
  - Argv is restricted to the two operational modes; argparse help and malformed-argument
    exits are outside this projection.
  - Hub preflight, dry-run, snapshots and audit are boundary metadata, not executable
    nodes in this main-only graph.
  - The 3600-second limit and six-call budget are descriptor bounds; the native subprocess
    has no enforced timeout.
  - Lunar supplies required runtime receipts, digests and provenance; native completion
    prints generated paths.
extensions:
  mathformer.source:
    category: hub
    native_id: formalphysics:original-two-isabelle
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
  mathformer.native_boundary:
    execution: CLI run_action -> run_leaf_action; MCP resolves the same native action.
    dependencies: []
    normal_argv: []
    promotion: Hub rejects extra arguments; --promote-lib is available only to direct
      script invocation.
    preflight: Blocks unauthorized mutations, missing required script, and extra arguments;
      dry-run skips execution.
    postflight: Repository snapshots audit undeclared writes and may mark the hub
      result failed.
    declared_write: libraries/MathformerPhysicsLib/backends/isabelle/Isabelle/
    actual_writes: artifacts/physics_isabelle/from_scratch_isabelle/<case>/ and optionally
      libraries/MathformerPhysicsLib/Isabelle/<case>/
    failure: Uncaught read/write/copy errors stop immediately; partial outputs and
      earlier iterations persist without rollback.
    completion: Four generated paths normally, eight with promotion; print once and
      return 0 after two cases.
    loop_bound: Fixed CASES cardinality is two; done is true at the bound, so on_exhausted
      is unreachable for this source.
    timeout_seconds: null
    context: repository_root supplies the filesystem context; fixed source and output
      paths remain relative to it. CLI defaults are unchanged. MCP writes obey the
      service read-only policy.
# REUSE-IgnoreEnd
