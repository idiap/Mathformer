schema_version: workflow-skill/v1
namespace: mathformer
id: hub_adoption_invoke_workflow
version: 1.0.0
kind: workflow
description: Project portable_adoption.invoke validation and single native dispatch.
aliases:
- adoption:invoke
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Identity:
    schema:
      type: string
  InputObject:
    schema:
      type: object
  OutputDirectory:
    schema:
      type:
      - string
      - 'null'
  Prepared:
    schema:
      type: object
      required:
      - oid
      - inputs
      - metadata
      - output_dir
      - surface
      - operation
      properties:
        oid:
          type: string
          enum:
          - router:resolve
          - control:workflow-contract
          - control:reasoning-log-summary
          - reasoning-log:validate
          - artifact_acceptance_loop:public
          - artifact_acceptance_loop:material
        inputs:
          type: object
        metadata:
          type: object
        output_dir:
          type:
          - string
          - 'null'
        surface:
          type: object
        operation:
          type: object
      additionalProperties: false
  NativeResult:
    schema:
      type:
      - object
      - array
      description: Native return value, preserved unchanged; not a success assertion.
inputs:
  identity:
    type: Identity
  inputs:
    type: InputObject
  output_dir:
    type: OutputDirectory
outputs:
  result:
    type: NativeResult
    value:
      ref: flow.outputs.result
operations:
  prepare:
    inputs:
      identity:
        type: Identity
      inputs:
        type: InputObject
      output_dir:
        type: OutputDirectory
    outputs:
      prepared:
        type: Prepared
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_invoke_prepare
        operation: mathformer_invoke_prepare
  router:
    inputs:
      prepared:
        type: Prepared
    outputs:
      result:
        type: NativeResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_invoke_router
        operation: mathformer_invoke_router
  hub_action:
    inputs:
      prepared:
        type: Prepared
    outputs:
      result:
        type: NativeResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_invoke_hub_action
        operation: mathformer_invoke_hub_action
  reasoning_log:
    inputs:
      prepared:
        type: Prepared
    outputs:
      result:
        type: NativeResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_invoke_reasoning_log
        operation: mathformer_invoke_reasoning_log
  prism_fixture:
    inputs:
      prepared:
        type: Prepared
    outputs:
      result:
        type: NativeResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_invoke_prism_fixture
        operation: mathformer_invoke_prism_fixture
flow:
  kind: sequence
  steps:
  - id: prepare
    kind: call
    operation: prepare
    arguments:
      identity:
        ref: inputs.identity
      inputs:
        ref: inputs.inputs
      output_dir:
        ref: inputs.output_dir
  - id: dispatch
    kind: switch
    cases:
    - id: router
      when:
        eq:
        - ref: steps.prepare.outputs.prepared.oid
        - literal: router:resolve
      body:
        kind: call
        operation: router
        arguments:
          prepared:
            ref: steps.prepare.outputs.prepared
    - id: workflow_contract
      when:
        eq:
        - ref: steps.prepare.outputs.prepared.oid
        - literal: control:workflow-contract
      body:
        kind: call
        operation: hub_action
        arguments:
          prepared:
            ref: steps.prepare.outputs.prepared
    - id: log
      when:
        any:
        - eq:
          - ref: steps.prepare.outputs.prepared.oid
          - literal: control:reasoning-log-summary
        - eq:
          - ref: steps.prepare.outputs.prepared.oid
          - literal: reasoning-log:validate
      body:
        kind: call
        operation: reasoning_log
        arguments:
          prepared:
            ref: steps.prepare.outputs.prepared
    default:
      kind: call
      operation: prism_fixture
      arguments:
        prepared:
          ref: steps.prepare.outputs.prepared
    outputs:
      result:
        type: NativeResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: NativeResult
      value:
        ref: steps.dispatch.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      - adjacent_prism_executable
      write:
      - artifacts/adoption/
      - artifacts/workflow_hub/
      - native_output_dir
      - temporary_fixture_directory
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 2
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked description only; fixture success never establishes
    backend verification.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: skills/control/workflow-contract-validator/scripts/portable_adoption.py
    selector: invoke; prepare_invocation; execute_invocation
    digest: sha256:71cc63a093533d56dc9a14c03557dbe914f75cfbc5baeee7b32fdf66ca58a025
  - path: skills/control/reasoning-log-schema-guardian/scripts/adoption_provenance.py
    selector: invoke_recorded; _finish
    digest: sha256:a9a24e31ba4fad57a41f4c03417f4488a4f000c28f908aa32752f872a12ba6be
  - path: scripts/mathformer.py
    selector: adoption:invoke registration; run_action; run_leaf_action; preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/adoption_invoke_tools.py
    selector: register_adoption_invoke_tools
    digest: sha256:d11269695b34073dd00aa1364025b32c7c8b7a0cc6d5ee28c5a1029b4dd8bf0b
  - path: scripts/mcp_server.py
    selector: register_adoption_invoke_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: normalize/adoption:invoke authored contract projection
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Native results retain branch-specific shapes and authority; detailed payload schemas
    are not projected.
  - The 3600-second and two-call limits are enforced by Lunar, not by native direct
    invocation.
  - Required receipt/provenance fields are schema declarations; native recording is
    optional and best effort.
  - Native effect qualification remains partial; direct output_dir is unrestricted
    by invoke itself.
extensions:
  mathformer.source:
    category: hub
    native_id: adoption:invoke
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: adoption:invoke
      family: control
      kind: execution
      safety: writes_artifacts
      depends_on: []
      timeout_seconds: null
  mathformer.native_boundary:
    execution: Authoritative native dispatcher; generated graph projects invoke's
      function interface.
    direct_defaults: Pass output_dir=null for the native direct-call default; no recording.
    cli: main parses identity and JSON inputs (default {}), defaults recording to
      artifacts/adoption and confines CLI output-dir there. ValueError, KeyError,
      TypeError and FileNotFoundError become exit 2; other exceptions propagate.
    recording: Each selected operation owns invoke_recorded(perform, metadata, output_dir).
      Execute perform exactly once; optional immutable result/provenance/log receipts
      preserve the same return object or original exception. Recording failures warn
      without replacing the outcome; parent-invocation context is restored.
    stopping: Complete after the selected operation and optional recording. Exceptions
      stop execution. No retry, convergence, checkpoint or orchestration loop exists.
      Finite metadata/result traversals remain helper internals.
    hub: Dependency-free adoption:invoke bypasses the dependency loop. Hub preflight
      or dry-run may stop before launch; post-execution write audit may mark failure.
# REUSE-IgnoreEnd
