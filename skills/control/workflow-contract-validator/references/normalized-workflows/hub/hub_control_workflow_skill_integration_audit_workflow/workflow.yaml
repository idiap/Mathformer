  - path: tests/mcp/run_integration_audit_workflow_tests.py
    selector: deterministic original/native/MCP/PRISM tests
    digest: sha256:8d8b8c5abfd0673ecfca1908579936b9d8db0758535aa0fa6c2bdf2806abf769
  - path: tests/mcp/fixtures/integration_audit_original.py.txt
    selector: frozen selected source main
    digest: sha256:58ef79156c0a320370585b2520b08c764e5fbe185b21b9fe7e9d577d8e330cc4
  - path: tests/test_matrix.json
    selector: mcp.integration_audit.workflow
    digest: sha256:fff1198d68051f3b3b28678d5fb25e8a044116b97722cb46813bb6bba4412a27
  gaps:
  - Finite helper traversals stay inside their owning native operation; there is no
    source convergence loop or retry. Parsed loop contracts are report metadata only.
  - The native CLI has no global timeout or operation ceiling; Lunar enforces the
    retained 3600 second and seven call contract budgets.
  - Hub preflight, dry-run and post-write auditing remain external controller behavior.
    MCP publishing invokes the service write policy and restricts output to the context
    repository artifacts/workflow_graphs directory; standalone CLI path semantics
    remain unchanged.
  - Options represent already parsed CLI values; argparse help and invalid argument
    handling remain at the CLI boundary. MCP exceptions terminate downstream execution
    without retries.
  - Required receipts, digests and provenance are produced by Lunar; the native CLI
    retains its original report writes and stdout. Serialized companions preserve
    insertion order through PRISM records.
extensions:
  mathformer.source:
    category: hub
    native_id: control:workflow-skill-integration-audit
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: control:workflow-skill-integration-audit
      summary: Audit how Mathformer skills are integrated into workflow graph artifacts.
      family: control
      kind: audit
      safety: writes_artifacts
      command:
      - '{python}'
      - scripts/audit_workflow_skill_integration.py
      - --json
      depends_on: []
      required_paths:
      - scripts/audit_workflow_skill_integration.py
      required_tools: []
      optional_tools: []
      writes:
      - artifacts/workflow_graphs/
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: Seven registered MCP tools reuse the ordered native helpers extracted
      from main/build_report. The original hub still invokes the CLI unchanged.
    stopping: Preflight errors or dry-run can stop before execution; undeclared writes
      are rejected afterward.
    failures: One pass without retries. Missing/malformed required inputs, mkdir/write
      failures, rendering errors and relative_to errors propagate. JSON may remain
      if later Markdown writing fails; both files may remain if result construction
      fails. Uncovered skills still yield ok true and exit 0.
    paths: Standalone CLI retains custom/absolute paths; MCP context root is within
      the repository and publish output is restricted to its artifacts/workflow_graphs
      subtree under service write policy.
    effects_status: Native filesystem calls with service write policy; Lunar runtime
      effect receipts.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    modeling: Ordered helper calls and their data dependencies; helper-local finite
      iteration stays internal.
  mathformer.step_semantics:
    resolve: scripts/audit_workflow_skill_integration.py:main parses CLI defaults,
      preserves absolute paths and prefixes relative paths with REPO_ROOT. Options
      represent parsed CLI arguments; the registered adapter calls the shared resolver.
    inventory: read_skill_inventory scans skills/*/*/SKILL.md then proj_skills/*/SKILL.md,
      sorted within each root. Carries the inventory dictionary, overwriting duplicate
      names with later entries. Reads UTF-8 with errors ignored, extracts name/description
      or fallbacks and infers theme. Finite discovered files bound traversal; no numerical
      cap or exhaustion failure exists.
    graph: graph_modeled_skills reads and parses graph JSON. Starts its modeled set
      from skill_inventory.modeled; only when empty unions hook.skill from ordered_hooks
      across all stacks. Carries the set over finite stacks/hooks, then returns sorted
      modeled names and summary (default empty object).
    registries: build_report calls parse_hook_registry before parse_agentic_hub. Pack
      their returned dictionaries as hooks and hub. Hook parsing extracts owners,
      direct routes, shared runtime skills, counts and loop-contract IDs; parsed loop
      contracts are metadata and are never executed. Documentation scans finite lines,
      carrying current category (initially Uncategorized), agents and category lists;
      headings update category and continue, matching link items update agents and
      append names. Return sorted category member lists.
    classify: 'classify_skills traverses sorted inventory names once, collecting ALL
      matching evidence and carrying rows/status buckets. Strongest status: visualized_in_graph
      if modeled; else workflow_hook_owner if owner; else direct_route_only if routed;
      else shared_runtime_only if runtime; else documented_agent_only if documented;
      else no_integration_evidence. Category defaults to Uncategorized and theme to
      misc. Finite inventory bounds traversal; return rows and sorted names within
      each bucket without failure for uncovered skills.'
    assemble: 'proposal_from_audit then build_report summary/return: compute bucket
      counts, predefined findings and recommendations, candidate stack IDs from parsed
      loop metadata, total counts and sorted theme Counter. Package summary, graph,
      hooks, hub categories, classification and proposal. Finite count comprehensions
      do not implement repair or refinement.'
    publish: 'main creates output directory, writes workflow_skill_integration_audit.json
      using ensure_ascii=False/indent=2/UTF-8, then calls render_markdown and writes
      workflow_skill_integration_audit.md in UTF-8. Renderer carries lines across
      finite summary/findings/buckets/recommendations/stacks; each bucket displays
      at most 12 names with remaining count. It lists every orphan if any, otherwise
      None. Construct result with repository-relative output paths, summary and bucket
      counts; print indented JSON if paths.json, otherwise ok: plus Markdown path;
      return 0.'
