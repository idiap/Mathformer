schema_version: workflow-skill/v1
namespace: mathformer
id: hub_control_workflow_skill_integration_audit_workflow
version: 1.0.0
kind: workflow
description: One-pass skill integration audit from the authoritative CLI main.
aliases:
- control:workflow-skill-integration-audit
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Options:
    schema:
      type: object
      properties:
        graph:
          type: string
          default: artifacts/workflow_graphs/workflow_graphs.json
        hooks:
          type: string
          default: skills/SKILL_HOOKS.yaml
        hub:
          type: string
          default: docs/architecture/AGENTIC_HUB.md
        output_dir:
          type: string
          default: artifacts/workflow_graphs
        json:
          type: boolean
          default: false
      additionalProperties: false
  Paths:
    schema:
      type: object
      required:
      - graph
      - hooks
      - hub
      - output_dir
      - json
      properties:
        graph:
          type: string
        hooks:
          type: string
        hub:
          type: string
        output_dir:
          type: string
        json:
          type: boolean
  Inventory:
    schema:
      type: object
      additionalProperties:
        type: object
        required:
        - path
        - description
        - root
        - theme
        properties:
          path:
            type: string
          description:
            type: string
          root:
            type: string
          theme:
            type: string
  Graph:
    schema:
      type: object
      required:
      - modeled
      - summary
      properties:
        modeled:
          type: array
          items:
            type: string
        summary:
          type: object
  Registries:
    schema:
      type: object
      required:
      - hooks
      - hub
      properties:
        hooks:
          type: object
        hub:
          type: object
  Classification:
    schema:
      type: object
      required:
      - rows
      - buckets
      properties:
        rows:
          type: array
          items:
            type: object
        buckets:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  Report:
    schema:
      type: object
      required:
      - summary
      - graph
      - hooks
      - hub_categories
      - classification
      - proposal
      properties:
        summary:
          type: object
        graph:
          type: object
        hooks:
          type: object
        hub_categories:
          type: object
        classification:
          type: object
        proposal:
          type: object
  Result:
    schema:
      type: object
      required:
      - ok
      - json_path
      - markdown_path
      - summary
      - bucket_counts
      properties:
        ok:
          const: true
        json_path:
          type: string
        markdown_path:
          type: string
        summary:
          type: object
        bucket_counts:
          type: object
          additionalProperties:
            type: integer
  ExitCode:
    schema:
      type: integer
      const: 0
  Context:
    schema:
      type: object
      required:
      - repository_root
      properties:
        repository_root:
          type: string
      additionalProperties: false
  Text:
    schema:
      type: string
inputs:
  options:
    type: Options
  context:
    type: Context
outputs:
  report:
    type: Report
    value:
      ref: flow.outputs.report
  result:
    type: Result
    value:
      ref: flow.outputs.result
  exit_code:
    type: ExitCode
    value:
      ref: flow.outputs.exit_code
  stdout:
    type: Text
    value:
      ref: flow.outputs.stdout
operations:
  resolve:
    inputs:
      options:
        type: Options
      context:
        type: Context
    outputs:
      paths:
        type: Paths
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_resolve
        operation: mathformer_integration_audit_resolve
  inventory:
    inputs:
      context:
        type: Context
    outputs:
      inventory:
        type: Inventory
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_inventory
        operation: mathformer_integration_audit_inventory
  graph:
    inputs:
      paths:
        type: Paths
    outputs:
      graph:
        type: Graph
      graph_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_graph
        operation: mathformer_integration_audit_graph
  registries:
    inputs:
      paths:
        type: Paths
    outputs:
      registries:
        type: Registries
      registries_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_registries
        operation: mathformer_integration_audit_registries
  classify:
    inputs:
      inventory:
        type: Inventory
      graph:
        type: Graph
      registries:
        type: Registries
    outputs:
      classification:
        type: Classification
      classification_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_classify
        operation: mathformer_integration_audit_classify
  assemble:
    inputs:
      inventory:
        type: Inventory
      graph:
        type: Graph
      registries:
        type: Registries
      classification:
        type: Classification
      graph_json:
        type: Text
      registries_json:
        type: Text
      classification_json:
        type: Text
    outputs:
      report:
        type: Report
      report_json:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_assemble
        operation: mathformer_integration_audit_assemble
  publish:
    inputs:
      paths:
        type: Paths
      report:
        type: Report
      context:
        type: Context
      report_json:
        type: Text
    outputs:
      result:
        type: Result
      exit_code:
        type: ExitCode
      stdout:
        type: Text
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_integration_audit_publish
        operation: mathformer_integration_audit_publish
flow:
  kind: sequence
  steps:
  - id: resolve
    kind: call
    operation: resolve
    arguments:
      options:
        ref: inputs.options
      context:
        ref: inputs.context
  - id: inventory
    kind: call
    operation: inventory
    arguments:
      context:
        ref: inputs.context
  - id: graph
    kind: call
    operation: graph
    arguments:
      paths:
        ref: steps.resolve.outputs.paths
  - id: registries
    kind: call
    operation: registries
    arguments:
      paths:
        ref: steps.resolve.outputs.paths
  - id: classify
    kind: call
    operation: classify
    arguments:
      inventory:
        ref: steps.inventory.outputs.inventory
      graph:
        ref: steps.graph.outputs.graph
      registries:
        ref: steps.registries.outputs.registries
  - id: assemble
    kind: call
    operation: assemble
    arguments:
      inventory:
        ref: steps.inventory.outputs.inventory
      graph:
        ref: steps.graph.outputs.graph
      registries:
        ref: steps.registries.outputs.registries
      classification:
        ref: steps.classify.outputs.classification
      graph_json:
        ref: steps.graph.outputs.graph_json
      registries_json:
        ref: steps.registries.outputs.registries_json
      classification_json:
        ref: steps.classify.outputs.classification_json
  - id: publish
    kind: call
    operation: publish
    arguments:
      paths:
        ref: steps.resolve.outputs.paths
      report:
        ref: steps.assemble.outputs.report
      context:
        ref: inputs.context
      report_json:
        ref: steps.assemble.outputs.report_json
  outputs:
    report:
      type: Report
      value:
        ref: steps.assemble.outputs.report
    result:
      type: Result
      value:
        ref: steps.publish.outputs.result
    exit_code:
      type: ExitCode
      value:
        ref: steps.publish.outputs.exit_code
    stdout:
      type: Text
      value:
        ref: steps.publish.outputs.stdout
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_graphs/
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 7
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Integration evidence only; no scientific validity or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/audit_workflow_skill_integration.py
    selector: main; read_skill_inventory; graph_modeled_skills; parse_hook_registry;
      parse_agentic_hub; classify_skills; assemble_report; resolve_paths; publish_report
    digest: sha256:fd5d06f0cca193750808529263e8cc3032894610e00ab952a7577ffb94de88e6
  - path: scripts/mathformer.py
    selector: build_registry/control:workflow-skill-integration-audit; run_action;
      run_leaf_action; preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/integration_audit_tools.py
    selector: register_integration_audit_tools
    digest: sha256:7eccaac5d867cb1703d2182255626f19dd42239fdef8a1484f5474d5b0d0a2ea
  - path: scripts/mcp_server.py
    selector: MCP registration
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
