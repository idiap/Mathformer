  gaps:
  - Child admission, preflight, subprocess, critic helpers and write auditing remain
    native inside visit; coverage is partial at this operation boundary.
  - Unknown-action admission is implemented by the native source but unreachable for
    this fixed registered alias. Registry specialization requires exactly one dependency
    and no parent command.
  - The 3600-second and six-call ceilings are Lunar budgets, not native subprocess
    limits; the registered child timeout remains None, with no retry.
  - Capability qualification placeholders in the supplied policy are retained; they
    grant no additional authority.
extensions:
  mathformer.source:
    category: hub
    native_id: physics-lib:coherence-integration-critic
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lib:coherence-integration-critic
      summary: Alias for MathformerPhysicsLib integration critic.
      family: mathformerphysicslib
      kind: sequence
      safety: read_only
      command: []
      depends_on:
      - mathformerphysicslib:integration-critic
      required_paths: []
      required_tools: []
      optional_tools: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: Callable MCP tools delegate directly to shared hub functions; visit
      recursively executes the registered child. The explicit repository_root mount
      is passed to preflight, subprocess cwd, and both write snapshots.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    failure_policy: Return native ok/status as data; propagate unexpected exceptions.
    scientific_payloads: HubResult is the transport envelope; scientific JSON stays
      in captured stdout.
    leaf: Preflight errors return immediately; dry_run returns before snapshot/launch;
      otherwise snapshot, launch critic_integration.py --self-test --json, then audit
      writes.
    success: Exit code zero plus successful write auditing; the printed report's ok
      field is not checked.
    timeout_seconds: null
    retries: 0
    adapter: Transport-only carry preserves rejected admission through a top-level
      loop because Lunar requires scoped exit handling for branch-local loops. Rejected
      admissions perform no dependency visit. Accepted admissions execute the original
      single dependency and stop at the first transition.
  mathformer.composition:
    ordered_dependencies:
    - mathformerphysicslib:integration-critic
    dependency_workflows:
    - hub_mathformerphysicslib_integration_critic_workflow
    command_after_dependencies: false
    keep_going_semantics: Stop on failure unless keep_going; dependencies_ok remains
      false after failure.
    extra_args_for_sequence: rejected by run_action
    specialization: Fixed build_registry alias with exactly one child and no parent
      command; absent CLI extra_args and seen are represented by explicit empty arrays.
    bound: Native exhaustion returns normally after one child, including failure;
      on_exhausted is unreachable for this registry.
  mathformer.critic:
    order: self_test_payload, canonicalize(summary), critic_integration, print JSON,
      return zero.
    actual_self_test: Summary lacks inventory metadata and concept_occurrence_index;
      final scan is empty and emits missing_foundations_index (high) and manifest_missing_foundations
      (medium), with report ok=false.
    native_scan: Initialize metadata findings and fixed Foundations.lean path; inspect
      every concept to iterable exhaustion, append high findings for owned Foundations
      modules without an existing index, and report ok only without high findings.
    stopping: No early exit, native concept-count cap, retry or exception suppression.
    adapter_bound: The separate MCP adapter's 1000-concept bound does not apply.
