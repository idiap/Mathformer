schema_version: workflow-skill/v1
namespace: mathformer
id: hub_paper_claim_audit_rfde_workflow
version: 1.0.0
kind: workflow
description: RFDE claim audit with its native hub dependency and subprocess boundary.
aliases:
- paper:claim-audit-rfde
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  Arguments:
    schema:
      type: array
      items:
        type: string
  Ancestry:
    schema:
      type: array
      items:
        type: string
      uniqueItems: true
  Boolean:
    schema:
      type: boolean
  Admission:
    schema:
      type: object
      required:
      - accepted
      - status
      - ancestry
      properties:
        accepted:
          type: boolean
        status:
          type: string
        ancestry:
          type: array
          items:
            type: string
      description: Native accepted/status/ancestry record.
  DependencyState:
    schema:
      type: object
      required:
      - index
      - children
      - dependencies_ok
      - ancestry
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 1
        children:
          type: array
          items:
            type: object
          maxItems: 1
        dependencies_ok:
          type: boolean
        ancestry:
          type: array
          items:
            type: string
  Boundary:
    schema:
      type: object
      required:
      - execute
      - payload
      - snapshot
      - continuation
      properties:
        execute:
          type: boolean
        payload:
          type: object
        snapshot:
          type: object
        continuation:
          type: string
          minLength: 1
  AuditAttempt:
    schema:
      type: object
      required:
      - ready
      - continuation
      properties:
        ready:
          type: boolean
        continuation:
          type: string
          minLength: 1
      description: Service-local single-use continuation of one audit subprocess;
        ready=false carries its captured native failure. Scan findings, text and packet
        stay on the native main stack until emit resumes it.
inputs:
  context:
    type: RunContext
  extra_args:
    type: Arguments
  ancestry:
    type: Ancestry
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  admit:
    inputs:
      extra_args:
        type: Arguments
      ancestry:
        type: Ancestry
    outputs:
      admission:
        type: Admission
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_admit
        operation: mathformer_paper_claim_audit_rfde_admit
  reject:
    inputs:
      admission:
        type: Admission
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_reject
        operation: mathformer_paper_claim_audit_rfde_reject
  initialize:
    inputs:
      admission:
        type: Admission
    outputs:
      state:
        type: DependencyState
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_initialize
        operation: mathformer_paper_claim_audit_rfde_initialize
  visit:
    inputs:
      context:
        type: RunContext
      state:
        type: DependencyState
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_visit
        operation: mathformer_paper_claim_audit_rfde_visit
  advance:
    inputs:
      context:
        type: RunContext
      state:
        type: DependencyState
      child:
        type: HubResult
    outputs:
      state:
        type: DependencyState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_advance
        operation: mathformer_paper_claim_audit_rfde_advance
  guard:
    inputs:
      context:
        type: RunContext
      state:
        type: DependencyState
    outputs:
      run:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_guard
        operation: mathformer_paper_claim_audit_rfde_guard
  finish_dependencies:
    inputs:
      state:
        type: DependencyState
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_finish_dependencies
        operation: mathformer_paper_claim_audit_rfde_finish_dependencies
  prepare:
    inputs:
      context:
        type: RunContext
    outputs:
      boundary:
        type: Boundary
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_prepare
        operation: mathformer_paper_claim_audit_rfde_prepare
  scan_main:
    inputs:
      boundary:
        type: Boundary
    outputs:
      attempt:
        type: AuditAttempt
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_scan_main
        operation: mathformer_paper_claim_audit_rfde_scan_main
  emit_main:
    inputs:
      attempt:
        type: AuditAttempt
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_emit_main
        operation: mathformer_paper_claim_audit_rfde_emit_main
  captured_failure:
    inputs:
      attempt:
        type: AuditAttempt
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_captured_failure
        operation: mathformer_paper_claim_audit_rfde_captured_failure
  finish_leaf:
    inputs:
      boundary:
        type: Boundary
      leaf:
        type: HubResult
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_finish_leaf
        operation: mathformer_paper_claim_audit_rfde_finish_leaf
  unlaunched:
    inputs:
      boundary:
        type: Boundary
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_unlaunched
        operation: mathformer_paper_claim_audit_rfde_unlaunched
  aggregate:
    inputs:
      state:
        type: DependencyState
      leaf:
        type: HubResult
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_claim_audit_rfde_aggregate
        operation: mathformer_paper_claim_audit_rfde_aggregate
flow:
  kind: sequence
  steps:
  - id: admit
    kind: call
    operation: admit
    arguments:
      extra_args:
        ref: inputs.extra_args
      ancestry:
        ref: inputs.ancestry
  - id: admitted
    kind: switch
    cases:
    - id: 'yes'
      when:
        ref: steps.admit.outputs.admission.accepted
      body:
        kind: sequence
        steps:
        - id: initialize
          kind: call
          operation: initialize
          arguments:
            admission:
              ref: steps.admit.outputs.admission
        - kind: sequence
          steps:
          - id: visit
            kind: call
            operation: visit
            arguments:
              context:
                ref: inputs.context
              state:
                ref: steps.initialize.outputs.state
          - id: advance
            kind: call
            operation: advance
            arguments:
              context:
                ref: inputs.context
              state:
                ref: steps.initialize.outputs.state
              child:
                ref: steps.visit.outputs.child
          outputs:
            state:
              type: DependencyState
              value:
                ref: steps.advance.outputs.state
          id: dependencies
          description: Finite unrolling of the sole registered dependency. Native
            advance sets done at index one; native exhaustion is unreachable.
        - id: guard
          kind: call
          operation: guard
          arguments:
            context:
              ref: inputs.context
            state:
              ref: steps.dependencies.outputs.state
        - id: command
          kind: switch
          cases:
          - id: 'yes'
            when:
              ref: steps.guard.outputs.run
            body:
              kind: sequence
              steps:
              - id: prepare
                kind: call
                operation: prepare
                arguments:
                  context:
                    ref: inputs.context
              - id: launch
                kind: switch
                cases:
                - id: 'yes'
                  when:
                    ref: steps.prepare.outputs.boundary.execute
                  body:
                    kind: sequence
                    steps:
                    - id: scan
                      kind: call
                      operation: scan_main
                      arguments:
                        boundary:
                          ref: steps.prepare.outputs.boundary
                    - id: emit
                      kind: switch
                      cases:
                      - id: 'yes'
                        when:
                          ref: steps.scan.outputs.attempt.ready
                        body:
                          id: emit
                          kind: call
                          operation: emit_main
                          arguments:
                            attempt:
                              ref: steps.scan.outputs.attempt
                      default:
                        id: failed
                        kind: call
                        operation: captured_failure
                        arguments:
                          attempt:
                            ref: steps.scan.outputs.attempt
                      outputs:
                        result:
                          type: HubResult
                          value:
                            ref: selected.outputs.result
                    - id: finish
                      kind: call
                      operation: finish_leaf
                      arguments:
                        boundary:
                          ref: steps.prepare.outputs.boundary
                        leaf:
                          ref: steps.emit.outputs.result
                    outputs:
                      result:
                        type: HubResult
                        value:
                          ref: steps.finish.outputs.result
                default:
                  id: unlaunched
                  kind: call
                  operation: unlaunched
                  arguments:
                    boundary:
                      ref: steps.prepare.outputs.boundary
                outputs:
                  result:
                    type: HubResult
                    value:
                      ref: selected.outputs.result
              - id: aggregate
                kind: call
                operation: aggregate
                arguments:
                  state:
                    ref: steps.dependencies.outputs.state
                  leaf:
                    ref: steps.launch.outputs.result
              outputs:
                result:
                  type: HubResult
                  value:
                    ref: steps.aggregate.outputs.result
          default:
            id: finish_dependencies
            kind: call
            operation: finish_dependencies
            arguments:
              state:
                ref: steps.dependencies.outputs.state
          outputs:
            result:
              type: HubResult
              value:
                ref: selected.outputs.result
        outputs:
          result:
            type: HubResult
            value:
              ref: steps.command.outputs.result
    default:
      id: reject
      kind: call
      operation: reject
      arguments:
        admission:
          ref: steps.admit.outputs.admission
    outputs:
      result:
        type: HubResult
        value:
          ref: selected.outputs.result
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.admitted.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/paper_skills/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 16
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked description only; completion establishes no scientific
    correctness or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: build_registry:paper:claim-audit-rfde; run_action and dependency/leaf
      helpers
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: paper_skills/paper-claim-evidence-auditor/scripts/audit_paper_claims.py
    selector: main; after_scan checkpoint retains native scan and emission in one
      process
    digest: sha256:95e504f313b50a67b8d6709377217f7ad4388143bcc820525f47aab654f4fa79
  - path: scripts/paper_claim_audit_rfde_tools.py
    selector: register_paper_claim_audit_rfde_tools
    digest: sha256:9f3dcb4b46f17a6e068c118474d27f76c3f5b2f4be077c9f44830f15098ff2c0
  - path: scripts/mcp_server.py
    selector: RFDE tool registration and service write guard
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory authored RFDE contract selection
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/mcp/run_paper_claim_audit_rfde_workflow_tests.py
    selector: 'PaperClaimAuditTests: isolated native fixtures, registered MCP bindings
      and real Lunar/PRISM'
    digest: sha256:4ba572e2ff2c8a98b1bcc9cce8bf7e0493408fd89a559cb1433d16e177a63571
  - path: tests/mcp/fixtures/paper_claim_audit_original.py
    selector: Frozen selected source before addition of after_scan checkpoint
    digest: sha256:5e7a80f5117a75589ea2c5a4cf927090c0ab0c44d954576736046a7b924b3618
  gaps:
  - Recursive evidence-packet implementation remains an opaque native hub call. Audit
    main retains its finite scan loops internally; scan and emit share a single paused
    subprocess and native stack.
  - Audit helper loops remain internal, exhaust finite input data and have no numeric
    truncation, retry, refinement or convergence test.
  - Hub specialization supplies packet, output and --json; optional packet/output
    and text-output paths of the generic CLI are outside this specialization.
  - Neither subprocess has a timeout. 3600 seconds and 16 block calls are descriptor
    budgets, not native enforcement; recursive child internals are opaque.
  - Required receipts/digests/provenance are contract requirements; native optional
    logs and reports do not establish them. Effects require qualification.
extensions:
  mathformer.source:
    category: hub
    native_id: paper:claim-audit-rfde
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: paper:claim-audit-rfde
      family: paper
      kind: validation
      safety: writes_artifacts
      depends_on:
      - paper:evidence-packet
      allows_extra_args: false
      timeout_seconds: null
      writes:
      - artifacts/paper_skills/
  mathformer.native_boundary:
    execution: Registered MCP stages reuse the native hub helpers. scan_main launches
      native main with an after_scan checkpoint; emit_main resumes that same subprocess.
      Handles are service-local and single use, with cleanup at service exit.
    failure_policy: Native failed results remain values; unexpected controller exceptions
      propagate.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    scientific_payloads: HubResult is a transport envelope; report remains JSON file/stdout.
  mathformer.composition:
    ordered_dependencies:
    - paper:evidence-packet
    dependency_workflows:
    - hub_paper_evidence_packet_workflow
    called_by:
    - paper:functionality-update-suite
    command_after_dependencies: true
    dependency_iteration_bound: 1
    dependency_loop_lowering: One visit/advance pair; exact finite unrolling because
      the fixed registry contains one dependency. No native exhaustion path exists.
  mathformer.specialization:
    paper: paper/REFERENCE_FREE_REFINEMENT_DYNAMICS.tex
    packet: artifacts/paper_skills/new_functionality_evidence_packet.json
    output: artifacts/paper_skills/rfde_paper_claim_audit.json
    json: true
    invocation: Default CLI ancestry and extra_args are empty arrays; callers may
      supply inherited ancestry. Registry identity and dependency count are fixed.
  mathformer.operation_sources:
    admit: scripts/mathformer.py::admit_action; fixed action paper:claim-audit-rfde
      in build_registry. Reject unknown identity, ancestry cycles, then extra args
      for composed actions. Copy ancestry and add identity.
    reject: scripts/mathformer.py::reject_action; return ok=false with native rejection
      status and cycle details, without dependencies.
    initialize: scripts/mathformer.py::initialize_dependencies; pack index=0, children=[],
      dependencies_ok=true and copied admission ancestry.
    visit: scripts/mathformer.py::visit_dependency/run_action; invoke sole dependency
      paper:evidence-packet using state.index and state.ancestry, no extra args. Retain
      recursive admission, preflight, dry-run, subprocess and write auditing. Child
      failures are values.
    advance: scripts/mathformer.py::advance_dependencies; pack index+1, append child
      once, AND cumulative dependencies_ok with child.ok, preserve ancestry. done
      iff index equals dependency count or failed child and not keep_going.
    guard: scripts/mathformer.py::dependency_command_guard; command exists AND (dependencies_ok
      OR context.keep_going).
    finish_dependencies: scripts/mathformer.py::finish_dependencies; preserve collected
      children and aggregate ok, sequence_completed/sequence_failed.
    prepare: scripts/mathformer.py::prepare_leaf_boundary/preflight; fixed argv, no
      extra args. Errors return execute=false and failed payload; otherwise dry_run
      returns execute=false, status=dry_run; otherwise snapshot before execution.
    scan_main: 'audit_paper_claims.py::main through findings.extend(audit_figure_sources(text));
      native main starts in one subprocess, pausing at after_scan with its live stack.
      The registered adapter uses complete_leaf_boundary to pack captured output.
      Resolve fixed paths; read UTF-8 paper then JSON packet. Accumulate findings
      in order: three overclaim regexes and all matches, packet missing_paths, five
      category mention checks and packet_type check, then includegraphics matches
      with up to three exists checks each, short-circuiting any. Medium missing-path
      findings use packet declarations, not a fresh path scan. Helpers own finite
      data-sized loops, append state and line calculations. File/JSON or scan errors
      propagate out of main; enclosing subprocess captures nonzero exit/stderr as
      ready=false, not a workflow exception. Launch errors propagate.'
    emit_main: audit_paper_claims.py::main remaining statements, within same subprocess;
      sort findings by severity high/medium/low, line or 10**9, id. Build report with
      ok iff no high, resolved paths, five keyword-category counts, normalized packet
      feature count, finding_count and findings. Counts accumulate over finite category
      keywords; no refinement. Create output parent and write indented sorted-key
      JSON plus newline, then print JSON. Exit 1 for high findings, otherwise 0, even
      with medium/low findings. Emission exceptions propagate out of main and become
      captured subprocess failure. Return launch_leaf_boundary payload with stdout/stderr/returncode/ok.
    captured_failure: scripts/paper_claim_audit_rfde_tools.py::captured_failure and
      scripts/mathformer.py::complete_leaf_boundary; expose the captured native child
      failure when main terminated before emission. No audit report is fabricated.
    finish_leaf: scripts/mathformer.py::finish_leaf_boundary; after-snapshot and write
      audit; undeclared writes force ok=false/status=undeclared_writes and append
      stderr even after exit 0.
    unlaunched: scripts/mathformer.py::run_leaf_action; return prepare_leaf_boundary
      payload unchanged on preflight failure or dry-run, no subprocess or after-snapshot.
    aggregate: scripts/mathformer.py::aggregate_dependencies; ok=dependencies_ok AND
      leaf.ok; completed_with_dependencies or failed_with_dependencies; retain children
      and leaf.
