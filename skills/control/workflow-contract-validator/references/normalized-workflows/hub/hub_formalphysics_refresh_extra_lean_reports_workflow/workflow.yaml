schema_version: workflow-skill/v1
namespace: mathformer
id: hub_formalphysics_refresh_extra_lean_reports_workflow
version: 1.0.0
kind: workflow
description: Refresh eight fixed FormalPhysics Lean cases in insertion order; return
  0 only after all finish.
aliases:
- formalphysics:refresh-extra-lean-reports
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Cursor:
    schema:
      type: integer
      minimum: 0
      maximum: 8
  Done:
    schema:
      type: boolean
  ExitCode:
    schema:
      type: integer
      const: 0
  Case:
    schema:
      type: object
      required:
      - case_id
      - rank
      - features
      properties:
        case_id:
          type: string
        rank:
          type: string
        features:
          type: array
          items:
            type: string
      additionalProperties: false
  CaseFiles:
    schema:
      type: object
      required:
      - case_id
      - source
      - lean
      - directory
      properties:
        case_id:
          type: string
        source:
          type: string
        lean:
          type: string
        directory:
          type: string
      additionalProperties: false
  RepositoryRoot:
    schema:
      type: string
      minLength: 1
inputs:
  repository_root:
    type: RepositoryRoot
outputs:
  exit_code:
    type: ExitCode
    value:
      literal: 0
operations:
  select_case:
    inputs:
      cursor:
        type: Cursor
    outputs:
      case:
        type: Case
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_select_case
        operation: mathformer_refresh_select_case
  prepare_compile:
    inputs:
      case:
        type: Case
      repository_root:
        type: RepositoryRoot
    outputs:
      files:
        type: CaseFiles
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_prepare_compile
        operation: mathformer_refresh_prepare_compile
  packets:
    inputs:
      case:
        type: Case
      files:
        type: CaseFiles
      repository_root:
        type: RepositoryRoot
    outputs:
      files:
        type: CaseFiles
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_packets
        operation: mathformer_refresh_packets
  critics:
    inputs:
      files:
        type: CaseFiles
      repository_root:
        type: RepositoryRoot
    outputs:
      files:
        type: CaseFiles
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_critics
        operation: mathformer_refresh_critics
  reviews:
    inputs:
      files:
        type: CaseFiles
      repository_root:
        type: RepositoryRoot
    outputs:
      files:
        type: CaseFiles
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_reviews
        operation: mathformer_refresh_reviews
  aggregate_copy:
    inputs:
      files:
        type: CaseFiles
      repository_root:
        type: RepositoryRoot
    outputs:
      files:
        type: CaseFiles
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_aggregate_copy
        operation: mathformer_refresh_aggregate_copy
  advance:
    inputs:
      cursor:
        type: Cursor
      completed:
        type: CaseFiles
    outputs:
      cursor:
        type: Cursor
      done:
        type: Done
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_refresh_advance
        operation: mathformer_refresh_advance
flow:
  kind: loop
  description: Exactly eight successful iterations; the eighth exits normally, not
    by exhaustion.
  state_type: Cursor
  initial:
    literal: 0
  max_iterations: 8
  on_exhausted: fail
  body:
    kind: sequence
    steps:
    - id: select
      kind: call
      operation: select_case
      arguments:
        cursor:
          ref: loop.state
    - id: compile
      kind: call
      operation: prepare_compile
      arguments:
        case:
          ref: steps.select.outputs.case
        repository_root:
          ref: inputs.repository_root
    - id: packets
      kind: call
      operation: packets
      arguments:
        case:
          ref: steps.select.outputs.case
        files:
          ref: steps.compile.outputs.files
        repository_root:
          ref: inputs.repository_root
    - id: critics
      kind: call
      operation: critics
      arguments:
        files:
          ref: steps.packets.outputs.files
        repository_root:
          ref: inputs.repository_root
    - id: reviews
      kind: call
      operation: reviews
      arguments:
        files:
          ref: steps.critics.outputs.files
        repository_root:
          ref: inputs.repository_root
    - id: publish
      kind: call
      operation: aggregate_copy
      arguments:
        files:
          ref: steps.reviews.outputs.files
        repository_root:
          ref: inputs.repository_root
    - id: advance
      kind: call
      operation: advance
      arguments:
        cursor:
          ref: loop.state
        completed:
          ref: steps.publish.outputs.files
    outputs:
      cursor:
        type: Cursor
        value:
          ref: steps.advance.outputs.cursor
      done:
        type: Done
        value:
          ref: steps.advance.outputs.done
  next_state:
    ref: body.outputs.cursor
  until:
    ref: body.outputs.done
  outputs:
    completed_cases:
      type: Cursor
      value:
        ref: loop.state
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_hub/
      - artifacts/physics_lean/from_scratch_lean/
      - libraries/MathformerPhysicsLib/Lean/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 56
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Report generation and compiler success establish neither scientific
    truth nor promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/refresh_formalphysics_extra_lean_reports.py
    selector: main; refresh_case; select_case; prepare_compile; packets; critics;
      reviews; aggregate_copy; advance; run; run_lean; CASES
    digest: sha256:a4f91228353cc250f5c7ae05d37838d794cf74ce9de464abb4feea3602ddb4a3
  - path: scripts/mathformer.py
    selector: formalphysics:refresh-extra-lean-reports; run_action; run_leaf_action;
      preflight
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/formalphysics_refresh_tools.py
    selector: register_refresh_tools
    digest: sha256:612d8e40fb8852adef2a81eb327bffc6eb68c2e6866daf4f3434ec390a373c79
  - path: scripts/mcp_server.py
    selector: register_refresh_tools; _refresh_reports_guard
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory authored refresh-extra-lean-reports contract
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Helper internals remain native; CaseFiles is a per-case filesystem locator, not
    report payload validation.
  - Native subprocesses have no timeout; Lunar applies the declared workflow wall-time
    and operation budgets.
  - Hub preflight and post-execution undeclared-write audit apply to hub invocation;
    block tools enforce service read-only/write-root controls and require host authorization.
extensions:
  mathformer.source:
    category: hub
    native_id: formalphysics:refresh-extra-lean-reports
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: formalphysics:refresh-extra-lean-reports
      family: physics_lean
      kind: generation
      safety: writes_repo
      command:
      - '{python}'
      - scripts/refresh_formalphysics_extra_lean_reports.py
      depends_on: []
      writes:
      - libraries/MathformerPhysicsLib/Lean/
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: Hub preflight may block or return a dry run before main; post-execution
      undeclared-write audit may mark failure.
    failure_policy: Nonzero Lean/helper exit raises RuntimeError; file/process exceptions
      propagate, stopping all cases with completed writes retained.
    helper_output: run saves stdout only when an output argument is supplied and that
      file does not exist; subprocess handling stays inside its owner.
    case_order:
    - formalphysics_0066
    - formalphysics_0191
    - formalphysics_0172
    - formalphysics_0119
    - formalphysics_0026
    - formalphysics_0176
    - formalphysics_0054
    - formalphysics_0059
    rank_order:
    - '03'
    - '04'
    - '05'
    - '06'
    - '07'
    - 08
    - 09
    - '10'
    iteration: Cursor is iterator-position projection only; no cross-case accumulator,
      repair, retry, or convergence test.
    bound: Fixed CASES has eight entries; done is true on iteration eight and main
      returns 0. Exhaustion failure is unreachable for this source.
    outputs: Per-case candidate, compiler log, packets, critic reports, both reviews,
      aggregate and library copy remain on disk; printed IDs follow completed cases.
    context: repository_root supplies the real source filesystem context; CLI defaults
      remain the repository root. Native helper argv, cwd, outputs and failure propagation
      are preserved. Case ID output uses the MCP diagnostic stream.
# REUSE-IgnoreEnd
