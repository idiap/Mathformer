schema_version: workflow-skill/v1
namespace: mathformer
id: route_control_reasoning_log_html_workflow
version: 1.0.0
kind: workflow
description: Execute the selected single-action reasoning-log HTML route through native
  controls.
aliases:
- control.reasoning.log.html
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  ActionId:
    schema:
      type: string
      const: control:reasoning-log-html
  Boolean:
    schema:
      type: boolean
  RouteState:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          maxItems: 1
          items:
            type: object
      required:
      - ok
      - children
      additionalProperties: false
  Match:
    schema:
      type: object
      required:
      - route
      - score
      - matched_terms
      properties:
        route:
          type: object
          required:
          - route_id
          - action_ids
          properties:
            route_id:
              const: control.reasoning.log.html
            action_ids:
              const:
              - control:reasoning-log-html
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
  Registry:
    schema:
      type: object
      additionalProperties:
        type: object
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
inputs:
  context:
    type: RunContext
  match:
    type: Match
  registry:
    type: Registry
  repository_root:
    type: RepositoryRoot
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: RouteState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_html_route_initialize
        operation: mathformer_html_route_initialize
  select_action:
    inputs:
      state:
        type: RouteState
      match:
        type: Match
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_html_route_select_action
        operation: mathformer_html_route_select_action
  execute_action:
    inputs:
      action_id:
        type: ActionId
      context:
        type: RunContext
      registry:
        type: Registry
      repository_root:
        type: RepositoryRoot
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_html_route_execute_action
        operation: mathformer_html_route_execute_action
  advance:
    inputs:
      state:
        type: RouteState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: RouteState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_html_route_advance
        operation: mathformer_html_route_advance
  finish:
    inputs:
      state:
        type: RouteState
      match:
        type: Match
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_html_route_finish
        operation: mathformer_html_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments: {}
  - id: route_actions
    kind: loop
    description: Exactly one route action; done is true after its result is appended.
      The literal bound is exact, with normal termination on that iteration.
    state_type: RouteState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select_action
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: execute
        kind: call
        operation: execute_action
        description: Admission rejection, preflight errors or dry_run return child
          data without launching. Otherwise execute the registered renderer once with
          no extra_args, capture stdout/stderr and return code, then audit writes
          against artifacts/. Undeclared writes set ok=false. Failed child data continues
          to advance; unexpected launch errors propagate and prevent route finalization.
        arguments:
          action_id:
            ref: steps.select.outputs.action_id
          context:
            ref: inputs.context
          registry:
            ref: inputs.registry
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.execute.outputs.child
          context:
            ref: inputs.context
      outputs:
        state:
          type: RouteState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Boolean
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: RouteState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.route_actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Rendering and route completion establish no scientific truth or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - intent_run_completed
  - intent_run_failed
provenance:
  coverage: interface_only
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes; initialize_intent_state; select_intent_action;
      advance_intent_state; finish_intent_state; run_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: skills/control/reasoning-log-schema-guardian/scripts/render_reasoning_log_html.py
    selector: main
    digest: sha256:f31ccd9b650ed4330787dc9d9c8c9debba2a64379001e73ab4d12533c1a24ab2
  - path: scripts/mcp_server.py
    selector: mathformer_run_workflow
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/reasoning_log_html_route_tools.py
    selector: register_reasoning_log_html_route_tools; selected_match; checked_registry;
      check_state
    digest: sha256:eb2d176961093aacc61629d8f8dba602a39069e537eff19e342afa4eda4e80a2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: reasoning_log_html_route_descriptor; inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Native action and renderer internals remain opaque inside execute_action; no full
    Python equivalence is claimed.
  - Lunar enforces the normalized 3600-second budget; the native action timeout remains
    None.
  - Lunar supplies execution receipts, effect records and provenance; optional native
    logging is unchanged.
extensions:
  mathformer.source:
    category: route
    native_id: control.reasoning.log.html
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: control.reasoning.log.html
      title: Render a reasoning log as HTML
      action_ids:
      - control:reasoning-log-html
      skill_routes:
      - reasoning-log-schema-guardian
  mathformer.native_boundary:
    execution: scripts/mathformer.py::run_intent_match; YAML is a generated projection.
    captured_inputs: Selected match, native registry projection, RunContext and optional
      repository mount are explicit ports. Registry and route values are checked against
      native declarations; renderer extra_args remain absent.
    selection: Already selected route; NL ranking and caller admission stay outside
      this graph.
    extra_args: Route execution forwards none; MCP rejects nonempty route extra_args.
    failure_policy: Failed child payloads are data; sticky aggregate failure selects
      intent_run_failed.
    renderer: Parse options; select supplied log or artifacts/reasoning/self_test/good.jsonl.
      If missing, generate repository fixtures without creating arbitrary requested
      inputs. Resolve paths, load JSONL events, validate unless --no-validation, build
      self-contained HTML, create output directories, write HTML and print its path.
      Validation blockers still write HTML, then exit 2; otherwise 0. Unhandled input,
      render or write errors terminate the renderer subprocess and become a failed
      captured child result.
    traversal: Finite input-line, event, invocation and finding traversals stay inside
      rendering; no retry or convergence loop or event-count cap.
    output_artifact: Default artifacts/reasoning/self_test/good.html; path appears
      in child stdout, not a separate route artifact port.
    limits: One run_action invocation; no native action timeout; five modeled block
      calls.
# REUSE-IgnoreEnd
