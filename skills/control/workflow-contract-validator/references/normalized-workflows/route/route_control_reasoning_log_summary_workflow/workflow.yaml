  gaps:
  - Action internals remain inside native run_action; its loaded-event traversal and
    validation/audit helpers are opaque to the route graph.
  - The 3600-second budget is enforced by Lunar, not the native route; its subprocess
    has no timeout or retry. Legacy MCP dispatch applies its separate timeout default.
  - The separate staged MCP loader's 10000-event cap does not apply; no event-count
    specialization is imposed.
  - Mandatory v1 receipts and digests are supplied by Lunar; native optional logging
    remains caller-owned.
  - Fixture creation can violate this read_only action's empty declared write roots;
    native write auditing must still fail it.
extensions:
  mathformer.source:
    category: route
    native_id: control.reasoning.log.summary
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: control.reasoning.log.summary
      title: Summarize reasoning logs for consumer applications
      action_ids:
      - control:reasoning-log-summary
      operator_note: Read-only JSON summary; pass a log path via extra args for a
        specific log.
  mathformer.native_boundary:
    execution: Registered mathformer_summary_route_* tools delegate to shared native
      controller functions; CLI and legacy MCP dispatch retain their controller.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Preserve failed child payloads and aggregate failure; unexpected
      exceptions propagate.
    scientific_payloads: HubResult is a transport envelope; leaf JSON is captured
      stdout.
    inputs: SelectedMatch restores the source-owned route; required registry projection
      must match native declarations. Nullable repository_root selects hub.REPO_ROOT
      when null.
    extra_arguments: Route forwards none; normalized MCP dispatch rejects nonempty
      extras despite the operator note.
    reports: Optional CLI report writing and MCP call logging stay with their callers,
      outside run_intent_match.
    service_authority: Non-dry-run MCP execution requires service write permission
      and a permitted artifacts/reasoning/self_test/ root because the native leaf
      may create fixtures. Native admission and write auditing remain unchanged.
    timing: The bound action keeps timeout_seconds=None; Lunar enforces the enclosing
      contract wall time. No retry or event cap is added.
  mathformer.composition:
    ordered_actions:
    - control:reasoning-log-summary
    action_workflows:
    - hub_control_reasoning_log_summary_workflow
    keep_going_semantics: Sticky failure; one action makes early stopping and exhaustion
      coincide with normal iterator completion.
    selection: Already selected route; NL scoring and ambiguity resolution remain
      native.
    bound_behavior: done is true after the sole action, so on_exhausted is unreachable
      on normal native returns.
