schema_version: workflow-skill/v1
namespace: mathformer
id: route_control_reasoning_log_summary_workflow
version: 1.0.0
kind: workflow
description: Summarize reasoning logs through the selected native single-action route.
aliases:
- control.reasoning.log.summary
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  SelectedMatch:
    schema:
      type: object
      properties:
        route_id:
          type: string
          const: control.reasoning.log.summary
        score:
          type: number
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route_id
      - score
      - matched_terms
      additionalProperties: false
  ActionId:
    schema:
      type: string
      const: control:reasoning-log-summary
  RouteState:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          items:
            type: object
          maxItems: 1
      required:
      - ok
      - children
      additionalProperties: false
  Bool:
    schema:
      type: boolean
  Registry:
    schema:
      type: object
      additionalProperties:
        type: object
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
inputs:
  context:
    type: RunContext
  match:
    type: SelectedMatch
  registry:
    type: Registry
  repository_root:
    type: RepositoryRoot
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: RouteState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_summary_route_initialize
        operation: mathformer_summary_route_initialize
  select:
    inputs:
      state:
        type: RouteState
      match:
        type: SelectedMatch
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_summary_route_select
        operation: mathformer_summary_route_select
  execute_action:
    inputs:
      action_id:
        type: ActionId
      context:
        type: RunContext
      registry:
        type: Registry
      repository_root:
        type: RepositoryRoot
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_summary_route_execute_action
        operation: mathformer_summary_route_execute_action
  advance:
    inputs:
      state:
        type: RouteState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: RouteState
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_summary_route_advance
        operation: mathformer_summary_route_advance
  finish:
    inputs:
      state:
        type: RouteState
      match:
        type: SelectedMatch
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_summary_route_finish
        operation: mathformer_summary_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments: {}
  - id: actions
    kind: loop
    description: Exactly one registered action; normal return after its observation,
      including child failure.
    state_type: RouteState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: execute
        kind: call
        operation: execute_action
        description: Admission then preflight; rejection returns failure data without
          launch. Dry-run returns its payload without subprocess or snapshots. Otherwise
          snapshot, run the registered summarize_reasoning_log.py --json with no extra
          arguments, capture output, then audit filesystem changes. Exit zero is successful
          unless the write audit fails; unexpected launch exceptions propagate. Child
          ok=false is data for advance, not a graph failure. The leaf selects the
          first existing default log among three candidates; only missing default
          fixture selection creates fixtures. It loads events, strictly validates,
          audits quality, initializes cursor and accumulators, then visits every loaded
          event, skipping traversal when empty. Unique skills/hooks/run IDs/decisions/risks/next
          actions, ordered timeline, and first-value-per-key artifacts are carried
          through traversal. Event status never stops traversal. Summary ok requires
          validation AND quality success; main prints JSON and exits 0 or 3. JSON
          remains stdout in the child envelope; optional direct-leaf output-file writing
          is unused.
        arguments:
          action_id:
            ref: steps.select.outputs.action_id
          context:
            ref: inputs.context
          registry:
            ref: inputs.registry
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance
        description: Append once; updated.ok = prior.ok AND bool(child.ok). done =
          len(updated.children)==1 OR (not child.ok AND not context.keep_going). keep_going
          cannot add another action to this fixed route.
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.execute.outputs.child
          context:
            ref: inputs.context
      outputs:
        state:
          type: RouteState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Bool
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: RouteState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: finish
    description: Return schema_version=1, sticky ok, route metadata, children and
      intent_run_completed or intent_run_failed.
    arguments:
      state:
        ref: steps.actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/reasoning/self_test/
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    - summarize_reasoning_logs
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked summary specification; completion confers no proof,
    promotion or runtime qualification.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
