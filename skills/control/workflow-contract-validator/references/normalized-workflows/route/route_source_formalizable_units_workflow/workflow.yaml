schema_version: workflow-skill/v1
namespace: mathformer
id: route_source_formalizable_units_workflow
version: 1.0.0
kind: workflow
description: Run the selected source-family validation self-tests through run_intent_match;
  this route does not extract units from user-supplied source.
aliases:
- source.formalizable.units
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  SelectedMatch:
    schema:
      type: object
      properties:
        route:
          type: object
          properties:
            route_id:
              const: source.formalizable.units
              type: string
            action_ids:
              type: array
              items:
                type: string
              const:
              - test:family:source
          required:
          - route_id
          - action_ids
          additionalProperties: true
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route
      - score
      - matched_terms
      additionalProperties: false
  Registry:
    schema:
      type: object
      properties:
        test:family:source:
          type: object
      required:
      - test:family:source
      additionalProperties:
        type: object
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
      minLength: 1
  ActionId:
    schema:
      type: string
      const: test:family:source
  IntentState:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          items:
            type: object
          maxItems: 1
      required:
      - ok
      - children
      additionalProperties: false
  Boolean:
    schema:
      type: boolean
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
inputs:
  context:
    type: RunContext
    required: true
  match:
    type: SelectedMatch
    required: true
  registry:
    type: Registry
    required: true
  repository_root:
    type: RepositoryRoot
    required: false
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize_intent_state:
    inputs: {}
    outputs:
      state:
        type: IntentState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_source_units_route_initialize
        operation: mathformer_source_units_route_initialize
  select_intent_action:
    inputs:
      state:
        type: IntentState
      match:
        type: SelectedMatch
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_source_units_route_select
        operation: mathformer_source_units_route_select
  run_action:
    inputs:
      action_id:
        type: ActionId
      registry:
        type: Registry
      context:
        type: RunContext
      repository_root:
        type: RepositoryRoot
        required: false
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_source_units_route_dispatch
        operation: mathformer_source_units_route_dispatch
  advance_intent_state:
    inputs:
      state:
        type: IntentState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: IntentState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_source_units_route_advance
        operation: mathformer_source_units_route_advance
  finish_intent_state:
    inputs:
      state:
        type: IntentState
      match:
        type: SelectedMatch
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_source_units_route_finish
        operation: mathformer_source_units_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize_intent_state
    arguments: {}
  - id: actions
    kind: loop
    description: The selected route contains exactly one action. Advance returns done=true
      after its child, so the literal bound returns normally on success or ordinary
      failure; keep_going cannot add work. Exhaustion is unreachable for this constrained
      route.
    state_type: IntentState
    initial:
      ref: steps.initialize.outputs.state
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select_intent_action
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: execute
        kind: call
        operation: run_action
        arguments:
          action_id:
            ref: steps.select.outputs.action_id
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance_intent_state
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.execute.outputs.child
          context:
            ref: inputs.context
      outputs:
        state:
          type: IntentState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Boolean
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    max_iterations: 1
    on_exhausted: fail
    outputs:
      state:
        type: IntentState
        value:
          ref: loop.state
  - id: finish
    kind: call
    operation: finish_intent_state
    arguments:
      state:
        ref: steps.actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Validation self-test status only; completion establishes no scientific
    truth, unit extraction, runtime qualification, or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes:source.formalizable.units; build_registry:test:family:source;
      initialize_intent_state; select_intent_action; advance_intent_state; finish_intent_state;
      run_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: tests/test_program/run_comprehensive_tests.py
    selector: run; prepare_checks; checks_pending; advance_check; run_check; finalize_checks;
      publish_report
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: tests/test_matrix.json
    selector: checks[module_family=source]
    digest: sha256:d4c98046613f686a2affceb6290419448ce02acdb50f2a3c6c4997555dc9858c
  - path: scripts/mcp_server.py
    selector: mathformer_run_workflow
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/source_units_route_tools.py
    selector: register_source_units_route_tools; selected_match; checked_registry
    digest: sha256:315c37e98342627e7c79b600760dadd9022bc186edd7e48588d158b8f1d2725c
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: source_units_route_descriptor; inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: tests/mcp/run_source_units_route_workflow_tests.py
    digest: sha256:28e4abf0c79d590f8f1a733e354502b42a38c5f0608edfffc97483b357b48a9d
  - path: tests/mcp/fixtures/source_units_route_boundary.py
    digest: sha256:7d9346ecbb7ce3d4d27db6abe0b58225fb6bac6bae39335ad1f5a8b2172b69d1
  - path: tests/mcp/fixtures/source_units_route_startup/sitecustomize.py
    digest: sha256:7c181e73d1b83e80c714fc0c63139bc5d559abdbca5f971f481d023d854913bf
  - path: tests/mcp/fixtures/source_units_route_original.py.txt
    digest: sha256:0acec58ea9a10767ede2e598e219e785b274750ac3604de87ce0289d799bbe7e
  gaps:
  - run_action is an opaque native boundary, including subprocess traversal, write
    auditing, reports, and dependency evidence; downstream internals are not separate
    graph nodes.
  - The 3600-second limit and five operation calls are enforced by Lunar; standalone
    native execution retains its own subprocess limits.
  - Lunar supplies contract receipts and provenance around native observability. Network
    and external effects remain subject to service qualification; capability placeholders
    grant no runtime authority.
extensions:
  mathformer.source:
    category: route
    native_id: source.formalizable.units
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: source.formalizable.units
      title: Extract source-grounded formalizable units
      description: Use when source text, paper text, or Lean/source alignment needs
        explicit unit packets.
      action_ids:
      - test:family:source
      operator_note: Runs the source family in the comprehensive test matrix.
  mathformer.native_boundary:
    execution: scripts/mathformer.py::run_intent_match; callers are main ask --run
      and scripts/mcp_server.py::mathformer_run_workflow. MCP resolves normalized
      identity to the native route and applies service controls before dispatch.
    mount: An explicit repository_root is passed through run_action to preflight,
      subprocess cwd and both write-audit snapshots; omission or null preserves the
      CLI repository default.
    failure_policy: Preserve native failure payloads. Only unexpected exceptions terminate
      a call before route finalization.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    downstream: Inside run_action's subprocess, prepare_checks fixes source-family
      selection in matrix order; state carries selection, index=0, and results=[].
      While index < len(selected), advance_check runs selected[index], increments
      index, and appends its result even after ordinary failure. Currently four 120-second
      self-tests cover extraction, translation packets, drift checking, and Lean annotations.
      At exhaustion finalize_checks validates results, computes aggregate success
      and writes dependency evidence; publish_report writes reports and exits 0 or
      3. No retries or convergence loops; the native bound is selection length, not
      a declared four-iteration contract cap.
  mathformer.composition:
    ordered_actions:
    - test:family:source
    action_workflows:
    - hub_test_family_source_workflow
    selection: Already-selected route only; NL scoring and ambiguity resolution remain
      native.
    keep_going_semantics: Stop after all actions or first unsuccessful child unless
      keep_going; aggregate ok remains false. With one action, done is always true
      after advance.
