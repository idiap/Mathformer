schema_version: workflow-skill/v1
namespace: mathformer
id: route_docs_reasoning_flow_catalog_workflow
version: 1.0.0
kind: workflow
description: Generate the semantic reasoning-flow catalogue and separate materialization
  reference through the selected native route.
aliases:
- docs.reasoning.flow.catalog
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Context:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
    representation: value
  Match:
    representation: value
    schema:
      type: object
      properties:
        route:
          type: object
          properties:
            route_id:
              const: docs.reasoning.flow.catalog
            action_ids:
              const:
              - docs:reasoning-flow-catalog
          required:
          - route_id
          - action_ids
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route
      - score
      - matched_terms
  Registry:
    representation: value
    schema:
      type: object
      properties:
        docs:reasoning-flow-catalog:
          type: object
      required:
      - docs:reasoning-flow-catalog
  Action:
    schema:
      type: string
      const: docs:reasoning-flow-catalog
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
    representation: value
  State:
    representation: value
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          maxItems: 1
          items:
            type: object
      required:
      - ok
      - children
      additionalProperties: false
  Done:
    schema:
      type: boolean
  Root:
    schema:
      type:
      - string
      - 'null'
      description: Optional native repository mount; null or omission uses the source
        default.
inputs:
  context:
    type: Context
  match:
    type: Match
  registry:
    type: Registry
  repository_root:
    type: Root
    required: false
outputs:
  result:
    type: HubResult
    value:
      ref: steps.finish.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_reasoning_catalog_initialize
        operation: mathformer_reasoning_catalog_initialize
  select:
    inputs:
      state:
        type: State
      match:
        type: Match
    outputs:
      action:
        type: Action
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_reasoning_catalog_select
        operation: mathformer_reasoning_catalog_select
  dispatch:
    inputs:
      action:
        type: Action
      registry:
        type: Registry
      context:
        type: Context
      repository_root:
        type: Root
        required: false
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_reasoning_catalog_dispatch
        operation: mathformer_reasoning_catalog_dispatch
  advance:
    inputs:
      state:
        type: State
      child:
        type: HubResult
      context:
        type: Context
    outputs:
      state:
        type: State
      done:
        type: Done
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_reasoning_catalog_advance
        operation: mathformer_reasoning_catalog_advance
  finish:
    inputs:
      state:
        type: State
      match:
        type: Match
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_reasoning_catalog_finish
        operation: mathformer_reasoning_catalog_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments: {}
  - id: actions
    kind: loop
    description: One source for-loop iteration; the computed done guard always terminates
      normally.
    state_type: State
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: dispatch
        kind: call
        operation: dispatch
        arguments:
          action:
            ref: steps.select.outputs.action
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.dispatch.outputs.child
          context:
            ref: inputs.context
      outputs:
        state:
          type: State
          value:
            ref: steps.advance.outputs.state
        done:
          type: Done
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: State
        value:
          ref: loop.state
  - id: finish
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/workflow_hub/
      - docs/architecture/ALL_REASONING_FLOWS.md
      - docs/architecture/REASONING_FLOW_MATERIALIZATIONS.md
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Native route completion establishes no scientific result or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes; initialize_intent_state; select_intent_action;
      advance_intent_state; finish_intent_state; run_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: skills/control/reasoning-flow-language/scripts/render_all_reasoning_flows.py
    selector: render_catalog; construct_catalog; dispose_catalog; generate_catalog;
      emit_catalog_result; main
    digest: sha256:208c892ff7c6fc3e0485dfb96cf578073b775a0a2d1804c6dae227c9600ed246
  - path: scripts/mcp_server.py
    selector: mathformer_ask; mathformer_run_workflow; _cap_unbounded_timeouts
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/reasoning_catalog_route_tools.py
    selector: register_reasoning_catalog_route_tools; selected_match; checked_registry;
      check_state
    digest: sha256:421f208c229680f71c6e189b9e2a8e872172215e0cf8e375111ff8481f56c8d2
  - path: scripts/adoption_check_tools.py
    selector: Context
    digest: sha256:da0f2eb9e33f2d5722a697b846fdeb9cf7bed4b9b31e9da0e1f0302b9859f6ac
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: reasoning_catalog_route_descriptor; inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Hub admission and renderer internals remain inside dispatch; the graph does not
    reimplement their finite helper traversals.
  - Wire match/registry projections are checked against native declarations; caller-specific
    replacement commands are not accepted.
  - The 3600-second ceiling is a contract limit, not a native route budget; CLI has
    no action timeout and the existing general MCP route applies its configurable
    default of 600 seconds. These step tools preserve the unbounded native action
    timeout.
  - Lunar supplies required contract receipts; optional source logs remain native
    observations, not receipt substitutes.
extensions:
  mathformer.source:
    category: route
    native_id: docs.reasoning.flow.catalog
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: docs.reasoning.flow.catalog
      action_ids:
      - docs:reasoning-flow-catalog
  mathformer.native_boundary:
    execution: Registered MCP step tools delegate to the shared scripts/mathformer.py
      controller functions, including the unchanged run_action boundary.
    selection: Already selected route; NL ranking and caller service-write-root checks
      remain outside run_intent_match.
    mount: Native caller repository_root is propagated unchanged; omitted mounts use
      the repository default.
    renderer: Registered argv runs render_all_reasoning_flows.py --json, without --check.
      main constructs, disposes, then emits. render_catalog validates registry alignment,
      matching style/profile sets and each parsed profile strictly, accumulating parsed
      records and ordered sections. It checks the semantic catalogue for implementation
      identifiers, then builds separate materializations and digest metadata. Traversals
      are finite input collections, with no retry or convergence loop. Generation
      writes the semantic document before the materializations document. Caught OSError,
      ValueError or FlowSyntaxError returns failure and exit 1; success exits 0. A
      failed second write leaves the first intact. Optional --check compares existing
      text and is unreachable through this route.
    loop_bound: One action means done is true after dispatch even on failure; exhaustion
      is unreachable for source-conforming operations.
# REUSE-IgnoreEnd
