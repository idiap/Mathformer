schema_version: workflow-skill/v1
namespace: mathformer
id: route_skills_plugin_check_workflow
version: 1.0.0
kind: workflow
description: Check agent plugin projection parity, then run plugin unit tests through
  the native ordered route.
aliases:
- skills.plugin-check
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  SelectedMatch:
    schema:
      type: object
      properties:
        route:
          type: object
          properties:
            route_id:
              const: skills.plugin-check
            action_ids:
              type: array
              prefixItems:
              - const: skills:plugin-check
              - const: skills:plugin-test
              items: false
              minItems: 2
              maxItems: 2
          required:
          - route_id
          - action_ids
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route
      - score
      - matched_terms
  NativeRegistry:
    schema:
      type: object
      additionalProperties:
        type: object
      description: Native action_to_dict projections; positive per-leaf timeout overrides
        preserve the MCP capped registry. Missing entries retain native admission
        failure.
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
      description: Native repository mount; null retains REPO_ROOT.
  ActionId:
    schema:
      type: string
      enum:
      - skills:plugin-check
      - skills:plugin-test
  RouteState:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          items:
            type: object
          maxItems: 2
      required:
      - ok
      - children
      additionalProperties: false
  Boolean:
    schema:
      type: boolean
inputs:
  context:
    type: RunContext
  match:
    type: SelectedMatch
  registry:
    type: NativeRegistry
  repository_root:
    type: RepositoryRoot
    required: false
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: RouteState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_plugin_check_route_initialize
        operation: mathformer_skills_plugin_check_route_initialize
  select:
    inputs:
      state:
        type: RouteState
      match:
        type: SelectedMatch
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_plugin_check_route_select
        operation: mathformer_skills_plugin_check_route_select
  dispatch:
    inputs:
      action_id:
        type: ActionId
      registry:
        type: NativeRegistry
      context:
        type: RunContext
      repository_root:
        type: RepositoryRoot
        required: false
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_plugin_check_route_dispatch
        operation: mathformer_skills_plugin_check_route_dispatch
  advance:
    inputs:
      state:
        type: RouteState
      child:
        type: HubResult
      context:
        type: RunContext
      match:
        type: SelectedMatch
    outputs:
      state:
        type: RouteState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_plugin_check_route_advance
        operation: mathformer_skills_plugin_check_route_advance
  finish:
    inputs:
      state:
        type: RouteState
      match:
        type: SelectedMatch
      registry:
        type: NativeRegistry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_skills_plugin_check_route_finish
        operation: mathformer_skills_plugin_check_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments: {}
  - id: actions
    kind: loop
    description: Native for-loop over the fixed two-action route. done is true on
      the second child, so the bound returns normally; exhaustion is unreachable for
      this specialization.
    state_type: RouteState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 2
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: dispatch
        kind: call
        operation: dispatch
        description: skills:plugin-check runs scripts/sync_agent_plugins.py --check;
          skills:plugin-test runs tests/agent_clients/test_agent_plugins.py. A child
          with ok=false is returned data, not a graph-call exception.
        arguments:
          action_id:
            ref: steps.select.outputs.action_id
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance
        description: Stop when appended children reach two, or when this child fails
          and keep_going is false. Continuing never clears prior failure.
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.dispatch.outputs.child
          context:
            ref: inputs.context
          match:
            ref: inputs.match
      outputs:
        state:
          type: RouteState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Boolean
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: RouteState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - temporary_directories
      - artifacts/workflow_hub/
    network: []
    external_write: []
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 8
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked validation description; completion establishes no scientific
    truth, promotion or runtime qualification.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes[skills.plugin-check]; build_registry; initialize_intent_state;
      select_intent_action; advance_intent_state; finish_intent_state; run_action;
      run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/sync_agent_plugins.py
    selector: synchronize; expected_files; find_stale; compare_projection; main
    digest: sha256:a03705054813e88f8ef2617dcd743b9e40e31a2ef2594fe858811b0d2c68b06c
  - path: tests/agent_clients/test_agent_plugins.py
    selector: AgentPluginTests; unittest.main
    digest: sha256:c1be95c03d1c0ea09ce164cf7a98e2400a841757cfe87cb0552dc2b5107bde5f
  - path: scripts/mcp_server.py
    selector: mathformer_ask; mathformer_run_workflow; _cap_unbounded_timeouts
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/skills_plugin_check_route_tools.py
    selector: register_skills_plugin_check_route_tools; selected_match; checked_registry;
      check_state
    digest: sha256:d63c138781262466bb9468d9875816881159b31ade2a08446d0431af063c17f9
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: skills_plugin_check_route_descriptor; descriptors
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - 'Leaf internals stay within dispatch: native admission/preflight may return failure;
    dry-run never launches; execution captures output and audits repository writes,
    which may reverse success. Unexpected launch exceptions propagate.'
  - Contract wall-time/call budgets and required receipts are enforced by the Lunar
    host; they are not native route-wide enforcement or upgraded native logs.
extensions:
  mathformer.source:
    category: route
    native_id: skills.plugin-check
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: skills.plugin-check
      title: Validate Mathformer agent plugins
      description: Check Codex and Claude plugin packaging and canonical skill parity.
      action_ids:
      - skills:plugin-check
      - skills:plugin-test
      positive_terms:
      - validate agent plugins
      - check agent plugins
      - validate plugin packaging
      skill_routes: []
      examples:
      - Validate agent plugins.
      operator_note: ''
  mathformer.native_boundary:
    execution: Authoritative execution is scripts/mathformer.py:run_intent_match;
      the active normalized graph calls its shared state functions and run_action
      through registered MCP tools.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    callers:
    - scripts/mathformer.py:main ask --run
    - scripts/mcp_server.py:mathformer_ask
    - scripts/mcp_server.py:mathformer_run_workflow
    registry_constraint: Exact native action projections or MCP per-leaf timeout-capped
      copies; selected actions are dependency-free leaves and accept no route extra_args.
      JSON never supplies executable code.
    timeout: CLI leaf defaults are None. MCP supplies configurable per-leaf timeouts,
      initially 600 seconds. The 3600-second contract limit is not a native route-wide
      deadline.
    failure_policy: Return native failed children and aggregate failure; unexpected
      exceptions propagate without retries.
    effects_status: Repository checks do not synchronize plugins. Test fixture mutations
      occur in temporary directories; caller-owned reports/logs remain outside the
      route.
    scientific_payloads: HubResult is a transport envelope, not a proof or scientific
      report.
  mathformer.composition:
    ordered_actions:
    - skills:plugin-check
    - skills:plugin-test
    action_workflows:
    - hub_skills_plugin_check_workflow
    - hub_skills_plugin_test_workflow
    leaf_behavior:
      check: Build expected projection, compare missing/differing files, append sorted
        stale entrypoints, fail on drift without synchronization.
      test: Run unittest checks for generation, drift, discovery, cached distribution,
        contracts and attribution; mutations use temporary fixtures.
    keep_going_semantics: Failure is sticky; stop after a failed child unless context.keep_going,
      or normally after two children.
    selection: Already-selected native route; NL ranking and ambiguity resolution
      remain caller-owned.
    bounds: At most two dispatches and eight modeled operation calls; no convergence
      loop, retries, checkpoints or resumptions. At the two-iteration bound done is
      true, so no exhaustion is signaled.
