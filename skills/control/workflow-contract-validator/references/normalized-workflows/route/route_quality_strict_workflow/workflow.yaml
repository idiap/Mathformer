schema_version: workflow-skill/v1
namespace: mathformer
id: route_quality_strict_workflow
version: 1.0.0
kind: workflow
description: Selected quality.strict route through the native controlled executor.
aliases:
- quality.strict
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Context:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  Match:
    schema:
      type: object
      properties:
        route:
          type: object
          properties:
            route_id:
              const: quality.strict
            action_ids:
              const:
              - quality:strict
          required:
          - route_id
          - action_ids
        score:
          type: number
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route
      - score
      - matched_terms
      description: Native IntentMatch projection retaining all other IntentRoute fields.
  Registry:
    schema:
      type: object
      additionalProperties:
        type: object
      description: Exact native action_to_dict projections; omissions preserve native
        unknown-action behavior.
  Action:
    schema:
      type: string
      const: quality:strict
  Flag:
    schema:
      type: boolean
  State:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          maxItems: 1
          items:
            type: object
      required:
      - ok
      - children
      additionalProperties: false
  Result:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
  Mount:
    schema:
      type: object
      properties:
        repository_root:
          type: string
      additionalProperties: false
inputs:
  context:
    type: Context
  match:
    type: Match
  registry:
    type: Registry
  mount:
    type: Mount
outputs:
  result:
    type: Result
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_quality_strict_route_initialize
        operation: mathformer_quality_strict_route_initialize
  select:
    inputs:
      state:
        type: State
      match:
        type: Match
    outputs:
      action:
        type: Action
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_quality_strict_route_select
        operation: mathformer_quality_strict_route_select
  execute_action:
    inputs:
      action:
        type: Action
      registry:
        type: Registry
      context:
        type: Context
      mount:
        type: Mount
    outputs:
      result:
        type: Result
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_quality_strict_route_execute
        operation: mathformer_quality_strict_route_execute
  advance:
    inputs:
      state:
        type: State
      child:
        type: Result
      context:
        type: Context
    outputs:
      state:
        type: State
      done:
        type: Flag
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_quality_strict_route_advance
        operation: mathformer_quality_strict_route_advance
  finish:
    inputs:
      state:
        type: State
      match:
        type: Match
      registry:
        type: Registry
    outputs:
      result:
        type: Result
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_quality_strict_route_finish
        operation: mathformer_quality_strict_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize_route
    kind: call
    operation: initialize
    arguments: {}
  - id: traverse_actions
    kind: loop
    description: Native ordered route traversal specialized to exactly one selected
      action. advance returns done at the action count even on failure; the final
      iteration exits normally and does not signal budget exhaustion.
    state_type: State
    initial:
      ref: steps.initialize_route.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select_action
        kind: call
        operation: select
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: run_action
        kind: call
        operation: execute_action
        arguments:
          action:
            ref: steps.select_action.outputs.action
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          mount:
            ref: inputs.mount
      - id: accumulate
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.run_action.outputs.result
          context:
            ref: inputs.context
      outputs:
        state:
          type: State
          value:
            ref: steps.accumulate.outputs.state
        done:
          type: Flag
          value:
            ref: steps.accumulate.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: State
        value:
          ref: body.outputs.state
  - id: pack_result
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.traverse_actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: Result
      value:
        ref: steps.pack_result.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-bound execution; completion establishes no scientific truth
    or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes; build_registry; initialize_intent_state; select_intent_action;
      advance_intent_state; finish_intent_state; run_action; prepare_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: tests/test_program/run_comprehensive_tests.py
    selector: prepare_checks; advance_check; finalize_checks; build_capability_ledger
    digest: sha256:60c9992ddfa80820b0c1e255d51b3e192f23d19efac01002713637c80056157a
  - path: scripts/mcp_server.py
    selector: mathformer_ask; mathformer_run_workflow
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/quality_strict_route_tools.py
    selector: register_quality_strict_route_tools; selected_match; checked_registry
    digest: sha256:d408b857cc6d25303cdc51b8c3701419118f33e8f87dfba21b2e5ee8a05f617b
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: quality_strict_route_descriptor
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - Dependency recursion and comprehensive matrix traversal remain opaque inside execute_action;
    native controls, state, output capture, reports and timeouts remain authoritative.
  - Route scoring and caller-level service controls are outside run_intent_match.
    Transported match/registry projections are checked against native declarations.
  - Native execution has no route-wide wall/call budget; Lunar additionally enforces
    the declared 3600 seconds and five calls.
  - External effect capability qualification remains host-owned; capability names
    are not runtime grants.
extensions:
  mathformer.source:
    category: route
    native_id: quality.strict
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: quality.strict
      title: Run the capability-complete strict quality gate
      description: Use for release validation where skipped or unavailable capabilities
        must fail.
      action_ids:
      - quality:strict
      operator_note: Fails when any selected capability is skipped, unavailable, or
        untested.
  mathformer.native_boundary:
    execution: Five callable MCP ports share native route state helpers and run_action;
      Lunar interprets this graph.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Preserve native ok/status failure payloads and propagated exceptions.
    scientific_payloads: Result types the transport envelope, not backend proof or
      test reports.
  mathformer.composition:
    ordered_actions:
    - quality:strict
    action_workflows:
    - hub_quality_strict_workflow
    keep_going_semantics: Stop on failure unless keep_going; aggregate failure remains
      sticky.
    selection: Already selected quality.strict; inputs constrain the action list to
      exactly one.
