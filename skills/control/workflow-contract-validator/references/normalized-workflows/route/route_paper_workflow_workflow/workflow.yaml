schema_version: workflow-skill/v1
namespace: mathformer
id: route_paper_workflow_workflow
version: 1.0.0
kind: workflow
description: Dispatch the selected paper.workflow route in native order, retaining
  child results and sticky failure.
aliases:
- paper.workflow
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  IntentMatch:
    schema:
      type: object
      properties:
        route:
          type: object
          properties:
            route_id:
              const: paper.workflow
            action_ids:
              const:
              - paper:functionality-update-suite
              - paper:workflow-catalog
          required:
          - route_id
          - action_ids
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route
      - score
      - matched_terms
  Registry:
    schema:
      type: object
      additionalProperties:
        type: object
      description: Checked value projection of native WorkflowAction records. Missing
        entries remain missing; executable caller-supplied replacements are rejected.
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
  ActionId:
    schema:
      type: string
      enum:
      - paper:functionality-update-suite
      - paper:workflow-catalog
  ActionCount:
    schema:
      type: integer
      const: 2
  Bool:
    schema:
      type: boolean
  RouteState:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          maxItems: 2
          items:
            type: object
      required:
      - ok
      - children
      additionalProperties: false
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
inputs:
  match:
    type: IntentMatch
  registry:
    type: Registry
  context:
    type: RunContext
  repository_root:
    type: RepositoryRoot
    required: false
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: RouteState
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_route_initialize
        operation: mathformer_paper_route_initialize
  select_action:
    inputs:
      state:
        type: RouteState
      match:
        type: IntentMatch
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_route_select_action
        operation: mathformer_paper_route_select_action
  run_child:
    inputs:
      action_id:
        type: ActionId
      registry:
        type: Registry
      context:
        type: RunContext
      repository_root:
        type: RepositoryRoot
        required: false
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_route_run_child
        operation: mathformer_paper_route_run_child
  advance:
    inputs:
      state:
        type: RouteState
      child:
        type: HubResult
      context:
        type: RunContext
      action_count:
        type: ActionCount
    outputs:
      state:
        type: RouteState
      done:
        type: Bool
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_route_advance
        operation: mathformer_paper_route_advance
  finish:
    inputs:
      state:
        type: RouteState
      match:
        type: IntentMatch
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp
        kind: tool
        target: mathformer_paper_route_finish
        operation: mathformer_paper_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments: {}
  - id: route_actions
    kind: loop
    state_type: RouteState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 2
    on_exhausted: fail
    description: Exactly the selected two-item route, possibly stopped after its first
      failure. The second advance always sets done, so reaching the native list bound
      returns normally; exhaustion is unreachable for conforming operations.
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select_action
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: dispatch
        kind: call
        operation: run_child
        arguments:
          action_id:
            ref: steps.select.outputs.action_id
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.dispatch.outputs.child
          context:
            ref: inputs.context
          action_count:
            literal: 2
      outputs:
        state:
          type: RouteState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Bool
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: RouteState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.route_actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/paper_skills/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 8
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Source-linked dispatch description only; completion establishes no
    scientific result, runtime qualification or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes/paper.workflow; initialize_intent_state; select_intent_action;
      advance_intent_state; finish_intent_state; run_action; prepare_action; run_leaf_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mcp_server.py
    selector: mathformer_ask; mathformer_run_workflow; _cap_unbounded_timeouts
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/paper_route_tools.py
    selector: register_paper_route_tools; selected_match; checked_registry; check_state
    digest: sha256:8cb6ac4a67fc4c59b101e3a0c2460ee169ef4974e1b3115761f84c7e31755b18
  - path: scripts/adoption_check_tools.py
    selector: Context
    digest: sha256:da0f2eb9e33f2d5722a697b846fdeb9cf7bed4b9b31e9da0e1f0302b9859f6ac
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: paper_route_descriptor; inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: paper_skills/framework-repository-cartographer/scripts/build_paper_evidence_packet.py
    selector: main (opaque native leaf)
    digest: sha256:a4554e62ad8531b71f0d591f2796265b2c3915445ce179ace2c23927e90140a8
  - path: paper_skills/scientific-paper-drafter/scripts/plan_paper_update.py
    selector: main (opaque native leaf)
    digest: sha256:2f1df9bcac253143698887855f99a6b3517991f7a0aa8e611b10db373026d2be
  - path: paper_skills/paper-claim-evidence-auditor/scripts/audit_paper_claims.py
    selector: main (opaque native leaf)
    digest: sha256:95e504f313b50a67b8d6709377217f7ad4388143bcc820525f47aab654f4fa79
  - path: paper_skills/framework-repository-cartographer/scripts/collect_workflow_catalog_for_paper.py
    selector: main (opaque native leaf)
    digest: sha256:c7daab1278e9a9d45e1af7163a5f56580701ea89b85c8bf319ab7c191b9d4cc8
  gaps:
  - Nested dependencies and leaf/helper internals remain owned by run_child, not expanded
    in this dispatch graph. Every visit executes native run_action without dependency
    memoization.
  - Wire match/registry projections hydrate checked native declarations; arbitrary
    replacement commands are rejected. Missing dependencies retain native unknown-action
    data; missing route entries additionally propagate the native final metadata serializer
    KeyError.
  - The 3600-second policy limit is a Lunar contract ceiling, not a native route-wide
    timeout. Eight calls bound this projected graph only, not nested native actions.
  - These step tools preserve the selected source native unbounded leaf timeouts.
    The existing general MCP ask/run entrypoints separately apply a configurable per-leaf
    cap (default 600 seconds). Service authorization and write-root guards precede
    step dispatch.
  - Lunar supplies required contract receipts and events; native subprocess capture,
    write audits and optional caller reporting remain source-owned. Native filesystem/network
    declarations remain partial.
extensions:
  mathformer.source:
    category: route
    native_id: paper.workflow
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: paper.workflow
      title: Run paper evidence and update workflows
      action_ids:
      - paper:functionality-update-suite
      - paper:workflow-catalog
      skill_routes:
      - paper-theory-autoformalization-orchestrator
      - paper-docling-layout-extractor
  mathformer.native_boundary:
    execution: Registered MCP step tools delegate to shared scripts/mathformer.py
      functions used by run_intent_match; run_child invokes the native recursive run_action
      boundary.
    callers:
    - scripts/mathformer.py:main ask --run
    - scripts/mcp_server.py:mathformer_ask(run=True)
    - scripts/mcp_server.py:mathformer_run_workflow
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Return native negative child/envelope data unchanged; propagate
      unexpected launch exceptions.
    scientific_payloads: HubResult is a transport envelope, not a backend report or
      proof artifact.
  mathformer.composition:
    ordered_actions:
    - paper:functionality-update-suite
    - paper:workflow-catalog
    action_workflows:
    - hub_paper_functionality_update_suite_workflow
    - hub_paper_workflow_catalog_workflow
    suite_dependencies:
    - paper:evidence-packet
    - paper:update-plan
    - paper:claim-audit-framework
    - paper:claim-audit-rfde
    evidence_dependency: Planning and both audits independently regenerate artifacts/paper_skills/new_functionality_evidence_packet.json
      via paper:evidence-packet; no dependency memoization. Planning/audits consume
      that packet; the suite has no parent command.
    catalog_action: After the suite, paper:workflow-catalog collects workflow evidence
      into paper catalogue artifacts under artifacts/paper_skills/.
    keep_going_semantics: Stop on a failed child unless context.keep_going; continuing
      never clears failure.
    selection: Already-selected paper.workflow only. Input route identity/order are
      constrained; NL matching remains native.
