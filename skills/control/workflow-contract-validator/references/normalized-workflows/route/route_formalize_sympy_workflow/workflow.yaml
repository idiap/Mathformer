schema_version: workflow-skill/v1
namespace: mathformer
id: route_formalize_sympy_workflow
version: 1.0.0
kind: workflow
description: Dispatch the already selected formalize.sympy route through native controls.
aliases:
- formalize.sympy
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
    representation: value
  Match:
    schema:
      type: object
      description: JSON-shaped view of the caller-owned native IntentMatch.
      properties:
        route:
          type: object
          properties:
            route_id:
              type: string
              const: formalize.sympy
            action_ids:
              type: array
              items:
                type: string
                const: sympy:controlled
              minItems: 1
              maxItems: 1
          required:
          - route_id
          - action_ids
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
      required:
      - route
      - score
      - matched_terms
  Registry:
    schema:
      type: object
      description: Caller-owned native action registry; entries are opaque here.
      properties:
        sympy:controlled:
          type: object
      required:
      - sympy:controlled
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
  ActionId:
    schema:
      type: string
      const: sympy:controlled
  Done:
    schema:
      type: boolean
  RouteState:
    schema:
      type: object
      properties:
        ok:
          type: boolean
        children:
          type: array
          maxItems: 1
          items:
            type: object
            properties:
              ok:
                type: boolean
            required:
            - ok
      required:
      - ok
      - children
      additionalProperties: false
inputs:
  context:
    type: RunContext
  match:
    type: Match
  registry:
    type: Registry
  repository_root:
    type: RepositoryRoot
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: RouteState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_route_initialize
        operation: mathformer_sympy_route_initialize
  select:
    inputs:
      state:
        type: RouteState
      match:
        type: Match
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_route_select
        operation: mathformer_sympy_route_select
  dispatch:
    inputs:
      action_id:
        type: ActionId
      registry:
        type: Registry
      context:
        type: RunContext
      repository_root:
        type: RepositoryRoot
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_route_dispatch
        operation: mathformer_sympy_route_dispatch
  advance:
    inputs:
      state:
        type: RouteState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: RouteState
      done:
        type: Done
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_route_advance
        operation: mathformer_sympy_route_advance
  finish:
    inputs:
      state:
        type: RouteState
      match:
        type: Match
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_sympy_route_finish
        operation: mathformer_sympy_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize_route
    kind: call
    operation: initialize
    arguments: {}
  - id: actions
    kind: loop
    description: Exactly one registered action; done is true after its result is appended.
    state_type: RouteState
    initial:
      ref: steps.initialize_route.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select_action
        kind: call
        operation: select
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: run_action
        kind: call
        operation: dispatch
        arguments:
          action_id:
            ref: steps.select_action.outputs.action_id
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          repository_root:
            ref: inputs.repository_root
      - id: append_result
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.run_action.outputs.child
          context:
            ref: inputs.context
      outputs:
        state:
          type: RouteState
          value:
            ref: steps.append_result.outputs.state
        done:
          type: Done
          value:
            ref: steps.append_result.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: RouteState
        value:
          ref: loop.state
  - id: finish_route
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish_route.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/sympy/
      - artifacts/sympy_api/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 5
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Native route status and suite diagnostics only; completion establishes
    no scientific truth or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes; initialize_intent_state; select_intent_action;
      advance_intent_state; finish_intent_state; run_action
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: tests/sympy/run_controlled_suite.py
    selector: main; run; run_case
    digest: sha256:f99794902893012461fa51bf2139af6500d5042140e3d5d15cb6b2d3f29917ef
  - path: scripts/mcp_server.py
    selector: mathformer_ask; mathformer_run_workflow; _cap_unbounded_timeouts
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: scripts/sympy_route_tools.py
    selector: register_sympy_route_tools; selected_match; checked_registry; check_state
    digest: sha256:95ccb7fb98ab0a3ce363df6021c66061238c6b58c234e3bf750c57f111ce09e1
  - path: scripts/adoption_check_tools.py
    selector: Context
    digest: sha256:da0f2eb9e33f2d5722a697b846fdeb9cf7bed4b9b31e9da0e1f0302b9859f6ac
  - path: scripts/benchmark_route_tools.py
    selector: State; Initialized; Invoked; Advanced; Finished
    digest: sha256:97480cdc2c306090e422360cdc645bd95fe075c6e565afa51d2054d4fe24cfcf
  - path: scripts/workflow_write_audit.py
    selector: snapshot_repository; audit_snapshots
    digest: sha256:1f1e5ca40776f1b5671d89668ca1eee5d6802f633749c6cce7a94d8d25c838a1
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: sympy_route_descriptor; inventory
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  gaps:
  - The downstream scientific suite remains inside dispatch; its internal stages are
    not graph nodes.
  - Network/external capability labels are retained qualification ceilings, not runtime
    grants. The registered suite uses local Python and SymPy operations.
  - Lunar supplies required runtime receipts, digests and events; native suite reports
    and captured output remain unchanged.
  - The 3600-second and five-call limits are enforced by Lunar, not by the native
    CLI. Step bindings retain timeout_seconds=None; legacy MCP applies its configurable
    600-second default.
extensions:
  mathformer.source:
    category: route
    native_id: formalize.sympy
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: formalize.sympy
      title: Check algebra or equations with SymPy
      description: Use when the target is an executable equation, identity, or symbolic
        derivation.
      action_ids:
      - sympy:controlled
      positive_terms:
      - sympy
      - symbolic
      - equation
      - identity
      - algebra
      - counterexample
      - simplify
      - executable algebra
      skill_routes:
      - sympy-autoformalization-drafter
      - sympy-execution-runner
      examples:
      - Check this identity with SymPy.
      operator_note: Writes ignored SymPy artifacts under artifacts/sympy/.
  mathformer.native_boundary:
    execution: Registered mathformer_sympy_route_* MCP tools delegate to the shared
      native route state functions and run_action. CLI and legacy MCP retain their
      native controllers.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Return native failed child results through aggregation; unexpected
      launch exceptions propagate.
    scientific_payloads: HubResult is the transport envelope, not the suite report
      payload.
    callers: CLI main ask --run selects a match; MCP mathformer_ask and mathformer_run_workflow
      call run_intent_match.
    mcp_controls: Canonical ID resolves to formalize.sympy; route extra_args are rejected;
      write roots checked unless dry_run.
    timeouts: CLI has no outer action timeout; MCP caps unbounded leaf actions with
      configurable default 600 seconds.
    suite: Python tests/sympy/run_controlled_suite.py --json probes dependencies then
      indexes APIs; failed preflight stops immediately. Five fixed sources run in
      order. Each case parses, models assumptions, grounds APIs, drafts, executes,
      validates identities, searches counterexamples (--max-n 100), verifies traces
      and produces consistency reports. Failed stages end that case; subsequent cases
      still run. State carries paths, cursor, preflight success/results and accumulated
      case reports. Completion writes HTML/JSON and succeeds only if every case succeeds.
      Subprocess calls time out after 180 seconds; uncaught timeout/launch exceptions
      abort the suite.
    registry_and_mount: Registry projections must match native action metadata; commands
      cannot be supplied by callers. Required nullable repository_root selects hub.REPO_ROOT
      when null. Native match metadata is rehydrated with score and matched_terms
      preserved.
    service_authority: Non-dry-run dispatch checks service write permission and both
      resolved native write roots before run_action. No timeout cap is injected by
      these step bindings.
  mathformer.composition:
    ordered_actions:
    - sympy:controlled
    action_workflows:
    - hub_sympy_controlled_workflow
    keep_going_semantics: Aggregate ok is sticky; this single-action route has no
      further work under keep_going.
    selection: Caller has already selected the fixed route; NL scoring and ambiguity
      handling remain native.
    bound_semantics: Normal return after one iteration, including child failure; exhaustion
      is unreachable for source-valid state.
