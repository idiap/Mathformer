    selector: main
    digest: sha256:5fa3e6d8766bdd992c61935625ad292f071b8d574e832d26b9bb2648fde14d59
  - path: skills/physics-lean/physics-lean-repair-expansion-cartographer/scripts/map_repair_expansion.py
    selector: main
    digest: sha256:6da95b91a9ca360312631d9fe67e51f52aa8e81931465e0ceb8e38a5d612fd03
  gaps:
  - Child internals remain native and opaque inside run_child; HubResult transports
    process envelopes rather than scientific payloads.
  - The 3600-second limit and required receipts are owned by Lunar; the native CLI
    route has no global deadline and optional native logs. New ports retain native
    leaf timeouts; legacy MCP ask/run_workflow retains its configurable cap.
  - Network/external capability labels require host qualification and do not grant
    authority.
extensions:
  mathformer.source:
    category: route
    native_id: repair.physics.lean.pathologies
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: repair.physics.lean.pathologies
      title: Run the Lean physics pathology repair loop
  mathformer.native_boundary:
    selection: Already selected route; NL ranking remains in callers CLI main ask
      --run and MCP mathformer_ask.
    dispatch: MCP mathformer_run_workflow resolves canonical ID to this route and
      rejects nonempty route extra_args.
    mount: 'Required nullable repository_root: null retains the native default; explicit
      paths propagate to run_action, preflight, process cwd and write audit.'
    failure: Unexpected exceptions propagate; failed child envelopes stop unless keep_going
      and never clear aggregate failure.
    child_status: Planner blocked status does not fail the route; native preflight,
      process exit and write audit determine child ok.
    dataflow: Six separate planner invocations; no automatic scientific repair feedback,
      forwarded outputs or route arguments.
    bounds: max_iterations=6 is exact route length; done is true on sixth child, so
      on_exhausted is unreachable under native advance semantics.
    calls: At most 20 modeled calls; nested native calls remain owned by run_child.
    advisory_controller:
      source: skills/physics-lean/physics-lean-recursive-repair-loop-controller/scripts/control_recursive_repair_loop.py
        build_control_plan
      inputs: Caller-supplied expansion/frontier and prior signatures; CLI iteration
        defaults to 1 and maximum to 6.
      priority:
      - complete_or_not_required_without_outstanding
      - non_exhaustive
      - repeated_signature
      - iteration_at_cap
      - empty_outstanding
      - recurse
      override: Expansion status blocked overrides any selected decision.
      outputs: Decision, blockers and frontier actions; blocked may also emit frontier
        actions.
      execution: One advisory decision only; no action execution, iteration increment
        or persisted history.
    bindings: Registered FastMCP tools invoke shared native intent-state helpers and
      run_action. Registry and match projections resolve to verified native declarations.
      No child outputs or extra_args are forwarded.
