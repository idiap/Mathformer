schema_version: workflow-skill/v1
namespace: mathformer
id: route_repair_physics_lean_pathologies_workflow
version: 1.0.0
kind: workflow
description: Execute the selected six-action physics Lean planning route through native
  controls.
aliases:
- repair.physics.lean.pathologies
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  RunContext:
    schema: ../../hub-interface.schema.json#/$defs/RunContext
  SelectedMatch:
    schema:
      type: object
      required:
      - route
      - score
      - matched_terms
      properties:
        route:
          type: object
          required:
          - route_id
          - action_ids
          properties:
            route_id:
              const: repair.physics.lean.pathologies
              type: string
            action_ids:
              const:
              - physics-lean:detect-pathology-objects
              - physics-lean:object-workbench
              - physics-lean:pathology-repair-loop
              - physics-lean:generative-repair-plan
              - physics-lean:repair-expansion-map
              - physics-lean:recursive-repair-control
              type: array
              items:
                type: string
        score:
          type: integer
        matched_terms:
          type: array
          items:
            type: string
  Registry:
    schema:
      type: object
      description: JSON projections of native WorkflowActions; the adapter verifies
        declarations, never accepting caller executable code.
      additionalProperties:
        type: object
  RepositoryRoot:
    schema:
      type:
      - string
      - 'null'
  ActionId:
    schema:
      type: string
      enum:
      - physics-lean:detect-pathology-objects
      - physics-lean:object-workbench
      - physics-lean:pathology-repair-loop
      - physics-lean:generative-repair-plan
      - physics-lean:repair-expansion-map
      - physics-lean:recursive-repair-control
  IntentState:
    schema:
      type: object
      required:
      - ok
      - children
      additionalProperties: false
      properties:
        ok:
          type: boolean
        children:
          type: array
          maxItems: 6
          items:
            type: object
  Boolean:
    schema:
      type: boolean
  HubResult:
    schema: ../../hub-interface.schema.json#/$defs/HubResult
inputs:
  match:
    type: SelectedMatch
  registry:
    type: Registry
  context:
    type: RunContext
  repository_root:
    type: RepositoryRoot
outputs:
  result:
    type: HubResult
    value:
      ref: flow.outputs.result
operations:
  initialize:
    inputs: {}
    outputs:
      state:
        type: IntentState
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_pathologies_route_initialize
        operation: mathformer_physics_pathologies_route_initialize
  select:
    inputs:
      state:
        type: IntentState
      match:
        type: SelectedMatch
    outputs:
      action_id:
        type: ActionId
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_pathologies_route_select
        operation: mathformer_physics_pathologies_route_select
  run_child:
    inputs:
      action_id:
        type: ActionId
      registry:
        type: Registry
      context:
        type: RunContext
      repository_root:
        type: RepositoryRoot
    outputs:
      child:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_pathologies_route_run_child
        operation: mathformer_physics_pathologies_route_run_child
  advance:
    inputs:
      state:
        type: IntentState
      child:
        type: HubResult
      context:
        type: RunContext
    outputs:
      state:
        type: IntentState
      done:
        type: Boolean
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_pathologies_route_advance
        operation: mathformer_physics_pathologies_route_advance
  finish:
    inputs:
      state:
        type: IntentState
      match:
        type: SelectedMatch
      registry:
        type: Registry
    outputs:
      result:
        type: HubResult
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_physics_pathologies_route_finish
        operation: mathformer_physics_pathologies_route_finish
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments: {}
  - id: actions
    kind: loop
    description: One native action per iteration, in route order. Sixth advance always
      sets done, so the native six-action bound returns normally.
    state_type: IntentState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 6
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select
        arguments:
          state:
            ref: loop.state
          match:
            ref: inputs.match
      - id: run
        kind: call
        operation: run_child
        arguments:
          action_id:
            ref: steps.select.outputs.action_id
          registry:
            ref: inputs.registry
          context:
            ref: inputs.context
          repository_root:
            ref: inputs.repository_root
      - id: advance
        kind: call
        operation: advance
        arguments:
          state:
            ref: loop.state
          child:
            ref: steps.run.outputs.child
          context:
            ref: inputs.context
      outputs:
        state:
          type: IntentState
          value:
            ref: steps.advance.outputs.state
        done:
          type: Boolean
          value:
            ref: steps.advance.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: IntentState
        value:
          ref: body.outputs.state
  - id: finish
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.actions.outputs.state
      match:
        ref: inputs.match
      registry:
        ref: inputs.registry
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.finish.outputs.result
policy:
  effects:
    filesystem:
      read:
      - repository
      - native_runtime_inputs
      write:
      - artifacts/
      - artifacts/workflow_hub/
    network:
    - native_binding_capabilities_require_qualification
    external_write:
    - native_binding_capabilities_require_qualification
  authority:
    allowed:
    - invoke_registered_native_workflow
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 20
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: Planning envelopes establish no proof, scientific truth, approval
    or promotion.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - workflow_started
  - step_started
  - step_completed
  - step_failed
  - workflow_completed
provenance:
  coverage: partial
  sources:
  - path: scripts/mathformer.py
    selector: run_intent_match
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: scripts/mathformer.py
    selector: build_intent_routes; initialize_intent_state; select_intent_action;
