      - textbook-theory-tex-organizer
      - textbook-chapter-autoformalization-orchestrator
      - textbook-autoformalization-batch-orchestrator
      - result-existence-precheck-orchestrator
      - source-line-translation-packet-builder
      - mathlib-grounding-maximizer
      - lean-execution-runner
      - lean-compile-checker
      - source-formalization-drift-guard
      - autoformalization-result-realness-verifier
      - lean-consistency-report-orchestrator
      hook_contracts:
      - id: intake.latex_archive_theory_extract
        phase: intake
        trigger: after a LaTeX textbook archive or source tree is provided and before thematic TeX organization
          or batch autoformalization
        owner_skill: latex-archive-theory-extractor
        reasoning_log_steps:
        - latex_archive_theory_extract_start
        - latex_archive_theory_extract_complete
        - latex_archive_theory_extract_error
        gate: extraction must preserve theorem-like environments, proof environments, source file/line
          provenance, labels, references, citations, and proof-pairing status before any batch job is
          created
        outputs:
        - theory_units_json
        - theorem_like_unit_inventory
        - proof_pairing_report
      - id: preformalization.textbook_theory_organize
        phase: preformalization
        trigger: after LaTeX archive theory extraction and before per-unit batch autoformalization jobs
          are emitted
        owner_skill: textbook-theory-tex-organizer
        reasoning_log_steps:
        - textbook_theory_organize_start
        - textbook_theory_organize_complete
        - textbook_theory_organize_error
        gate: organized TeX bundles must preserve original LaTeX blocks and source provenance while grouping
          units by coherent chapter or section context
        outputs:
        - organized_theory_manifest
        - thematic_tex_bundles
      - id: draft.textbook_chapter_autoformalization
        phase: drafting
        trigger: after a LaTeX book archive has been extracted and chapter-by-chapter planning is required
          before object-level execution
        owner_skill: textbook-chapter-autoformalization-orchestrator
        reasoning_log_steps:
        - textbook_chapter_autoformalization_start
        - textbook_chapter_inventory_complete
        - textbook_chapter_batch_ready
        - textbook_chapter_run_complete
        - textbook_chapter_autoformalization_error
        gate: each chapter must have its own source-preserving theory_units JSON, organized TeX manifest,
          batch manifest with proof jobs, and optional object-run manifest before the next chapter is
          executed
        outputs:
        - textbook_chapter_plan
        - per_chapter_theory_units_json
        - per_chapter_batch_manifest
        - per_chapter_object_run_manifest
      - id: draft.textbook_batch_autoformalize
        phase: drafting
        trigger: after organized textbook theory bundles are available and before individual queued units
          enter the standard autoformalization workflow
        owner_skill: textbook-autoformalization-batch-orchestrator
        reasoning_log_steps:
        - textbook_autoformalization_batch_start
        - textbook_autoformalization_job_written
        - textbook_autoformalization_batch_complete
        - textbook_autoformalization_batch_error
        gate: batch jobs must stay queued or support-only until each unit passes duplicate-result, mathlib
          grounding, Lean execution, realness, and consistency gates through the standard workflow
        outputs:
        - textbook_autoformalization_batch_manifest
        - per_unit_autoformalization_jobs
        - per_unit_workflow_prompts
      - id: draft.textbook_object_autoformalization_run
        phase: drafting
        trigger: after a textbook autoformalization batch manifest is available and an executor is asked
          to process jobs object by object
        owner_skill: textbook-autoformalization-batch-orchestrator
        reasoning_log_steps:
        - textbook_object_autoformalization_run_start
        - textbook_object_autoformalization_job_start
        - textbook_object_autoformalization_generation_complete
        - textbook_object_autoformalization_gates_complete
        - textbook_object_autoformalization_run_complete
        - textbook_object_autoformalization_run_error
        gate: each object run must record provider availability, generated Lean if any, realness and unified
          consistency reports, and must not mark complete unless all configured gates pass
        outputs:
        - textbook_object_run_manifest
        - per_object_result_json
        - per_object_generated_lean
        - per_object_gate_reports
      - id: preformalization.result_existence_precheck
        phase: preformalization
        trigger: before initial autoformalization of a theorem-like result unless a reviewed waiver or
          seed formalization is provided
        owner_skill: result-existence-precheck-orchestrator
        reasoning_log_steps:
        - result_existence_precheck_start
        - result_existence_precheck_local_search_ready
        - result_existence_precheck_web_search_ready
        - result_existence_precheck_complete
        - result_existence_precheck_skipped
        - result_existence_precheck_error
        gate: initial drafting is blocked until existing mathlib/MathformerLib candidates are ruled out
          and required official-source web search is complete
        outputs:
        - result_existence_report
        - reuse_packet
        - proceed_to_autoformalization
      - id: preformalization.line_translation_packet
        phase: preformalization
        trigger: after source-unit inventory and expansion review, before duplicate-result precheck or
          first Lean drafting
        owner_skill: source-line-translation-packet-builder
        reasoning_log_steps:
        - source_line_translation_packet_start
        - source_line_translation_packet_complete
        - source_line_translation_packet_error
        gate: every source-backed drafting target must expose stable literal source line ids, exact NL/LaTeX
          spans, Lean-facing candidate surfaces, and prompt-ready source anchors before the drafter is
          trusted
        outputs:
        - line_translation_packet
        - literal_source_anchor_index
        - lean_drafting_alignment_prompt
      - id: mathlib.grounding_maximize
        phase: mathlib_alignment
        trigger: after concept coverage, web grounding, import planning, saved Lean generation, or whenever
          artifact-set mathlib grounding is below target
        owner_skill: mathlib-grounding-maximizer
        reasoning_log_steps:
        - mathlib_grounding_maximization_start
        - mathlib_grounding_maximization_round_start
        - mathlib_grounding_measurement_complete
        - mathlib_grounding_fix_plan_ready
        - mathlib_grounding_monotonic_gate_complete
        - mathlib_grounding_maximization_complete
        - mathlib_grounding_maximization_error
        gate: artifact sets should have no broad Mathlib imports, no realness blockers, compatibility
          scores at target, and nondecreasing reference-free grounding unless explicitly marked draft
          or blocked
        outputs:
        - mathlib_grounding_report
        - grounding_loop_todos
        - monotonicity_comparison
      - id: execute.initial
        phase: execution
        trigger: immediately after autoformalizer_initial_output or seed_formalization_used
        owner_skill: lean-execution-runner
        reasoning_log_steps:
        - lean_execution_initial_start
        - lean_execution_initial_output
        gate: execution diagnostics must be available before refinement decisions
        outputs:
        - correctness
        - hard_feedback
        - lean_error_log_file
        - lean_error_log
      - id: check.compile
        phase: verification
        trigger: after each generated or saved Lean artifact
        owner_skill: lean-compile-checker
        reasoning_log_steps:
        - hard_critique_initial_start
        - hard_critique_initial_output
        - hard_critique_start
        - hard_critique_output
        - hard_critique_final_start
        - hard_critique_final_output
        - saved_output_hard_check_start
        - saved_output_hard_check
        - compatibility_audit_lake_check_start
        - compatibility_audit_lake_check_complete
        gate: failed compile checks trigger formal refinement or fail the final gate
      - id: postformalization.source_anchor_drift_guard
        phase: verification
        trigger: after initial Lean generation, seed replay, refinement, or denoising when a line translation
          packet exists
        owner_skill: source-formalization-drift-guard
        reasoning_log_steps:
        - source_anchor_drift_guard_start
        - source_anchor_drift_guard_complete
        - source_anchor_drift_guard_error
        gate: Lean declaration comments must cite valid Source anchors with configured coverage, no orphan
          anchors, and no source-aware declaration comments missing anchors
        outputs:
        - source_anchor_drift_report
        - covered_source_anchor_set
        - uncovered_source_anchor_set
      - id: artifact.realness_gate
        phase: artifacts
        trigger: after each saved Lean artifact or report, and before final statistics/report publication
        owner_skill: autoformalization-result-realness-verifier
        reasoning_log_steps:
        - result_realness_verification_complete
        gate: final artifacts must have no mock/stub/planned/unexecuted markers, no `sorry`/`admit`/target
          `axiom`, no missing generated-line `NL/LaTeX:` comments, and no interface scaffold claimed as
          complete
        outputs:
        - result_realness_report
        - blocking_realness_findings
      - id: consistency.unified_report
        phase: consistency
        trigger: after saved Lean artifact generation, before final acceptance, and after any consistency,
          grounding, or realness critic changes
        owner_skill: lean-consistency-report-orchestrator
        reasoning_log_steps:
        - lean_consistency_report_start
        - lean_consistency_report_layer_complete
        - lean_consistency_report_complete
        - lean_consistency_report_error
        gate: final artifacts pass only when all required consistency layers pass, including compile context
          when enabled, comment hygiene, realness, informalization, declaration shape, internal proof
          consistency, reverse informal consistency, non-vacuity, cross-file concepts, mathlib grounding,
          and reference-free monitoring
        outputs:
        - lean_consistency_report
        - blocking_consistency_layers
        - monotonic_consistency_todos
      recommended_hook_contracts: []
  mathformer.membership:
    required_hooks_are_not_an_execution_schedule: true
    owner_skills:
    - latex-archive-theory-extractor
    - textbook-theory-tex-organizer
    - textbook-chapter-autoformalization-orchestrator
    - textbook-autoformalization-batch-orchestrator
    - result-existence-precheck-orchestrator
    - source-line-translation-packet-builder
    - mathlib-grounding-maximizer
    - lean-execution-runner
    - lean-compile-checker
    - source-formalization-drift-guard
    - autoformalization-result-realness-verifier
    - lean-consistency-report-orchestrator
    runtime_accounting: {}
