    contract:
      id: textbook_theory_autoformalization_loop
      description: LaTeX textbook archive extraction, thematic TeX organization, truthful per-unit job
        queuing, and standard Lean workflow gates for each target unit
      required_hooks:
      - intake.latex_archive_theory_extract
      - preformalization.textbook_theory_organize
      - draft.textbook_chapter_autoformalization
      - draft.textbook_batch_autoformalize
      - draft.textbook_object_autoformalization_run
