  - id: refine_loop
    kind: loop
    state_type: LoopState
    initial:
      ref: steps.initialize.outputs.state
    max_iterations: 4
    on_exhausted: budget_exhausted
    body:
      kind: sequence
      steps:
      - id: guard
        kind: call
        operation: compute_iteration_guard
        arguments:
