              core_statement_annotations:
                ref: inputs.core_statement_annotations
        - id: compile_failed
          when:
            eq:
            - ref: steps.guard.outputs.guard.route
            - literal: formal_repair
          body:
            kind: call
            operation: formal_repair_round
            arguments:
              informal_statement:
                ref: inputs.informal_statement
              file_prefix:
                ref: inputs.file_prefix
              dependency_context:
                ref: inputs.dependency_context
              alignment_hints:
                ref: inputs.alignment_hints
              core_statement_annotations:
                ref: inputs.core_statement_annotations
              state:
                ref: loop.state
              max_iterations:
                ref: inputs.max_iterations
        default:
          kind: call
          operation: semantic_repair_round
          arguments:
            informal_statement:
              ref: inputs.informal_statement
            file_prefix:
              ref: inputs.file_prefix
            dependency_context:
              ref: inputs.dependency_context
            alignment_hints:
              ref: inputs.alignment_hints
            core_statement_annotations:
              ref: inputs.core_statement_annotations
            state:
              ref: loop.state
            max_iterations:
              ref: inputs.max_iterations
        outputs:
          state:
            type: LoopState
            value:
              ref: selected.outputs.state
          stop:
            type: StopFlag
            value:
              ref: selected.outputs.stop
      outputs:
        state:
          type: LoopState
          value:
            ref: steps.route.outputs.state
        stop:
          type: StopFlag
          value:
            ref: steps.route.outputs.stop
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.stop
    outputs:
      final_state:
        type: LoopState
        value:
          ref: loop.state
