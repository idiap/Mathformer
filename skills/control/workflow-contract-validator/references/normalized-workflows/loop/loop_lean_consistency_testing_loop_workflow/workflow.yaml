schema_version: workflow-skill/v1
namespace: mathformer
id: loop_lean_consistency_testing_loop_workflow
version: 1.0.0
kind: workflow
description: 'Single-pass build_report coordinator: optional compilation, file checks,
  ordered consistency checks, optional grounding and monitoring, then unified report
  aggregation. No repair or convergence loop.'
aliases:
- lean_consistency_testing_loop
lifecycle: active
activation:
  mode: explicit
  prerequisites: []
types:
  Args:
    schema:
      type: object
      properties:
        lean_file:
          type: array
          items:
            type: string
          default: []
        run_lean_check:
          type: boolean
          default: false
        informalization_report:
          type:
          - string
          - 'null'
          default: null
        output_file:
          type:
          - string
          - 'null'
          default: null
        reasoning_log_file:
          type:
          - string
          - 'null'
          default: null
        target_mathlib_compatibility:
          type: integer
          default: 80
        target_reference_free_score:
          type: integer
          default: 80
        skip_mathlib_grounding:
          type: boolean
          default: false
        skip_reference_free_monitor:
          type: boolean
          default: false
      additionalProperties: false
  Boolean:
    schema:
      type: boolean
  State:
    schema:
      type: object
      required:
      - args
      - paths
      - layers
      - informalization_report
      - output_file
      properties:
        args:
          type: object
          description: Resolved native arguments, thresholds, flags and optional log
            path.
        paths:
          type: array
          items:
            type: string
        layers:
          type: array
          items:
            type: object
            required:
            - id
            - ok
            - required
            - skipped
            properties:
              id:
                type: string
              ok:
                type: boolean
              required:
                type: boolean
              skipped:
                type: boolean
            additionalProperties: true
        informalization_report:
          type: string
        output_file:
          type: string
      additionalProperties: false
  Report:
    schema:
      type: object
      required:
      - generated_at_utc
      - skill
      - hook_id
      - ok
      - summary
      - lean_files
      - layers
      - blocking_layers
      - output_files
      properties:
        generated_at_utc:
          type: string
        skill:
          type: string
          const: lean-consistency-report-orchestrator
        hook_id:
          type: string
          const: consistency.unified_report
        ok:
          type: boolean
        summary:
          type: object
          required:
          - file_count
          - layer_count
          - blocking_layer_count
          - finding_count
          - blocking_finding_count
          - consistency_score
          - min_layer_score
          properties:
            file_count:
              type: integer
            layer_count:
              type: integer
            blocking_layer_count:
              type: integer
            finding_count:
              type: integer
            blocking_finding_count:
              type: integer
            consistency_score:
              type: number
            min_layer_score:
              type: number
        lean_files:
          type: array
          items:
            type: string
        layers:
          type: array
          items:
            type: object
        blocking_layers:
          type: array
          items:
            type: string
        output_files:
          type: object
          required:
          - report
          - informalization_report
          properties:
            report:
              type: string
            informalization_report:
              type: string
  Path:
    schema:
      type: string
  Context:
    schema:
      type: object
      required:
      - handle
      properties:
        handle:
          type: string
      additionalProperties: false
inputs:
  args:
    type: Args
outputs:
  report:
    type: Report
    value:
      ref: flow.outputs.report
  report_path:
    type: Path
    value:
      ref: flow.outputs.report_path
  informalization_report_path:
    type: Path
    value:
      ref: flow.outputs.informalization_report_path
operations:
  initialize:
    inputs:
      args:
        type: Args
    outputs:
      state:
        type: State
      has_files:
        type: Boolean
      grounding_enabled:
        type: Boolean
      monitor_enabled:
        type: Boolean
      context:
        type: Context
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_initialize
        operation: mathformer_lean_consistency_initialize
  compile:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_compile
        operation: mathformer_lean_consistency_compile
  file_checks:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_file_checks
        operation: mathformer_lean_consistency_file_checks
  core_checks:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_core_checks
        operation: mathformer_lean_consistency_core_checks
  grounding:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_grounding
        operation: mathformer_lean_consistency_grounding
  monitor:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_monitor
        operation: mathformer_lean_consistency_monitor
  carry_state:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      state:
        type: State
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_carry_state
        operation: mathformer_lean_consistency_carry_state
  aggregate:
    inputs:
      state:
        type: State
      context:
        type: Context
    outputs:
      report:
        type: Report
      report_path:
        type: Path
      informalization_report_path:
        type: Path
    execution:
      mode: deterministic
      binding:
        adapter: mcp.tool
        kind: tool
        target: mathformer_lean_consistency_aggregate
        operation: mathformer_lean_consistency_aggregate
flow:
  kind: sequence
  steps:
  - id: initialize
    kind: call
    operation: initialize
    arguments:
      args:
        ref: inputs.args
  - id: compile
    kind: call
    operation: compile
    arguments:
      state:
        ref: steps.initialize.outputs.state
      context:
        ref: steps.initialize.outputs.context
  - id: files
    kind: switch
    cases:
    - id: enabled
      when:
        ref: steps.initialize.outputs.has_files
      body:
        kind: call
        operation: file_checks
        arguments:
          state:
            ref: steps.compile.outputs.state
          context:
            ref: steps.initialize.outputs.context
    default:
      kind: call
      operation: carry_state
      arguments:
        state:
          ref: steps.compile.outputs.state
        context:
          ref: steps.initialize.outputs.context
    outputs:
      state:
        type: State
        value:
          ref: selected.outputs.state
  - id: core
    kind: call
    operation: core_checks
    arguments:
      state:
        ref: steps.files.outputs.state
      context:
        ref: steps.initialize.outputs.context
  - id: grounding
    kind: switch
    cases:
    - id: enabled
      when:
        ref: steps.initialize.outputs.grounding_enabled
      body:
        kind: call
        operation: grounding
        arguments:
          state:
            ref: steps.core.outputs.state
          context:
            ref: steps.initialize.outputs.context
    default:
      kind: call
      operation: carry_state
      arguments:
        state:
          ref: steps.core.outputs.state
        context:
          ref: steps.initialize.outputs.context
    outputs:
      state:
        type: State
        value:
          ref: selected.outputs.state
  - id: monitor
    kind: switch
    cases:
    - id: enabled
      when:
        ref: steps.initialize.outputs.monitor_enabled
      body:
        kind: call
        operation: monitor
        arguments:
          state:
            ref: steps.grounding.outputs.state
          context:
            ref: steps.initialize.outputs.context
    default:
      kind: call
      operation: carry_state
      arguments:
        state:
          ref: steps.grounding.outputs.state
        context:
          ref: steps.initialize.outputs.context
    outputs:
      state:
        type: State
        value:
          ref: selected.outputs.state
  - id: aggregate
    kind: call
    operation: aggregate
    arguments:
      state:
        ref: steps.monitor.outputs.state
      context:
        ref: steps.initialize.outputs.context
  outputs:
    report:
      type: Report
      value:
        ref: steps.aggregate.outputs.report
    report_path:
      type: Path
      value:
        ref: steps.aggregate.outputs.report_path
    informalization_report_path:
      type: Path
      value:
        ref: steps.aggregate.outputs.informalization_report_path
policy:
  effects:
    filesystem:
      read:
      - repository
      write:
      - run_artifacts
      - reasoning_log
    network: []
    external_write: []
  authority:
    allowed:
    - inspect_declared_contract
    - run_consistency_checks
    - produce_consistency_report
    forbidden:
    - bypass_native_controls
    - infer_scientific_truth_from_completion
    - repair_lean_files
    - promote_artifacts
  limits:
    wall_time_seconds: 3600
    max_operation_calls: 7
  failure:
    default: fail
    retry:
      max_attempts: 1
      retryable_codes: []
  resume:
    mode: none
    require_matching_definition_and_inputs: true
  claim_ceiling: A consistency report records required executed layers; it grants
    no scientific truth, promotion or runtime qualification.
observability:
  receipts: required
  artifact_digests: sha256
  provenance: required
  events:
  - lean_consistency_report_start
  - lean_consistency_report_layer_complete
  - lean_consistency_report_complete
provenance:
  coverage: partial
  sources:
  - path: skills/lean/lean-consistency-report-orchestrator/scripts/run_lean_consistency_report.py
    selector: build_report; initialize_report; compile_report; check_report_files;
      check_report_core; ground_report; monitor_report; aggregate_report; run_json_layer;
      run_lean_compile_layer; parse_args; main
    digest: sha256:f04bb382362a488693593f2178d619a591a7c95ed3dbd534438bc75982fd9cad
  - path: skills/SKILL_HOOKS.yaml
    selector: loop_contracts/lean_consistency_testing_loop
    digest: sha256:6a4370a206d71da4550b976e50fd1d4863881b3f920820a3ea7b49e8de39a353
  - path: scripts/lean_consistency_workflow_tools.py
    selector: register_lean_consistency_tools; source_report
    digest: sha256:3eb71bee506d4d6750b2433cbc84444a9df091da13cb773b726391090c890424
  - path: scripts/mcp_server.py
    selector: register_lean_consistency_tools
    digest: sha256:e8d99ef05300267dc16e41f072baedd8cf4bebafb19a82ecf8fdd2ac051c2ba2
  - path: skills/control/workflow-contract-validator/scripts/normalize_workflows.py
    selector: inventory lean_consistency_testing_loop
    digest: sha256:eaa651dbf2f2e1633a0637e4978f92863b83dbf768e6a16c77f25e6c071fd418
  - path: scripts/mathformer.py
    selector: audit_pack_sources
    digest: sha256:9aeea40cc2fa10223d2315409f055e95e4e368ca0358bfe5173b644d008356a0
  - path: tests/mcp/run_lean_consistency_workflow_tests.py
    selector: LeanConsistencyTests
    digest: sha256:7815e11d2476bb307f971d8fe79d713ef3b0a66c87a2594c45866ac5b220cbac
  - path: tests/mcp/fixtures/lean_consistency_boundary.py
    selector: install; serve
    digest: sha256:874b4b6319147f7d189cfc03ed1e7da5ea05eacb473f0fa7c710686bf97fd981
  - path: tests/mcp/fixtures/lean_consistency_original.py.txt
    selector: original build_report behavior oracle
    digest: sha256:bd506f12b24ccc69fefcebf39edc9cf18f6303a22d25b8685f68883c4371bf62
  gaps:
  - Native helper internals remain inside their owning operations. Source-anchor drift,
    RFDE reporting and surrounding AgentC repetition are outside build_report.
  - The 3600-second contract ceiling is inherited, not a native whole-run deadline;
    unbounded input file count can reach it before native per-layer timeouts.
extensions:
  mathformer.source:
    category: loop
    native_id: lean_consistency_testing_loop
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    execution_owner_skill: skills/lean/lean-consistency-report-orchestrator/SKILL.md
    execution_source: skills/lean/lean-consistency-report-orchestrator/scripts/run_lean_consistency_report.py
    selector: build_report
  mathformer.membership:
    required_hooks_are_not_an_execution_schedule: true
  mathformer.execution:
    passes: 1
    state: Accumulate layers and carry the same informalization-report path through
      ordered stages. No retries, checkpointing, repair loop or convergence test.
    failure: Nonzero returns, invalid JSON or payload ok=false become failed layers;
      subsequent layers still run. Uncaught subprocess exceptions/timeouts abort before
      final aggregation. JSON layers use required=true. Disabled compilation appends
      a skipped nonrequired layer.
    cli: build_report returns a report even when ok=false. main returns failure status
      only when --expect-ok is set; CLI formatting/self-test are outside this contract.
    outer_repetition: AgentC owns surrounding bounded refinement and post-loop promotion/recheck;
      these are outside build_report.
    budgets: Seven block calls per pass. Compilation repeats once per supplied file
      within its owning helper; there is no graph loop or arbitrary loop cap.
    context: Initialize returns a service-owned single-pass context; later ports assert
      unchanged native state and ordered execution. Exceptions consume context. Skipped
      branches preserve state and append no layer.
