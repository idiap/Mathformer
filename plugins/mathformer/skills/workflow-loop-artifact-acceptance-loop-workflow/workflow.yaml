      hook_contracts:
      - id: annotate.line_comment_guard
        phase: annotation
        trigger: after initial drafting, denoising, or refinement produces generated Lean code and before
          the artifact is accepted or saved
        owner_skill: lean-line-annotation
        reasoning_log_steps:
        - lean_line_comment_guard_start
        - lean_line_comment_guard_complete
        - lean_line_comment_guard_error
        gate: generated Lean must preserve source-aware semantic declaration comments and avoid legacy
          per-line `NL/LaTeX:` noise or syntax-only comments
        outputs:
        - line_comment_contract_report
      - id: mathlib.import.minimize
        phase: cleanup
        trigger: after denoising, refinement, or saved Lean artifact generation when the import block
          should be tightened
        owner_skill: mathlib-import-minimizer
        reasoning_log_steps:
        - mathlib_import_minimization_start
        - mathlib_import_minimization_complete
        gate: final artifacts should have deduplicated imports and no broad `import Mathlib` unless explicitly
          waived
        outputs:
        - minimized_imports
        - suggested_import_block
        - import_minimization_findings
      - id: mathlib.grounding_maximize
        phase: mathlib_alignment
        trigger: after concept coverage, web grounding, import planning, saved Lean generation, or whenever
          artifact-set mathlib grounding is below target
        owner_skill: mathlib-grounding-maximizer
        reasoning_log_steps:
        - mathlib_grounding_maximization_start
        - mathlib_grounding_maximization_round_start
        - mathlib_grounding_measurement_complete
        - mathlib_grounding_fix_plan_ready
        - mathlib_grounding_monotonic_gate_complete
        - mathlib_grounding_maximization_complete
        - mathlib_grounding_maximization_error
        gate: artifact sets should have no broad Mathlib imports, no realness blockers, compatibility
          scores at target, and nondecreasing reference-free grounding unless explicitly marked draft
          or blocked
        outputs:
        - mathlib_grounding_report
        - grounding_loop_todos
        - monotonicity_comparison
      - id: audit.compatibility
        phase: audit
        trigger: enable_compatibility_audit is true after saved output
        owner_skill: mathlib-abstraction-auditor
        reasoning_log_steps:
        - compatibility_audit_start
        - compatibility_audit_cli_start
        - compatibility_audit_file_loaded
        - compatibility_audit_structure_scanned
        - compatibility_audit_finding_detected
        - compatibility_audit_complete
        - compatibility_audit_report_written
        - compatibility_audit_output_emitted
        - compatibility_audit_error
        gate: compatibility_target_met controls score-gated outer cycles
      - id: postformalization.informalize
        phase: postformalization
        trigger: after a final Lean artifact compiles and before consistency review, artifact acceptance,
          or human-facing proof explanation
        owner_skill: lean-informalization-extractor
        reasoning_log_steps:
        - lean_informalization_extraction_start
        - lean_informalization_extraction_complete
        - lean_informalization_extraction_error
        gate: every theorem-like final declaration should have a conservative informal statement and proof
          summary derived from the Lean artifact, with source/generation comments preserved separately
        outputs:
        - lean_informalization_packet
        - reverse_statement_packets
        - reverse_proof_summaries
      - id: consistency.declaration_shape
        phase: consistency
        trigger: after reverse informalization and before source/Lean informal-consistency review, non-vacuity
          review, or final acceptance
        owner_skill: lean-declaration-shape-consistency-checker
        reasoning_log_steps:
        - lean_declaration_shape_consistency_start
        - lean_declaration_shape_consistency_complete
        - lean_declaration_shape_consistency_error
        gate: theorem-like declarations must preserve source-advertised logical shape, including iff,
          existence, uniqueness, and conditional structure, unless an explicit representation-boundary
          note explains the encoding
        outputs:
        - declaration_shape_report
        - declaration_shape_findings
        - declaration_shape_score
      - id: postformalization.informal_internal_consistency
        phase: postformalization
        trigger: after reverse informalization and before source/Lean informal-consistency review
        owner_skill: lean-informal-proof-internal-consistency-verifier
        reasoning_log_steps:
        - lean_informal_internal_consistency_start
        - lean_informal_internal_consistency_complete
        - lean_informal_internal_consistency_error
        gate: informalized proof packets must have no missing statements, missing proof summaries, placeholder
          traces, axioms-as-proofs, exact circular dependencies, or severe proof-shape contradictions
          before they are used as consistency evidence
        outputs:
        - informal_proof_internal_consistency_report
        - internal_proof_consistency_findings
        - internal_proof_consistency_score
      - id: postformalization.informal_consistency
        phase: postformalization
        trigger: after reverse informalization and before final artifact acceptance or MathformerLib promotion
        owner_skill: lean-informal-consistency-verifier
        reasoning_log_steps:
        - lean_informal_consistency_start
        - lean_informal_consistency_complete
        - lean_informal_consistency_error
        gate: final artifacts must have no reverse-informalization blockers, no realness blockers, no
          optional Lean-check failures, and no source/comment claim shape inconsistent with the Lean theorem
          signature
        outputs:
        - informal_consistency_report
        - reverse_consistency_findings
        - proof_consistency_score
      - id: consistency.nonvacuity
        phase: consistency
        trigger: after compilation, informalization, and declaration-shape review before final acceptance
          or MathformerLib promotion
        owner_skill: lean-nonvacuity-consistency-checker
        reasoning_log_steps:
        - lean_nonvacuity_consistency_start
        - lean_nonvacuity_consistency_complete
        - lean_nonvacuity_consistency_error
        gate: accepted theorem-like declarations must have no axioms, false-hypothesis vacuity, target-restating
          hypotheses, or undocumented exact-hypothesis proof wrappers
        outputs:
        - nonvacuity_report
        - nonvacuity_findings
        - nonvacuity_score
      - id: consistency.cross_file_concepts
        phase: consistency
        trigger: after one or more Lean artifacts are saved and before corpus-level acceptance or MathformerLib
          promotion
        owner_skill: lean-cross-file-concept-consistency-indexer
        reasoning_log_steps:
        - lean_cross_file_concept_index_start
        - lean_cross_file_concept_index_complete
        - lean_cross_file_concept_index_error
        gate: same-file full declaration-name collisions block acceptance; cross-file divergent concept
          families become review or MathformerLib-promotion todos
        outputs:
        - cross_file_concept_index
        - cross_file_consistency_report
        - mathformerlib_promotion_candidates
      - id: consistency.unified_report
        phase: consistency
        trigger: after saved Lean artifact generation, before final acceptance, and after any consistency,
          grounding, or realness critic changes
        owner_skill: lean-consistency-report-orchestrator
        reasoning_log_steps:
        - lean_consistency_report_start
        - lean_consistency_report_layer_complete
        - lean_consistency_report_complete
        - lean_consistency_report_error
        gate: final artifacts pass only when all required consistency layers pass, including compile context
          when enabled, comment hygiene, realness, informalization, declaration shape, internal proof
          consistency, reverse informal consistency, non-vacuity, cross-file concepts, mathlib grounding,
          and reference-free monitoring
        outputs:
        - lean_consistency_report
        - blocking_consistency_layers
        - monotonic_consistency_todos
      - id: artifact.realness_gate
        phase: artifacts
        trigger: after each saved Lean artifact or report, and before final statistics/report publication
        owner_skill: autoformalization-result-realness-verifier
        reasoning_log_steps:
        - result_realness_verification_complete
        gate: final artifacts must have no mock/stub/planned/unexecuted markers, no `sorry`/`admit`/target
          `axiom`, no missing generated-line `NL/LaTeX:` comments, and no interface scaffold claimed as
          complete
        outputs:
        - result_realness_report
        - blocking_realness_findings
      - id: artifact.statistics
        phase: artifacts
        trigger: workflow completion
        owner_skill: autoformalization-workflow-orchestrator
        reasoning_log_steps:
        - save_refinement_history
        - save_autoformalization_statistics
        - save_systematic_report
        - workflow_complete
        gate: null
        outputs:
        - .lean
        - .history.json
        - .report.json
        - reasoning-log.jsonl
        - .stats.json
        - .stats.tex
      - id: evaluation.rfde_report
        phase: evaluation
        trigger: after unified consistency report, reference-free critic monitoring, source-anchor drift
          report, realness gate, and artifact statistics are available
        owner_skill: reference-free-descriptive-evaluator
        reasoning_log_steps:
        - rfde_report_start
        - rfde_surface_measurement_complete
        - rfde_trajectory_analysis_complete
        - rfde_report_complete
        - rfde_report_error
        gate: RFDE reporting must expose hard gates, metric profiles, claim and obligation ledgers, diagnostics,
          cost trace, phase-transition observability, and rendered dashboard without hiding weak evidence
          surfaces
        outputs:
        - rfde_report_json
        - rfde_report_markdown
        - rfde_dashboard_html
        - rfde_trajectory_timeline_html
        - rfde_metrics_timeseries
        - rfde_trajectory_model
      - id: library.documentation
        phase: library
        trigger: after final Lean artifacts, realness reports, consistency reports, statistics, and Mathformerlib
          registry updates are complete
        owner_skill: mathformer-library-docs-generator
        reasoning_log_steps:
        - mathformer_library_docs_start
        - mathformer_library_docs_complete
        - mathformer_library_docs_error
        gate: every documented Lean module must have a repository Markdown page, rendered Lean and LaTeX/source
          sections where present, and an updated browsable index
        outputs:
        - mathformer_library_docs_index
        - mathformer_library_module_pages
        - mathformer_library_docs_manifest
      - id: library.aligned_html_documentation
        phase: library
        trigger: after final Lean artifacts have source-aware comments and the Markdown documentation
          pass is complete
        owner_skill: mathformer-library-docs-generator
        reasoning_log_steps:
        - mathformer_aligned_html_docs_start
        - mathformer_aligned_html_docs_complete
        - mathformer_aligned_html_docs_error
        gate: every included Lean module must have one aligned HTML page with original text, rendered
          LaTeX, syntax-highlightable Lean code, source-order declaration anchors, and an updated aligned
          index
        outputs:
        - mathformer_aligned_html_docs_index
        - mathformer_aligned_html_module_pages
        - mathformer_aligned_html_docs_manifest
      recommended_hook_contracts: []
  mathformer.membership:
    required_hooks_are_not_an_execution_schedule: true
    owner_skills:
    - lean-line-annotation
