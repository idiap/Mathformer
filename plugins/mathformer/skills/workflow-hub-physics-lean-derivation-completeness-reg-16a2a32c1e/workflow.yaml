extensions:
  mathformer.source:
    category: hub
    native_id: physics-lean:derivation-completeness-regression
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: physics-lean:derivation-completeness-regression
      family: physics_lean
      kind: validation
      safety: writes_artifacts
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: main(argv) via build_registry -> run_action -> run_leaf_action with
      --json; this graph exports main results rather than a HubResult envelope.
    failure_policy: Nonzero checker exit, malformed JSON or any uncaught exception
      aborts immediately before the final report; findings normally exit zero.
    controls: Hub preflight/dry-run can prevent launch; post-execution write audit
      can mark the action unsuccessful even after main returns zero.
    callers:
    - run_lean_physics_backend_suite.py::derivation_regression
    - run_critic_calibration_dashboard.py::derivation
  mathformer.regression:
    ordering: All ten subprocesses finish before checks; independent reports are retained,
      without repair, retry, recursive expansion or loop-carried scientific state.
    checker_priority: High-severity target-restatement findings block first; otherwise
      positive frontier count or blocked obligations yields derivation_partial; otherwise
      complete_autoformalization.
    assertions: Eleven source-defined checks cover self-test, direct/wrapped target
      blocking, legitimate completion, frontier blocking, compiled_surface preservation,
      and five case-specific obligation/probe/frontier checks.
    case_common: All five FormalPhysics checks require complete_autoformalization,
      blocked_obligation_count default 0 equal to 0, and recursive_frontier_count
      default -1 equal to 0.
    predicates:
      self_test_passes: self_test.ok is True.
      direct_target_hypothesis_blocks: direct.status is blocked_target_restating_assumption
        and codes contains direct_target_repeated_as_hypothesis.
      wrapped_target_witness_blocks: wrapped.status is blocked_target_restating_assumption
        and codes contains target_restatement_wrapped_in_witness.
      legitimate_source_law_witness_passes: legitimate.status is complete_autoformalization.
      open_frontier_blocks_complete_status: frontier_blocked.status is derivation_partial
        and frontier_blocked.ok is False.
      compiled_surface_flag_preserved_when_blocked: frontier_blocked first artifact
        flags contain compiled_surface and status is derivation_partial.
      formalphysics_0014_obligations_and_probes: case_common; commutator_to_dirac_bridge
        is proved_from_commutator_expectation; at least 4 generative_repair_probes
        and zero repair_frontier_nodes.
      formalphysics_0015_vacuum_rabi_complete: case_common; transition_amplitude_from_state_expansion,
        born_probability_from_amplitude and complex_norm_square_minus_i_sin are proved.
      formalphysics_0021_parameter_hamiltonian_complete: case_common; eigenvalue_to_expectation_curve_bridge,
        derivative_uniqueness_transfer_bridge and expectation_derivative_calculation
        are proved.
      formalphysics_0052_position_expectation_complete: case_common; born_density_integrand_bridge,
        resolution_identity_measure_kernel and born_integral_bridge are proved; measure_integral_mathlib_surface
        is mathlib_reused.
      formalphysics_0074_chained_bridge_complete: case_common; complex_imaginary_quotient_bridge
        and square_identity_bridge are proved.
