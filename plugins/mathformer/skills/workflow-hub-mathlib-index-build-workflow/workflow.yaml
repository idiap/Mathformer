            import_edges. Imports stop at first regex-matched declaration; declaration
            scans finish at EOF. Retain source locations, docs, tokens, shapes and
            unverified Lean status. Then accumulate reverse imports, descendant counts
            and declaration adjacency. Inspect first 16 module and namespace peers;
            selected token-peer scans break after an insertion reaches related-set
