      discovery; dependency_errors starts empty and appends in registry/dependency
      order.
    bounds: Finite command arguments, matrix records, hook text matches, six glob
      result collections, discovered paths, and registered dependency edges.
    stopping: Each scan completes its collection; findings never trigger early termination.
      Natural completion returns normally; there is no native exhaustion outcome.
