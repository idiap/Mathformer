      depends_on: []
      allows_extra_args: false
      timeout_seconds: 900
  mathformer.native_boundary:
    execution: Native hub dispatch remains main -> run_action -> run_leaf_action;
      normalized operations call the same native runner functions with server-owned
      args/state/report and recheck service write policy each time.
    argv:
    - '{python}'
    - tests/test_program/run_comprehensive_tests.py
    - --module-family
    - physics_sympy
    - --json
    controls: Preflight precedes execution; dry-run skips the subprocess; declared
      writes are audited. Failures remain failures.
    traversal: Ordinary failures/timeouts are result data and do not stop iteration;
      missing optional dependencies skip by default, fail under strict/fail-on-warning.
      Unexpected exceptions propagate.
    checks: Compare exit with expected_exit; audit writes after completed subprocesses
      and fail undeclared writes. Timeout handling returns failure without that completed-process
      audit. Row timeout defaults to 120 seconds.
    bound: 'No native iteration cap: selected-row count bounds traversal. With input
      tests <=4096 and one increment per row, until is true on the last permitted
      iteration; finalization returns normally, including at 4096. on_exhausted is
      unreachable for valid inputs/state.'
    budgets: 900 seconds is the native outer subprocess limit; 8197 calls covers two
      per row plus enter/prepare/initial guard/finalize/publish. The former 3600-second
      projection was not native.
    outputs: 'JSON: artifacts/test_program/deterministic_tests.json; dependency snapshot:
      artifacts/test_program/dependency_map.json; native stdout and exit 0/3. Optional
      JSONL/JUnit are disabled.'
  mathformer.specialization:
    matrix_input: Assertion of exact native tests/test_matrix.json; transported rows
      never supply commands. The original 4096 total-row admission bound is retained.
    context: Input args fixes registered workstation defaults, except run_id as source
      context. enter parses once and returns an opaque handle; later tools require
      owned state and phase.
    loop: Root Cursor(state,pending) loop is equivalent to the native while guard,
      including empty selection via retain_empty. This layout avoids unsupported branch-local
      loop exhaustion in Lunar. No retry or truncation; finalization requires exhaustion.
    snapshot: emit_dependency_map_only is constant false for this hub action, so the
      unreachable early branch is specialized away. The shared native snapshot MCP
      operation is bound and tested separately.
    publication: Native stdout is emitted on MCP stderr and returned in publication.stdout
      on success. JSON report is written before a native nonzero exit becomes an MCP
      error; failure reports exit 3. The source exit gate is implemented inside publish
      because Lunar does not compile gate nodes.
    bound: At most 4096 advances and 8197 calls (enter, prepare, initial guard, two
      per row, finalize, publish). Empty selection uses six calls; the native hub
      wall limit remains 900 seconds.
