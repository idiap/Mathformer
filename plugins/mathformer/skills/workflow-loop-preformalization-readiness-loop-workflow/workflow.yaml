      hook_contracts:
      - id: intake.paper_layout_extract
        phase: intake
        trigger: after a PDF URL, paper PDF, or paper text is provided and before paper-level theory localization
        owner_skill: paper-docling-layout-extractor
        reasoning_log_steps:
        - paper_layout_extract_start
        - paper_layout_extract_complete
        - paper_layout_extract_error
        gate: layout extraction must report its engine and preserve sections, blocks, references, warnings,
          and source provenance before theorem localization
        outputs:
        - paper_layout_packet
        - extraction_engine_report
        - layout_warnings
      - id: intake.paper_theory_localize
        phase: intake
        trigger: after paper layout extraction and before source-unit inventory, LaTeX expansion, duplicate-result
          precheck, or first-pass drafting
        owner_skill: paper-main-theory-localizer
        reasoning_log_steps:
        - paper_theory_localization_start
        - paper_theory_localization_complete
        - paper_theory_localization_error
        gate: selected paper-level drafting targets must include support units, intermediate expansion
          queue, reference support, and mathlib concept hints
        outputs:
        - paper_theory_localization_packet
        - main_theory_results
        - intermediate_expansion_queue
        - reference_support_packet
      - id: intake.source_unit_inventory
        phase: intake
        trigger: after a source URL, article, paper excerpt, or wiki-style page is provided and before
          LaTeX expansion, duplicate-result precheck, or first-pass drafting
        owner_skill: source-formalizable-unit-extractor
        reasoning_log_steps:
        - source_unit_inventory_start
        - source_unit_inventory_complete
        - source_unit_inventory_error
        gate: every selected theorem-like drafting target must have a typed source-linked unit, original
          span, mathlib concept hints, and downstream routes before autoformalization begins
        outputs:
        - formalizable_unit_inventory
        - source_unit_dependency_queue
        - source_unit_mathlib_concepts
      - id: preformalization.paper_theory_expand
        phase: preformalization
        trigger: after paper theory localization and before drafting the selected main result queue
        owner_skill: paper-theory-autoformalization-orchestrator
        reasoning_log_steps:
        - paper_theory_expansion_plan_start
        - paper_theory_intermediate_queue_ready
        - paper_theory_reference_support_ready
        - paper_theory_expansion_plan_complete
        - paper_theory_expansion_plan_error
        gate: main paper results cannot be drafted until definitions, assumptions, intermediate lemmas,
          proof blocks, notation, equations, and cited references are expanded or explicitly marked unresolved
        outputs:
        - expanded_intermediate_queue
        - main_result_drafting_queue
        - blocked_or_unresolved_dependencies
      - id: preformalization.expansion_support
        phase: preformalization
        trigger: proof text is available before LaTeX prerequisite expansion
        owner_skill: proof-expansion-support-orchestrator
        reasoning_log_steps:
        - proof_expansion_support_start
        - proof_expansion_support_complete
        - proof_expansion_support_skipped
        gate: hard or research-level proof segments must either have web support or explicit unresolved
          status
        outputs:
        - expansion_support_packet
      - id: preformalization.expansion_difficulty
        phase: preformalization
        trigger: proof expansion support is enabled or requested
        owner_skill: proof-expansion-difficulty-estimator
        reasoning_log_steps:
        - proof_expansion_difficulty_start
        - proof_expansion_difficulty_complete
        - proof_expansion_difficulty_error
        gate: null
        outputs:
        - difficulty_report
        - web_search_recommended segments
        - suggested_queries
      - id: preformalization.expansion_web_support
        phase: preformalization
        trigger: difficulty estimator flags hard/research segments or web_search_recommended is true
        owner_skill: proof-expansion-web-researcher
        reasoning_log_steps:
        - proof_expansion_web_search_start
        - proof_expansion_web_search_result
        - proof_expansion_web_search_complete
        - proof_expansion_web_search_skipped
        gate: source-backed claims must cite URLs and preserve uncertainty when support is incomplete
        outputs:
        - web_research_packets
        - verified statements
        - unresolved uncertainties
      - id: preformalization.expand
        phase: preformalization
        trigger: enable_latex_expansion is true and a LatexExpansionAgent is configured
        owner_skill: latex-prerequisite-expander
        reasoning_log_steps:
        - latex_expansion_start
        - latex_expansion_complete
        - latex_expansion_error
        - latex_expansion_skipped
        gate: null
        outputs:
        - expanded_statement
        - effective_statement
      - id: preformalization.review.suite
        phase: preformalization
        trigger: after latex_expansion_complete or when expansion review is explicitly requested
        owner_skill: latex-expansion-review-orchestrator
        reasoning_log_steps:
        - latex_expansion_review_suite_start
        - latex_expansion_review_suite_complete
        - latex_expansion_review_suite_skipped
        gate: suite passes only when all configured expansion reviewers return Judgement True
        outputs:
        - latex_expansion_reviews
        - latex_expansion_review_passed
      - id: preformalization.review.completeness
        phase: preformalization
        trigger: expanded_statement is available and a completeness reviewer is configured
        owner_skill: latex-expansion-completeness-reviewer
        reasoning_log_steps:
        - latex_expansion_completeness_review_start
        - latex_expansion_completeness_review_complete
        - latex_expansion_completeness_review_error
        - latex_expansion_completeness_review_skipped
        gate: missing assumptions, prerequisites, side conditions, or changed conclusion should block
          trusting the expansion
        outputs:
        - judgement
        - explanation
      - id: preformalization.review.bindings
        phase: preformalization
        trigger: expanded_statement is available and a binding reviewer is configured
        owner_skill: latex-expansion-binding-reviewer
        reasoning_log_steps:
        - latex_expansion_binding_review_start
        - latex_expansion_binding_review_complete
        - latex_expansion_binding_review_error
        - latex_expansion_binding_review_skipped
        gate: dangling identifiers, free variables, ambiguous domains, or quantifier drift should block
          trusting the expansion
        outputs:
        - judgement
        - explanation
      - id: dependency.resolve
        phase: dependency
        trigger: dependency_statements is non-empty
        owner_skill: autoformalization-workflow-orchestrator
        reasoning_log_steps:
        - dependency_inputs_resolved
        - dependency_processing_start
        - dependency_recursive_call
        - dependency_recursive_result
        - dependency_resolution_complete
        gate: recursive dependencies use the same hook contract as parent statements
      - id: preformalization.line_translation_packet
        phase: preformalization
        trigger: after source-unit inventory and expansion review, before duplicate-result precheck or
          first Lean drafting
        owner_skill: source-line-translation-packet-builder
        reasoning_log_steps:
        - source_line_translation_packet_start
        - source_line_translation_packet_complete
        - source_line_translation_packet_error
        gate: every source-backed drafting target must expose stable literal source line ids, exact NL/LaTeX
          spans, Lean-facing candidate surfaces, and prompt-ready source anchors before the drafter is
          trusted
        outputs:
        - line_translation_packet
        - literal_source_anchor_index
        - lean_drafting_alignment_prompt
      - id: preformalization.result_existence_precheck
        phase: preformalization
        trigger: before initial autoformalization of a theorem-like result unless a reviewed waiver or
          seed formalization is provided
        owner_skill: result-existence-precheck-orchestrator
        reasoning_log_steps:
        - result_existence_precheck_start
        - result_existence_precheck_local_search_ready
        - result_existence_precheck_web_search_ready
        - result_existence_precheck_complete
        - result_existence_precheck_skipped
        - result_existence_precheck_error
        gate: initial drafting is blocked until existing mathlib/MathformerLib candidates are ruled out
          and required official-source web search is complete
        outputs:
        - result_existence_report
        - reuse_packet
        - proceed_to_autoformalization
      recommended_hook_contracts: []
