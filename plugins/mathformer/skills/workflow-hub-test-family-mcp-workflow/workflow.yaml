  gaps:
  - Default-only specialization excludes dependency-map-only, changed-files, strict,
    matrix-coverage, JSONL and JUnit branches; they remain available through the native
    entrypoint.
  - Applicability requires at most 97 selected MCP rows. Preparation rejects larger
    selections before any check; the native runner has no iteration-exhaustion failure.
  - Row payloads and native effects remain source-owned; network and external effects
    require qualification. Native optional logs do not supply all v1 receipts; Lunar
    supplies execution receipts and digests.
extensions:
  mathformer.source:
    category: hub
    native_id: test:family:mcp
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: test:family:mcp
      summary: Run the comprehensive test matrix for the mcp module family.
      family: mcp
      kind: validation
      safety: writes_artifacts
      command:
      - '{python}'
      - tests/test_program/run_comprehensive_tests.py
      - --module-family
      - mcp
      - --json
      depends_on: []
      required_paths:
      - tests/test_program/run_comprehensive_tests.py
      - tests/test_matrix.json
      required_tools: []
      optional_tools: []
      writes:
      - artifacts/
      allows_extra_args: false
      timeout_seconds: 900
      notes: ''
  mathformer.native_boundary:
    execution: CLI run_action delegates to run_leaf_action after preflight; dry-run
      returns before launch. MCP resolves the alias and delegates via mathformer_run_action,
      enforcing service write roots.
    qualification_capability_names_are_not_runtime_grants: true
    effects_status: partial_native_declarations
    failure_policy: Missing/invalid matrix or unhandled exceptions abort; ordinary
      failed/skipped check results continue traversal. A failed report is published
      before exit 3.
    scientific_payloads: Report is native test evidence; the controller separately
      captures stdout, stderr, exit status and write audit.
    block_execution: Registered tools share the native runner functions. A server-owned
      context retains parse_args defaults, validates cursor/report assertions and
      phases, and checks service write policy on every call. Publication returns native
      stdout to preserve MCP transport.
  mathformer.execution:
    preparation: load_matrix requires schema_version 2, a nonempty tests list and
      object rows; command placeholders are expanded. Optional validate_matrix coverage
      checking is disabled.
    check_semantics: Workstation skips unavailable optional dependencies; strict/fail-on-warning
      would fail them. Otherwise compare expected exit and audit undeclared writes;
      timeout returns a failed result. No retry or short circuit.
    bounds: Row timeouts are currently 30–600 seconds with fallback 120. The 900-second
      hub subprocess timeout may interrupt traversal before publication; 3600 is not
      a native bound.
    loop_bound: With admitted selection size <=97, exhaustion is unreachable; an empty
      selection bypasses the loop, and row 97 completes normally after its guard.
      No native iteration-exhaustion error exists.
    outputs: Dependency snapshot is artifacts/test_program/dependency_map.json; JSON
      report is artifacts/test_program/deterministic_tests.json and JSON stdout. Default
      run_id is generated by parse_args.
    context: enter parses --module-family mcp --json once, including native run_id
      and output path defaults. The opaque context is required by all subsequent ports.
    empty_selection: The top-level PRISM loop carries a Cursor envelope. retain_empty
      performs no check or source write and preserves the native zero-iteration path;
      nonempty cursors call advance then the guard exactly once per row.
