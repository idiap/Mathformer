    ordered_actions:
    - mathlib:indexing-control-suite
    action_workflows:
    - hub_mathlib_indexing_control_suite_workflow
    selection: Already selected native route; NL scoring and ambiguity resolution
      remain native.
    iteration_boundary: Exactly one action. A returned child always makes done true
      on the first iteration, so bound completion returns normally even on child failure.
      on_exhausted is unreachable for native state transitions.
    keep_going_semantics: Failure remains sticky; the single-action route has no additional
      iterations under keep_going.
