    suite: 'run_suite initializes position=0 and results=[], then executes all six
      COMMANDS in order: build index with --max-files 220 --json; validate existing
      index with --validate-existing --json; validate concept ontology --json; self-test
      term annotations --json; self-test navigation state --json; navigation --monotonic-check
      --json. Each run_command has a 240-second timeout. execute_command uses position;
      advance_state increments position and appends the result. The fixed COMMANDS
      iteration controls termination, ignoring advance_state''s returned done flag.
      Ordinary command failures are accumulated; none shortens this schedule. run_command
      accepts returncode=0 unless parsed payload.ok is explicitly false; JSON decode
      failure uses a stdout object. Inner timeout, launch and unexpected payload-shape
      errors propagate out of main, potentially preventing report creation; the enclosing
      hub captures the nonzero process exit as failure data. Only all passing commands
      trigger additional_oracles: version metadata, theorem shapes/declaration graph,
      optional reranker cache, annotation results, and navigation gaps/monotonicity.
      Otherwise oracle_checks=[] without artifact reads. Optional reranker enablement
      does not make its cache file read optional. Artifact read, JSON and shape errors
      propagate and can prevent report creation. finish_report writes artifacts/mathlib_index/indexing_control_suite.json
      with schema_version=1, style, results, oracle_checks, counts and ok requiring
      every command and oracle to pass. main prints JSON and exits 0 iff ok, otherwise
      1. There are no retries, refinement iterations or additional convergence loops.'
