      json_output: false
    input_materialization: Context supplies working_directory and explicit allow_mutating.
      artifact_root resolves relative to that directory; json_output selects native
      console formatting. API index remains artifacts/sympy_api/index.json under the
      working directory. Python is the native resolved executable.
    sources_in_order:
    - tests/latex/wiki_level/sum_first_odd_numbers.tex
    - tests/sympy/controlled_latex/binomial_square.tex
    - tests/sympy/controlled_latex/finite_geometric_sum.tex
    - tests/sympy/controlled_latex/product_rule_derivative.tex
    - tests/sympy/controlled_latex/matrix_distributivity.tex
    bounds:
      preflight_steps: 2
      cases: 5
      post_parse_commands_per_case: 8
      subprocess_timeout_seconds: 180
      counterexample_max_n: 100
    bound_behavior: Native done is true by preflight iteration 2 and successful-preflight
      case iteration 5, returning normally at the bound. Failed preflight traverses
      a single state-only case-loop guard with no case commands. on_exhausted is unreachable
      on normal native returns.
    failure_behavior: Nonzero preflight stops with a failure report; nonzero case
      commands return failed reports and later cases continue. Uncaught timeout or
      other exceptions abort without guaranteed final reports.
    counterexample_domain: Sampling domain is determined by the artifact; max_n=100
      is passed to the searcher.
    retry_and_resume: No retry, repair, convergence test, or checkpoint support.
    mcp_server:
      command: python
      args:
      - scripts/sympy_controlled_suite_tools.py
