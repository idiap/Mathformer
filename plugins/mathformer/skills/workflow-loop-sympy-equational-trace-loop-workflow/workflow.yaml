  gaps:
  - Case command iteration, artifact payloads, timing and helper internals remain
    owned by native run_case; this is a partial structural model.
  - The retained 3600-second policy limit is a host-enforced contract ceiling; the
    native suite has no overall deadline. Each subprocess has its native 180-second
    timeout.
  - Lunar emits execution receipts and artifact digests. Native helpers retain command
    logs, timings, case reports, suite JSON, HTML index and captured console output.
    Completion does not assert scientific truth.
  - Lunar cannot scope branch-local loop exhaustion. The top-level case loop uses
    the native prepare_cases failed-preflight identity and skip_cases guard; neither
    executes a case or a command. Preflight failure still emits the native failure
    report, with no case work or index HTML.
