    - '{python}'
    - skills/mathformerphysicslib/mathformerphysicslib-mathlib-grounding-auditor/scripts/audit_mathlib_grounding.py
    - --self-test
    - --json
    child_writes: []
    timeout: Null invocation.leaf_timeout_seconds retains CLI timeout=None; an explicit
      positive integer sets only the registered child timeout (600 is the native MCP
      default). Lunar separately enforces its 3600-second wall budget.
    auditor_behavior: self_test_graph runs the shared fixture pipeline/assertions,
      then canonicalizes the returned report envelope rather than its nested graph.
      Missing concept_occurrence_index yields an empty graph and empty grounding report;
      print_report returns zero. Hub does not validate report contents.
    scientific_payloads: HubResult is a transport envelope containing captured stdout/stderr,
      not a validated grounding artifact.
    adapter: Transport-only carry preserves rejected admission through a top-level
      loop required by Lunar scoped loop exits; it performs no source dependency work.
      Accepted runs call admit, initialize, visit, advance, finish exactly once each.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
