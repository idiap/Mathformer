extensions:
  mathformer.source:
    category: hub
    native_id: control:reasoning-log-index
    owner_skill: skills/control/reasoning-log-schema-guardian/SKILL.md
  mathformer.native_boundary:
    execution: Callable MCP steps share native index functions and hub preflight/write
      audit. repository_root selects the repository context, including isolated workflow_hub
      workspaces.
    failure_policy: Preserve native preflight and subprocess failure; post-execution
      write audit may override success.
    lowering: Root-level cursor loop carries terminal preflight state through a no-op
      exhaustion check because Lunar rejects branch-local bounded loops. No source
      work or writes occur on this path.
  mathformer.index_semantics:
    entry: Run/skill/hook metadata, log path and SHA-256, mtime as created_at_utc,
      event count, independent summary status, validation/quality statuses, summary
      path.
    summary: summaries/<log stem>-<first ten SHA-256 characters>.summary.json; JSON
      is sorted, indented, UTF-8 with trailing newline.
    acceptance: Every entry must pass validation and quality; summary ok controls
      only entry status. Empty entries pass vacuously in the unrestricted source.
    continuation: Validation or quality failure is entry data and does not stop later
      logs; exceptions stop execution.
    helper_bounds: Each SHA-256 pass reads 1 MiB chunks until EOF; hashing, timestamps,
      validation and summary internals stay inside index_log.
    discovery: Without explicit logs, sort reasoning-related JSONL paths under root;
      exclude bad filenames and adversarial directories.
    callers: Hub reasoning-log-consumer-readiness; run_with_reasoning_log.py may call
      build_index directly.
