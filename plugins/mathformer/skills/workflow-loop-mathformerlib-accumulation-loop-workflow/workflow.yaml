extensions:
  mathformer.source:
    category: loop
    native_id: mathformerlib_accumulation_loop
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: mathformerlib_accumulation_loop
      description: controlled accumulation into the parallel MathformerLib library
  mathformer.membership:
    required_hooks_are_not_an_execution_schedule: true
    owner_skills:
    - mathformerlib-accumulation-orchestrator
    - mathformerlib-registry-manager
    - mathformerlib-promotion-gate
    - autoformalization-result-realness-verifier
    - mathformer-library-docs-generator
    runtime_accounting: {}
  mathformer.execution:
    route: mathformerlib.accumulation
    action: test:family:mathformerlib
    specialization: Family fixed to mathformerlib, changed_files_only=false, pinned
      canonical matrix, wrapper rejects more than two rows.
    traversal: Each advance preserves matrix/selected/families, appends one result
      and increments index; empty selection finalizes without executing a check.
    bound: Root Cursor(state,remaining) loop runs at most twice. Empty and snapshot
      cursors are carried once without run_check. Preparation rejects more than two
      selected rows; exhaustion fails without finalization or publication.
    selected_checks: Registry manager --help then promotion gate --help; each subprocess
      has a 120-second timeout; hub timeout is 900 seconds.
    check_failures: Missing optional dependencies skip, or fail under strict/fail_on_warning;
      unexpected exits, timeouts and undeclared writes produce failed results and
      traversal continues.
    finalization: Schema errors or failed results make ok=false; optional matrix errors
      append a failed meta-result; strict additionally requires capability_ledger.strict_ready.
    termination: Unhandled exceptions abort; no retries, convergence cycle or checkpoint
      resume. A failed report is published normally with exit code 3.
    context: Opaque enter handle owns immutable args, cursor/history, phase and report;
      every MCP call rechecks service authorization.
    operation_calls: 'Nine calls at the two-row bound: enter, prepare, pending, two
      advance/pending pairs, finalize, publish. Empty/snapshot branches use six calls.'
