    contract:
      id: paper:workflow-catalog
      summary: Collect workflow graph evidence into paper-ready catalogue artifacts.
      family: paper
      kind: generation
      safety: writes_artifacts
      command:
      - '{python}'
      - paper_skills/framework-repository-cartographer/scripts/collect_workflow_catalog_for_paper.py
