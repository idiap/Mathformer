      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: Dependency-free registered leaf under scripts/mathformer.py; paper.workflow
      intent includes it; MCP tools delegate to the same functions.
    launch: Hub preflight failure or dry-run prevents launch; post-run write auditing
      can mark failure.
    defaults:
      graph: artifacts/workflow_graphs/workflow_graphs.json
      output: artifacts/paper_skills/workflow_catalog_for_paper.json
    argv: Supply [] for native CLI defaults or [--json] for registered leaf emission;
      library adapter input represents process argv.
    failure: Parse, malformed-input, read, render, write or emission errors terminate
      without recovery. Writes are sequential and nontransactional.
    timing: No native global deadline, retry, convergence, resumable state or checkpoint
      support.
  mathformer.catalogue_semantics:
    carried_state: Workflows starts empty; exactly one row appended per input stack
      in insertion order. Final counts scan the completed list; summary is copied.
    relation_first_match:
    - 'ID contains preformalization or textbook: intake and expand'
    - 'ID contains mathlib: ground'
    - 'ID contains draft-execute-refine: draft, execute and repair'
    - 'ID contains artifact-acceptance or consistency: consistency'
    - 'ID contains physics: physics, plus symbolic only if ID also contains sympy'
    - 'ID contains premise: premise and atp'
    - 'ID contains sympy: symbolic'
    - 'ID contains workflow-graph: observe and reflect'
    - 'ID contains reflection: reflect'
    - 'family.lower() contains control: control'
    - 'otherwise: support'
    iteration: All stack and rendering traversals stop on input exhaustion with normal
      return; no stack-count cap. Only first_hooks extraction is capped at five; hook_count
      covers all hooks.
    granularity: Main composition is explicit; native helper loops and nested branch
      selection remain within catalogue and write_outputs, avoiding an invented literal
      traversal bound.
  mathformer.transport:
    graph_model: JSON text preserves native stacks insertion order through Lunar canonicalization.
      Catalogue workflow records remain an ordered array.
    context: repository_root supplies the native mount; the independent service requires
      its configured repository mount and guards each output with its write policy.
    emission: Native print output is emitted to MCP stderr; CLI stdout is unchanged.
