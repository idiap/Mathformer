  gaps:
  - Finite helper scans remain inside project/discover/compare. Filesystem state accumulates
    without snapshots or rollback.
  - Specialization accepts at most 10000 expected and 10000 stale paths; adapters
    reject larger projections before writes. Empty sweeps use a terminal no-op call.
  - Hub preflight, dry run, write audit and main JSON reporting remain native boundary
    metadata; this graph models synchronize, not main. Lunar enforces descriptor budgets.
