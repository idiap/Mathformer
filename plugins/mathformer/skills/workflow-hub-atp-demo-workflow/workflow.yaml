extensions:
  mathformer.source:
    category: hub
    native_id: atp:demo
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: atp:demo
      family: atp
      kind: demo
      safety: writes_artifacts
      allows_extra_args: false
      timeout_seconds: 120
  mathformer.native_boundary:
    execution: Registered staged tools retain native preflight/write audit and drain
      discover_proof_steps in a worker with the native 120-second deadline. Scientific
      operations, histories, outputs and CLI rendering are shared with the original
      entrypoint.
    failure_policy: Preflight failure/dry-run bypass execution. Native exceptions
      fail the current tool without retry; the bounded worker returns the native timeout
      envelope through inert remaining stages. Unproved completion retains CLI exit
      3 and ok=false.
    timeout_scope: 120 seconds bounds the staged worker from initialization, including
      time between calls. The worker is terminated at the deadline; Vampire retains
      its 3-second solver limit and deletion trials their 1-second solver limit.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
  mathformer.specialization:
    bounds: 'Fixed source demo: one candidate, four generated entries (three proof-eligible),
      <=8 selected plus <=3 promoted premises. Each loop checks exhaustion after its
      final item and returns normally even without a proof.'
    exhaustion: on_exhausted=fail denotes a violated specialization, never ordinary
      source list exhaustion; done is true at or before each bound.
    state_semantics: No convergence/refinement or automatic retry. Lemma proofs never
      consume earlier promotions; minimization traverses its initial augmented snapshot
      once and carries current premises/trial records.
    configuration: Use the repository demo file unchanged and the declared constants;
      no extra CLI arguments. Helpers own their callbacks, timing, logs, subprocesses
      and artifact writes.
    limits: 25 bounds runtime operation calls; the wall budget remains 120 seconds.
    bypass: Dispatch chooses live initialization or an inert handle. Inert stages
      perform no scientific execution and each loop exits on its first call; finish
      returns the unmodified native preflight/dry-run payload. Root-scoped loops preserve
      Lunar exhaustion handling.
