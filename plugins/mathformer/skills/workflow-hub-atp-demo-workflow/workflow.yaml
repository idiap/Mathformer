flow:
  kind: sequence
  steps:
  - id: prepare
    kind: call
    operation: boundary
    arguments:
      context:
        ref: inputs.context
      demo:
        ref: inputs.demo
  - id: dispatch
    kind: switch
    cases:
    - id: execute
      when:
        ref: steps.prepare.outputs.execute
      body:
        id: init
        kind: call
        operation: initialize
        arguments:
          boundary:
            ref: steps.prepare.outputs.state
          demo:
            ref: inputs.demo
    default:
      kind: call
      operation: bypass
      arguments:
        state:
          ref: steps.prepare.outputs.state
    outputs:
      state:
        type: Search
        value:
          ref: selected.outputs.state
  - id: candidates
    kind: loop
    state_type: Search
    initial:
      ref: steps.dispatch.outputs.state
    max_iterations: 1
    on_exhausted: fail
    body:
      kind: sequence
      steps:
      - id: select
        kind: call
        operation: select_pack
        arguments:
          state:
            ref: loop.state
      - id: lemmas
        kind: loop
        state_type: Generation
        initial:
          ref: steps.select.outputs.state
        max_iterations: 4
        on_exhausted: fail
        body:
          kind: call
          operation: lemma_step
          arguments:
            state:
              ref: loop.state
        next_state:
          ref: body.outputs.state
        until:
          ref: body.outputs.done
        outputs:
          state:
            type: Generation
            value:
              ref: body.outputs.state
      - id: augment
        kind: call
        operation: augment_pack
        arguments:
          state:
            ref: steps.lemmas.outputs.state
      - id: minimize
        kind: loop
        state_type: Minimization
        initial:
          ref: steps.augment.outputs.state
        max_iterations: 11
        on_exhausted: fail
        body:
          kind: call
          operation: deletion_step
          arguments:
            state:
              ref: loop.state
        next_state:
          ref: body.outputs.state
        until:
          ref: body.outputs.done
        outputs:
          state:
            type: Minimization
            value:
              ref: body.outputs.state
      - id: theorem
        kind: call
        operation: final_attempt
        arguments:
          state:
            ref: steps.minimize.outputs.state
      - id: carry
        kind: call
        operation: carry_candidate
        arguments:
          state:
            ref: loop.state
          attempt:
            ref: steps.theorem.outputs.attempt
      outputs:
        state:
          type: Search
          value:
            ref: steps.carry.outputs.state
        done:
          type: Bool
          value:
            ref: steps.carry.outputs.done
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: Search
        value:
          ref: body.outputs.state
  - id: report
    kind: call
    operation: finish
    arguments:
      state:
        ref: steps.candidates.outputs.state
      boundary:
        ref: steps.prepare.outputs.state
  outputs:
    result:
      type: HubResult
      value:
        ref: steps.report.outputs.result
