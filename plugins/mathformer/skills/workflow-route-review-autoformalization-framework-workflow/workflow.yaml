extensions:
  mathformer.source:
    category: route
    native_id: review.autoformalization.framework
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: review.autoformalization.framework
      title: Review or improve the autoformalization framework
      action_ids:
      - review:autoformalization-framework
      skill_routes:
      - mathformer-workflow-router
      - mathformerphysicslib-coherence-gate
      operator_note: Runs control, documentation and promoted PhysicsLib release gates;
        backlog implementation requires an agent or developer.
  mathformer.native_boundary:
    execution: Registered MCP graph ports share the selected scripts/mathformer.py
      controller helpers; native CLI and existing MCP dispatch remain authoritative.
    service: MCP resolves canonical ID to native route and checks service write roots
      before dispatch; it supplies a configurable 600-second default timeout.
    failure_policy: Returned ok=false is data for sticky aggregation, not a block
      exception; unexpected launch errors propagate. No retries or checkpoints.
    leaves: Preflight and mutation policy precede dry-run or registered argv launch;
      timeout and undeclared writes yield failure, preserving captured output and
      audit.
    timeouts: Release action 1200 seconds; internal build/coherence/version 900/180/30
      seconds. CLI leaves with no declared timeout are unbounded.
    release: Build promoted PhysicsLib root, check coherence, obtain Lean version,
      collect import hashes, assess acceptance, write artifacts/physics_lean/release_gate/report.json.
      All three checks run in order despite earlier failed checks.
    context_ports: match preserves native route scoring and terms; registry projects
      immutable native declarations; mount supplies optional repository_root. Route
      starts with empty extra args and fresh ancestry.
    rejection_transport: Dependency loop is outside the admission branch for PRISM
      scoped exhaustion. A rejected admission carries inert state and original rejection
      through carry_rejection; no native dependency initialization, visit, advance
      or finish occurs.
    host_budgets: Lunar enforces the 3600-second and 12-operation ceilings. Native
      recursive calls are opaque to graph operation accounting.
  mathformer.composition:
    ordered_actions:
    - review:autoformalization-framework
    action_workflows:
    - hub_review_autoformalization_framework_workflow
    dependencies:
    - control:all
    - test:docs
    - mathformerphysicslib:release-gate
    recursive_control: control:all traverses its nine registered repository-control
      gates in order using the same native stop and sticky-failure rules.
    selection: Fixed already-selected route and native registry; NL scoring remains
      native. Recursive unknown actions, cycles and composed extra args return failure.
    bounds: Route length 1 and parent dependency length 3 are exact source bounds;
      done is true on the final child, so exhaustion is unreachable and normal return
      is preserved.
