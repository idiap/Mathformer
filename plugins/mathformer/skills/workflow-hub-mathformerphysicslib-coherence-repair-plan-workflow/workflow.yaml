  mathformer.native_boundary:
    scope: Executable main CLI branches; repository_root supplies native filesystem
      context. Registered hub invocation continues to fix argv to --self-test --json.
    callers:
    - coherence-suite
    - physics-lib:coherence-repair-plan
    dispatch: Preflight errors or dry-run stop before launch; otherwise run_leaf_action
      launches one subprocess and audits undeclared writes.
    transport: Payload and exit_code describe main; the hub wraps them in its native
      result envelope.
  mathformer.helper_semantics:
    default_reports: Self-test returns a result bundle, not inventory; canonicalization
      sees no concept_occurrence_index and builds an empty graph. Integration sees
      absent inventory flags. Embedded fixture repair_plan is not returned.
    collection: Repeated report paths are loaded once in order; supplied reports bypass
      default generation.
    carried_state: repair_plan initializes actions=[] and appends one action per finding,
      traversing reports and each report.get("findings", []) in order.
    mapping: Ownership kinds map to consolidate_concept_owner; missing integration
      kinds to repair_integration_surface; API kinds to add_operable_bridge_api; others
      to record_or_block_gap.
    action_fields: Each action copies severity, concept_id and source_kind and includes
      a textual monotonicity_gate; the gate is not executed.
    bounds: Helper traversals are bounded by input collection sizes, without a fixed
      cap; collection exhaustion returns normally, including empty collections.
    completion: action_count=len(actions); status is repair_required iff actions is
      nonempty, otherwise no_repairs_required.
    failure: Argparse errors, uncaught loading/writing errors or self-test assertions
      abort; findings alone do not change the zero return code. JSON printing is unconditional
      even without --json.
    control: No repair application, retry, convergence loop, early success stop or
      checkpoint support.
  mathformer.runtime:
    observability: Native JSON emission is preserved on the MCP diagnostic stderr
      channel. Lunar provides execution receipts and digests.
    context: repository_root is passed to inventory, self-test, integration and API
      helpers; report and output paths retain native CLI resolution.
