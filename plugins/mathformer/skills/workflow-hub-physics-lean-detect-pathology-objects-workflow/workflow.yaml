flow:
  kind: sequence
  steps:
  - id: parse
    kind: call
    operation: parse_cli
    arguments:
      argv:
        ref: inputs.extra_args
      context:
        ref: inputs.context
    description: Native argparse; help exits successfully before input loading, invalid
      arguments fail before detection.
  - id: run
    kind: switch
    cases:
    - id: help
      when:
        ref: steps.parse.outputs.options.halted
      body:
        kind: call
        operation: help
        arguments:
          options:
            ref: steps.parse.outputs.options
    default:
      kind: sequence
      steps:
      - id: select_input
        kind: switch
        cases:
        - id: self_test
          when:
            ref: steps.parse.outputs.options.self_test
          body:
            kind: call
            operation: fixed_fixture
            arguments: {}
            description: Substitute the exact fixed source, Lean and monitor fixture
              from main; ignore input paths.
        default:
          kind: call
          operation: load_inputs
          arguments:
            options:
              ref: steps.parse.outputs.options
            context:
              ref: inputs.context
          description: Read source, then Lean, then monitor JSON. Inline strings,
            including empty strings, override their paths. Missing texts become empty
            strings; missing report becomes {}. File, decoding and JSON errors propagate;
            malformed report shapes can fail later.
        outputs:
          data:
            type: DetectionInput
            value:
              ref: selected.outputs.data
          data_json:
            type: Text
            value:
              ref: selected.outputs.data_json
      - id: initialize
        kind: call
        operation: initialize_state
        arguments:
          data:
            ref: steps.select_input.outputs.data
          data_json:
            ref: steps.select_input.outputs.data_json
        description: Pack the texts/report, default findings/features, and an empty
          objects dictionary. Traverse all findings to extract string categories and
          distinct codes from dictionary entries only. Carry these with source_features
          and lean_features into detection.
      - id: detect
        kind: call
        operation: accumulate_detections
        arguments:
          state:
            ref: steps.initialize.outputs.state
          state_json:
            ref: steps.initialize.outputs.state_json
        description: 'Apply every independent source condition in source order, cumulatively:
          quantum notation or reported flag; operator cues or flag; unbounded position/momentum
          cues; real-line L2 cues; Schwartz/L2 cues; commutator cues; vector/field
          cues or flag; frame/basis cues; vector calculus cues; integral/limit cues
          or flag; physical-law cues or flag; implicit-premise flag or finding code;
          then unit/dimension cues or raw_scalar_erasure anywhere in the serialized
          report. Literal matches are case-insensitive and use full source text. Lean
          feature flags annotate evidence; raw Lean text does not drive detection.
          add_object inserts by class or merges by maximum confidence and sorted unions
          of source cues, Lean cues and categories; the first reason and catalogue
          surfaces remain. Candidates carry required library/repair surfaces and blocking-gate
          metadata. Finite finding/pattern scans stay inside this operation; no retry,
          refinement or recursion occurs, and the fixed catalogue permits at most
          16 distinct classes.'
      - id: finalize
        kind: call
        operation: finalize_packet
        arguments:
          state:
            ref: steps.detect.outputs.state
          state_json:
            ref: steps.detect.outputs.state_json
        description: Sort candidates by descending confidence then class. Only if
          that list is empty and findings are truthy, add the physical_law fallback
          at confidence 0.5 and use dictionary values. Build the ID from the first
          12 SHA-256 hex digits of sorted-key JSON containing each text's first 2000
          characters and findings. Emit count, objects, feature summaries, sorted
          distinct categories and library-first policy; status is ready for nonempty
          objects, otherwise no_objects_detected. The 16-class bound returns normally
          without exhaustion.
      - id: emit
        kind: call
        operation: check_and_emit
        arguments:
          options:
            ref: steps.parse.outputs.options
          packet:
            ref: steps.finalize.outputs.packet
          context:
            ref: inputs.context
          packet_json:
            ref: steps.finalize.outputs.packet_json
        description: If self_test, assert ready and presence of quantum_operator and
          commutator before output. Serialize with ensure_ascii false and indent 2.
          A supplied output path triggers parent mkdir and UTF-8 write with a trailing
          newline; otherwise print to stdout. Return 0 even for no_objects_detected.
          Assertion and uncaught I/O errors terminate without success.
      outputs:
        packet:
          type: Packet
          value:
            ref: steps.finalize.outputs.packet
        exit_code:
          type: ExitCode
          value:
            ref: steps.emit.outputs.exit_code
        stdout:
          type: Text
          value:
            ref: steps.emit.outputs.stdout
    outputs:
      packet:
        type: Packet
        value:
          ref: selected.outputs.packet
      exit_code:
        type: ExitCode
        value:
          ref: selected.outputs.exit_code
      stdout:
        type: Text
        value:
          ref: selected.outputs.stdout
  outputs:
    packet:
      type: Packet
      value:
        ref: steps.run.outputs.packet
    exit_code:
