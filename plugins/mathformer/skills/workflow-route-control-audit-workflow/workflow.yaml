      omissions retain unknown-action failures. Arbitrary commands and changed graph
      topology are rejected.
    timeout: These block adapters retain CLI leaf timeouts (None for these gates).
      Existing mathformer_ask and mathformer_run_workflow separately cap unbounded
      leaves at configurable 600 seconds. Lunar enforces the descriptor wall-time
      and operation-call ceilings.
    failure_policy: Negative native results remain data through aggregation; unexpected
      launch exceptions propagate.
    audit_caveat: hub:audit runs audit --json without --strict; JSON ok=false can
      exit zero, and parent success uses exit status plus write audit.
