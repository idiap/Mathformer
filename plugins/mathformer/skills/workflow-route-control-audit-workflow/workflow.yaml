      and optional report publication stay with the original callers. extra_args and
      seen expose native action admission context; registry contains checked source
      metadata, never executable caller code.
    bound: Nine source-ordered dependencies; done=true on visit nine completes normally.
      Early failure stops unless keep_going. Loop exhaustion is unreachable for valid
      native states; Lunar fails if the declared guard is exhausted.
    order: Entrypoints, layout, contracts, reasoning language/catalog, skill/log coverage,
      log smoke, Git diff.
    admission_bypass: The dependency loop is top-level for Lunar scoped-exit compatibility.
      On rejected admission, carry transports the unchanged empty state and native
      rejection with done=true, without any native dependency initialization, visit,
      advance or completion. Carry is a wire adapter, never a native step or child
      result.
