    suite_order:
    - Controlled formalphysics_0000 validation.
    - Five adversarial fixtures, retaining cursor, sticky all_ok and ordered results;
      expectation failures do not stop traversal.
    - Derivation-completeness regression.
    - Grounded-sample-thoroughness regression.
    - Aggregate report writing; success is the conjunction of all four components.
