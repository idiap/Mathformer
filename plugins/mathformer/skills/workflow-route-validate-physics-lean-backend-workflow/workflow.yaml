      repair-script traversal carrying cursor, ordered reports and paths, then bounded
      repair-argument traversal. Invoke repair orchestration, generative repair, expansion
      mapping and recursive control evaluation in source order. Recursive controller
      is called once with iteration=1 and max_iterations=6; the suite does not recursively
      repeat.
    suite_failure_and_outputs: run_json raises immediately on subprocess failure.
      Otherwise write_suite emits artifacts/physics_lean/backend_suite/lean_physics_backend_suite_report.json;
      main prints JSON and exits 0/1 from aggregate ok. Repair terminal states can
      independently block library status even when checks pass. Hub captures the subprocess
      result and audits writes before route accumulation.
