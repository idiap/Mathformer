    owning_operation: run
    behavior: Both actions build expected metadata, skill entrypoints, optional workflow
      projections and licensing, discover stale entrypoints, and compare content.
      Dry-run skips subprocesses.
    sync: Iterate expected files in order, skipping identical content; then remove
      stale generated entrypoints and eligible generated companions. Unmanaged stale
      content raises an error after any preceding writes, which are preserved.
    check: Comparison only; drift exits unsuccessfully. Missing/invalid inputs and
      filesystem errors terminate the subprocess unsuccessfully. Iteration counts
      follow discovered files/catalog entries, not a refinement bound.
