      command:
      - '{python}'
      - benchmarks/formal_science/formal_science.py
      depends_on: []
      writes:
      - data/
      - artifacts/benchmarks/
      allows_extra_args: true
      timeout_seconds: 1200
  mathformer.native_boundary:
    execution: Hub forwards extra arguments through run_action/run_leaf_action; no
      dependency loop.
    stopping: Hub preflight failure or dry-run prevents execution. Timeout, nonzero
      exit or undeclared writes fails the action. Native main returns after one handler.
    limits: 1200 seconds is the hub subprocess bound, not a direct-main timeout. Direct
      invocation has no overall timeout; urlopen has no explicit timeout. The former
      generated 3600-second limit was not a native bound.
    iteration: Helper record/output loops exhaust finite input or selected lists,
      returning normally at exhaustion. Validation carries the accumulating example
      list; statistics carries field counts and formal-answer count; output enumeration
      carries indices/ranks and sequential writes. Text cleaning repeatedly pops boundary
      sentinel lines, strictly shrinking the list. No proof-search, convergence, retry
      or checkpoint loop exists. No artificial loop cap is added.
    defaults: Dataset directory is data/benchmarks/formal_science; fields default
      to Electromagnetism, Quantum Mechanics, Other. Export requires output-file;
      force defaults false and bundle-dir defaults None. n/sample-size accept arbitrary
      integers with ordinary slicing and no nonnegative validation.
    observability: Native output retained in stdout/stderr ports and server stderr.
      Argparse SystemExit maps to a terminal result before handler dispatch.
