    reload_semantics: Initial examples remain in State; every navigate call rereads
      workflow_coordinates from TAXONOMY_PATH. No snapshot or cache is introduced.
    cli_priority: --self-test takes precedence over --request. Request-only mode navigates
      once and writes its navigation report. With neither option, main raises SystemExit
      with an error. Without --json, main prints its source PASS/FAIL message.
    failure_policy: Input/I/O exceptions propagate. Failed examples accumulate without
      early termination; finalization writes aggregate ok=false, then main prints
      JSON and returns exit 1.
  mathformer.scoring:
    semantics: Lowercase the request. The physics_lean.goal_sample.recursive_autoformalization
      row immediately returns score zero and no matches unless the source sample-scope
      regex matches. Otherwise traverse reasoning_types, object_domains, backend_families,
      and risk_classes in source order. For each coordinate, test its underscore-to-space
      form and KEYWORDS terms by substring; hits add len(hits)+1 and append the coordinate.
      A task_id with hyphens replaced by spaces OR workflow_id with underscores replaced
      by spaces adds five once and appends task_id. Return sorted(set(matched)).
    navigation_output: navigate returns schema_version 1, style mathformer_meta_taxonomic_navigation_report,
      ok based on selection presence, request, selected candidate or null, ranked
      candidates, and rejected_alternatives from ranked[1:] whose scores are at most
      the selected score or zero when selection is null. Each candidate retains workflow_id,
      task_id, score, matched_coordinates, and the source rejected_reason.
    bounds: Helper loops are bounded by loaded workflow rows, coordinate lists, and
      keyword lists. The outer loop processes all initially loaded examples in order.
      No iterative refinement, retries, or mismatch-based early stop occurs.
