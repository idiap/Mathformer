  mathformer.operation_semantics:
    initialize: scripts/mathformer.py::initialize_intent_state packs {ok:true, children:[]}.
    select: scripts/mathformer.py::select_intent_action indexes the selected route's
      action_ids by len(state.children). build_intent_routes fixes this route to [isabelle:wiki].
    invoke_action: scripts/mathformer.py::run_action owns admission, preflight and
      leaf execution. Rejection/preflight failures return failure data; dry_run returns
      without launching. Otherwise run tests/isabelle/run_wiki_case.py --json, then
      audit writes; undeclared writes set ok=false even after process success. run_wiki_case.py::run_case
      prepares paths/session/report, searches grounding for injectivity/composition,
      drafts the fixed injective-composition theory, checks it, then finalizes. Paths
      and accumulated step reports flow in state. Recorded grounding/drafting failures
      do not skip later steps. Grounding/drafting subprocess limits are 60 seconds
      each; the checker gets 240 seconds with a 255-second enclosing subprocess limit.
      Missing Isabelle fails; otherwise build the session and require exit zero and
      no placeholder markers. Final success requires grounding and drafting process
      success plus parsed execution JSON with ok=true. main writes the final report
      and exits 0/1. Uncaught exceptions abort the case subprocess and are reflected
      by the hub; exceptions escaping the hub operation abort the route.
    advance: scripts/mathformer.py::advance_intent_state appends child once in order;
      updated.ok = state.ok and bool(child.get('ok',false)). With this route's action_count=1,
      done is len(updated.children)==1 or (not child.get('ok',false) and not context.keep_going).
      Continuing never clears failure. Packs updated state and computes the guard
      using the shared native helper.
    finish: scripts/mathformer.py::finish_intent_state packs schema_version=1, sticky
      ok, ordered children and native intent_match_to_dict route metadata from the
      selected match and registry. Status is intent_run_completed when ok, otherwise
      intent_run_failed. Failure remains returned result data.
