      output_root: artifacts/physics_sympy/recursive_goal_runs
      native_regenerate_initial_artifact: false
    timing: Hub subprocess timeout is 900 seconds; direct build_run and its stage
      subprocesses have no explicit timeout or retry. The old 3600-second normalization
      limit is not native.
    bound: Fixed five-stage traversal returns normally when done on visit five; exhaustion
      is unreachable for prepared native order. Controller cap six is decision metadata,
      not a runner loop bound.
    cli_exit: main returns 3 for report.status=blocked; otherwise 0. Unhandled exceptions
      abort.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
  mathformer.operation_semantics:
    prepare: run_recursive_goal_case.py::prepare_run. Unpack native arguments, create
      run directory, clear both prior reasoning logs, and generate/regenerate artifact.
      Existing artifact is skipped only when regeneration is false. Writer unavailable,
      unregistered case or caught writer failure becomes initial_draft.status=blocked.
      Load existing source JSON or synthesize from artifact metadata; write rebuilt
      source and prepare the five ordered commands. Other filesystem/JSON exceptions
      propagate.
    pack: run_recursive_goal_case.py::pack_run_state. Pack prepared, next_stage=0,
      initial-draft stage report, empty command_metadata and blockers. Blocked generation
      adds initial_draft_generation_blocked without stopping.
    visit_stage: 'run_recursive_goal_case.py::execute_run_stage/run_json/stage_commands.
      Run stage_order[next_stage] once, capturing returncode/stdout/stderr and report
      path. goal_plan runs executable gates -> current_evidence.json; design_guard_review
      -> design_guard_review.json; repair_expansion_map reads that review -> repair_expansion.json;
      recursive_repair_control reads that map -> controller_decision.json; then grounded_sample_thoroughness
      -> thoroughness.json. Other shared case/artifact/file reads remain native. Zero
      exit loads output file if present, otherwise stdout JSON; nonzero exit returns
      empty report and adds stage_command_failed. Store status (status or goal_status
      or command_failed), path/style and command metadata. High/critical/error findings
      also append blockers; traversal continues. Project mutated state and native
      boolean after next_stage increments; done iff next_stage equals stage count.
      Launch/JSON/filesystem exceptions propagate. No stage timeout or retry. Entry
      beyond the order raises ValueError. Controller helpers load_state/compute_guards/choose_branch/finish_plan
      use iteration=1, max_iterations=6, no prior maps: first complete/not_required
      with no outstanding nodes, then non-exhaustive, repeated signature, iteration
      cap, empty outstanding set, else recurse. Non-exhaustive/repeated/cap branches
      block; empty completes. Blocked map overrides the decision. This runner never
      follows the returned frontier.'
    assess: run_recursive_goal_case.py::assess_run. Load five report files (missing
      gives empty object; malformed JSON propagates), retain state and reports. complete
      iff recorded thoroughness status is complete_sympy_physics_derivation and blockers
      is empty; blocked iff blockers is nonempty.
    emit: run_recursive_goal_case.py::emit_run. Emit native semantic/status summaries,
      stage reports, command metadata, blockers and artifact paths to recursive_goal_run.json,
      then summary.md, optional reasoning event, then copy existing-file aliases.
      Return report. Alias pairs are current_evidence->goal_plan, repair_expansion->repair_expansion_map,
      controller_decision->recursive_repair_control, thoroughness->grounded_sample_thoroughness
      (all .json), reasoning->reasoning_log (.jsonl). Missing alias sources are skipped;
      other write/log/copy exceptions propagate.
