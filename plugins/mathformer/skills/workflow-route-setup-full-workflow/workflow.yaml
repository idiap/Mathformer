    execution: Registered mathformer_setup_full_route_* tools share native intent-state
      helpers and run_action with scripts/mathformer.py:run_intent_match.
    callers:
    - CLI main ask --run
    - scripts/mcp_server.py:mathformer_ask
    - scripts/mcp_server.py:mathformer_run_workflow
    dispatch: Native MCP resolves the normalized identity, rejects route extra arguments,
      and checks service write roots. Bound run_child also checks service read-only
      policy and write roots; RunContext retains native mutation authorization and
      dry-run.
    scope: Already selected native route; NL scoring and caller admission stay outside
      this graph.
    failure_policy: Return native negative results unchanged; exceptions terminate
      execution.
    hydration: SelectedMatch restores the canonical native route and preserves score/matched_terms.
      Supplied route fields and full registry declarations must match their native
      values; JSON cannot supply executable code.
    context: All five RunContext flags, selected match, exact native registry projection
      and nullable repository_root are explicit ports. Null preserves the native default
      repository mount.
  mathformer.composition:
    ordered_actions:
    - setup:all
    action_workflows:
    - hub_setup_all_workflow
    bound: One action is fixed by SelectedMatch; after its result done is true, so
      exhaustion is unreachable and returns normally even on ok=false.
    keep_going_semantics: Cannot add work to this one-action route; aggregate failure
      stays sticky.
  mathformer.execute_details:
    command:
    - uv
    - run
    - python
    - scripts/install_env.py
    - --all-extras
    - --with-lean
    subprocess_timeout_seconds: null
    boundary: Native required-path, uv discovery and mutation preflight precede execution.
      Dry-run does not launch. Capture exit code, stdout and stderr, then audit writes.
      Nonzero exits and undeclared writes become child.ok=false; unexpected launch
      exceptions propagate. No dependencies, extra arguments or retries.
    installer: main validates Python >=3.10, creates and verifies the virtual environment,
      selects and deduplicates all extras, installs them in one checked uv invocation,
      then resolves lake and runs lake update followed by lake build. Completion is
      emitted only after success. This fixed route selects Python and Lean; skip branches
      remain inside the native installer. Missing tools and checked subprocess failures
      stop execution.
