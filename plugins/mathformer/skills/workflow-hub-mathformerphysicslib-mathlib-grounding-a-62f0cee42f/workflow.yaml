extensions:
  mathformer.source:
    category: hub
    native_id: mathformerphysicslib:mathlib-grounding-audit
    owner_skill: skills/mathformerphysicslib/mathformerphysicslib-mathlib-grounding-auditor/SKILL.md
    contract:
      id: mathformerphysicslib:mathlib-grounding-audit
      summary: Smoke-test MathformerPhysicsLib Mathlib grounding audits.
      family: mathformerphysicslib
      kind: validation
      safety: read_only
      command:
      - '{python}'
      - skills/mathformerphysicslib/mathformerphysicslib-mathlib-grounding-auditor/scripts/audit_mathlib_grounding.py
      - --self-test
      - --json
      depends_on: []
      writes: []
      allows_extra_args: false
      timeout_seconds: null
  mathformer.native_boundary:
    execution: Existing scripts/mathformer.py controller remains the registered hub
      boundary. MCP block tools share implementation with main; this flow projects
      main and does not invoke the hub.
    registered_argv:
    - --self-test
    - --json
    main_input_scope: argv models main's CLI alternatives; the registered hub action
      selects only the self-test branch and disallows extra arguments.
    ordering: Admission then preflight; errors or dry-run return before launch. Otherwise
      launch exactly once, capture subprocess status/stdout/stderr, then audit repository
      writes.
    failure_policy: Hub success requires returncode zero AND a passing write audit.
      Unexpected launch errors propagate. Main exceptions/assertion failures terminate
      its subprocess unsuccessfully; grounding blockers alone do not.
    timeout_seconds: null
    callers:
    - mathformerphysicslib:coherence-suite
    - physics-lib:coherence-mathlib-grounding
    effects_status: partial_native_declarations
  mathformer.audit:
    source: coherence_common.py::audit_grounding
    carried_state:
    - ordered concept reports, initially []
    - per-level Counter, initially empty
    - failed_candidate_count, initially 0
    iteration: Visit each concept_graph.get('concepts',[]) item once in order; an
      empty list performs zero iterations. Inner failed-candidate traversal visits
      each target once only for unsupported levels.
    classification:
    - targets and owner and 'Foundations' not in owner -> direct_mathlib
    - targets and owner -> mathlib_bridge
    - targets without owner -> local_blocker
    - no targets -> unverified_local
    update: Increment the selected level count, collect failed candidates in target
      order, add their count to the total, append the concept report. Only direct_mathlib
      and mathlib_bridge set complete_allowed=true and have no blockers.
    stopping: Return normally after all concepts, with sorted summary counts, total
      failed candidates and ordered concept reports. No repair, convergence test,
      retry, fixed cap or exhaustion signal.
    self_test_result: After self_test_payload succeeds, canonicalizing its report
      envelope gives an empty graph; final summary={}, failed_candidate_count=0, concepts=[].
  mathformer.runtime:
    repository_root: Null uses the native repository inventory defaults. A string
      supplies build_inventory(repository_root) as an explicit read context; self-test
      remains the native fixture branch.
    stdout: Native sorted, indented JSON is returned and mirrored to service stderr
      to preserve transport framing.
    write_policy: Optional writes obey the service read-only policy and configured
      allowed write roots.
