    cli: main normalizes --case, calls build_packet, serializes JSON to stdout or
      --output (creating parents), and exits 0 for ok or 3 otherwise.
    hub: Preflight errors or dry-run return before launch; timeout fails execution;
      subsequent repository write audit can override success.
    path_discrepancy: Defaults use root-level MathformerPhysicsLib/, currently only
      __pycache__; hub preflight checks libraries/MathformerPhysicsLib/. Default artifacts
      are unavailable.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    state_transport: Single-use server-local handles retain native locals including
      the imported module across stages; assembly and native errors release the handle;
      abandoned handles last until server shutdown. No replay, retry or cross-server
      resume. Relative artifact_root paths use the MCP process working directory,
      just as native Path arguments do.
    observability: Native artifact stdout is mirrored to MCP server stderr to preserve
      protocol framing. Source findings, packets and exceptions remain native; Lunar
      records step receipts.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    carried_state: Accumulated findings, imported artifact and extracted metadata,
      IR, semantic packets and parity; no retry, repair or convergence loop.
    traversal_bounds: Metadata traversals use input sizes; at most three packets;
      seven fields for each of at most two nonbaseline packets; three Lean target-name
      searches, each excerpt capped at 700 characters.
    stopping: Traversals finish normally at collection end; builder returns one packet
      without an exhaustion condition or internal time budget.
    comparison_fields:
    - case_id
    - source_digest
    - ir_digest
    - quantity_roles
    - assumption_ids
    - obligation_ids
    - target_claim
    comparison_limit: Backend packets inherit the same SymPy-derived IR; hashes bind
      artifacts but do not independently extract their semantics.
    callers: Parity-gate and MCP-adapter case loops are outside this selected workflow.
  mathformer.step_sources:
    inspect: 'Source build_packet opening block and load_sympy_module: resolve default
      or supplied roots, import SymPy, check Lean and Isabelle, read existing Lean
      text, initialize findings and pack source locals. Add high sympy_artifact_unavailable
      or lean_artifact_missing findings; Isabelle absence adds none. Missing loader,
      SymPy dependency failure, and ordinary import exceptions are structured; non-SymPy
      ModuleNotFoundError propagates. Lean read failures propagate.'
    collect: 'Source build_packet CLAIM through semantic_parity initialization: preserve
      state, obtain CLAIM and initialize target and empty reports. If module exists,
      call derive_target, validate_dimensions, validate_numeric_samples in one try,
      preserving completed assignments; a caught exception adds high sympy_validation_failed
      and skips remaining calls. Returned failed reports alone add no high finding.
      Collect assumptions, Lean mentions/definitions, projections, grounding, and
      optional review_final_equations in source order; review exceptions propagate.
      Initialize null IR, empty packets and unavailable parity. Pack updated locals
      and compute ir_ready as module is not None and isinstance(claim, dict), without
      requiring successful validation.'
    align: 'Source build_packet IR conditional and physics_ir.py helpers: filter assumption
      rows, pack ir_spec, call from_case_spec then validate_ir. Add high physics_ir_invalid
      for errors but continue. Store IR plus digest; collect shared projection IDs.
      Append SymPy packet, then Lean if present, then Isabelle if present, using the
      same IR and each artifact''s SHA-256. Compare packets; extend accumulated findings
      only when semantic_parity is false. Preserve all prior locals. Helper traversals
      and exceptions remain native; uncaught errors propagate.'
    assemble: 'Source build_packet packet literal through return, including lean_theorem_targets:
      pack source target, IR, backend packets, parity, backend targets, assumptions,
      semantic deltas, dimension/numeric treatment, projections, support-object statuses
      and accumulated findings. Set ok to not any finding whose severity equals high;
      return one packet even when ok is false. Missing finding severity or other uncaught
      errors propagate. No Lean compilation or independent backend semantic extraction.'
