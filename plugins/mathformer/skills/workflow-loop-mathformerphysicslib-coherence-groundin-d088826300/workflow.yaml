    - mathformerphysicslib-coherence-repair-planner
    - mathformerphysicslib-coherence-gate
    runtime_accounting: {}
  mathformer.native_semantics:
    termination: Exactly one pass, normal return after checks; exceptions propagate
      without retry, rollback or checkpoint. A blocked gate or grounding regression
      does not stop reporting.
    traversal: Finite module, concept, report and finding traversals retain order
      and accumulators inside their owning operations; no refinement loop or convergence
      test.
    baseline: Only output_dir/mathlib_grounding.json is consumed across runs, before
      overwrite. Empty usable prior rows gives no_previous_report; unmatched concept
      IDs are skipped.
    comparison: Shared IDs compare unverified_local < local_blocker < mathlib_bridge
      < direct_mathlib; unknown levels rank -1; decreases regress, increases improve,
      equality is unchanged.
    repairs: Spread/competing-owner findings consolidate ownership; manifest/index
      findings repair integration; absent/thin API findings add bridge API; other
      findings record_or_block_gap. No actions means no_repairs_required.
    gate: Any high finding gives blocked; else any medium gives warn; otherwise accepted.
      Gate status is report data.
    checks: Positive module count; any formalphysics_ module; seven probes with report
      schemas and evidence-only blocking; nonnegative failed candidate count and per-concept
      candidate records; comparison status present; Markdown exists and contains the
      report title.
    artifacts: Markdown coherence_report.md first, then inventory.json, concept_graph.json,
      mathlib_grounding.json, redefinition_critic.json, integration_critic.json, api_operability_critic.json,
      generative_coherence_critic_plan.json, repair_plan.json, coherence_gate.json.
    cli: main prints the returned summary and exits 0 iff all six checks pass, else
      1; hub action mathformerphysicslib:coherence-loop-report and its physics-lib
      alias reach main; coherence_loop_tools exposes native stages through MCP.
