extensions:
  mathformer.source:
    category: hub
    native_id: isabelle:wiki
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: isabelle:wiki
      summary: Run the controlled wiki-level Isabelle case.
      family: isabelle
      kind: validation
      safety: writes_artifacts
      command:
      - '{python}'
      - tests/isabelle/run_wiki_case.py
      - --json
      depends_on: []
      required_paths:
      - tests/isabelle/run_wiki_case.py
      required_tools: []
      optional_tools:
      - isabelle
      writes:
      - artifacts/isabelle/
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: Each MCP tool delegates to the shared native prepare_case, ground_case,
      draft_case, execute_case or finalize_case used by run_case. Writing tools enforce
      service read-only and allowed-root admission.
    effects_status: partial_native_declarations
    failure_policy: Unexpected exceptions propagate; subprocess nonzero exits and
      caught timeouts are stage report data and do not stop later stages.
    scientific_payloads: WikiReport is the native case report; the hub transport envelope
      is separate.
    inputs: Ports model run_case parameters; hub CLI rejects extra arguments and uses
      output_dir artifacts/isabelle/wiki_level and timeout_sec 240.
    outputs: main writes wiki_injective_composition.e2e.json under output_dir unless
      report_file overrides it, prints JSON with --json, and exits 0 iff report.ok,
      otherwise 1.
    artifacts: Output holds grounding, draft, execution and final JSON reports, session/AutoformalizedWikiInjectiveComposition.thy,
      and session/ROOT; case_output resolves the supplied output_dir.
    grounding: Internal concept/theory/line traversal accumulates scores, skips unreadable
      theories, retains eight matches per concept and four snippets per theory by
      default; these are result caps, not orchestration iterations.
    drafting: The fixed LaTeX fixture is tests/latex/wiki_level/injective_composition.tex;
      grounding evidence is recorded but never consumed by the deterministic drafter.
    checking: After reading theory and preparing ROOT, missing Isabelle returns ok
      false; otherwise one build runs, requiring exit 0 and no sorry/oops/quickcheck_params
      markers. Internal timeout returns ok false.
    bounds: Ground/draft are each 60 seconds; checking defaults to 240 internally
      and 255 externally. Hub has no overall timeout or dependencies; no retry, repair,
      or checkpoint is added.
    transport: 'CaseState ports losslessly encode TimeoutExpired byte captures as
      {mathformer.bytes_base64: base64}; delegates restore native bytes. Terminal
      report serialization errors propagate after finalization rather than coercing
      captures to text.'
