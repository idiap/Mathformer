        kind: call
        operation: run_action
        description: Invoke run_action with no extra args or dependencies, carrying
          repository_root through preflight, cwd and both write snapshots (null preserves
          the native default mount). Preflight checks installer presence, uv availability
          and (allow_mutating or dry_run). Errors return ok false without execution;
          otherwise dry_run returns planned argv. Execution captures subprocess output,
          then audits repository writes. Nonzero exit, timeout, or undeclared writes
          yield ok false; unexpected launch errors propagate and prevent advance/finish.
          The command is uv run python scripts/install_env.py --all-extras. Installer
          main requires Python 3.10+, creates/updates .venv and verifies its Python
          executable, then selects and deduplicates benchmark, SymPy/NumPy, Docling
          and MCP dependencies and installs them in one checked uv pip invocation.
