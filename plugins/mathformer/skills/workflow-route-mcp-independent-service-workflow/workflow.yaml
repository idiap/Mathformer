extensions:
  mathformer.source:
    category: route
    native_id: mcp.independent.service
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: mcp.independent.service
      title: Validate the independent whole-pipeline MCP service
      action_ids:
      - mcp:service-config
      - mcp:service-dependencies
      - mcp:service-self-check
  mathformer.native_boundary:
    execution: Already selected native route with JSON match and RunContext, explicit
      server-owned execution-registry records, and null/default or exact service repository
      mount.
    callers:
    - scripts/mathformer.py::main (ask --run)
    - scripts/mcp_server.py::mathformer_ask
    - scripts/mcp_server.py::mathformer_run_workflow
    dispatch: MCP resolves the normalized identity to the route and checks service
      write roots before execution except in dry-run.
    child_semantics: Dry-run launches no subprocess; executed success requires zero
      exit status and a passing write audit.
    action_semantics:
      config: Validate config/mathformer_mcp.example.toml and scan designated tracked
        files for secrets.
      dependencies: Probe fixed tables of 10 packages then 6 tools; each scan carries
        cursor, rows and done. Missing required dependencies set ready=false but ok=true.
      self_check: Combine config, dependency ok (not ready), router coverage, hub
        audit, secret scan and auth policy; collect service coverage; never start
        the server.
    bound_semantics: Three is the exact route length, not a refinement cap; done is
      true after action three. Exhaustion failure is unreachable under native helpers.
    registry_transport: Records must exactly match the three service-owned execution
      registry entries. No arbitrary command registration.
