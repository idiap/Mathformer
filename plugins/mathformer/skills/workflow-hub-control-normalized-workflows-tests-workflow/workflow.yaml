    normalizer_check: Record stale/missing files and continue; validate matching workflows;
      then collect unexpected descriptors.
    controller_fixtures: Dry runs and stubbed failures only; default stops after first
      failed child, keep_going visits all, aggregate success stays false.
    failures: Test assertion/error is result data for suite continuation; operation
      failure denotes infrastructure failure, not an assertion.
    effects: Temporary fixtures are cleaned up, including one beneath the generated
      output directory; no scientific backend executes.
