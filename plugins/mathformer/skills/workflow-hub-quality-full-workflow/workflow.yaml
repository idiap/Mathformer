      writes: []
      allows_extra_args: false
      timeout_seconds: null
      notes: ''
  mathformer.native_boundary:
    execution: Registered mathformer_quality_full_* tools reuse native admission,
      rejection, initialization, visit, advance and finish. Repository root is explicit,
      service write roots/read-only mode are checked before real visits, and native
      leaf timeouts are retained unchanged.
    context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    failure_policy: Native ok=false remains failure data for traversal; unexpected
      launch exceptions propagate without retries.
    scientific_payloads: HubResult is a transport envelope; child reports remain native
      artifacts.
    leaf_semantics: Check required paths/tools and mutation permission first; dry-run
      returns before subprocess. Capture stdout/stderr with each leaf timeout, then
      audit writes. Preflight errors, nonzero exit, timeout or undeclared writes fail
      the leaf.
    comprehensive: test:comprehensive invokes tests/test_program/run_comprehensive_tests.py
      --module-family all --write-jsonl --write-junit --json; timeout=3600 seconds.
      The finite selected matrix runs sequentially without fail-fast, accumulates
      check results, validates them, aggregates status/capability evidence and emits
      reports. Check timeouts default to 120 seconds; unavailable optional dependencies
      normally skip.
    control_all: Recursively executes registered repository-control gates under the
      same controller.
    mount: inputs.repository_root propagates unchanged (resolved to an absolute Path)
      through recursion, preflight, subprocess cwd and write audits.
  mathformer.composition:
    ordered_dependencies:
    - control:all
    - test:comprehensive
    dependency_workflows:
    - hub_control_all_workflow
    - hub_test_comprehensive_workflow
    command_after_dependencies: false
    keep_going_semantics: Stop on first failed child unless context.keep_going; cumulative
      failure is sticky.
    extra_args_for_sequence: rejected by run_action
    modeling: Exactly two visits at most, done on index two or first failed child
      without keep_going. No retries. Transport carry runs only on admission rejection.
    admission_bypass: The top-level loop uses a transport-only carry operation on
      rejection; no native child or native finish runs. This preserves rejection payloads
      while supporting Lunar scoped loop exits.
