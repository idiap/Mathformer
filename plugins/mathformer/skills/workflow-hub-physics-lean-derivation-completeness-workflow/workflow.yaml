  mathformer.native_boundary:
    execution: Hub preflight then one script launch through run_action/run_leaf_action;
      no dependencies or internal retries.
    failure_policy: Uncaught file/JSON/input errors stop immediately; report incompleteness
      is a normal return unless --expect-complete is set.
    default_hub_semantics: The default command omits --expect-complete, so exit 0
      and hub success may coexist with report.ok=false.
  mathformer.analysis:
    declaration_rules: Skip physicalLawHolds, generatedSupportHolds and dimensionCompatibleEq;
      detect direct/wrapped conclusion hypotheses and exact unwrapping of target witnesses.
    obligation_order: Recognized case IDs 0015/0021/0052/0074 select case builders;
      otherwise nonempty required_terms selects terms and prior-stage evidence; otherwise
      scan concepts, selecting specialized Heisenberg obligations for heisenberg/fluctuation/cauchy.
    status_precedence: High-severity findings yield blocked_target_restating_assumption;
      else positive frontier or blocked obligations yield derivation_partial; else
      complete_autoformalization. Worst file status wins.
    helper_state: Parsing stacks/depth, target-hypothesis sets, findings, declarations,
      obligations and repair descriptions remain local to analyze_current.
    helper_bounds: Traversals follow finite input lengths and fixed check lists; parenthesis
      normalization strictly shortens its input. No convergence loop, recursive repairs
      or generative model call.
