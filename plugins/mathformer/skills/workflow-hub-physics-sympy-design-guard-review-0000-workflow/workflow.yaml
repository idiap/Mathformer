    execution: main --mode design_guard_review calls this reviewer; the registered
      dependency-free leaf uses --case formalphysics_0000 --json. Other callers may
      invoke the function directly.
    prelaunch: Hub preflight errors stop launch; dry-run returns without launch. Subprocess
      timeout returns hub ok=false.
    path_discrepancy: Reviewer default MathformerPhysicsLib/SymPy/formalphysics_0000/MathformerPhysics.py
      is absent; hub preflight checks libraries/MathformerPhysicsLib/SymPy/formalphysics_0000/MathformerPhysics.py.
      Without --sympy-file, a launched registered invocation reaches artifact_missing.
    completion: CLI serializes the report to stdout or --output, optionally appends
      a reasoning-log event, and returns 0 even when report.status is fail. Hub returncode
      success is transport completion, not review acceptance; uncaught exceptions
      prevent normal completion.
    effects_status: Importing the artifact executes its Python code; validation callbacks
      also require effect qualification. Capability labels are not grants.
    output_semantics: This contract exports the reviewer report, not HubResult. Recommendations
      and next_action are never dispatched.
    iteration: Sequential internal traversals carry accumulated findings/evidence.
      No repair/retry loop, checkpoint, collection-size bound, or native exhaustion
      signal exists.
    module_transport: read_and_import retains the native module and text under an
      opaque single-use handle. inspect_module consumes it with matching review state,
      without reimport. Exceptions consume the handle; abandoned handles are reclaimed
      at server shutdown. Handles cannot survive process restart or support resume.
  mathformer.composition:
    ordered_dependencies: []
    dependency_workflows: []
    command_after_dependencies: false
    modeling: Selected reviewer internals use shared native helper implementations
      and registered MCP tools; hub admission, timeout, CLI output and optional logging
      remain native boundary responsibilities.
