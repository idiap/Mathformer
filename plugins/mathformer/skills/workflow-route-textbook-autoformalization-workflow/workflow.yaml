extensions:
  mathformer.source:
    category: route
    native_id: textbook.autoformalization
    owner_skill: skills/control/mathformer-workflow-router/SKILL.md
    contract:
      route_id: textbook.autoformalization
      title: Run textbook autoformalization controls
      action_ids:
      - test:family:textbook
      operator_note: Runs the textbook family in the comprehensive test matrix.
  mathformer.native_boundary:
    execution: Registered MCP ports share the native route state helpers and run_action.
      Route and registry projections assert native declarations and cannot install
      commands.
    callers: CLI main dispatches the top ask --run match; MCP mathformer_ask and mathformer_run_workflow
      dispatch the route.
    mcp_admission: Normalized identity resolves to the native route; route extra_args
      are rejected; service write roots are checked before execution.
    mounting: Pass an explicit repository_root to run_action; null preserves the CLI
      default.
    failure_policy: Returned child ok=false is data for advance and finish; unexpected
      exceptions terminate without a packed route result.
    leaf: tests/test_program/run_comprehensive_tests.py --module-family textbook --json.
      Preflight errors return without launch; dry-run returns argv without execution.
      Execution captures output with a 900-second timeout and audits repository writes.
      Timeout, nonzero exit or undeclared writes set child ok=false.
  mathformer.composition:
    selection: Already selected fixed route; NL scoring and caller admission remain
      outside this graph.
    stopping: Action exhaustion or first failed child unless keep_going; one action
      means keep_going adds no work.
    bound: Exact source cardinality, constrained by Match; native done is true at
      iteration one, so exhaustion failure is unreachable.
    downstream: Native runner fixes matrix, ordered textbook selection and families,
      then carries index and results while checks_pending. It attempts every selected
      check despite ordinary failures, validates results, builds capability summary,
      writes reports, and exits 0 or 3. Unexpected exceptions propagate.
    current_checks: Four self-tests cover archive extraction, TeX organization, batch
      building and batch running, with respective timeouts 120/120/120/180 seconds
      and no optional dependency. These are validation self-tests, not a production
      pipeline.
