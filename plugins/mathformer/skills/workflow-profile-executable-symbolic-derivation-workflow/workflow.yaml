  gaps:
  - The profile ERFL specifies epistemic dependencies and establishes no unique execution
    schedule; this contract binds only the selected associated suite.
  - Case command iteration, artifact payloads and helper internals remain owned by
    native run_case; this is a partial structural model.
  - The retained 3600-second host ceiling is not a native total timeout; each subprocess
    has a 180-second timeout.
  - Lunar requires loop exhaustion at root scope. After failed preflight, prepare_cases
    and skip_cases are pure identity guards; no case commands run. The failure report
    uses the original preflight state.
  - Native command histories, timings, JSON and HTML reports remain source-owned;
    the adapter transports printed output in completion.stdout.
  - The original profile claim ceiling is retained. Runnable binding qualification
    applies only to the selected native suite, not to a general ERFL execution schedule.
extensions:
  mathformer.source:
    category: profile
    native_id: executable_symbolic_derivation
    owner_skill: skills/control/reasoning-flow-language/SKILL.md
    goal: Build and check an explicit symbolic transformation trace.
    trust_transition:
      from: source_expression
      to: executable_checked_trace_or_counterexample
  mathformer.materialization:
    associated_workflow: sympy_equational_trace_loop
    execution_source: tests/sympy/run_controlled_suite.py
    selector: main
    cli_defaults:
      artifact_root: artifacts/sympy/controlled_suite
      json_output: false
    sources_in_order:
    - tests/latex/wiki_level/sum_first_odd_numbers.tex
    - tests/sympy/controlled_latex/binomial_square.tex
    - tests/sympy/controlled_latex/finite_geometric_sum.tex
    - tests/sympy/controlled_latex/product_rule_derivative.tex
    - tests/sympy/controlled_latex/matrix_distributivity.tex
    stopping: Both loops return normally at their literal bounds because their native
      done guard is true there.
    errors: Timeout exceptions and uncaught errors abort; nonzero case stages return
      data and do not stop later cases.
    retries_and_resume: No repair iterations, retries or checkpoints.
  mathformer.native_operations:
    initialize: tests/sympy/run_controlled_suite.py::initialize/main packs state,
      creates root, selects repository .venv/bin/python or sys.executable, fixes API
      index at artifacts/sympy_api/index.json, sets cursor=0, preflight_ok=true and
      empty result lists.
    preflight_step: tests/sympy/run_controlled_suite.py::preflight_step/preflight_commands
      runs dependency_probe then api_index with --self-test, appends the subprocess
      result, assigns preflight_ok, increments cursor and computes done=(not preflight_ok
      or cursor==2).
    preflight_failure: tests/sympy/run_controlled_suite.py::preflight_failure/emit_report
      writes suite_report.json with ok=false and preflight results, emits selected
      console format, returns exit_code=1 and index_html=null.
    prepare_cases: tests/sympy/run_controlled_suite.py::prepare_cases resets cursor
      to 0 and case_reports to [] after successful preflight, retaining all other
      state.
    suite_case: tests/sympy/run_controlled_suite.py::suite_case/run_case selects SOURCES[cursor]
      and uses root and api_index. Ordered stages are parse, assumptions, grounding,
      draft, execute, identity, counterexamples, trace, consistency. Parse determines
      case_id, artifact name and concepts (fallback symbolic_simplification); assumptions
      consume parse; grounding consumes concepts and API index; draft consumes parse,
      assumptions and grounding. Execution, identity, counterexamples and trace consume
      the artifact; consistency consumes artifact and all preceding evidence, writing
      JSON, Markdown and HTML. The first nonzero stage immediately returns a failed
      report with accumulated results; success loads the consistency report and returns
      ok=true plus artifact and HTML paths. Counterexamples receives --max-n 100;
      its helper falls back to the artifact's default sampler when that keyword is
      unsupported.
    collect_case: tests/sympy/run_controlled_suite.py::collect_case appends report
      even when ok=false, increments cursor, preserves other fields and computes done=(cursor==len(SOURCES)),
      where len(SOURCES)=5.
    finish: tests/sympy/run_controlled_suite.py::finish/write_index_html/emit_report
      writes index.html then suite_report.json containing python, preflight, cases
      and index_html; emits the selected console format. Exit is 0 exactly when all
      case reports have ok=true, otherwise 1.
