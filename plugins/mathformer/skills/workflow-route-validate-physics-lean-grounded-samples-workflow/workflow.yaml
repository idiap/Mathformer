  mathformer.operation_semantics:
    initialize_suite: Source initialize_suite/selected_case_specs resolves all cases
      before auditing, packs ordered pending case/spec pairs and empty completed results.
      Empty selection uses CASE_SPECS; dictionary assignment deduplicates IDs in order.
      Explicit IDs use curated specs or an existing source record; unknown IDs abort.
      Generated specs require proof/declaration minima 4/8 for operator cues, else
      2/4; deep-signal minimum is 2 for operator/calculus cues, else 1, with terms
      checked on code. Successful initialization is nonempty.
    audit_next: 'Source audit_next/audit_case reads the first pending Lean file, then
      invokes checker_report with --recursive-frontier-count 0 --expect-complete and
      optional source record. All checks must pass: complete_autoformalization with
      ok true, zero blocked obligations and reported frontier, recursive grounding
      header, required terms, no FORBIDDEN_SHORTCUTS, spec proof/declaration depth,
      at least four generative probes, empty repair frontier, sufficient deep signals
      and no shallow operator wrapper. Check failures return ok false; unhandled file/JSON/subprocess
      errors abort. run_json accepts a nonzero subprocess exit with JSON-object stdout
      for auditing. This operation does not compile Lean.'
    append_guard: Source append_guard removes the first pending item, appends result
      to completed, returns the packed state and done = not pending. Failed audits
      remain recorded and do not stop traversal.
    finalize_suite: Source finalize_suite computes ok = all completed results' ok,
      case_count and policy, then writes artifacts/physics_lean/grounded_sample_thoroughness/report.json
      under repository_root and returns the payload, including when ok is false. Write
      errors abort.
