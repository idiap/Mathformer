  gaps:
  - Helper internals remain native subprocess calls inside shared runner operations;
    no individual helper algorithm is modeled as a workflow node.
  - Native stage timeouts are 240 seconds except grounding at 360; direct Lean has
    no local timeout. The host enforces the retained 3600-second workflow ceiling.
  - Lunar supplies operation receipts, digests and provenance; filesystem resources
    require host mapping and the MCP service enforces declared output mounts.
extensions:
  mathformer.source:
    category: loop
    native_id: lean_physics_derivation_trace_loop
    owner_skill: skills/control/workflow-contract-validator/SKILL.md
    contract:
      id: lean_physics_derivation_trace_loop
  mathformer.membership:
    required_hooks_are_not_an_execution_schedule: true
    runtime_accounting: {}
  mathformer.execution:
    entrypoint: physics-lean:goal-sample-recursive-0009
    defaults:
      iteration: 1
      max_iterations: 8
    controller: 'Ordered controller decisions: complete when status is complete/not_required
      and outstanding nodes are empty; otherwise block if not exhaustive, then on
      repeated signature, then at iteration >= max_iterations; otherwise complete
      if no outstanding nodes, else recurse. Expansion status blocked overrides any
      decision. Previous-map history is empty here, so repeated-signature detection
      cannot fire.'
    stopping: Only the seven-entry and four-entry queues repeat. Their final visits
      return normally; exhaustion failure is unreachable for native-initialized queues.
      No theorem edits, iteration increment, repair repetition or checkpoints.
    failure_behavior: run_stage records nonzero exits, missing outputs and timeouts
      and continues; uncaught exceptions stop execution. Final report is written before
      returning 0 or 1.
    acceptance: Return 0 iff all REQUIRED_COMPLETENESS_STAGES executions succeed and
      final_acceptance passes. Critical stages drift_monitor/pathology_repair/repair_expansion_map/recursive_control/final_hypothesis_review/consistency_report/case_thoroughness
      block for status fail, blocked, needs_expansion or blocked_on_library_or_labels,
      decision blocked or payload_ok=false. Also require compilation success and controller
      decision (fallback status) complete; otherwise return 1.
    artifacts:
    - source_text.txt
    - stage_reports
    - lean_execution_raw.log
    - source_record.rebuilt.json
    - recursive_goal_case_run.json
