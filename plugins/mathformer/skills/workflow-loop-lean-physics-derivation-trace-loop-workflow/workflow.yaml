flow:
  kind: sequence
  steps:
  - id: prepare
    kind: call
    operation: prepare_source
    arguments:
      argv:
        ref: inputs.argv
      context:
        ref: inputs.context
    description: '--source-record is required; question/answer must be nonempty and
      case_id start formalphysics_. Defaults: iteration=1, max_iterations=8; optional
      --lean-file, --artifact-root, --json.'
  - id: physics
    kind: loop
    state_type: State
    initial:
      ref: steps.prepare.outputs.state
    max_iterations: 7
    on_exhausted: fail
    description: Visit symbol_table, equation_parse, dimension_model, unit_grounding,
      law_grounding, gap_detection, derivation_plan in order. The queue is nonempty
      at entry; each visit removes one item even after a recorded stage failure; visit
      seven exits normally.
    body:
      kind: call
      operation: visit_physics_stage
      arguments:
        state:
          ref: loop.state
        context:
          ref: inputs.context
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: State
        value:
          ref: loop.state
  - id: critique
    kind: call
    operation: plan_critique_ground
    arguments:
      state:
        ref: steps.physics.outputs.state
      context:
        ref: inputs.context
    description: 'Ordered calls: workflow plan, type packet, assumption packet, background
      plan, unit report, semantics critic, assumption critic, dimension critic, drift
      monitor, object detection, workbench plan, Mathlib grounding; prior packet/report
      paths supply downstream arguments.'
  - id: repairs
    kind: loop
    state_type: State
    initial:
      ref: steps.critique.outputs.state
    max_iterations: 4
    on_exhausted: fail
    description: Visit notational collapse, abstraction elevation, proof-strategy
      alignment and implicit-premise normalization in order, using monitor/object/workbench
      artifacts. Accumulate all repair-plan paths; visit four drains the queue and
      exits normally.
    body:
      kind: call
      operation: visit_repair_plan
      arguments:
        state:
          ref: loop.state
        context:
          ref: inputs.context
    next_state:
      ref: body.outputs.state
    until:
      ref: body.outputs.done
    outputs:
      state:
        type: State
        value:
          ref: loop.state
  - id: plans
    kind: call
    operation: finish_plans
    arguments:
      state:
        ref: steps.repairs.outputs.state
      context:
        ref: inputs.context
    description: Repair paths and existing source/Lean/packet reports feed the ordered
      plans. The controller receives supplied iteration/max_iterations and no previous-map
      history; its recurse decision never repeats this runner or edits Lean.
  - id: compile
    kind: call
    operation: compile_interpret
    arguments:
      state:
        ref: steps.plans.outputs.state
      context:
        ref: inputs.context
  - id: evidence
    kind: switch
    cases:
    - id: silent_success
      when:
        ref: steps.compile.outputs.silent_success
      body:
        kind: call
        operation: normalize_silent
        arguments:
          state:
            ref: steps.compile.outputs.state
          context:
            ref: inputs.context
    default:
      kind: call
      operation: retain_state
      arguments:
        state:
          ref: steps.compile.outputs.state
        context:
          ref: inputs.context
    outputs:
      state:
        type: State
        value:
          ref: selected.outputs.state
  - id: report
    kind: call
    operation: validate_report
    arguments:
      state:
        ref: steps.evidence.outputs.state
      context:
        ref: inputs.context
    description: Always report after recorded stage failures. --compile-ok requires
      compiler success; --realness-ok also requires execution payload no_known_diagnostics;
      --anchor-ok is supplied unconditionally. Completeness receives recursive-frontier-count=0.
      Main returns result.returncode.
  outputs:
    result:
      type: RunResult
      value:
        ref: steps.report.outputs.result
