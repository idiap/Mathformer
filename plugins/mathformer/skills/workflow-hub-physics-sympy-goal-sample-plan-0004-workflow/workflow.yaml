      0 for every normally produced plan, including blocked/partial. Serialization,
      write or log exceptions can abort.'
  mathformer.iteration:
    ownership: scan_open_markers traverses all source lines and 3 patterns; inspect_module
      traverses fixed lists; run_executable_gates traverses 12 validators and then
      all reports.
    state: Findings and evidence accumulate in one state; validators share the same
      imported module; reports accumulate in source order.
    stopping: Helpers finish their finite traversals normally; failed validator reports
      never skip later validators. No refinement loop, recursive execution or exhaustion
      outcome exists.
    failures: load_module catches Exception as import evidence; call_validator catches
      initial non-TypeError Exception as failure reports, retries TypeError once with
