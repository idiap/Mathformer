    classify: 'Source: plan_goal_sample_sympy_autoformalization.py::build_plan high_findings/next_action/status.
      Filter/count high findings. Initial action is needs_initial_draft for the missing-artifact
      branch, otherwise recurse. Recheck path.exists(): existing with no high findings
