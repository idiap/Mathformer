  mathformer.native_boundary:
    execution: Typed MCP tools execute the shared native batch functions. The unchanged
      mathformer_run_workflow route and hub action remain available with their original
      control envelope.
    controls: Load reuses hub preflight; context supplies repository_root and allow_mutating=true.
      Every writing tool applies service read-only and allowed-write-root checks.
      Native pass ordering and fixed selection are checked before advancing; finish
      verifies the native completion status. The finish tool propagates native nonzero
      exit after reporting.
    context_fields:
    - repository_root
    - allow_mutating
    failure_policy: Nonzero JSON helpers raise immediately; uncaught launch/parsing/I/O
      errors abort. Lean nonzero checks accumulate. No rollback, retry, adaptive repair
      or recursive execution.
    effects_status: partial_native_declarations
    qualification_capability_names_are_not_runtime_grants: true
    hub_context_fields:
    - dry_run
    - json_output
    - keep_going
    - allow_mutating
    - write_report
    exit_gate_lowering:
      source_node:
        id: native_exit
        kind: gate
        description: Native SystemExit after artifacts and CLI emission; nonzero is
          workflow failure.
        condition:
          eq:
          - ref: steps.finish.outputs.exit_code
          - literal: 0
        on_false: fail
      binding: mathformer_dirac_finish
      reason: Lunar does not compile standalone gates. The finish tool applies this
        condition after native finish_batch and emit_report; nonzero exit raises after
        artifacts, without another call.
  mathformer.composition:
    ordered_actions:
    - physics-lean:dirac-recursive-formalphysics
    action_workflows:
    - hub_physics_lean_dirac_recursive_formalphysics_workflow
    keep_going_semantics: Route failure is sticky; keep_going adds no work because
      the route contains one action.
    selection: Already selected route; NL scoring remains native.
    state_semantics: Each accumulator is ordered by the fixed selection; its length
      is that pass cursor. Step operations pack state and compute done; expressions
      neither construct records nor do arithmetic.
    bound_semantics: Exactly five items per pass; done=true after the fifth, so the
      bound returns normally. Exhaustion failure is unreachable for the fixed native
      batch; inputs cannot alter indices or pass sizes.
    stopping: next_policy.decision is complete iff status is complete_autoformalization,
      otherwise recurse. This is report data only; execution stops after reporting.
