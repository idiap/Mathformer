flow:
  kind: sequence
  steps:
  - id: parse
    kind: call
    operation: parse
    arguments:
      argv:
        ref: inputs.argv
      context:
        ref: inputs.context
  - id: run
    kind: switch
    cases:
    - id: help
      when:
        ref: steps.parse.outputs.options.halted
      body:
        kind: call
        operation: help
        arguments:
          options:
            ref: steps.parse.outputs.options
    default:
      kind: sequence
      steps:
      - id: select_report
        kind: switch
        cases:
        - id: self_test
          when:
            ref: steps.parse.outputs.options.self_test
          body:
            kind: call
            operation: self_test
            arguments: {}
        default:
          kind: sequence
          description: One normal build_report call decomposed in its original evaluation
            order.
          steps:
          - id: load
            kind: call
            operation: load
            arguments:
              options:
                ref: steps.parse.outputs.options
              context:
                ref: inputs.context
            description: Read source, Lean, then type/assumption/unit/semantics/assumption-critic/dimension
              packets; retain Lean path even when inline Lean wins.
          - id: inspect
            kind: call
            operation: inspect_pack
            arguments:
              material:
                ref: steps.load.outputs.material
              material_json:
                ref: steps.load.outputs.material_json
            description: Extract source then Lean cues; scan grounding debt; serialize
              type packet, read unit status, collect semantic/assumption/dimension
              codes, recursively gather support labels, initialize findings, compute
              four guards and pack state. source_dense is any quantum/operator/vector/calculus
              cue; lean_scalar_heavy is raw_scalar_count>=3 without quantity/dimension
              surface; packet_mentions_quantity searches lower-case type JSON for
              quantity/dimension/vector/operator/hilbert; unit_missing_or_failed means
              unit status missing, fail or null.
          - id: rules
            kind: call
            operation: apply_rules
            arguments:
              analysis:
                ref: steps.inspect.outputs.analysis
              analysis_json:
                ref: steps.inspect.outputs.analysis_json
            description: 'Independent ordered ifs, not exclusive branches: quantum
              cue without Hilbert/operator; vector cue and (absent vector surface
              or vector_structure_erased); dense source and scalar-heavy Lean without
              quantity packet cues; dense source and missing/failed unit guard with
              raw_scalar_erasure or physical_quantities_erased. These four append
              critical blockers. Source calculus without Lean calculus appends critical/blocker
              if trivial proof or target-shaped hypothesis, otherwise error; source
              physical_law without Lean law surface appends error; trivial proof plus
              target-shaped hypothesis appends critical/blocker. Calculus plus derivative-strategy
              substitution appends warning. Side conditions without source-backed/mathlib-backed/generated-support/blocked
              labels append warning; hidden_strengthening or missing_assumption_packet
              critic codes append error.'
          - id: summarize
            kind: call
            operation: summarize
            arguments:
              analysis:
                ref: steps.inspect.outputs.analysis
              findings:
                ref: steps.rules.outputs.findings
              analysis_json:
                ref: steps.inspect.outputs.analysis_json
              findings_json:
                ref: steps.rules.outputs.findings_json
            description: Any blocker gives fail; otherwise max rank>=1 gives warn,
              else pass. Grounding-debt ok does not affect this status.
          outputs:
            report:
              type: Report
              value:
                ref: steps.summarize.outputs.report
            report_json:
              type: JsonText
              value:
                ref: steps.summarize.outputs.report_json
        outputs:
          report:
            type: Report
            value:
              ref: selected.outputs.report
          report_json:
            type: JsonText
            value:
              ref: selected.outputs.report_json
      - id: emit
        kind: call
        operation: emit
        arguments:
          options:
            ref: steps.parse.outputs.options
          report:
            ref: steps.select_report.outputs.report
          context:
            ref: inputs.context
          report_json:
            ref: steps.select_report.outputs.report_json
        description: Emit exactly one selected report and return 0, including for
          status fail; serialization and I/O errors propagate.
      outputs:
        report:
          type: Report
          value:
            ref: steps.select_report.outputs.report
        exit_code:
          type: ExitCode
          value:
            ref: steps.emit.outputs.exit_code
        stdout:
          type: Stdout
          value:
            ref: steps.emit.outputs.stdout
    outputs:
      report:
        type: Report
        value:
          ref: selected.outputs.report
      exit_code:
        type: ExitCode
        value:
          ref: selected.outputs.exit_code
      stdout:
        type: Stdout
        value:
          ref: selected.outputs.stdout
  outputs:
    report:
      type: Report
      value:
