flow:
  kind: sequence
  steps:
  - id: prepare
    kind: call
    operation: prepare
    description: Resolve relative artifact_root against REPO_ROOT; if it exists, rmtree
      it. Pack the resolved root, generated_seeds.jsonl and kb paths. Cleanup failure
      aborts before generation.
    arguments:
      request:
        ref: inputs.request
  - id: generate
    kind: call
    operation: generate
    description: 'run_json with sys.executable and GENERATOR: --family all --include-axioms
      --include-theorems --output seed_jsonl --json. The child advances a cursor through
      finite SEEDS, accumulating matching entries and terminating normally when exhausted.
      Serialization and reporting remain internal. The seed file feeds indexing; the
      JSON report feeds final assertions.'
    arguments:
      paths:
        ref: steps.prepare.outputs.paths
  - id: index
    kind: call
    operation: index
    description: 'After generation completes, run_json with INDEXER: --kb-root kb_root
      --seed-jsonl seed_jsonl --vampire-artifact-root artifacts/vampire_atp --vampire-limit
      8 --build-bloom --build-embeddings --embedding-dimension 256 --smoke-query ''inverse
      of a triple product in a group reverses order'' --json. The child advances its
      file cursor through the one supplied file, accumulating insertion results and
      terminating normally on exhaustion. State retains store location, Vampire count,
      index paths and smoke hits. Vampire ingestion, Bloom construction, embeddings
      and top-five semantic search branches are enabled by these arguments. Callbacks
      and reporting remain internal. Context supplies the existing Vampire artifact
      root; native main uses artifacts/vampire_atp.'
    arguments:
      paths:
        ref: steps.prepare.outputs.paths
      context:
        ref: inputs.context
  - id: finish
    kind: call
    operation: finish
    description: Extract ordered hit IDs. Check generated.ok, seed file existence,
      generated.entry_count >= 10, indexed.ok, indexed.added_count >= 10, Bloom manifest
      and embedding file existence, and first ID group.inverse_triple_product_reverse_order.
      Preserve empty-list falsiness for no hits. Pack payload with all(assertions.values()).
      Print JSON when request.json, otherwise ok/root/hit IDs; return 0 if ok else
      3. False assertions still emit the payload. Missing keys, malformed records
      and other exceptions abort.
    arguments:
      request:
        ref: inputs.request
      paths:
        ref: steps.prepare.outputs.paths
      generated:
        ref: steps.generate.outputs.generated
      indexed:
        ref: steps.index.outputs.indexed
  outputs:
    result:
      type: Result
      value:
        ref: steps.finish.outputs.result
    exit_code:
      type: ExitCode
      value:
        ref: steps.finish.outputs.exit_code
    stdout:
      type: Stdout
      value:
        ref: steps.finish.outputs.stdout
