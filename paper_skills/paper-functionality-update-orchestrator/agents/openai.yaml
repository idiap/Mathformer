# Motivation:
#   Expose the paper functionality update orchestrator through agent-client
#   skill discovery.
#
# Intent:
#   Give users a concise prompt for converting new Mathformer features into
#   audited manuscript updates.
#
# Function:
#   Declares display metadata for the local agent interface.
#
# Maintenance Notes:
#   Keep the prompt aligned with the SKILL.md trigger and output shape.

interface:
  display_name: "Paper Functionality Update Orchestrator"
  short_description: "Turn new Mathformer features into evidence-grounded paper updates."
  default_prompt: "Use $paper-functionality-update-orchestrator to convert a new Mathformer feature into an evidence packet, section plan, figure/table plan, and claim audit checklist."
