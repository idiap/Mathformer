# Neuro-symbolic AI Group
# File Documentation
#
# Motivation:
#   Keep the Lean toolchain and dependency graph reproducible for local and automated builds.
#
# Intent:
#   Declare the project targets, pinned dependencies, and compiler/runtime version expected by Mathformer.
#
# Function:
#   Provides configuration consumed by Lake, Lean, and build tooling before source files are compiled.
#
# Maintenance Notes:
#   Keep this header synchronized with major responsibility changes, and prefer updating tests or examples when behavior changes.

name = "mathformer"
version = "1.0.0"
defaultTargets = ["Mathformer"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.24.0"

[[lean_lib]]
name = "Mathformer"
srcDir = "backends/lean"

[[lean_lib]]
name = "MathformerLib"
srcDir = "libraries"

[[lean_lib]]
name = "MathformerPhysicsLib"
srcDir = "libraries"

[[lean_exe]]
name = "mathformer"
root = "Main"
srcDir = "backends/lean"
